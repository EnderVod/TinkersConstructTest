public net.minecraft.client.gui.screens.inventory.AbstractContainerScreen topPos
public net.minecraft.client.gui.screens.inventory.AbstractContainerScreen imageWidth
public net.minecraft.client.gui.screens.inventory.AbstractContainerScreen imageHeight
public net.minecraft.client.gui.screens.Screen font

# Mantle/Tinkers module screens dynamically reposition shared container slots.
public-f net.minecraft.world.inventory.Slot x
public-f net.minecraft.world.inventory.Slot y

# 1.21 mappings for fields used by custom indestructible items and secondary tool attacks.
