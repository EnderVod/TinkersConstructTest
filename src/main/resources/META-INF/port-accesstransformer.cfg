# Minecraft 1.21 makes ResourceLocation final and its direct namespace/path constructor non-public.
# Tinkers deliberately subclasses ResourceLocation for strongly typed IDs (materials, modifiers, stats, patterns).
# Preserve that public Tinkers API/design instead of replacing every typed ID with an unrelated wrapper.
public-f net.minecraft.resources.ResourceLocation
public net.minecraft.resources.ResourceLocation <init>(Ljava/lang/String;Ljava/lang/String;)V

# Tinkers GUI modules are separate helper objects rather than screen subclasses. 1.21 keeps these
# geometry/font fields protected, so expose the same state the helpers accessed on older versions.
