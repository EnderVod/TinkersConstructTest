/*
 * Tinkers' Construct
 * NeoForge 1.21.1 port build
 */

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
    id 'io.freefair.lombok' version '8.14.2'
}

repositories {
    mavenCentral()
    maven {
        name = "Prog's Maven"
        url = 'https://dvs1.progwml6.com/files/maven'
    }
    maven {
        name = "Jared's Maven"
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'NeoForge'
        url = 'https://maven.neoforged.net/releases'
    }
}

group = 'slimeknights.tconstruct'
base {
    archivesName = 'TinkersConstruct'
}
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// SlimeKnights version format
task buildInfo {
    try {
        def cmd = "git rev-parse --short HEAD"
        def proc = cmd.execute()
        proc.waitFor()
        ext.revision = proc.exitValue() == 0 ? proc.text.trim() : "GITBORK"
    } catch (all) {
        ext.revision = "gitgud"
    }
    ext.buildNum = System.getenv().BUILD_NUMBER != null ? "${System.getenv().BUILD_NUMBER}" : "DEV.${project.buildInfo.revision}"
}

ext.artifact_version = System.getenv().ARTIFACT_VERSION != null ? System.getenv().ARTIFACT_VERSION : "${mod_version}.${project.buildInfo.buildNum}"
version = "${minecraft_version}-${artifact_version}"

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}, Version: ${version}"

sourceSets {
    main {
        java {
            // Temporary porting exclusions. These optional integrations and data generators are
            // re-enabled as their 1.21.1 APIs are migrated. Core Tinkers gameplay stays enabled.
            exclude 'slimeknights/tconstruct/plugin/craftingtweaks/**'
            exclude 'slimeknights/tconstruct/plugin/jsonthings/**'
            exclude 'slimeknights/tconstruct/plugin/DietPlugin.java'
            exclude 'slimeknights/tconstruct/plugin/DummmmmmyPlugin.java'
            exclude 'slimeknights/tconstruct/plugin/ImmersiveEngineeringPlugin.java'
            exclude 'slimeknights/tconstruct/common/data/**'
            exclude 'slimeknights/tconstruct/fluids/data/**'
            exclude 'slimeknights/tconstruct/gadgets/data/**'
            exclude 'slimeknights/tconstruct/library/data/**'
            exclude 'slimeknights/tconstruct/shared/data/**'
            exclude 'slimeknights/tconstruct/world/data/**'
            exclude 'slimeknights/tconstruct/smeltery/data/Byproduct.java'
            exclude 'slimeknights/tconstruct/smeltery/data/FluidContainerTransferProvider.java'
            exclude 'slimeknights/tconstruct/smeltery/data/SmelteryRecipeProvider.java'
            exclude 'slimeknights/tconstruct/tables/data/**'
            exclude 'slimeknights/tconstruct/tools/data/ArmorModelProvider.java'
            exclude 'slimeknights/tconstruct/tools/data/EnchantmentToModifierProvider.java'
            exclude 'slimeknights/tconstruct/tools/data/FluidEffectProvider.java'
            exclude 'slimeknights/tconstruct/tools/data/ModifierProvider.java'
            exclude 'slimeknights/tconstruct/tools/data/ModifierRecipeProvider.java'
            exclude 'slimeknights/tconstruct/tools/data/StationSlotLayoutProvider.java'
            exclude 'slimeknights/tconstruct/tools/data/ToolDefinitionDataProvider.java'
            exclude 'slimeknights/tconstruct/tools/data/ToolItemModelProvider.java'
            exclude 'slimeknights/tconstruct/tools/data/ToolsRecipeProvider.java'
            exclude 'slimeknights/tconstruct/tools/data/client/**'
            exclude 'slimeknights/tconstruct/tools/data/material/MaterialDataProvider.java'
            exclude 'slimeknights/tconstruct/tools/data/material/MaterialRecipeProvider.java'
            exclude 'slimeknights/tconstruct/tools/data/material/MaterialRenderInfoProvider.java'
            exclude 'slimeknights/tconstruct/tools/data/material/MaterialStatsDataProvider.java'
            exclude 'slimeknights/tconstruct/tools/data/material/MaterialTraitsDataProvider.java'
            exclude 'slimeknights/tconstruct/tools/data/material/TrimMaterialProvider.java'
            // 1.20 recipe generator adapters still use FinishedRecipe; runtime recipes do not depend on them.
            exclude 'slimeknights/tconstruct/library/recipe/molding/MoldingRecipeBuilder.java'
            exclude 'slimeknights/tconstruct/library/recipe/material/ShapedMaterialConsumerBuilder.java'
            exclude 'slimeknights/tconstruct/library/recipe/material/MaterialsConsumerBuilder.java'
            exclude 'slimeknights/tconstruct/library/recipe/material/MaterialRecipeBuilder.java'
            exclude 'slimeknights/tconstruct/library/recipe/entitymelting/EntityMeltingRecipeBuilder.java'
            exclude 'slimeknights/tconstruct/library/recipe/fuel/MeltingFuelBuilder.java'
            exclude 'slimeknights/tconstruct/library/recipe/tinkerstation/building/MaterialSwappingRecipeBuilder.java'
            exclude 'slimeknights/tconstruct/library/recipe/tinkerstation/building/ToolBuildingRecipeBuilder.java'
        }
        resources {
            srcDir 'src/generated/resources'
            exclude '**/.cache/**'
            exclude 'assets/tconstruct/debug'
        }
    }
}

minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')
minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/port-accesstransformer.cfg')

runs {
    configureEach {
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        systemProperty 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP,CORE'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        if (project.hasProperty('mc_uuid')) {
            arguments.addAll '--uuid', project.getProperty('mc_uuid')
        }
        if (project.hasProperty('mc_username')) {
            arguments.addAll '--username', project.getProperty('mc_username')
        }
        if (project.hasProperty('mc_accessToken')) {
            arguments.addAll '--accessToken', project.getProperty('mc_accessToken')
        }
    }

    server {
        argument '--nogui'
    }

    data {
        // Keep stale-file cleanup away from tracked 1.20 resources during the migration.
        arguments.addAll '--mod', 'tconstruct', '--all', '--output', file("$buildDir/datagen/resources").absolutePath,
                '--existing', file('src/main/resources/').absolutePath, '--existing-mod', 'mantle'
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    def mantleJars = fileTree(dir: 'libs', include: ['Mantle-*.jar'], exclude: ['*-sources.jar'])
    if (mantleJars.isEmpty()) {
        throw new GradleException('Missing Mantle 1.21.1 JAR in ./libs. CI downloads the green Mantle artifact before compiling Tinkers.')
    }
    implementation mantleJars

    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.8.2'
    testImplementation 'org.mockito:mockito-inline:4.2.0'
    testImplementation 'org.assertj:assertj-core:3.21.0'
}

test {
    useJUnitPlatform()
    jvmArgs '-Dnet.bytebuddy.experimental=true'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        version: artifact_version,
        loader_range: loader_range,
        minecraft_range: minecraft_range,
        neo_range: neo_range,
        mantle_range: mantle_range,
        jei_range: jei_range,
        json_things_range: json_things_range
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title': "Tinkers' Construct",
            'Specification-Vendor': 'Slime Knights',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': "${version}",
            'Implementation-Vendor': 'Slime Knights',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

java {
    withSourcesJar()
}

tasks.named('sourcesJar', Jar).configure {
    exclude 'assets/**'
    exclude 'data/**'
    exclude 'pack.png'
    exclude 'pack.mcmeta'
    exclude 'META-INF/neoforge.mods.toml'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }

    repositories {
        if (project.hasProperty('DEPLOY_DIR')) {
            maven { url = DEPLOY_DIR }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
