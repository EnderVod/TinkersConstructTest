name: Tinkers Screen Bounds Access Fix

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-screen-bounds-access.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge

      - name: Replace protected cross-screen bounds access
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          replacements = {
              Path('src/main/java/slimeknights/tconstruct/library/client/GuiUtil.java'): [
                  ('screen.leftPos', 'screen.getGuiLeft()'),
                  ('screen.topPos', 'screen.getGuiTop()'),
                  ('screen.imageWidth', 'screen.getXSize()'),
                  ('screen.imageHeight', 'screen.getYSize()'),
              ],
              Path('src/main/java/slimeknights/tconstruct/tables/client/inventory/PartBuilderScreen.java'): [
                  ('this.infoPanelScreen.imageHeight = this.imageHeight;',
                   'this.infoPanelScreen.setImageHeight(this.imageHeight);'),
              ],
              Path('src/main/java/slimeknights/tconstruct/tables/client/inventory/TinkerChestScreen.java'): [
                  ('this.scalingChestScreen.imageHeight += 18;',
                   'this.scalingChestScreen.setImageHeight(this.scalingChestScreen.getYSize() + 18);'),
              ],
              Path('src/main/java/slimeknights/tconstruct/tables/client/inventory/ModifierWorktableScreen.java'): [
                  ('this.tinkerInfo.imageHeight', 'this.tinkerInfo.getYSize()'),
              ],
              Path('src/main/java/slimeknights/tconstruct/tables/client/inventory/TinkerStationScreen.java'): [
                  ('this.tinkerInfo.imageHeight', 'this.tinkerInfo.getYSize()'),
                  ('this.tinkerInfo.getArea().getHeight()', 'this.tinkerInfo.getYSize()'),
                  ('module.topPos += 4;', 'module.adjustBounds(0, 4, 0, 0);'),
                  ('this.tinkerInfo.leftPos', 'this.tinkerInfo.getGuiLeft()'),
                  ('tinkerInfo.leftPos', 'tinkerInfo.getGuiLeft()'),
                  ('this.tinkerInfo.topPos', 'this.tinkerInfo.getGuiTop()'),
                  ('tinkerInfo.topPos', 'tinkerInfo.getGuiTop()'),
                  ('this.tinkerInfo.imageWidth', 'this.tinkerInfo.getXSize()'),
                  ('tinkerInfo.imageWidth', 'tinkerInfo.getXSize()'),
                  ('this.modifierInfo.leftPos', 'this.modifierInfo.getGuiLeft()'),
                  ('modifierInfo.leftPos', 'modifierInfo.getGuiLeft()'),
                  ('this.modifierInfo.topPos', 'this.modifierInfo.getGuiTop()'),
                  ('modifierInfo.topPos', 'modifierInfo.getGuiTop()'),
              ],
              Path('src/main/java/slimeknights/tconstruct/smeltery/client/screen/module/GuiFuelModule.java'): [
                  ('screen.leftPos', 'screen.getGuiLeft()'),
                  ('screen.topPos', 'screen.getGuiTop()'),
              ],
              Path('src/main/java/slimeknights/tconstruct/smeltery/client/screen/module/GuiSmelteryTank.java'): [
                  ('parent.leftPos', 'parent.getGuiLeft()'),
                  ('parent.topPos', 'parent.getGuiTop()'),
              ],
              Path('src/main/java/slimeknights/tconstruct/smeltery/client/screen/module/GuiMeltingModule.java'): [
                  ('screen.leftPos', 'screen.getGuiLeft()'),
                  ('screen.topPos', 'screen.getGuiTop()'),
              ],
              Path('src/main/java/slimeknights/tconstruct/smeltery/client/screen/module/GuiTankModule.java'): [
                  ('screen.leftPos', 'screen.getGuiLeft()'),
                  ('screen.topPos', 'screen.getGuiTop()'),
              ],
          }

          changed = []
          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              new = text
              for old, repl in pairs:
                  if old in new:
                      new = new.replace(old, repl)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(path)

          border_path = Path('src/main/java/slimeknights/tconstruct/tables/client/inventory/widget/BorderWidget.java')
          border = border_path.read_text(encoding='utf-8')
          old_block = '''    gui.leftPos -= this.borderLeft.w;\n    gui.topPos -= this.borderTop.h;\n\n    gui.imageWidth += this.borderLeft.w + this.borderRight.w;\n    gui.imageHeight += this.borderTop.h + this.borderBottom.h;'''
          new_block = '''    gui.adjustBounds(-this.borderLeft.w, -this.borderTop.h,\n                     this.borderLeft.w + this.borderRight.w,\n                     this.borderTop.h + this.borderBottom.h);'''
          if old_block in border:
              border = border.replace(old_block, new_block)
              border_path.write_text(border, encoding='utf-8')
              changed.append(border_path)
          elif new_block not in border:
              raise SystemExit('Could not locate BorderWidget protected bounds mutation')

          # The old SRG field ATs no longer match the 1.21 runtime fields. All source accesses now use public APIs.
          at_path = Path('src/main/resources/META-INF/accesstransformer.cfg')
          at = at_path.read_text(encoding='utf-8')
          stale_fields = (' f_97726_ # xSize', ' f_97727_ # ySize', ' f_97736_ # guiTop', ' f_97735_ # guiLeft')
          at_lines = [line for line in at.splitlines() if not any(token in line for token in stale_fields)]
          new_at = '\n'.join(at_lines) + '\n'
          if new_at != at:
              at_path.write_text(new_at, encoding='utf-8')
              changed.append(at_path)

          # Fail on any direct access to another object's AbstractContainerScreen positioning fields.
          # `this.imageHeight` etc. remain legal inside subclasses and are intentionally allowed.
          field_re = re.compile(r'\b(?!this\b)([A-Za-z_$][\w$]*)\.(imageHeight|imageWidth|topPos|leftPos)\b')
          candidates = []
          for path in Path('src/main/java').rglob('*.java'):
              for lineno, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if field_re.search(line):
                      candidates.append((str(path), lineno, line.strip()))
          if candidates:
              for path, lineno, line in candidates[:250]:
                  print(f'LEFTOVER {path}:{lineno}: {line}')
              raise SystemExit(f'{len(candidates)} direct protected screen-field accesses remain')

          print(f'Changed {len(set(changed))} files')
          print('No direct cross-screen imageWidth/imageHeight/leftPos/topPos accesses remain.')
          PY

      - name: Commit screen bounds migration
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No screen-bounds changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/slimeknights/tconstruct/library/client/GuiUtil.java \
                  src/main/java/slimeknights/tconstruct/tables/client/inventory \
                  src/main/java/slimeknights/tconstruct/smeltery/client/screen/module \
                  src/main/resources/META-INF/accesstransformer.cfg
          git commit -m 'Remove cross-screen protected container field access'
          git push origin HEAD:1.21.1-neoforge
