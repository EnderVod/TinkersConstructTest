name: Tinkers Remaining Forge Import Scan

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-import-scan.yml

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge

      - name: Summarize remaining Forge imports
        run: |
          echo '=== Remaining files with net.minecraftforge imports ==='
          grep -RIl '^import net\.minecraftforge' src/main/java | wc -l || true
          echo '=== Unique remaining Forge imports ==='
          grep -Rh '^import net\.minecraftforge' src/main/java \
            | sed 's/^import //; s/;//' \
            | sort \
            | uniq -c \
            | sort -nr \
            | head -250 || true

          echo '=== Old packet context files ==='
          grep -RIl 'net\.minecraftforge\.network\.NetworkEvent\.Context' src/main/java | sort || true
          echo '=== Suspicious payload-context substitutions ==='
          grep -RInE '[A-Za-z0-9_$.]+IPayloadContext context' src/main/java || true
          echo '=== Old capability files ==='
          grep -RIl 'net\.minecraftforge\.common\.capabilities\|ForgeCapabilities' src/main/java | sort || true
          echo '=== Old mod-bus context files ==='
          grep -RIl 'FMLJavaModLoadingContext' src/main/java | sort || true
          echo '=== Old tool action files ==='
          grep -RIl 'net\.minecraftforge\.common\.ToolAction\|net\.minecraftforge\.common\.ToolActions' src/main/java | sort || true
          echo '=== ToolActions constants used ==='
          grep -RhoE 'ToolActions\.[A-Z0-9_]+' src/main/java | sort -u || true
          echo '=== Removed Forge ToolActions exact uses ==='
          grep -RInE 'ToolActions\.(DRILL_ATTACK|GRAPPLE_HOOK|ITEM_HOOK|SHIELD_DISABLE)' src/main/java || true
          echo '=== Old condition/crafting files ==='
          grep -RIl 'net\.minecraftforge\.common\.crafting' src/main/java | sort || true
