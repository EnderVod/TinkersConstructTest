name: Tinkers 1.21.1 Server Smoke Test

# Smoke source includes migrated 1.21 Part Builder/material recipes and rejects silent custom-recipe parse failures.
on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-server-smoke.yml
      - src/main/java/**
      - src/main/resources/**
      - src/generated/resources/**
      - build.gradle
      - gradle.properties
      - settings.gradle
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: tinkers-1.21.1-server-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Tinkers port
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Download latest green Mantle 1.21.1 build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p libs mantle-artifact
          mantle_run=$(gh api '/repos/EnderVod/MantleTest/actions/workflows/port-compile.yml/runs?branch=1.21.1-neoforge&status=success&per_page=1' --jq '.workflow_runs[0].id')
          if [ -z "$mantle_run" ]; then
            echo 'Could not find a successful Mantle 1.21.1 build.'
            exit 1
          fi
          mantle_artifact=$(gh api "/repos/EnderVod/MantleTest/actions/runs/$mantle_run/artifacts" --jq '.artifacts[] | select(.name == "mantle-1.21.1-neoforge" and .expired == false) | .id' | head -n 1)
          if [ -z "$mantle_artifact" ]; then
            echo "Could not find a live Mantle artifact for successful run $mantle_run."
            exit 1
          fi
          echo "Using Mantle workflow run $mantle_run, artifact $mantle_artifact"
          gh api "/repos/EnderVod/MantleTest/actions/artifacts/$mantle_artifact/zip" > mantle.zip
          unzip -q mantle.zip -d mantle-artifact
          mantle_jar=$(find mantle-artifact -type f -name 'Mantle-*.jar' ! -name '*-sources.jar' | head -n 1)
          if [ -z "$mantle_jar" ]; then
            echo 'Could not find the Mantle runtime JAR in the downloaded artifact.'
            find mantle-artifact -maxdepth 3 -type f -print
            exit 1
          fi
          cp "$mantle_jar" libs/
          echo "Using Mantle dependency: $(basename "$mantle_jar")"

      - name: Prepare development server
        run: |
          mkdir -p run/server
          echo 'eula=true' > run/server/eula.txt
          cat > run/server/server.properties <<'EOF'
          online-mode=false
          server-port=25565
          level-name=world
          max-players=1
          view-distance=3
          simulation-distance=3
          EOF

      - name: Boot dedicated server
        shell: bash
        run: |
          set +e
          ./gradlew runServer --no-daemon > server-console.log 2>&1 &
          server_pid=$!
          ready=0

          # A cold runner may spend several minutes preparing NeoForm and vanilla assets before
          # Minecraft itself starts. Keep the process under the job timeout, but do not confuse
          # that one-time Gradle setup with a Tinkers startup failure.
          for _ in $(seq 1 600); do
            if grep -Eq 'Done \([0-9.]+s\)!|Done \(' run/server/logs/latest.log server-console.log 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          combined_log=$(mktemp)
          cat server-console.log run/server/logs/latest.log 2>/dev/null > "$combined_log" || true

          if [ "$ready" -eq 1 ]; then
            # Minecraft can reach the ready state while rejecting individual datapack recipes.
            # Treat failures in the two recipe families currently under migration as a smoke failure.
            if grep -E 'Parsing error loading recipe tconstruct:tools/(parts/builder|materials)/' "$combined_log" > migrated-recipe-errors.txt; then
              echo 'Tinkers server reached ready state but rejected migrated Part Builder/material recipes:'
              cat migrated-recipe-errors.txt
              kill -TERM "$server_pid" 2>/dev/null || true
              sleep 2
              kill -KILL "$server_pid" 2>/dev/null || true
              exit 1
            fi

            echo 'Tinkers dedicated server reached the ready state with no Part Builder/material recipe parse errors.'
            grep -E 'Loaded [0-9]+ recipes' "$combined_log" | tail -n 1 || true
            kill -TERM "$server_pid" 2>/dev/null || true
            sleep 2
            kill -KILL "$server_pid" 2>/dev/null || true
            exit 0
          fi

          if kill -0 "$server_pid" 2>/dev/null; then
            kill -TERM "$server_pid" 2>/dev/null || true
            sleep 2
            kill -KILL "$server_pid" 2>/dev/null || true
          fi

          echo 'Tinkers server did not reach ready state.'
          echo '--- server console tail ---'
          tail -n 300 server-console.log || true
          echo '--- latest.log tail ---'
          tail -n 300 run/server/logs/latest.log || true
          exit 1

      - name: Upload server smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tinkers-1.21.1-server-smoke-log
          path: |
            server-console.log
            run/server/logs/latest.log
            migrated-recipe-errors.txt
          if-no-files-found: warn
