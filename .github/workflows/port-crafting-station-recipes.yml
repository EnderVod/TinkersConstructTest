name: Tinkers Crafting Station Recipe Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-crafting-station-recipes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge

      - name: Migrate Crafting Station resources to 1.21.1
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          old_root = Path('src/generated/resources/data/tconstruct/recipes/tables')
          new_root = Path('src/generated/resources/data/tconstruct/recipe/tables')
          new_root.mkdir(parents=True, exist_ok=True)
          names = ('crafting_station', 'crafting_station_from_logs', 'crafting_station_from_tables')
          workstation_tag = 'c:player_workstations/crafting_tables'

          def rewrite(node):
              if isinstance(node, dict):
                  for key, value in list(node.items()):
                      if key == 'type' and value == 'forge:difference':
                          node[key] = 'neoforge:difference'
                      elif key == 'tag' and value == 'forge:workbenches':
                          node[key] = workstation_tag
                      else:
                          rewrite(value)
              elif isinstance(node, list):
                  for value in node:
                      rewrite(value)

          for name in names:
              old = old_root / f'{name}.json'
              data = json.loads(old.read_text(encoding='utf-8'))
              result = data.get('result')
              if not isinstance(result, dict):
                  raise SystemExit(f'{old}: missing result object')
              if 'item' in result:
                  result['id'] = result.pop('item')
              if result.get('id') != 'tconstruct:crafting_station':
                  raise SystemExit(f'{old}: unexpected result {result!r}')
              rewrite(data)
              new = new_root / f'{name}.json'
              new.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
              print(f'Migrated {old} -> {new}')

          old_tag = Path('src/generated/resources/data/tconstruct/tags/items/tables.json')
          new_tag = Path('src/generated/resources/data/tconstruct/tags/item/tables.json')
          new_tag.parent.mkdir(parents=True, exist_ok=True)
          tag_data = json.loads(old_tag.read_text(encoding='utf-8'))
          required_tables = {'tconstruct:crafting_station', 'tconstruct:part_builder', 'tconstruct:tinker_station'}
          if not required_tables.issubset(set(tag_data.get('values', []))):
              raise SystemExit('tables item tag is missing core table entries')
          new_tag.write_text(json.dumps(tag_data, indent=2) + '\n', encoding='utf-8')

          # Contribute the Tinkers Crafting Station to NeoForge/Fabric's standard common crafting-table tag.
          for registry in ('item', 'block'):
              path = Path(f'src/generated/resources/data/c/tags/{registry}/player_workstations/crafting_tables.json')
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps({'replace': False, 'values': ['tconstruct:crafting_station']}, indent=2) + '\n', encoding='utf-8')

          # Keep Tinkers' runtime tag constants aligned with NeoForge 1.21 common tags.
          tags_path = Path('src/main/java/slimeknights/tconstruct/common/TinkerTags.java')
          tags = tags_path.read_text(encoding='utf-8')
          old = 'WORKBENCHES = common("workbenches");'
          if tags.count(old) not in (0, 2):
              raise SystemExit(f'Unexpected WORKBENCHES constant count: {tags.count(old)}')
          tags = tags.replace(old, 'WORKBENCHES = common("player_workstations/crafting_tables");')
          if tags.count('WORKBENCHES = common("player_workstations/crafting_tables");') != 2:
              raise SystemExit('Failed to migrate both block and item WORKBENCHES constants')
          tags_path.write_text(tags, encoding='utf-8')

          normal = json.loads((new_root / 'crafting_station.json').read_text(encoding='utf-8'))
          ingredient = normal['key']['w']
          if ingredient.get('type') != 'neoforge:difference':
              raise SystemExit('Crafting Station recipe does not use neoforge:difference')
          if ingredient.get('base', {}).get('tag') != workstation_tag:
              raise SystemExit('Crafting Station recipe does not use the 1.21 common crafting workstation tag')
          for name in names:
              result = json.loads((new_root / f'{name}.json').read_text(encoding='utf-8')).get('result', {})
              if result.get('id') != 'tconstruct:crafting_station' or 'item' in result:
                  raise SystemExit(f'{name}: invalid 1.21 result {result!r}')
          PY

      - name: Commit Crafting Station migration
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No Crafting Station resource changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/generated/resources/data/tconstruct/recipe/tables/crafting_station.json \
                  src/generated/resources/data/tconstruct/recipe/tables/crafting_station_from_logs.json \
                  src/generated/resources/data/tconstruct/recipe/tables/crafting_station_from_tables.json \
                  src/generated/resources/data/tconstruct/tags/item/tables.json \
                  src/generated/resources/data/c/tags/item/player_workstations/crafting_tables.json \
                  src/generated/resources/data/c/tags/block/player_workstations/crafting_tables.json \
                  src/main/java/slimeknights/tconstruct/common/TinkerTags.java
          git commit -m 'Use 1.21 common Crafting Station tags'
          git push origin HEAD:1.21.1-neoforge
