name: Fishing Renderer Fix
on:
  push:
    branches: [1.21.1-neoforge]
    paths: ['.github/workflows/port-fishing-renderer-fix.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Patch renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/java/slimeknights/tconstruct/tools/client/material/CombatFishingHookRenderer.java')
          s = p.read_text(encoding='utf-8')
          old = 'FishingHookRenderer.stringVertex(hookXOff, hookYOff, hookZOff, consumer, lastPose, i / 16f, (i + 1) / 16f);'
          new = 'stringVertex(hookXOff, hookYOff, hookZOff, consumer, lastPose, i / 16f, (i + 1) / 16f);'
          if old not in s:
              raise SystemExit('private vanilla stringVertex call not found')
          s = s.replace(old, new, 1)
          marker = '  @Override\n  public ResourceLocation getTextureLocation(CombatFishingHook pEntity) {'
          helper = (
              '  /** Local copy of vanilla fishing line generation; the vanilla helper is private in 1.21.1. */\n'
              '  private static void stringVertex(float xOff, float yOff, float zOff, VertexConsumer consumer, PoseStack.Pose pose, float fraction, float nextFraction) {\n'
              '    float x = xOff * fraction;\n'
              '    float y = yOff * (fraction * fraction + fraction) * 0.5F + 0.25F;\n'
              '    float z = zOff * fraction;\n'
              '    float nextX = xOff * nextFraction;\n'
              '    float nextY = yOff * (nextFraction * nextFraction + nextFraction) * 0.5F + 0.25F;\n'
              '    float nextZ = zOff * nextFraction;\n'
              '    float normalX = nextX - x;\n'
              '    float normalY = nextY - y;\n'
              '    float normalZ = nextZ - z;\n'
              '    float length = Mth.sqrt(normalX * normalX + normalY * normalY + normalZ * normalZ);\n'
              '    if (length > 0.0F) {\n'
              '      normalX /= length;\n'
              '      normalY /= length;\n'
              '      normalZ /= length;\n'
              '    }\n'
              '    consumer.addVertex(pose.pose(), x, y, z).setColor(0, 0, 0, 255).setNormal(pose, normalX, normalY, normalZ);\n'
              '  }\n\n'
          )
          if marker not in s:
              raise SystemExit('renderer insertion marker not found')
          s = s.replace(marker, helper + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/slimeknights/tconstruct/tools/client/material/CombatFishingHookRenderer.java
          git commit -m 'Avoid private vanilla fishing line renderer helper'
          git push
