name: Tinkers 1.21.1 Port Compile

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-compile.yml
      - src/main/java/**
      - src/main/resources/**
      - src/generated/resources/**
      - build.gradle
      - gradle.properties
      - settings.gradle
      - gradle/wrapper/gradle-wrapper.properties
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: tinkers-1.21.1-port-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Tinkers port
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Download latest green Mantle 1.21.1 build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p libs mantle-artifact
          mantle_run=$(gh api '/repos/EnderVod/MantleTest/actions/workflows/port-compile.yml/runs?branch=1.21.1-neoforge&status=success&per_page=1' --jq '.workflow_runs[0].id')
          if [ -z "$mantle_run" ]; then
            echo 'Could not find a successful Mantle 1.21.1 build.'
            exit 1
          fi
          mantle_artifact=$(gh api "/repos/EnderVod/MantleTest/actions/runs/$mantle_run/artifacts" --jq '.artifacts[] | select(.name == "mantle-1.21.1-neoforge" and .expired == false) | .id' | head -n 1)
          if [ -z "$mantle_artifact" ]; then
            echo "Could not find a live Mantle artifact for successful run $mantle_run."
            exit 1
          fi
          echo "Using Mantle workflow run $mantle_run, artifact $mantle_artifact"
          gh api "/repos/EnderVod/MantleTest/actions/artifacts/$mantle_artifact/zip" > mantle.zip
          unzip -q mantle.zip -d mantle-artifact
          mantle_jar=$(find mantle-artifact -type f -name 'Mantle-*.jar' ! -name '*-sources.jar' | head -n 1)
          if [ -z "$mantle_jar" ]; then
            echo 'Could not find the Mantle runtime JAR in the downloaded artifact.'
            find mantle-artifact -maxdepth 3 -type f -print
            exit 1
          fi
          cp "$mantle_jar" libs/
          echo "Using Mantle dependency: $(basename "$mantle_jar")"

      # Keep compiler output as artifacts so each porting pass can target the exact remaining failures.
      - name: Compile Tinkers core
        run: |
          set -o pipefail
          ./gradlew compileJava --no-daemon --stacktrace 2>&1 | tee compile.log

      - name: Build compact compiler summary
        if: always()
        run: |
          if [ -f compile.log ]; then
            grep -E '(^|: )[[:alnum:]_./-]+\.java:[0-9]+: error:|^[[:space:]]*error:|cannot find symbol|package .* does not exist' compile.log \
              | sed -E 's#^.*?/src/main/java/#src/main/java/#' \
              | head -400 > compile-errors.txt || true
          fi
          test -s compile-errors.txt || echo 'No javac error lines captured.' > compile-errors.txt

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tinkers-compile-log
          path: compile.log
          if-no-files-found: warn

      - name: Upload compiler error summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tinkers-compile-errors
          path: compile-errors.txt
          if-no-files-found: error

      - name: Upload port source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tinkers-port-source
          path: src/main/java
          if-no-files-found: error
