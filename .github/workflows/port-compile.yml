name: Tinkers 1.21.1 Port Compile

# Verify station tabs, 1.21 pattern recipe, model namespace, and GUI font access through 68330c40.
on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-compile.yml
      - src/main/java/**
      - src/main/resources/**
      - src/generated/resources/**
      - build.gradle
      - gradle.properties
      - settings.gradle
      - gradle/wrapper/gradle-wrapper.properties
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: tinkers-1.21.1-port-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Tinkers port
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Download latest green Mantle 1.21.1 build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p libs mantle-artifact
          mantle_run=$(gh api '/repos/EnderVod/MantleTest/actions/workflows/port-compile.yml/runs?branch=1.21.1-neoforge&status=success&per_page=1' --jq '.workflow_runs[0].id')
          if [ -z "$mantle_run" ]; then
            echo 'Could not find a successful Mantle 1.21.1 build.'
            exit 1
          fi
          mantle_artifact=$(gh api "/repos/EnderVod/MantleTest/actions/runs/$mantle_run/artifacts" --jq '.artifacts[] | select(.name == "mantle-1.21.1-neoforge" and .expired == false) | .id' | head -n 1)
          if [ -z "$mantle_artifact" ]; then
            echo "Could not find a live Mantle artifact for successful run $mantle_run."
            exit 1
          fi
          echo "Using Mantle workflow run $mantle_run, artifact $mantle_artifact"
          gh api "/repos/EnderVod/MantleTest/actions/artifacts/$mantle_artifact/zip" > mantle.zip
          unzip -q mantle.zip -d mantle-artifact
          mantle_jar=$(find mantle-artifact -type f -name 'Mantle-*.jar' ! -name '*-sources.jar' | head -n 1)
          if [ -z "$mantle_jar" ]; then
            echo 'Could not find the Mantle runtime JAR in the downloaded artifact.'
            find mantle-artifact -maxdepth 3 -type f -print
            exit 1
          fi
          cp "$mantle_jar" libs/
          echo "Using Mantle dependency: $(basename "$mantle_jar")"

      - name: Compile Tinkers core
        run: |
          set -o pipefail
          ./gradlew compileJava --no-daemon --stacktrace 2>&1 | tee compile.log

      - name: Verify dynamic EquipmentSlot caches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          patterns = ('new boolean[6]', 'new IToolStackView[6]', 'new int[6]', 'new UUID[6]', 'new float[6]')
          bad = []
          for path in Path('src/main/java').rglob('*.java'):
              text = path.read_text(encoding='utf-8')
              if 'getFilterFlag()' in text and any(pattern in text for pattern in patterns):
                  bad.append(str(path))
          if bad:
              raise SystemExit('Hard-coded six-slot EquipmentSlot caches remain:\n' + '\n'.join(bad))
          print('No hard-coded six-slot caches remain in getFilterFlag()-indexed classes.')
          PY

      - name: Verify NeoForge model resource namespace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          legacy = ('"forge:item/default"', '"forge:item/default-tool"', '"forge:item/bucket_drip"', '"forge:composite"')
          bad = []
          for root in (Path('src/generated/resources/assets/tconstruct/models'), Path('src/main/resources/assets/tconstruct/models')):
              if not root.exists():
                  continue
              for path in root.rglob('*.json'):
                  text = path.read_text(encoding='utf-8')
                  if any(token in text for token in legacy):
                      bad.append(str(path))
          if bad:
              raise SystemExit('Legacy Forge model resource references remain:\n' + '\n'.join(bad[:100]))
          print('No legacy Forge model resource references remain in Tinkers models.')
          PY

      - name: Verify Minecraft 1.21 pattern recipe
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('src/generated/resources/data/tconstruct/recipe/tables/pattern.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          if data.get('result', {}).get('id') != 'tconstruct:pattern':
              raise SystemExit('Pattern recipe does not use Minecraft 1.21 result.id format')
          if data.get('key', {}).get('s', {}).get('tag') != 'c:rods/wooden':
              raise SystemExit('Pattern recipe does not use the NeoForge c: wooden rod tag')
          print('Pattern recipe is present in singular recipe/ path with 1.21 fields and c: tag.')
          PY

      - name: Verify external Screen font access is gone
        run: |
          python3 - <<'PY'
          from pathlib import Path
          targets = [
              Path('src/main/java/slimeknights/tconstruct/tables/client/inventory/widget/TinkerTabsWidget.java'),
              Path('src/main/java/slimeknights/tconstruct/smeltery/client/screen/module/GuiFuelModule.java'),
              Path('src/main/java/slimeknights/tconstruct/smeltery/client/screen/module/GuiSmelteryTank.java'),
              Path('src/main/java/slimeknights/tconstruct/smeltery/client/screen/module/GuiTankModule.java'),
              Path('src/main/java/slimeknights/tconstruct/smeltery/client/screen/module/GuiMeltingModule.java'),
          ]
          bad = []
          for path in targets:
              text = path.read_text(encoding='utf-8')
              if 'parent.font' in text or 'screen.font' in text:
                  bad.append(str(path))
          at = Path('src/main/resources/META-INF/accesstransformer.cfg').read_text(encoding='utf-8')
          if 'net.minecraft.client.gui.screens.Screen f_96547_' in at:
              bad.append('src/main/resources/META-INF/accesstransformer.cfg')
          if bad:
              raise SystemExit('External Screen.font access remains:\n' + '\n'.join(bad))
          print('External Screen.font reads and stale font AT are gone.')
          PY

      - name: Build compact compiler summary
        if: always()
        run: |
          if [ -f compile.log ]; then
            grep -E '(^|: )[[:alnum:]_./-]+\.java:[0-9]+: error:|^[[:space:]]*error:|cannot find symbol|package .* does not exist' compile.log \
              | sed -E 's#^.*?/src/main/java/#src/main/java/#' \
              | head -400 > compile-errors.txt || true
          fi
          test -s compile-errors.txt || echo 'No javac error lines captured.' > compile-errors.txt

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tinkers-compile-log
          path: compile.log
          if-no-files-found: warn

      - name: Upload compiler error summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tinkers-compile-errors
          path: compile-errors.txt
          if-no-files-found: error

      - name: Upload port source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tinkers-port-source
          path: src/main/java
          if-no-files-found: error
