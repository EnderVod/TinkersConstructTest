name: Tinkers 1.21.1 Runtime Validation

on:
  workflow_dispatch:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-runtime-tools-fixes.yml
      - src/main/java/slimeknights/tconstruct/tools/client/material/CombatFishingHookRenderer.java
      - src/main/java/slimeknights/tconstruct/tools/client/ToolRenderEvents.java
      - src/main/java/slimeknights/tconstruct/tables/client/inventory/widget/TinkerTabsWidget.java
      - src/generated/resources/data/minecraft/tags/item/arrows.json
      - src/generated/resources/data/tconstruct/recipe/tools/materials/string.json
      - src/generated/resources/data/tconstruct/recipe/tools/armor/travelers/**

permissions:
  contents: read

jobs:
  validate-runtime-migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tinkers port
        uses: actions/checkout@v4

      - name: Validate migrated runtime assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          renderer_path = Path('src/main/java/slimeknights/tconstruct/tools/client/material/CombatFishingHookRenderer.java')
          renderer = renderer_path.read_text(encoding='utf-8')
          if 'FishingHookRenderer.stringVertex(' in renderer:
              raise SystemExit('Private vanilla FishingHookRenderer.stringVertex call remains')
          if 'private static void stringVertex(' not in renderer:
              raise SystemExit('Local fishing-line stringVertex helper is missing')

          tool_render_path = Path('src/main/java/slimeknights/tconstruct/tools/client/ToolRenderEvents.java')
          tool_render = tool_render_path.read_text(encoding='utf-8')
          if 'controller.getDestroyStage()' not in tool_render:
              raise SystemExit('Block-damage renderer is not using the public 1.21 destroy-stage API')

          tabs_path = Path('src/main/java/slimeknights/tconstruct/tables/client/inventory/widget/TinkerTabsWidget.java')
          tabs = tabs_path.read_text(encoding='utf-8')
          if 'parent.getMinecraft().font' not in tabs:
              raise SystemExit('Tinker tabs tooltip is not using Minecraft public font access')

          arrows_path = Path('src/generated/resources/data/minecraft/tags/item/arrows.json')
          arrows = json.loads(arrows_path.read_text(encoding='utf-8'))
          if 'tconstruct:arrow' not in arrows.get('values', []):
              raise SystemExit('Tinkers arrow is absent from minecraft:arrows')

          string_recipe_path = Path('src/generated/resources/data/tconstruct/recipe/tools/materials/string.json')
          string_recipe = json.loads(string_recipe_path.read_text(encoding='utf-8'))
          string_tag = string_recipe.get('ingredient', {}).get('tag')
          if string_tag != 'c:strings':
              raise SystemExit(f'Expected common string tag c:strings, got {string_tag!r}')

          traveler_root = Path('src/generated/resources/data/tconstruct/recipe/tools/armor/travelers')
          expected = ('goggles.json', 'chestplate.json', 'pants.json', 'boots.json')
          for name in expected:
              path = traveler_root / name
              if not path.is_file():
                  raise SystemExit(f'Missing migrated travelers recipe: {path}')
              text = path.read_text(encoding='utf-8')
              if 'forge:' in text:
                  raise SystemExit(f'Legacy Forge tag remains in {path}')

          print('Known 1.21 runtime regressions and resource migrations validated successfully.')
          PY
