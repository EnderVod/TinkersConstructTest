name: Tinkers one-shot frypan smelting 1.21 batch

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-batch-fix.yml

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout port branch
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Apply verified frypan smelting migrations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/main/java/slimeknights/tconstruct/tools/modules/SmeltingModule.java")
          text = path.read_text(encoding="utf-8")

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected exactly one match, found {count}: {old[:140]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              "import net.minecraft.world.item.crafting.RecipeType;",
              "import net.minecraft.world.item.crafting.RecipeHolder;\nimport net.minecraft.world.item.crafting.RecipeType;")
          replace_once(
              "private static AbstractCookingRecipe lastRecipe = null;",
              "private static RecipeHolder<? extends AbstractCookingRecipe> lastRecipe = null;")

          replace_once(
              """  private static AbstractCookingRecipe findRecipe(RecipeType<? extends AbstractCookingRecipe> recipeType, ItemStack stack, Level level, ModifierId modifier) {\n    SingleRecipeInput input = new SingleRecipeInput(stack);\n    try {\n      // first, try the cached recipe\n      if (lastRecipe != null && lastRecipe.matches(input, level)) {\n        return lastRecipe;\n      }\n      // if that failed, do a recipe lookup\n      AbstractCookingRecipe recipe = level.getRecipeManager().getRecipeFor(recipeType, input, level).orElse(null);\n      if (recipe != null) {\n        lastRecipe = recipe;\n      }\n      return recipe;""",
              """  private static RecipeHolder<? extends AbstractCookingRecipe> findRecipe(RecipeType<? extends AbstractCookingRecipe> recipeType, ItemStack stack, Level level, ModifierId modifier) {\n    SingleRecipeInput input = new SingleRecipeInput(stack);\n    try {\n      // first, try the cached recipe\n      if (lastRecipe != null && lastRecipe.value().matches(input, level)) {\n        return lastRecipe;\n      }\n      // if that failed, do a recipe lookup\n      RecipeHolder<? extends AbstractCookingRecipe> recipe = level.getRecipeManager().getRecipeFor(recipeType, input, level).orElse(null);\n      if (recipe != null) {\n        lastRecipe = recipe;\n      }\n      return recipe;""")

          replace_once(
              """        // lazily load a few pieces of data\n        AbstractCookingRecipe recipe = null;\n        ItemStack stack = null;""",
              """        // lazily load a few pieces of data\n        RecipeHolder<? extends AbstractCookingRecipe> recipeHolder = null;\n        AbstractCookingRecipe recipe = null;\n        ItemStack stack = null;""")

          replace_once(
              """          stack = ItemStack.of(entry);\n          recipe = findRecipe(recipeType, stack, level, modifier.getId());\n          if (recipe != null) {\n            time = recipe.getCookingTime();\n          }""",
              """          stack = ItemStack.parseOptional(level.registryAccess(), entry);\n          recipeHolder = findRecipe(recipeType, stack, level, modifier.getId());\n          if (recipeHolder != null) {\n            recipe = recipeHolder.value();\n            time = recipe.getCookingTime();\n          }""")

          replace_once(
              """              stack = ItemStack.of(entry);\n              if (!stack.isEmpty()) {\n                recipe = findRecipe(recipeType, stack, level, modifier.getId());\n              }""",
              """              stack = ItemStack.parseOptional(level.registryAccess(), entry);\n              if (!stack.isEmpty()) {\n                recipeHolder = findRecipe(recipeType, stack, level, modifier.getId());\n                recipe = recipeHolder == null ? null : recipeHolder.value();\n              }""")

          replace_once("ItemStack.isSameItemSameTags(currentResult, result)", "ItemStack.isSameItemSameComponents(currentResult, result)")
          replace_once(
              "TConstruct.LOG.error(\"Error getting result of recipe {} on modifier {}, this usually indicates a broken recipe\", recipe.getId(), modifier, e);",
              "TConstruct.LOG.error(\"Error getting result of recipe {} on modifier {}, this usually indicates a broken recipe\", recipeHolder != null ? recipeHolder.id() : recipe, modifier, e);")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit verified batch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/slimeknights/tconstruct/tools/modules/SmeltingModule.java
          git commit -m "Port frypan smelting recipes and components to 1.21"
          git push origin HEAD:1.21.1-neoforge

      - name: Dispatch full port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --ref 1.21.1-neoforge
