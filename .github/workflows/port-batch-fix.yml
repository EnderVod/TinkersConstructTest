name: Tinkers one-shot smashing components 1.21 batch

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-batch-fix.yml

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout port branch
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Apply verified Smashing fluid component migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/main/java/slimeknights/tconstruct/tools/modules/ranged/ammo/SmashingModule.java")
          text = path.read_text(encoding="utf-8")

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected exactly one match, found {count}: {old[:180]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              "import net.minecraft.core.RegistryAccess;",
              "import net.minecraft.core.RegistryAccess;\nimport net.minecraft.core.component.DataComponentPatch;\nimport net.minecraft.core.component.DataComponents;")
          replace_once(
              "import net.minecraft.nbt.CompoundTag;\nimport net.minecraft.nbt.Tag;",
              "import net.minecraft.nbt.CompoundTag;\nimport net.minecraft.nbt.NbtOps;\nimport net.minecraft.nbt.Tag;")
          replace_once(
              "import net.minecraft.world.item.TooltipFlag;",
              "import net.minecraft.world.item.TooltipFlag;\nimport net.minecraft.world.item.component.CustomData;")
          replace_once("import java.util.Objects;\n", "")

          replace_once(
              """  /** Gets the current fluid NBT */\n  @Nullable\n  private static CompoundTag getFluidTag(IModDataView data) {\n    if (data.contains(KEY_FLUID_TAG, Tag.TAG_COMPOUND)) {\n      return data.getCompound(KEY_FLUID_TAG);\n    }\n    return null;\n  }""",
              """  /** Reads the stored 1.21 fluid component patch. Legacy 1.20 fluid NBT becomes custom data. */\n  private static DataComponentPatch getFluidComponents(IModDataView data) {\n    if (!data.contains(KEY_FLUID_TAG)) {\n      return DataComponentPatch.EMPTY;\n    }\n    Tag encoded = data.get(KEY_FLUID_TAG);\n    if (encoded == null) {\n      return DataComponentPatch.EMPTY;\n    }\n    var parsed = DataComponentPatch.CODEC.parse(NbtOps.INSTANCE, encoded);\n    var result = parsed.result();\n    if (result.isPresent()) {\n      return result.get();\n    }\n    // Before 1.21 this key stored FluidStack's arbitrary tag directly. Preserve it as CUSTOM_DATA.\n    if (encoded instanceof CompoundTag legacy && !legacy.isEmpty()) {\n      return DataComponentPatch.builder().set(DataComponents.CUSTOM_DATA, CustomData.of(legacy.copy())).build();\n    }\n    parsed.error().ifPresent(error -> TConstruct.LOG.warn("Unable to decode Smashing fluid components: {}", error.message()));\n    return DataComponentPatch.EMPTY;\n  }\n\n  /** Serializes a fluid's component patch for persistent modifier/projectile storage. */\n  @Nullable\n  private static Tag serializeFluidComponents(FluidStack stack) {\n    return DataComponentPatch.CODEC.encodeStart(NbtOps.INSTANCE, stack.getComponentsPatch())\n      .resultOrPartial(error -> TConstruct.LOG.warn("Unable to encode Smashing fluid components: {}", error))\n      .orElse(null);\n  }\n\n  /** Reconstructs a component-aware fluid stack from modifier data. */\n  private static FluidStack makeFluidStack(IModDataView data, Fluid fluid, int amount) {\n    FluidStack stack = new FluidStack(fluid, amount);\n    stack.applyComponents(getFluidComponents(data));\n    return stack;\n  }""")

          replace_once(
              """    // success! we can fill\n    if (action.execute()) {\n      // we don't actually store the amount, its up to the modifier to determine that\n      data.putString(KEY_FLUID, Loadables.FLUID.getString(resource.getFluid()));\n      // we want to store a fixed size, but its possible part swapping changes our capacity, so keep track of our capacity at the time of storing\n      data.putFloat(KEY_VALIDATE, getValidationAmount(tool, modifier));\n      CompoundTag tag = resource.getTag();\n      if (tag != null) {\n        data.put(KEY_FLUID_TAG, tag.copy());\n      }\n    }""",
              """    // Ensure all fluid components are persistable before accepting the fill.\n    Tag components = serializeFluidComponents(resource);\n    if (components == null) {\n      return 0;\n    }\n    // success! we can fill\n    if (action.execute()) {\n      // we don't actually store the amount, its up to the modifier to determine that\n      data.putString(KEY_FLUID, Loadables.FLUID.getString(resource.getFluid()));\n      // we want to store a fixed size, but its possible part swapping changes our capacity, so keep track of our capacity at the time of storing\n      data.putFloat(KEY_VALIDATE, getValidationAmount(tool, modifier));\n      data.put(KEY_FLUID_TAG, components.copy());\n    }""")

          text = text.replace("new FluidStack(fluid, amount, getFluidTag(data))", "makeFluidStack(data, fluid, amount)")
          text = text.replace("new FluidStack(fluid, amount, getFluidTag(persistentData))", "makeFluidStack(persistentData, fluid, amount)")
          text = text.replace("new FluidStack(fluid, FluidValues.BOTTLE, getFluidTag(data))", "makeFluidStack(data, fluid, FluidValues.BOTTLE)")

          replace_once(
              """          // ensure the tag matches\n          CompoundTag storedTag = getFluidTag(data);\n          if (Objects.equals(storedTag, resource.getTag())) {\n            FluidStack result = new FluidStack(fluid, amount, storedTag);\n            if (action.execute()) {\n              clearFluid(data);\n            }\n            return result;\n          }""",
              """          // ensure both fluid identity and the 1.21 component patch match\n          FluidStack stored = makeFluidStack(data, fluid, amount);\n          if (FluidStack.isSameFluidSameComponents(stored, resource)) {\n            if (action.execute()) {\n              clearFluid(data);\n            }\n            return stored;\n          }""")

          replace_once(
              """          if (toolData.contains(KEY_FLUID_TAG, Tag.TAG_COMPOUND)) {\n            persistentData.put(KEY_FLUID_TAG, toolData.getCompound(KEY_FLUID_TAG));\n          }""",
              """          if (toolData.contains(KEY_FLUID_TAG)) {\n            Tag components = toolData.get(KEY_FLUID_TAG);\n            if (components != null) {\n              persistentData.put(KEY_FLUID_TAG, components.copy());\n            }\n          }""")

          if "getFluidTag(" in text or "getTag()" in text or "new FluidStack(fluid, amount," in text:
              raise RuntimeError("Legacy FluidStack tag API remains after Smashing migration")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit verified batch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/slimeknights/tconstruct/tools/modules/ranged/ammo/SmashingModule.java
          git commit -m "Port Smashing fluid data components to 1.21"
          git push origin HEAD:1.21.1-neoforge

      - name: Dispatch full port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --ref 1.21.1-neoforge
