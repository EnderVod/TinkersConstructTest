name: Tinkers one-shot block interactions 1.21 batch

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-batch-fix.yml

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout port branch
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Apply verified block interaction migrations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}: {old[:220]!r}")
              return text.replace(old, new, 1)

          # ChestBlock: item custom data + 1.21 block interaction pipeline.
          path = Path("src/main/java/slimeknights/tconstruct/tables/block/ChestBlock.java")
          text = path.read_text(encoding="utf-8")
          text = replace_once(text, "import net.minecraft.core.BlockPos;", "import net.minecraft.core.BlockPos;\nimport net.minecraft.core.component.DataComponents;", "chest data components import")
          text = replace_once(text, "import net.minecraft.nbt.Tag;", "import net.minecraft.nbt.Tag;\nimport net.minecraft.world.ItemInteractionResult;", "chest item interaction import")
          text = replace_once(text, "import net.minecraft.world.item.ItemStack;", "import net.minecraft.world.item.ItemStack;\nimport net.minecraft.world.item.component.CustomData;", "chest CustomData import")
          text = replace_once(
              text,
              """    CompoundTag tag = stack.getTag();\n    if (tag != null && tag.contains(\"TinkerData\", Tag.TAG_COMPOUND)) {\n      CompoundTag tinkerData = tag.getCompound(\"TinkerData\");\n      BlockEntity te = worldIn.getBlockEntity(pos);\n      if (te instanceof AbstractChestBlockEntity chest) {\n        chest.readInventory(tinkerData);\n      }\n    }""",
              """    CompoundTag tag = stack.getOrDefault(DataComponents.CUSTOM_DATA, CustomData.EMPTY).copyTag();\n    if (tag.contains(\"TinkerData\", Tag.TAG_COMPOUND)) {\n      CompoundTag tinkerData = tag.getCompound(\"TinkerData\");\n      BlockEntity te = worldIn.getBlockEntity(pos);\n      if (te instanceof AbstractChestBlockEntity chest) {\n        chest.readInventory(tinkerData, worldIn.registryAccess());\n      }\n    }""",
              "chest placed inventory data")
          text = replace_once(
              text,
              """  @SuppressWarnings(\"deprecation\")\n  @Override\n  @Deprecated\n  public InteractionResult use(BlockState state, Level worldIn, BlockPos pos, Player player, InteractionHand handIn, BlockHitResult hit) {\n    BlockEntity te = worldIn.getBlockEntity(pos);\n    Inventory playerInventory = player.getInventory();\n    ItemStack heldItem = playerInventory.getSelected();\n\n    if (!heldItem.isEmpty() && te instanceof AbstractChestBlockEntity chest && chest.canInsert(player, heldItem)) {\n      IItemHandlerModifiable itemHandler = chest.getItemHandler();\n      ItemStack rest = ItemHandlerHelper.insertItem(itemHandler, heldItem, false);\n      if (rest.isEmpty() || rest.getCount() < heldItem.getCount()) {\n        playerInventory.items.set(playerInventory.selected, rest);\n        return InteractionResult.SUCCESS;\n      }\n    }\n\n    return super.use(state, worldIn, pos, player, handIn, hit);\n  }""",
              """  @Override\n  protected ItemInteractionResult useItemOn(ItemStack heldItem, BlockState state, Level worldIn, BlockPos pos, Player player, InteractionHand handIn, BlockHitResult hit) {\n    BlockEntity te = worldIn.getBlockEntity(pos);\n    if (!heldItem.isEmpty() && te instanceof AbstractChestBlockEntity chest && chest.canInsert(player, heldItem)) {\n      IItemHandlerModifiable itemHandler = chest.getItemHandler();\n      ItemStack rest = ItemHandlerHelper.insertItem(itemHandler, heldItem, false);\n      if (rest.isEmpty() || rest.getCount() < heldItem.getCount()) {\n        player.setItemInHand(handIn, rest);\n        return ItemInteractionResult.SUCCESS;\n      }\n    }\n    return super.useItemOn(heldItem, state, worldIn, pos, player, handIn, hit);\n  }""",
              "chest useItemOn migration")
          text = text.replace("import net.minecraft.world.InteractionResult;\n", "")
          text = text.replace("import net.minecraft.world.entity.player.Inventory;\n", "")
          path.write_text(text, encoding="utf-8")

          # TinkerStationBlock: custom-data presence is no longer needed; pick-block uses vanilla 1.21 signature.
          path = Path("src/main/java/slimeknights/tconstruct/tables/block/TinkerStationBlock.java")
          text = path.read_text(encoding="utf-8")
          text = replace_once(text, "import net.minecraft.world.entity.player.Player;\n", "", "remove pick player import")
          text = replace_once(text, "import net.minecraft.world.level.BlockGetter;", "import net.minecraft.world.level.LevelReader;", "LevelReader pick import")
          text = replace_once(text, "import net.minecraft.world.phys.HitResult;\n", "", "remove HitResult import")
          text = replace_once(text, "if (stack.hasTag() && level.getBlockEntity(pos) instanceof TinkerStationBlockEntity be) {", "if (level.getBlockEntity(pos) instanceof TinkerStationBlockEntity be) {", "remove legacy hasTag gate")
          text = replace_once(
              text,
              "public ItemStack getCloneItemStack(BlockState state, HitResult target, BlockGetter level, BlockPos pos, Player player) {",
              "public ItemStack getCloneItemStack(LevelReader level, BlockPos pos, BlockState state) {",
              "vanilla 1.21 clone stack signature")
          path.write_text(text, encoding="utf-8")

          # ArmorSlot: enchantments are holder-backed dynamic registry entries in 1.21.
          path = Path("src/main/java/slimeknights/tconstruct/tables/menu/slot/ArmorSlot.java")
          text = path.read_text(encoding="utf-8")
          text = replace_once(text, "import net.minecraft.resources.ResourceLocation;", "import net.minecraft.core.registries.Registries;\nimport net.minecraft.resources.ResourceLocation;", "enchantment registry import")
          text = replace_once(text, "import net.minecraft.world.item.enchantment.EnchantmentHelper;", "import net.minecraft.world.item.enchantment.EnchantmentHelper;\nimport net.minecraft.world.item.enchantment.Enchantments;", "binding curse key import")
          text = replace_once(
              text,
              "return stack.isEmpty() || player.isCreative() || !EnchantmentHelper.hasBindingCurse(stack);",
              "return stack.isEmpty() || player.isCreative() || EnchantmentHelper.getItemEnchantmentLevel(player.level().registryAccess().lookupOrThrow(Registries.ENCHANTMENT).getOrThrow(Enchantments.BINDING_CURSE), stack) <= 0;",
              "binding curse holder lookup")
          path.write_text(text, encoding="utf-8")

          # FluidCannonBlock: legacy Block#use moved to item interaction in 1.21.
          path = Path("src/main/java/slimeknights/tconstruct/smeltery/block/FluidCannonBlock.java")
          text = path.read_text(encoding="utf-8")
          text = replace_once(text, "import net.minecraft.world.InteractionHand;", "import net.minecraft.world.InteractionHand;\nimport net.minecraft.world.ItemInteractionResult;", "cannon interaction result import")
          text = replace_once(text, "import net.minecraft.world.item.Equipable;", "import net.minecraft.world.item.Equipable;\nimport net.minecraft.world.item.ItemStack;", "cannon stack import")
          text = replace_once(
              text,
              """  @Deprecated\n  @Override\n  public InteractionResult use(BlockState state, Level world, BlockPos pos, Player player, InteractionHand hand, BlockHitResult hit) {""",
              """  @Override\n  protected ItemInteractionResult useItemOn(ItemStack stack, BlockState state, Level world, BlockPos pos, Player player, InteractionHand hand, BlockHitResult hit) {""",
              "fluid cannon useItemOn signature")
          text = replace_once(text, "    return InteractionResult.SUCCESS;\n  }", "    return ItemInteractionResult.SUCCESS;\n  }", "fluid cannon result")
          text = text.replace("import net.minecraft.world.InteractionResult;\n", "")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit verified batch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/slimeknights/tconstruct/tables/block/ChestBlock.java \
                  src/main/java/slimeknights/tconstruct/tables/block/TinkerStationBlock.java \
                  src/main/java/slimeknights/tconstruct/tables/menu/slot/ArmorSlot.java \
                  src/main/java/slimeknights/tconstruct/smeltery/block/FluidCannonBlock.java
          git commit -m "Port table and cannon interactions to 1.21"
          git push origin HEAD:1.21.1-neoforge

      - name: Dispatch full port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --ref 1.21.1-neoforge
