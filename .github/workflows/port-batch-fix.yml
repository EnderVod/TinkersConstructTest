name: Tinkers JEI 19.42 compatibility batch

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-batch-fix.yml

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout port branch
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Backport JEI category APIs to 19.42
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          ROOT=Path('src/main/java')

          def p(rel): return ROOT/rel

          def replace_once(path, old, new, label):
              text=path.read_text(encoding='utf-8')
              c=text.count(old)
              if c!=1: raise RuntimeError(f'{path}: {label} expected 1 found {c}')
              path.write_text(text.replace(old,new,1),encoding='utf-8')

          def add_import(path, anchor, imp, label):
              text=path.read_text(encoding='utf-8')
              if imp in text: return
              c=text.count(anchor)
              if c!=1: raise RuntimeError(f'{path}: {label} anchor {c}')
              path.write_text(text.replace(anchor,anchor+'\n'+imp,1),encoding='utf-8')

          # Restore JEI 19.42 tooltip widget removed by upstream Tinkers' 19.51 migration.
          helper=p('slimeknights/tconstruct/plugin/jei/util/RecipeTooltipWidget.java')
          if helper.exists(): raise RuntimeError('RecipeTooltipWidget unexpectedly exists')
          helper.write_text('''package slimeknights.tconstruct.plugin.jei.util;\n\nimport mezz.jei.api.gui.builder.ITooltipBuilder;\nimport mezz.jei.api.gui.drawable.IDrawable;\nimport mezz.jei.api.gui.widgets.IRecipeWidget;\nimport net.minecraft.client.gui.GuiGraphics;\nimport net.minecraft.client.gui.navigation.ScreenPosition;\nimport net.minecraft.network.chat.Component;\n\nimport javax.annotation.Nullable;\nimport java.util.List;\n\n/** Adds a tooltip to a rectangular area of a recipe, optionally drawing content in the same location. */\npublic class RecipeTooltipWidget implements IRecipeWidget {\n  @Nullable\n  private final IDrawable drawable;\n  private final ScreenPosition position;\n  private final int width;\n  private final int height;\n  private final List<Component> tooltip;\n\n  public RecipeTooltipWidget(IDrawable drawable, int x, int y, Component tooltip) {\n    this(drawable, x, y, List.of(tooltip));\n  }\n\n  public RecipeTooltipWidget(IDrawable drawable, int x, int y, List<Component> tooltip) {\n    this(drawable, x, y, drawable.getWidth(), drawable.getHeight(), tooltip);\n  }\n\n  public RecipeTooltipWidget(int x, int y, int width, int height, Component tooltip) {\n    this(null, x, y, width, height, List.of(tooltip));\n  }\n\n  private RecipeTooltipWidget(@Nullable IDrawable drawable, int x, int y, int width, int height, List<Component> tooltip) {\n    this.drawable = drawable;\n    this.position = new ScreenPosition(x, y);\n    this.width = width;\n    this.height = height;\n    this.tooltip = List.copyOf(tooltip);\n  }\n\n  @Override\n  public ScreenPosition getPosition() {\n    return position;\n  }\n\n  @Override\n  public void drawWidget(GuiGraphics graphics, double mouseX, double mouseY) {\n    if (drawable != null) {\n      drawable.draw(graphics);\n    }\n  }\n\n  @Override\n  public void getTooltip(ITooltipBuilder builder, double mouseX, double mouseY) {\n    if (mouseX >= 0 && mouseY >= 0 && mouseX < width && mouseY < height) {\n      builder.addAll(tooltip);\n    }\n  }\n}\n''',encoding='utf-8')

          # Simple widget API backports.
          for rel, old, new in [
          ('slimeknights/tconstruct/plugin/jei/entity/SeveringCategory.java','builder.addRecipeArrowWidget().setPosition(42, 10);','builder.addRecipeArrow().setPosition(42, 10);'),
          ('slimeknights/tconstruct/plugin/jei/entity/EntityMeltingRecipeCategory.java','builder.addDrawableWidget(arrow).setPosition(71, 21);','builder.addDrawable(arrow).setPosition(71, 21);'),
          ('slimeknights/tconstruct/plugin/jei/AlloyRecipeCategory.java','builder.addDrawableWidget(arrow).setPosition(90, 21);','builder.addDrawable(arrow).setPosition(90, 21);'),
          ('slimeknights/tconstruct/plugin/jei/partbuilder/PartBuilderCategory.java','builder.addRecipeArrowWidget().setPosition(66, 15);','builder.addRecipeArrow().setPosition(66, 15);'),
          ]: replace_once(p(rel),old,new,'JEI 19.42 widget backport')

          # Tool building tooltip drawable.
          path=p('slimeknights/tconstruct/plugin/jei/ToolBuildingCategory.java')
          add_import(path,'import slimeknights.tconstruct.library.tools.layout.LayoutSlot;','import slimeknights.tconstruct.plugin.jei.util.RecipeTooltipWidget;','tool tooltip import')
          replace_once(path,'builder.addRecipeArrowWidget().setPosition(74, 22);','builder.addRecipeArrow().setPosition(74, 22);','tool arrow')
          replace_once(path,'builder.addDrawableWidget(anvil).setPosition(76, 44).setTooltip(ANVIL);','builder.addWidget(new RecipeTooltipWidget(anvil, 76, 44, ANVIL));','anvil tooltip')

          # Molding simple drawables.
          path=p('slimeknights/tconstruct/plugin/jei/MoldingRecipeCategory.java')
          for old,new,label in [
          ('builder.addRecipeArrowWidget().setPosition(24, 23);','builder.addRecipeArrow().setPosition(24, 23);','molding arrow'),
          ('builder.addDrawableWidget(recipe.getPattern().isEmpty() ? upArrow : downArrow).setPosition(8, 17);','builder.addDrawable(recipe.getPattern().isEmpty() ? upArrow : downArrow).setPosition(8, 17);','molding direction'),
          ('builder.addDrawableWidget(block).setPosition(3, 40);','builder.addDrawable(block).setPosition(3, 40);','molding input block'),
          ('builder.addDrawableWidget(block).setPosition(51, 40);','builder.addDrawable(block).setPosition(51, 40);','molding output block'),
          ]: replace_once(path,old,new,label)

          # Melting used a custom animated drawable with tooltip before JEI 19.51.
          path=p('slimeknights/tconstruct/plugin/jei/melting/AbstractMeltingCategory.java')
          add_import(path,'import mezz.jei.api.gui.drawable.IDrawable;','import mezz.jei.api.gui.drawable.IDrawableAnimated.StartDirection;','animated direction import')
          add_import(path,'import slimeknights.tconstruct.plugin.jei.util.FluidTooltipCallback;','import slimeknights.tconstruct.plugin.jei.util.RecipeTooltipWidget;','melting tooltip import')
          replace_once(path,'  protected final IDrawableStatic plus;','  protected final IDrawableStatic plus;\n  private final IGuiHelper guiHelper;','melting gui helper field')
          replace_once(path,'    this.background = helper.createDrawable(BACKGROUND_LOC, 0, 0, 132, 40);','    this.guiHelper = helper;\n    this.background = helper.createDrawable(BACKGROUND_LOC, 0, 0, 132, 40);','melting gui helper init')
          old='''    // includes both the static arrow background and animated foreground\n    builder.addAnimatedRecipeArrowWidget(recipe.getTime() * 5)\n      .setPosition(56, 18)\n      .setTooltip(Component.translatable(KEY_COOLING_TIME, recipe.getTime() / 4));\n    if (recipe.getOreType() != null) {\n      builder.addDrawableWidget(plus).setPosition(83, 26).setTooltip(TOOLTIP_ORE);\n    }'''
          new='''    IDrawable arrow = guiHelper.drawableBuilder(BACKGROUND_LOC, 150, 41, 24, 17)\n                                 .buildAnimated(recipe.getTime() * 5, StartDirection.LEFT, false);\n    builder.addWidget(new RecipeTooltipWidget(\n      arrow, 56, 18, Component.translatable(KEY_COOLING_TIME, recipe.getTime() / 4)));\n    if (recipe.getOreType() != null) {\n      builder.addWidget(new RecipeTooltipWidget(plus, 83, 26, TOOLTIP_ORE));\n    }'''
          replace_once(path,old,new,'melting widgets')

          # Worktable title hover area.
          path=p('slimeknights/tconstruct/plugin/jei/modifiers/ModifierWorktableCategory.java')
          add_import(path,'import slimeknights.tconstruct.plugin.jei.TConstructJEIConstants;','import slimeknights.tconstruct.plugin.jei.util.RecipeTooltipWidget;','worktable tooltip import')
          replace_once(path,'builder.addTooltipArea(0, 2, 121, 11).setTooltip(recipe.getDescription(null));','builder.addWidget(new RecipeTooltipWidget(0, 2, 121, 11, recipe.getDescription(null)));','worktable tooltip')

          # Modifier tooltip drawables.
          path=p('slimeknights/tconstruct/plugin/jei/modifiers/ModifierRecipeCategory.java')
          add_import(path,'import slimeknights.tconstruct.plugin.jei.TConstructJEIConstants;','import slimeknights.tconstruct.plugin.jei.util.RecipeTooltipWidget;','modifier tooltip import')
          replace_once(path,'builder.addRecipeArrowWidget().setPosition(71, 33);','builder.addRecipeArrow().setPosition(71, 33);','modifier arrow')
          replace_once(path,'builder.addDrawableWidget(requirements).setPosition(66, 58).setTooltip(requirementsError);','builder.addWidget(new RecipeTooltipWidget(requirements, 66, 58, requirementsError));','requirements tooltip')
          replace_once(path,'builder.addDrawableWidget(incremental).setPosition(83, 59).setTooltip(TEXT_INCREMENTAL);','builder.addWidget(new RecipeTooltipWidget(incremental, 83, 59, TEXT_INCREMENTAL));','incremental tooltip')
          replace_once(path,'''builder.addDrawableWidget(SLOTLESS)\n        .setPosition(102, 58)\n        .setTooltip(SlotIngredientRenderer.TEXT_FREE);''','''builder.addWidget(new RecipeTooltipWidget(SLOTLESS, 102, 58, SlotIngredientRenderer.TEXT_FREE));''','slotless tooltip')

          # Casting drawables and cast tooltip.
          path=p('slimeknights/tconstruct/plugin/jei/casting/AbstractCastingCategory.java')
          add_import(path,'import slimeknights.tconstruct.plugin.jei.util.FluidTooltipCallback;','import slimeknights.tconstruct.plugin.jei.util.RecipeTooltipWidget;','casting tooltip import')
          replace_once(path,'builder.addDrawableWidget(block).setPosition(38, 35);','builder.addDrawable(block).setPosition(38, 35);','casting block')
          replace_once(path,'builder.addDrawableWidget(arrow).setPosition(58, 18);','builder.addDrawable(arrow).setPosition(58, 18);','casting arrow')
          replace_once(path,'builder.addDrawableWidget(drawable).setPosition(63, 39).setTooltip(tooltip);','builder.addWidget(new RecipeTooltipWidget(drawable, 63, 39, tooltip));','casting tooltip')

          # JEI 19.42 ITypedIngredient predates normalize().
          path=p('slimeknights/tconstruct/plugin/jei/util/ClickableIngredient.java')
          text=path.read_text(encoding='utf-8')
          text=text.replace('import mezz.jei.api.ingredients.IIngredientHelper;\n','')
          old='''  @Override\n  public ClickableIngredient<T> normalize(IIngredientHelper<T> ingredientHelper) {\n    T normalized = ingredientHelper.normalizeIngredient(getIngredient);\n    return normalized == getIngredient ? this : new ClickableIngredient<>(getType, normalized, getArea);\n  }\n\n'''
          if text.count(old)!=1: raise RuntimeError('Clickable normalize mismatch')
          path.write_text(text.replace(old,'',1),encoding='utf-8')

          # Tinkers-owned display interfaces retain recipe IDs after vanilla Recipe moved identity to RecipeHolder.
          for rel, anchor in [
          ('slimeknights/tconstruct/library/recipe/worktable/IModifierWorktableRecipe.java','import net.minecraft.network.chat.Component;'),
          ('slimeknights/tconstruct/library/recipe/partbuilder/IDisplayPartBuilderRecipe.java','import net.minecraft.core.registries.BuiltInRegistries;'),
          ('slimeknights/tconstruct/library/recipe/material/MaterialsCraftingTableRecipe.java','import net.minecraft.world.item.ItemStack;'),
          ]: add_import(p(rel),anchor,'import net.minecraft.resources.ResourceLocation;','recipe id import')
          path=p('slimeknights/tconstruct/library/recipe/worktable/IModifierWorktableRecipe.java')
          replace_once(path,'public interface IModifierWorktableRecipe extends ICommonRecipe<ITinkerableContainer> {','public interface IModifierWorktableRecipe extends ICommonRecipe<ITinkerableContainer> {\n  /** Stable ID used for JEI display/bookmark identity. */\n  ResourceLocation getId();','worktable id contract')
          path=p('slimeknights/tconstruct/library/recipe/partbuilder/IDisplayPartBuilderRecipe.java')
          replace_once(path,'public interface IDisplayPartBuilderRecipe extends IPartBuilderRecipe {','public interface IDisplayPartBuilderRecipe extends IPartBuilderRecipe {\n  /** Stable ID used for JEI display/bookmark identity. */\n  ResourceLocation getId();','part builder id contract')
          path=p('slimeknights/tconstruct/library/recipe/material/MaterialsCraftingTableRecipe.java')
          replace_once(path,'public interface MaterialsCraftingTableRecipe {','public interface MaterialsCraftingTableRecipe {\n  /** Stable ID used by crafting-category extensions. */\n  ResourceLocation getId();','materials id contract')

          # Static extension helper must preserve the materials recipe intersection type.
          path=p('slimeknights/tconstruct/plugin/jei/material/MaterialsCraftingExtension.java')
          replace_once(path,'public static void setRecipe(ICraftingCategoryExtension self, IRecipeLayoutBuilder builder, ICraftingGridHelper craftingGridHelper, CraftingRecipe recipe, List<ItemStack> result, ItemStack plainResult, @Nullable int[] materialSlots) {','public static <R extends CraftingRecipe & MaterialsCraftingTableRecipe> void setRecipe(ICraftingCategoryExtension self, IRecipeLayoutBuilder builder, ICraftingGridHelper craftingGridHelper, R recipe, List<ItemStack> result, ItemStack plainResult, @Nullable int[] materialSlots) {','materials helper generic')

          # Exact JEI 19.42 crafting extension method name.
          path=p('slimeknights/tconstruct/plugin/jei/JEIPlugin.java')
          text=path.read_text(encoding='utf-8')
          count=text.count('.addCategoryExtension(')
          if count!=3: raise RuntimeError(f'Expected 3 addCategoryExtension calls, got {count}')
          path.write_text(text.replace('.addCategoryExtension(','.addExtension('),encoding='utf-8')

          # Assert no 19.51-only category widget APIs remain in the files handled here.
          for rel in [
          'slimeknights/tconstruct/plugin/jei/entity/SeveringCategory.java','slimeknights/tconstruct/plugin/jei/entity/EntityMeltingRecipeCategory.java','slimeknights/tconstruct/plugin/jei/ToolBuildingCategory.java','slimeknights/tconstruct/plugin/jei/AlloyRecipeCategory.java','slimeknights/tconstruct/plugin/jei/MoldingRecipeCategory.java','slimeknights/tconstruct/plugin/jei/melting/AbstractMeltingCategory.java','slimeknights/tconstruct/plugin/jei/modifiers/ModifierWorktableCategory.java','slimeknights/tconstruct/plugin/jei/modifiers/ModifierRecipeCategory.java','slimeknights/tconstruct/plugin/jei/casting/AbstractCastingCategory.java','slimeknights/tconstruct/plugin/jei/partbuilder/PartBuilderCategory.java']:
              text=p(rel).read_text(encoding='utf-8')
              for bad in ('addDrawableWidget(', 'addRecipeArrowWidget(', 'addAnimatedRecipeArrowWidget(', 'addTooltipArea('):
                  if bad in text: raise RuntimeError(f'{rel}: {bad} remains')
          print('JEI 19.42 compatibility batch validated')
          PY

      - name: Commit verified JEI compatibility batch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No JEI compatibility changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/slimeknights/tconstruct/plugin/jei \
                  src/main/java/slimeknights/tconstruct/library/recipe/worktable/IModifierWorktableRecipe.java \
                  src/main/java/slimeknights/tconstruct/library/recipe/partbuilder/IDisplayPartBuilderRecipe.java \
                  src/main/java/slimeknights/tconstruct/library/recipe/material/MaterialsCraftingTableRecipe.java
          git commit -m "Backport Tinkers JEI integration to JEI 19.42"
          git push origin HEAD:1.21.1-neoforge

      - name: Dispatch full port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --ref 1.21.1-neoforge
