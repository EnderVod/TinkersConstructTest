name: Remove vanilla-package explosion shim

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-batch-fix.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout port branch
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Remove split-package compatibility shim
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/main/java/slimeknights/tconstruct/library/utils/CustomExplosion.java')
          text = path.read_text(encoding='utf-8')
          old_import = 'import net.minecraft.world.item.enchantment.ProtectionEnchantment;\n'
          if text.count(old_import) != 1:
              raise RuntimeError(f'Expected ProtectionEnchantment import once, found {text.count(old_import)}')
          text = text.replace(old_import, '', 1)
          old_call = 'adjustedStrength = ProtectionEnchantment.getExplosionKnockbackAfterDampener(living, adjustedStrength);'
          new_call = 'adjustedStrength *= 1.0D - living.getAttributeValue(net.minecraft.world.entity.ai.attributes.Attributes.EXPLOSION_KNOCKBACK_RESISTANCE);'
          if text.count(old_call) != 1:
              raise RuntimeError(f'Expected explosion shim call once, found {text.count(old_call)}')
          text = text.replace(old_call, new_call, 1)
          path.write_text(text, encoding='utf-8')

          shim = Path('src/main/java/net/minecraft/world/item/enchantment/ProtectionEnchantment.java')
          if not shim.exists():
              raise RuntimeError('ProtectionEnchantment shim is already missing')
          shim.unlink()

          # No Tinkers-owned sources may live in the vanilla namespace; that creates a Java module split-package.
          vanilla_sources = list(Path('src/main/java/net/minecraft').rglob('*.java'))
          if vanilla_sources:
              raise RuntimeError(f'Vanilla namespace sources remain: {vanilla_sources}')
          PY

      - name: Commit runtime namespace fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/main/java/slimeknights/tconstruct/library/utils/CustomExplosion.java src/main/java/net/minecraft
          git commit -m "Remove vanilla-package explosion compatibility shim"
          git push origin HEAD:1.21.1-neoforge
