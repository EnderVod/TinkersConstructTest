name: Tinkers one-shot modifier events 1.21 batch

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-batch-fix.yml

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout port branch
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Apply verified ModifierEvents migrations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/main/java/slimeknights/tconstruct/tools/logic/ModifierEvents.java")
          text = path.read_text(encoding="utf-8")

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected exactly one match, found {count}: {old[:120]!r}")
              text = text.replace(old, new, 1)

          # Dynamic enchantment registry + item data components.
          replace_once(
              "import net.minecraft.core.registries.BuiltInRegistries;",
              "import net.minecraft.core.component.DataComponents;\nimport net.minecraft.core.registries.BuiltInRegistries;\nimport net.minecraft.core.registries.Registries;")
          replace_once(
              "import net.minecraft.server.level.ServerPlayer;",
              "import net.minecraft.server.level.ServerLevel;\nimport net.minecraft.server.level.ServerPlayer;")
          replace_once(
              "import net.minecraft.world.item.ItemStack;",
              "import net.minecraft.world.item.ItemStack;\nimport net.minecraft.world.item.component.CustomData;")
          replace_once(
              "import net.minecraft.world.item.enchantment.EnchantmentHelper;",
              "import net.minecraft.world.item.enchantment.EnchantmentHelper;\nimport net.minecraft.world.item.enchantment.Enchantments;")
          replace_once(
              "import net.neoforged.neoforge.event.level.BlockEvent.BreakEvent;",
              "import net.neoforged.neoforge.event.level.BlockDropsEvent;")

          # Vanishing is holder-backed in 1.21.
          replace_once(
              """        LivingEntity target = event.getEntity();\n        // check each slot for gold""",
              """        LivingEntity target = event.getEntity();\n        var vanishing = target.level().registryAccess().lookupOrThrow(Registries.ENCHANTMENT).getOrThrow(Enchantments.VANISHING_CURSE);\n        // check each slot for gold""")
          replace_once(
              "!EnchantmentHelper.hasVanishingCurse(stack)",
              "EnchantmentHelper.getItemEnchantmentLevel(vanishing, stack) <= 0")

          # Mantle 1.21 reads the soulbound slot marker from CUSTOM_DATA.
          old = "stack.getOrCreateTag().putInt(MantleEvents.SOULBOUND_SLOT, i);"
          if text.count(old) != 2:
              raise RuntimeError(f"Expected two soulbound NBT writes, found {text.count(old)}")
          text = text.replace(old, "int slot = i;\n          CustomData.update(DataComponents.CUSTOM_DATA, stack, tag -> tag.putInt(MantleEvents.SOULBOUND_SLOT, slot));", 2)

          # Block experience is mutable on BlockDropsEvent in current NeoForge.
          replace_once(
              """  static void beforeBlockBreak(BreakEvent event) {\n    Player player = event.getPlayer();""",
              """  static void beforeBlockBreak(BlockDropsEvent event) {\n    if (!(event.getBreaker() instanceof Player player)) {\n      return;\n    }""")
          replace_once(
              "event.setExpToDrop((int)(event.getExpToDrop() * bonus));",
              "event.setDroppedExperience((int)(event.getDroppedExperience() * bonus));")

          # 1.21 collapsed directional fireball power into a scalar acceleration value.
          replace_once(
              """                if (projectile instanceof AbstractHurtingProjectile hurting) {\n                  hurting.xPower = reboundAngle.x * 0.1;\n                  hurting.yPower = reboundAngle.y * 0.1;\n                  hurting.zPower = reboundAngle.z * 0.1;\n                }""",
              """                if (projectile instanceof AbstractHurtingProjectile hurting) {\n                  hurting.accelerationPower = 0.1;\n                }""")

          replace_once("target.setSecondsOnFire(5);", "target.igniteForSeconds(5);")

          # Vanilla 1.21 combines post-hurt and post-damage enchantment callbacks.
          replace_once(
              """          if (!level.isClientSide && livingOwner != null) {\n            EnchantmentHelper.doPostHurtEffects(target, livingOwner);\n            EnchantmentHelper.doPostDamageEffects(livingOwner, target);\n          }""",
              """          if (level instanceof ServerLevel serverLevel && livingOwner != null) {\n            EnchantmentHelper.doPostAttackEffects(serverLevel, target, damageSource);\n          }""")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit verified batch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/slimeknights/tconstruct/tools/logic/ModifierEvents.java
          git commit -m "Port modifier event APIs to 1.21"
          git push origin HEAD:1.21.1-neoforge

      - name: Dispatch full port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --ref 1.21.1-neoforge
