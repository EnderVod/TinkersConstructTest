name: Tinkers one-shot tool table screen 1.21 batch

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-batch-fix.yml

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout port branch
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Apply verified ToolTableScreen 1.21 migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          at = Path("src/main/resources/META-INF/port-accesstransformer.cfg")
          text = at.read_text(encoding="utf-8")
          anchor = "public net.minecraft.client.gui.screens.Screen font\n"
          if text.count(anchor) != 1:
              raise RuntimeError("Expected Screen font AT anchor exactly once")
          additions = (
              "# Tinkers uses vanilla's smithing armor-stand transform for its tool-table preview.\n"
              "public net.minecraft.client.gui.screens.inventory.SmithingScreen ARMOR_STAND_ANGLE\n"
              "public net.minecraft.client.gui.screens.inventory.SmithingScreen ARMOR_STAND_TRANSLATION\n"
          )
          if "SmithingScreen ARMOR_STAND_ANGLE" not in text:
              text = text.replace(anchor, anchor + additions, 1)
          if "SmithingScreen ARMOR_STAND_TRANSLATION" not in text:
              raise RuntimeError("Smithing translation AT missing after migration")
          at.write_text(text, encoding="utf-8")

          path = Path("src/main/java/slimeknights/tconstruct/tables/client/inventory/ToolTableScreen.java")
          text = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}: {old[:180]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              "InventoryScreen.renderEntityInInventory(graphics, this.armorStandX, this.armorStandY, this.armorStandScale, pose, null, this.armorStandPreview);",
              "InventoryScreen.renderEntityInInventory(graphics, this.armorStandX, this.armorStandY, this.armorStandScale, SmithingScreen.ARMOR_STAND_TRANSLATION, pose, null, this.armorStandPreview);",
              "1.21 entity preview signature")
          replace_once(
              "result.getItem().appendHoverText(result, Minecraft.getInstance().level, list, Default.NORMAL);",
              "result.getItem().appendHoverText(result, Item.TooltipContext.of(Minecraft.getInstance().level.registryAccess()), list, Default.NORMAL);",
              "1.21 tooltip context")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit verified batch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/META-INF/port-accesstransformer.cfg \
                  src/main/java/slimeknights/tconstruct/tables/client/inventory/ToolTableScreen.java
          git commit -m "Port tool table preview and tooltip APIs to 1.21"
          git push origin HEAD:1.21.1-neoforge

      - name: Dispatch full port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --ref 1.21.1-neoforge
