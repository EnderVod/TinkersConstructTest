name: Tinkers one-shot worldgen datagen 1.21 batch

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-batch-fix.yml

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout port branch
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Apply verified worldgen and recipe-builder migrations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: {label}: expected one match, found {count}: {old[:180]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          at = Path("src/main/resources/META-INF/port-accesstransformer.cfg")
          text = at.read_text(encoding="utf-8")
          marker = "public net.minecraft.world.item.context.BlockPlaceContext replaceClicked\n"
          if text.count(marker) != 1:
              raise RuntimeError("Expected BlockPlaceContext AT anchor exactly once")
          additions = (
              "\n# HugeFungusFeature kept these generation helpers in 1.21.1 but made them private. Tinkers' slime\n"
              "# fungus only changes base validation/height selection, then deliberately delegates stem/hat placement\n"
              "# to vanilla so behavior stays identical to the active Minecraft implementation.\n"
              "public net.minecraft.world.level.levelgen.feature.HugeFungusFeature placeStem(Lnet/minecraft/world/level/WorldGenLevel;Lnet/minecraft/util/RandomSource;Lnet/minecraft/world/level/levelgen/feature/HugeFungusConfiguration;Lnet/minecraft/core/BlockPos;IZ)V\n"
              "public net.minecraft.world.level.levelgen.feature.HugeFungusFeature placeHat(Lnet/minecraft/world/level/WorldGenLevel;Lnet/minecraft/util/RandomSource;Lnet/minecraft/world/level/levelgen/feature/HugeFungusConfiguration;Lnet/minecraft/core/BlockPos;IZ)V\n"
          )
          if "HugeFungusFeature placeStem" in text or "HugeFungusFeature placeHat" in text:
              raise RuntimeError("Huge fungus AT entries already present unexpectedly")
          at.write_text(text.replace(marker, marker + additions, 1), encoding="utf-8")

          path = Path("src/main/java/slimeknights/tconstruct/tables/recipe/TinkerStationDamagingRecipeBuilder.java")
          replace_once(
              path,
              "consumer.accept(new LoadableFinishedRecipe<>(new TinkerStationDamagingRecipe(id, ingredient, damageAmount), TinkerStationDamagingRecipe.LOADER, advancementId));",
              "consumer.accept(new LoadableFinishedRecipe<>(id, new TinkerStationDamagingRecipe(id, ingredient, damageAmount), TinkerStationDamagingRecipe.LOADER, advancementId));",
              "Mantle LoadableFinishedRecipe constructor")

          path = Path("src/main/java/slimeknights/tconstruct/tables/recipe/TinkerStationPartSwappingBuilder.java")
          text = path.read_text(encoding="utf-8")
          old = "consumer.accept(new LoadableFinishedRecipe<>(new ToolMaterialSwappingRecipe(id, tools, maxStackSize, extraRequirements), ToolMaterialSwappingRecipe.LOADER, null));"
          if text.count(old) != 1:
              raise RuntimeError("Tool material swapping finished recipe constructor mismatch")
          text = text.replace(old, "consumer.accept(new LoadableFinishedRecipe<>(id, new ToolMaterialSwappingRecipe(id, tools, maxStackSize, extraRequirements), ToolMaterialSwappingRecipe.LOADER, null));", 1)
          old = "consumer.accept(new LoadableFinishedRecipe<>(new TinkerStationPartSwapping(id, tools, maxStackSize, extraRequirements), TinkerStationPartSwapping.LOADER, null));"
          if text.count(old) != 1:
              raise RuntimeError("Part swapping finished recipe constructor mismatch")
          text = text.replace(old, "consumer.accept(new LoadableFinishedRecipe<>(id, new TinkerStationPartSwapping(id, tools, maxStackSize, extraRequirements), TinkerStationPartSwapping.LOADER, null));", 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit verified batch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/META-INF/port-accesstransformer.cfg \
                  src/main/java/slimeknights/tconstruct/tables/recipe/TinkerStationDamagingRecipeBuilder.java \
                  src/main/java/slimeknights/tconstruct/tables/recipe/TinkerStationPartSwappingBuilder.java
          git commit -m "Port slime fungus access and recipe builders to 1.21"
          git push origin HEAD:1.21.1-neoforge

      - name: Dispatch full port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --ref 1.21.1-neoforge
