name: Tinkers one-shot modifier worktable 1.21 batch

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-batch-fix.yml

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout port branch
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Apply verified Modifier Worktable 1.21 migrations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/main/java/slimeknights/tconstruct/tables/block/entity/table/ModifierWorktableBlockEntity.java")
          text = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly one match, found {count}: {old[:180]!r}")
              text = text.replace(old, new, 1)

          replace_once("import net.minecraftforge.common.util.LazyOptional;\n", "", "remove LazyOptional")
          replace_once("import net.neoforged.neoforge.items.ItemHandlerHelper;\n", "", "remove copy helper import")
          replace_once("    this.itemHandlerCap = LazyOptional.of(() -> this.itemHandler);\n", "", "remove legacy capability")
          replace_once(
              "Optional<IModifierWorktableRecipe> recipe = level.getRecipeManager().getRecipeFor(TinkerRecipeTypes.MODIFIER_WORKTABLE.get(), inventoryWrapper, level);",
              "Optional<IModifierWorktableRecipe> recipe = level.getRecipeManager().getRecipeFor(TinkerRecipeTypes.MODIFIER_WORKTABLE.get(), inventoryWrapper, level).map(holder -> holder.value());",
              "unwrap recipe holder")
          replace_once("ItemStack.isSameItemSameTags(original, stack)", "ItemStack.isSameItemSameComponents(original, stack)", "component-aware equality")
          replace_once("ForgeEventFactory.firePlayerCraftingEvent(player, resultItem, this.inventoryWrapper);", "EventHooks.firePlayerCraftingEvent(player, resultItem, this.inventoryWrapper);", "NeoForge craft event")
          replace_once(
              "this.setItem(TINKER_SLOT, ItemHandlerHelper.copyStackWithSize(tinkerable, tinkerable.getCount() - shrinkToolSlot));",
              "this.setItem(TINKER_SLOT, tinkerable.copyWithCount(tinkerable.getCount() - shrinkToolSlot));",
              "1.21 stack copy")

          for legacy in ("LazyOptional", "itemHandlerCap", "isSameItemSameTags", "ForgeEventFactory", "ItemHandlerHelper.copyStackWithSize"):
              if legacy in text:
                  raise RuntimeError(f"Legacy Modifier Worktable API remains: {legacy}")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit verified batch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/slimeknights/tconstruct/tables/block/entity/table/ModifierWorktableBlockEntity.java
          git commit -m "Port Modifier Worktable APIs to 1.21"
          git push origin HEAD:1.21.1-neoforge

      - name: Dispatch full port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --ref 1.21.1-neoforge
