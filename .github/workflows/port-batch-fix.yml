name: Port standard armor types to 1.21

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-batch-fix.yml

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout port branch
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Restrict Tinkers armor systems to player armor types
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('src/main/java/slimeknights/tconstruct')
          material = root / 'library/tools/definition/ModifiableArmorMaterial.java'
          text = material.read_text(encoding='utf-8')

          old = '  public static final EquipmentSlot[] ARMOR_SLOTS = {EquipmentSlot.FEET, EquipmentSlot.LEGS, EquipmentSlot.CHEST, EquipmentSlot.HEAD};'
          new = '''  public static final EquipmentSlot[] ARMOR_SLOTS = {EquipmentSlot.FEET, EquipmentSlot.LEGS, EquipmentSlot.CHEST, EquipmentSlot.HEAD};
  /** The four humanoid armor item types. Minecraft 1.21 also has BODY for animal armor, which Tinkers does not model. */
  public static final ArmorItem.Type[] ARMOR_TYPES = {ArmorItem.Type.HELMET, ArmorItem.Type.CHESTPLATE, ArmorItem.Type.LEGGINGS, ArmorItem.Type.BOOTS};'''
          if text.count(old) != 1:
              raise RuntimeError('ARMOR_SLOTS anchor mismatch')
          text = text.replace(old, new, 1)

          if text.count('ToolDefinition[] definitions = new ToolDefinition[4];') != 1:
              raise RuntimeError('armor definition array anchor mismatch')
          text = text.replace('ToolDefinition[] definitions = new ToolDefinition[4];', 'ToolDefinition[] definitions = new ToolDefinition[ARMOR_TYPES.length];', 1)

          old = '''    for (ArmorItem.Type slot : slots) {
      definitions[slot.ordinal()] = ToolDefinition.create(id.withSuffix("_" + slot.getName()));
    }'''
          new = '''    for (ArmorItem.Type slot : slots) {
      int index = slot.ordinal();
      if (index >= definitions.length) {
        throw new IllegalArgumentException("Unsupported non-humanoid armor type " + slot);
      }
      definitions[index] = ToolDefinition.create(id.withSuffix("_" + slot.getName()));
    }'''
          if text.count(old) != 1:
              raise RuntimeError('armor create loop mismatch')
          text = text.replace(old, new, 1)

          if text.count('return create(id, equipSound, ArmorItem.Type.values());') != 1:
              raise RuntimeError('default armor type list mismatch')
          text = text.replace('return create(id, equipSound, ArmorItem.Type.values());', 'return create(id, equipSound, ARMOR_TYPES);', 1)

          old = '    return armorDefinitions[slotType.ordinal()];'
          new = '''    int index = slotType.ordinal();
    return index < armorDefinitions.length ? armorDefinitions[index] : null;'''
          if text.count(old) != 1:
              raise RuntimeError('armor definition lookup mismatch')
          text = text.replace(old, new, 1)
          material.write_text(text, encoding='utf-8')

          # All remaining Tinkers usages of Type.values() mean the four player armor pieces.
          # In 1.21 values() also contains BODY, intended for animal body armor.
          replacement = 'slimeknights.tconstruct.library.tools.definition.ModifiableArmorMaterial.ARMOR_TYPES'
          changed = []
          count = 0
          for path in root.rglob('*.java'):
              if path == material:
                  continue
              source = path.read_text(encoding='utf-8')
              hits = source.count('ArmorItem.Type.values()')
              if hits:
                  count += hits
                  path.write_text(source.replace('ArmorItem.Type.values()', replacement), encoding='utf-8')
                  changed.append((str(path), hits))
          if count != 22:
              raise RuntimeError(f'Expected 22 remaining ArmorItem.Type.values() uses, found {count}: {changed}')

          # Assert the old five-type iteration cannot re-enter these 4-slot systems.
          leftovers = []
          for path in root.rglob('*.java'):
              if 'ArmorItem.Type.values()' in path.read_text(encoding='utf-8'):
                  leftovers.append(str(path))
          if leftovers:
              raise RuntimeError(f'Legacy ArmorItem.Type.values() remains: {leftovers}')
          print(f'Patched {count + 1} ArmorItem.Type.values() call sites across Tinkers')
          PY

      - name: Commit armor type migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/slimeknights/tconstruct
          git commit -m "Restrict Tinkers armor systems to humanoid armor types"
          git push origin HEAD:1.21.1-neoforge

      - name: Dispatch compile and server smoke
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run port-compile.yml --ref 1.21.1-neoforge
          gh workflow run port-server-smoke.yml --ref 1.21.1-neoforge
