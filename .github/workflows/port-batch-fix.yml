name: Tinkers one-shot table APIs 1.21 batch

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-batch-fix.yml

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout port branch
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Apply verified table migrations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected exactly one match, found {count}: {old[:160]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Block-entity capabilities moved from per-BE LazyOptional lookups to Level capability queries.
          tabbed = Path("src/main/java/slimeknights/tconstruct/tables/menu/TabbedContainerMenu.java")
          replace_once(tabbed,
              "import net.minecraftforge.common.capabilities.ForgeCapabilities;",
              "import net.neoforged.neoforge.capabilities.Capabilities;")
          replace_once(tabbed,
              "import net.neoforged.neoforge.items.IItemHandlerModifiable;",
              "import net.neoforged.neoforge.items.IItemHandler;\nimport net.neoforged.neoforge.items.IItemHandlerModifiable;")
          replace_once(tabbed,
              "int invSlots = inventoryTE.getCapability(ForgeCapabilities.ITEM_HANDLER, accessDir).orElse(EmptyItemHandler.INSTANCE).getSlots();",
              "IItemHandler handler = world.getCapability(Capabilities.ItemHandler.BLOCK, inventoryTE.getBlockPos(), inventoryTE.getBlockState(), inventoryTE, accessDir);\n        int invSlots = (handler == null ? EmptyItemHandler.INSTANCE : handler).getSlots();")
          replace_once(tabbed,
              "return tileEntity.getCapability(ForgeCapabilities.ITEM_HANDLER, direction).filter(cap -> cap instanceof IItemHandlerModifiable).isPresent();",
              "Level level = tileEntity.getLevel();\n    return level != null && level.getCapability(Capabilities.ItemHandler.BLOCK, tileEntity.getBlockPos(), tileEntity.getBlockState(), tileEntity, direction) instanceof IItemHandlerModifiable;")

          # RecipeManager now returns RecipeHolder.
          wrapper = Path("src/main/java/slimeknights/tconstruct/tables/block/entity/inventory/TinkerStationContainerWrapper.java")
          replace_once(wrapper,
              "Optional<MaterialRecipe> newRecipe = world.getRecipeManager().getRecipeFor(TinkerRecipeTypes.MATERIAL.get(), inv, world);",
              "Optional<MaterialRecipe> newRecipe = world.getRecipeManager().getRecipeFor(TinkerRecipeTypes.MATERIAL.get(), inv, world).map(holder -> holder.value());")

          # Preserve Tinkers' custom enlarged render bounds, but it is no longer a vanilla override in 1.21.
          retextured = Path("src/main/java/slimeknights/tconstruct/tables/block/entity/table/RetexturedTableBlockEntity.java")
          replace_once(retextured,
              """  @Override\n  public AABB getRenderBoundingBox() {\n    return new AABB(worldPosition, worldPosition.offset(1, 2, 1));\n  }""",
              """  public AABB getRenderBoundingBox() {\n    return new AABB(\n      worldPosition.getX(), worldPosition.getY(), worldPosition.getZ(),\n      worldPosition.getX() + 1, worldPosition.getY() + 2, worldPosition.getZ() + 1);\n  }""")

          station = Path("src/main/java/slimeknights/tconstruct/tables/block/entity/table/TinkerStationBlockEntity.java")
          replace_once(station, "import net.minecraftforge.common.util.LazyOptional;\n", "")
          replace_once(station, "import net.neoforged.neoforge.items.ItemHandlerHelper;\n", "")
          replace_once(station,
              "    this.itemHandlerCap = LazyOptional.of(() -> this.itemHandler);\n",
              "")
          replace_once(station,
              "recipe = manager.getRecipeFor(TinkerRecipeTypes.TINKER_STATION.get(), this.inventoryWrapper, this.level).orElse(null);",
              "recipe = manager.getRecipeFor(TinkerRecipeTypes.TINKER_STATION.get(), this.inventoryWrapper, this.level).map(holder -> holder.value()).orElse(null);")
          replace_once(station,
              "ForgeEventFactory.firePlayerCraftingEvent(player, resultItem, this.inventoryWrapper);",
              "EventHooks.firePlayerCraftingEvent(player, resultItem, this.inventoryWrapper);")
          replace_once(station,
              "this.setItem(TINKER_SLOT, ItemHandlerHelper.copyStackWithSize(tinkerable, tinkerable.getCount() - shrinkToolSlot));",
              "this.setItem(TINKER_SLOT, tinkerable.copyWithCount(tinkerable.getCount() - shrinkToolSlot));")

          # Mantle 1.21 exposes the inventory handler directly; register the table block capabilities once.
          tconstruct = Path("src/main/java/slimeknights/tconstruct/TConstruct.java")
          replace_once(tconstruct,
              "import slimeknights.tconstruct.common.TinkerModule;",
              "import slimeknights.mantle.block.entity.InventoryBlockEntity;\nimport slimeknights.tconstruct.common.TinkerModule;")
          replace_once(tconstruct,
              """  static void registerCapabilities(final RegisterCapabilitiesEvent event) {\n    event.registerBlockEntity(Capabilities.FluidHandler.BLOCK, TinkerSmeltery.tank.get(), (tank, side) -> tank.getTank());""",
              """  static void registerCapabilities(final RegisterCapabilitiesEvent event) {\n    InventoryBlockEntity.registerItemHandler(event, TinkerTables.craftingStationTile.get());\n    InventoryBlockEntity.registerItemHandler(event, TinkerTables.tinkerStationTile.get());\n    InventoryBlockEntity.registerItemHandler(event, TinkerTables.partBuilderTile.get());\n    InventoryBlockEntity.registerItemHandler(event, TinkerTables.modifierWorktableTile.get());\n\n    event.registerBlockEntity(Capabilities.FluidHandler.BLOCK, TinkerSmeltery.tank.get(), (tank, side) -> tank.getTank());""")
          PY

      - name: Commit verified batch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/slimeknights/tconstruct/TConstruct.java \
                  src/main/java/slimeknights/tconstruct/tables/menu/TabbedContainerMenu.java \
                  src/main/java/slimeknights/tconstruct/tables/block/entity/inventory/TinkerStationContainerWrapper.java \
                  src/main/java/slimeknights/tconstruct/tables/block/entity/table/RetexturedTableBlockEntity.java \
                  src/main/java/slimeknights/tconstruct/tables/block/entity/table/TinkerStationBlockEntity.java
          git commit -m "Port table capabilities and recipes to 1.21"
          git push origin HEAD:1.21.1-neoforge

      - name: Dispatch full port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --ref 1.21.1-neoforge
