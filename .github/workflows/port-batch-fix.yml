name: Tinkers one-shot station recipe IDs 1.21 batch

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-batch-fix.yml

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout port branch
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Apply verified Tinker Station recipe ID migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}: {old[:200]!r}")
              return text.replace(old, new, 1)

          path = Path("src/main/java/slimeknights/tconstruct/tables/block/entity/table/TinkerStationBlockEntity.java")
          text = path.read_text(encoding="utf-8")
          text = replace_once(text, "import net.minecraft.network.chat.Component;", "import net.minecraft.network.chat.Component;\nimport net.minecraft.resources.ResourceLocation;", "ResourceLocation import")
          text = replace_once(
              text,
              """  /** Last crafted crafting recipe */\n  @Nullable @Getter\n  private ITinkerStationRecipe lastRecipe;""",
              """  /** Last crafted crafting recipe */\n  @Nullable @Getter\n  private ITinkerStationRecipe lastRecipe;\n  /** 1.21 stores recipe identity on RecipeHolder rather than Recipe. */\n  @Nullable\n  private ResourceLocation lastRecipeId;""",
              "cached recipe ID field")
          text = replace_once(
              text,
              """      // first, try the cached recipe\n      ITinkerStationRecipe recipe = lastRecipe;\n      // if it does not match, find a new recipe\n      if (recipe == null || !recipe.matches(this.inventoryWrapper, this.level)) {\n        recipe = manager.getRecipeFor(TinkerRecipeTypes.TINKER_STATION.get(), this.inventoryWrapper, this.level).map(holder -> holder.value()).orElse(null);\n      }\n\n      // if we have a recipe, fetch its result\n      boolean needsSync = true;\n      if (recipe != null) {\n        // sync if the recipe is different\n        if (lastRecipe != recipe) {\n          this.lastRecipe = recipe;\n          this.syncToRelevantPlayers(this::syncRecipe);\n          needsSync = false;\n        }""",
              """      // first, try the cached recipe and its holder-owned ID\n      ITinkerStationRecipe recipe = lastRecipe;\n      ResourceLocation recipeId = lastRecipeId;\n      // if it does not match, find a new holder so we retain both recipe value and its 1.21 ID\n      if (recipe == null || !recipe.matches(this.inventoryWrapper, this.level)) {\n        var holder = manager.getRecipeFor(TinkerRecipeTypes.TINKER_STATION.get(), this.inventoryWrapper, this.level).orElse(null);\n        if (holder != null) {\n          recipe = holder.value();\n          recipeId = holder.id();\n        } else {\n          recipe = null;\n          recipeId = null;\n        }\n      }\n\n      // if we have a recipe, fetch its result\n      boolean needsSync = true;\n      if (recipe != null) {\n        // sync if either the recipe object or holder identity changed\n        if (lastRecipe != recipe || !Objects.equals(lastRecipeId, recipeId)) {\n          this.lastRecipe = recipe;\n          this.lastRecipeId = recipeId;\n          this.syncToRelevantPlayers(this::syncRecipe);\n          needsSync = false;\n        }""",
              "retain RecipeHolder ID")
          text = replace_once(
              text,
              """    if (this.lastRecipe != null && this.level != null && !this.level.isClientSide && player instanceof ServerPlayer server) {\n      TinkerNetwork.getInstance().sendTo(new UpdateTinkerStationRecipePacket(this.worldPosition, this.lastRecipe), server);\n    }""",
              """    if (this.lastRecipe != null && this.lastRecipeId != null && this.level != null && !this.level.isClientSide && player instanceof ServerPlayer server) {\n      TinkerNetwork.getInstance().sendTo(new UpdateTinkerStationRecipePacket(this.worldPosition, this.lastRecipeId), server);\n    }""",
              "sync holder ID")
          text = replace_once(
              text,
              """  public void updateRecipe(ITinkerStationRecipe recipe) {\n    this.lastRecipe = recipe;\n    this.craftingResult.clearContent();\n  }""",
              """  public void updateRecipe(ITinkerStationRecipe recipe, @Nullable ResourceLocation recipeId) {\n    this.lastRecipe = recipe;\n    this.lastRecipeId = recipeId;\n    this.craftingResult.clearContent();\n  }\n\n  /** Compatibility overload for callers that do not own a RecipeHolder ID. */\n  public void updateRecipe(ITinkerStationRecipe recipe) {\n    updateRecipe(recipe, null);\n  }""",
              "client recipe ID update")
          path.write_text(text, encoding="utf-8")

          path = Path("src/main/java/slimeknights/tconstruct/tables/network/UpdateTinkerStationRecipePacket.java")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              """  public UpdateTinkerStationRecipePacket(BlockPos pos, ITinkerStationRecipe recipe) {\n    this.pos = pos;\n    this.recipe = recipe.getId();\n  }""",
              """  public UpdateTinkerStationRecipePacket(BlockPos pos, ResourceLocation recipe) {\n    this.pos = pos;\n    this.recipe = recipe;\n  }""",
              "packet takes holder ID")
          text = replace_once(text, "te.updateRecipe(recipe);", "te.updateRecipe(recipe, packet.recipe);", "screen tile recipe update")
          text = replace_once(text, "be.updateRecipe(recipe);", "be.updateRecipe(recipe, packet.recipe);", "direct block entity recipe update")
          if "recipe.getId()" in text:
              raise RuntimeError("Obsolete recipe.getId() remains in station sync packet")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit verified batch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/slimeknights/tconstruct/tables/block/entity/table/TinkerStationBlockEntity.java \
                  src/main/java/slimeknights/tconstruct/tables/network/UpdateTinkerStationRecipePacket.java
          git commit -m "Port Tinker Station recipe holder IDs to 1.21"
          git push origin HEAD:1.21.1-neoforge

      - name: Dispatch full port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --ref 1.21.1-neoforge
