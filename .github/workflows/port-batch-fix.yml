name: Tinkers one-shot table UI cleanup 1.21 batch

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-batch-fix.yml

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout port branch
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Apply verified small table UI migrations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path_string, replacements, forbidden=()):
              path = Path(path_string)
              text = path.read_text(encoding="utf-8")
              for label, old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise RuntimeError(f"{path}: {label}: expected one match, found {count}: {old[:160]!r}")
                  text = text.replace(old, new, 1)
              for legacy in forbidden:
                  if legacy in text:
                      raise RuntimeError(f"{path}: legacy API remains: {legacy}")
              path.write_text(text, encoding="utf-8")

          patch(
              "src/main/java/slimeknights/tconstruct/tables/menu/slot/CraftingResultSlot.java",
              [("craft event", "ForgeEventFactory.firePlayerCraftingEvent(this.player, stack, this.container);", "EventHooks.firePlayerCraftingEvent(this.player, stack, this.container);")],
              ("ForgeEventFactory",))

          patch(
              "src/main/java/slimeknights/tconstruct/tables/block/entity/chest/PartChestBlockEntity.java",
              [("component equality", "ItemStack.isSameItemSameTags(stack, this.getStackInSlot(i))", "ItemStack.isSameItemSameComponents(stack, this.getStackInSlot(i))")],
              ("isSameItemSameTags",))

          patch(
              "src/main/java/slimeknights/tconstruct/tables/client/inventory/PartInfoPanelScreen.java",
              [
                ("remove ComponentContents import", "import net.minecraft.network.chat.ComponentContents;\n", ""),
                ("pattern text empty check", "this.patternCost != null && this.patternCost.getContents() != ComponentContents.EMPTY", "this.patternCost != null && !this.patternCost.getString().isEmpty()"),
                ("material text empty check", "this.materialValue != null && this.materialValue.getContents() != ComponentContents.EMPTY", "this.materialValue != null && !this.materialValue.getString().isEmpty()"),
              ],
              ("ComponentContents.EMPTY",))

          patch(
              "src/main/java/slimeknights/tconstruct/tables/client/inventory/CraftingStationScreen.java",
              [("resource location factory", "new ResourceLocation(\"textures/gui/container/crafting_table.png\")", "ResourceLocation.withDefaultNamespace(\"textures/gui/container/crafting_table.png\")")],
              ("new ResourceLocation(\"textures/gui/container/crafting_table.png\")",))

          patch(
              "src/main/java/slimeknights/tconstruct/tables/client/inventory/widget/SlotButtonItem.java",
              [("remove final render override", """  @Override\n  public void render(GuiGraphics pGuiGraphics, int pMouseX, int pMouseY, float pPartialTick) {\n    super.render(pGuiGraphics, pMouseX, pMouseY, pPartialTick);\n  }\n\n""", "")],
              ("public void render(GuiGraphics",))

          patch(
              "src/main/java/slimeknights/tconstruct/tables/client/inventory/TinkerStationScreen.java",
              [
                ("editable state via visibility", "} else if (!textField.isEditable()) {", "} else if (!textField.visible) {"),
                ("remove obsolete EditBox tick", "    this.textField.tick();\n", ""),
              ],
              ("isEditable()", "textField.tick()"))
          PY

      - name: Commit verified batch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/slimeknights/tconstruct/tables/menu/slot/CraftingResultSlot.java \
                  src/main/java/slimeknights/tconstruct/tables/block/entity/chest/PartChestBlockEntity.java \
                  src/main/java/slimeknights/tconstruct/tables/client/inventory/PartInfoPanelScreen.java \
                  src/main/java/slimeknights/tconstruct/tables/client/inventory/CraftingStationScreen.java \
                  src/main/java/slimeknights/tconstruct/tables/client/inventory/widget/SlotButtonItem.java \
                  src/main/java/slimeknights/tconstruct/tables/client/inventory/TinkerStationScreen.java
          git commit -m "Port small table UI APIs to 1.21"
          git push origin HEAD:1.21.1-neoforge

      - name: Dispatch full port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --ref 1.21.1-neoforge
