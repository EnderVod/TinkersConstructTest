name: Fix ResourceLocation runtime inheritance for 1.21

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-batch-fix.yml

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout port branch
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Expose ResourceLocation subclass contract at runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/main/resources/META-INF/accesstransformer.cfg')
          text = path.read_text(encoding='utf-8')
          class_rule = 'public-f net.minecraft.resources.ResourceLocation'
          ctor_rule = 'protected net.minecraft.resources.ResourceLocation <init>(Ljava/lang/String;Ljava/lang/String;)V'
          if class_rule in text or ctor_rule in text:
              raise RuntimeError('ResourceLocation runtime AT rules already present; refusing duplicate insertion')
          anchor = '# ResourceLocation validation\n'
          if text.count(anchor) != 1:
              raise RuntimeError(f'Expected one ResourceLocation validation anchor, found {text.count(anchor)}')
          rules = (
              '# ResourceLocation typed IDs - Minecraft 1.21 made the class final and constructor private\n'
              + class_rule + '\n'
              + ctor_rule + '\n\n'
          )
          path.write_text(text.replace(anchor, rules + anchor, 1), encoding='utf-8')
          PY

      - name: Commit runtime ResourceLocation transform
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/META-INF/accesstransformer.cfg
          git commit -m "Transform ResourceLocation for typed Tinkers IDs at runtime"
          git push origin HEAD:1.21.1-neoforge

      - name: Dispatch validation builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run port-compile.yml --ref 1.21.1-neoforge
          gh workflow run port-server-smoke.yml --ref 1.21.1-neoforge
          gh workflow run port-alpha-build.yml --ref 1.21.1-neoforge
