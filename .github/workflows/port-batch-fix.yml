name: Tinkers one-shot arrow and world 1.21 batch

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-batch-fix.yml

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout port branch
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Apply verified arrow and world migrations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected exactly one match, found {count}: {old[:140]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          # 1.21 moved arrow knockback into a protected vanilla helper that accounts for
          # the weapon's enchantment components. The port AT exposes the helper so the
          # enderference reimplementation can preserve exact vanilla knockback behavior.
          modifier_events = Path("src/main/java/slimeknights/tconstruct/tools/logic/ModifierEvents.java")
          replace_once(
              modifier_events,
              """          // knockback from punch\n          int knockback = arrow.getKnockback();\n          if (knockback > 0) {\n            Vec3 knockbackVec = arrow.getDeltaMovement().multiply(1.0D, 0.0D, 1.0D).normalize().scale(knockback * 0.6D);\n            if (knockbackVec.lengthSqr() > 0.0D) {\n              target.push(knockbackVec.x, 0.1D, knockbackVec.z);\n            }\n          }""",
              """          // use vanilla's 1.21 weapon/enchantment-aware arrow knockback path\n          arrow.doKnockback(target, damageSource);""")

          # EnumObject has both one- and two-argument forEach overloads; method references
          # became ambiguous under the current generics. Make the intended value callback explicit.
          tinker_world = Path("src/main/java/slimeknights/tconstruct/world/TinkerWorld.java")
          replace_once(tinker_world, "TinkerWorld.heads.forEach(blocks::add);", "TinkerWorld.heads.forEach((type, block) -> blocks.add(block));")
          replace_once(tinker_world, "TinkerWorld.wallHeads.forEach(blocks::add);", "TinkerWorld.wallHeads.forEach((type, block) -> blocks.add(block));")
          PY

      - name: Commit verified batch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/slimeknights/tconstruct/tools/logic/ModifierEvents.java \
                  src/main/java/slimeknights/tconstruct/world/TinkerWorld.java
          git commit -m "Port arrow knockback and skull registration to 1.21"
          git push origin HEAD:1.21.1-neoforge

      - name: Dispatch full port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --ref 1.21.1-neoforge
