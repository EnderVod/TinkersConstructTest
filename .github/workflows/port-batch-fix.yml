name: Tinkers final core APIs 1.21 batch

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-batch-fix.yml

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout port branch
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Apply verified final core API migrations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}: {old[:220]!r}")
              return text.replace(old, new, 1)

          # FluidTank serialization became registry-aware in NeoForge 1.21.
          path = Path("src/main/java/slimeknights/tconstruct/smeltery/item/ScaledFluidTank.java")
          text = path.read_text(encoding="utf-8")
          text = replace_once(text, "import net.minecraft.nbt.CompoundTag;", "import net.minecraft.core.HolderLookup;\nimport net.minecraft.nbt.CompoundTag;", "HolderLookup import")
          text = replace_once(
              text,
              """  @Override\n  public FluidTank readFromNBT(CompoundTag nbt) {\n    // scale the fluid on reading from NBT; as each instance should store the fluid relative to stack size 1\n    FluidStack fluid = FluidStack.loadFluidStackFromNBT(nbt);\n    fluid.setAmount(fluid.getAmount() * scale);\n    setFluid(fluid);\n    return this;\n  }\n\n  @Override\n  public CompoundTag writeToNBT(CompoundTag nbt) {\n    // scale the fluid on reading from NBT; as each instance should store the fluid relative to stack size 1\n    FluidStack fluid = this.fluid.copy();\n    fluid.setAmount(fluid.getAmount() / scale);\n    fluid.writeToNBT(nbt);\n    return nbt;\n  }""",
              """  @Override\n  public FluidTank readFromNBT(HolderLookup.Provider lookupProvider, CompoundTag nbt) {\n    // Scale the fluid on reading; each serialized instance stores the amount for stack size 1.\n    FluidStack fluid = FluidStack.parseOptional(lookupProvider, nbt.getCompound(\"Fluid\"));\n    fluid.setAmount(fluid.getAmount() * scale);\n    setFluid(fluid);\n    return this;\n  }\n\n  @Override\n  public CompoundTag writeToNBT(HolderLookup.Provider lookupProvider, CompoundTag nbt) {\n    // Serialize one item's share while preserving the 1.21 FluidStack component patch.\n    FluidStack fluid = this.fluid.copy();\n    fluid.setAmount(fluid.getAmount() / scale);\n    if (!fluid.isEmpty()) {\n      nbt.put(\"Fluid\", fluid.save(lookupProvider));\n    }\n    return nbt;\n  }""",
              "registry-aware scaled tank NBT")
          for legacy in ("loadFluidStackFromNBT", "writeToNBT(nbt)"):
              if legacy in text:
                  raise RuntimeError(f"Legacy ScaledFluidTank API remains: {legacy}")
          path.write_text(text, encoding="utf-8")

          # Food effect duration formatting now takes the active tick rate.
          path = Path("src/main/java/slimeknights/tconstruct/gadgets/block/FoodCakeBlock.java")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "ContainerFoodItem.addEffectTooltip(food, tooltip);",
              "ContainerFoodItem.addEffectTooltip(food, tooltip, context.tickRate());",
              "food tooltip tick rate")
          path.write_text(text, encoding="utf-8")

          # ItemStack network codecs are registry-aware in 1.21. Mantle supplies RegistryFriendlyByteBuf at runtime.
          path = Path("src/main/java/slimeknights/tconstruct/common/network/InventorySlotSyncPacket.java")
          text = path.read_text(encoding="utf-8")
          text = replace_once(text, "import net.minecraft.network.FriendlyByteBuf;", "import net.minecraft.network.FriendlyByteBuf;\nimport net.minecraft.network.RegistryFriendlyByteBuf;", "registry buffer import")
          text = replace_once(
              text,
              "this.itemStack = buffer.readItem();",
              "this.itemStack = ItemStack.OPTIONAL_STREAM_CODEC.decode((RegistryFriendlyByteBuf) buffer);",
              "registry-aware item decode")
          text = replace_once(
              text,
              "packetBuffer.writeItem(this.itemStack);",
              "ItemStack.OPTIONAL_STREAM_CODEC.encode((RegistryFriendlyByteBuf) packetBuffer, this.itemStack);",
              "registry-aware item encode")
          path.write_text(text, encoding="utf-8")

          # MobEffectInstance now stores a Holder<MobEffect> instead of a raw effect value.
          path = Path("src/main/java/slimeknights/tconstruct/common/registration/PotionDeferredRegister.java")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "import net.minecraft.core.registries.Registries;",
              "import net.minecraft.core.registries.BuiltInRegistries;\nimport net.minecraft.core.registries.Registries;",
              "built-in effect registry import")
          text = replace_once(
              text,
              "new MobEffectInstance(effect.get(), duration, amplifier)",
              "new MobEffectInstance(BuiltInRegistries.MOB_EFFECT.wrapAsHolder(effect.get()), duration, amplifier)",
              "holder-backed potion effect")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit verified batch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/slimeknights/tconstruct/smeltery/item/ScaledFluidTank.java \
                  src/main/java/slimeknights/tconstruct/gadgets/block/FoodCakeBlock.java \
                  src/main/java/slimeknights/tconstruct/common/network/InventorySlotSyncPacket.java \
                  src/main/java/slimeknights/tconstruct/common/registration/PotionDeferredRegister.java
          git commit -m "Port final core APIs to 1.21"
          git push origin HEAD:1.21.1-neoforge

      - name: Dispatch full port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --ref 1.21.1-neoforge
