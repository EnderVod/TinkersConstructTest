name: Tinkers one-shot part builder 1.21 batch

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-batch-fix.yml

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout port branch
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Apply verified Part Builder 1.21 migrations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly one match, found {count}: {old[:160]!r}")
              return text.replace(old, new, 1)

          path = Path("src/main/java/slimeknights/tconstruct/tables/block/entity/table/PartBuilderBlockEntity.java")
          text = path.read_text(encoding="utf-8")
          text = replace_once(text, "import net.minecraft.world.item.crafting.Recipe;\n", "", "remove Recipe import")
          text = replace_once(text, "import net.minecraftforge.common.util.LazyOptional;\n", "", "remove LazyOptional import")
          text = replace_once(text, "    this.itemHandlerCap = LazyOptional.of(() -> this.itemHandler);\n", "", "remove legacy item handler cap")
          text = replace_once(
              text,
              """        recipes = level.getRecipeManager().byType(TinkerRecipeTypes.PART_BUILDER.get()).values().stream()\n                       .filter(r -> r.partialMatch(inventoryWrapper))\n                       .sorted(Comparator.comparing(Recipe::getId))\n                       .flatMap(r -> r.getPatterns(inventoryWrapper).map(p -> new PatternRecipe(p, r)))\n                       .collect(Collectors.toMap(PatternRecipe::pattern, PatternRecipe::recipe, (a, b) -> a));""",
              """        recipes = level.getRecipeManager().getAllRecipesFor(TinkerRecipeTypes.PART_BUILDER.get()).stream()\n                       .sorted(Comparator.comparing(holder -> holder.id().toString()))\n                       .map(holder -> holder.value())\n                       .filter(r -> r.partialMatch(inventoryWrapper))\n                       .flatMap(r -> r.getPatterns(inventoryWrapper).map(p -> new PatternRecipe(p, r)))\n                       .collect(Collectors.toMap(PatternRecipe::pattern, PatternRecipe::recipe, (a, b) -> a));""",
              "recipe holder list")
          text = replace_once(text, "ItemStack.isSameItemSameTags(original, stack)", "ItemStack.isSameItemSameComponents(original, stack)", "component-aware equality")
          text = replace_once(text, "ForgeEventFactory.firePlayerCraftingEvent(player, result, this.inventoryWrapper);", "EventHooks.firePlayerCraftingEvent(player, result, this.inventoryWrapper);", "crafting event")
          if "LazyOptional" in text or "itemHandlerCap" in text or ".byType(" in text or "Recipe::getId" in text or "isSameItemSameTags" in text or "ForgeEventFactory" in text:
              raise RuntimeError("Legacy PartBuilderBlockEntity API remains after migration")
          path.write_text(text, encoding="utf-8")

          path = Path("src/main/java/slimeknights/tconstruct/tables/block/entity/inventory/PartBuilderContainerWrapper.java")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "this.material = world.getRecipeManager().getRecipeFor(TinkerRecipeTypes.MATERIAL.get(), this, world).orElse(null);",
              "this.material = world.getRecipeManager().getRecipeFor(TinkerRecipeTypes.MATERIAL.get(), this, world).map(holder -> holder.value()).orElse(null);",
              "material recipe holder")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit verified batch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/slimeknights/tconstruct/tables/block/entity/table/PartBuilderBlockEntity.java \
                  src/main/java/slimeknights/tconstruct/tables/block/entity/inventory/PartBuilderContainerWrapper.java
          git commit -m "Port Part Builder recipes and components to 1.21"
          git push origin HEAD:1.21.1-neoforge

      - name: Dispatch full port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --ref 1.21.1-neoforge
