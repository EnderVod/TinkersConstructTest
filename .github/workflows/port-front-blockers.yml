name: Tinkers Small 1.21 Compatibility Cleanup

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout latest Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Port remaining small 1.21 APIs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Durability capability moved from Item to component-bearing ItemStack.
          path = Path('src/main/java/slimeknights/tconstruct/library/modifiers/hook/display/DurabilityDisplayModifierHook.java')
          text = path.read_text(encoding='utf-8')
          old = 'if (!stack.getItem().canBeDepleted() || !stack.is(TinkerTags.Items.DURABILITY)) {'
          new = 'if (!stack.isDamageableItem() || !stack.is(TinkerTags.Items.DURABILITY)) {'
          if text.count(old) != 1:
              raise RuntimeError('DurabilityDisplayModifierHook stack durability check changed unexpectedly')
          text = text.replace(old, new, 1)
          old = 'return tool.getItem().canBeDepleted() && tool.getDamage() > 0;'
          new = 'return tool.getDamage() > 0;'
          if text.count(old) != 1:
              raise RuntimeError('DurabilityDisplayModifierHook fallback durability check changed unexpectedly')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          # Adventure-mode placement predicate is still exposed directly on ItemStack under its 1.21 name.
          path = Path('src/main/java/slimeknights/tconstruct/library/modifiers/fluid/FluidEffectContext.java')
          text = path.read_text(encoding='utf-8')
          old = 'stack.hasAdventureModePlaceTagForBlock(level.registryAccess().registryOrThrow(Registries.BLOCK), new BlockInWorld(level, getBlockPos(), false))'
          new = 'stack.canPlaceOnBlockInAdventureMode(new BlockInWorld(level, getBlockPos(), false))'
          if text.count(old) != 1:
              raise RuntimeError('FluidEffectContext adventure placement call changed unexpectedly')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          # ChangeOverTimeBlock renamed applyChangeOverTime to changeOverTime in vanilla 1.21.
          path = Path('src/main/java/slimeknights/tconstruct/library/modifiers/fluid/FluidEffect.java')
          text = path.read_text(encoding='utf-8')
          old = 'copper.applyChangeOverTime(state, world, context.getBlockPos(), world.getRandom());'
          new = 'copper.changeOverTime(state, world, context.getBlockPos(), world.getRandom());'
          if text.count(old) != 1:
              raise RuntimeError('FluidEffect copper weathering call changed unexpectedly')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          # Mantle owns the compatibility wrapper for NeoForge condition codecs.
          path = Path('src/main/java/slimeknights/tconstruct/library/modifiers/fluid/FluidEffectManager.java')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import net.neoforged.neoforge.common.crafting.CraftingHelper;\n', '')
          if 'import slimeknights.mantle.recipe.condition.ConditionHelper;\n' not in text:
              anchor = 'import slimeknights.mantle.recipe.ingredient.FluidIngredient;\n'
              if anchor not in text:
                  raise RuntimeError('FluidEffectManager Mantle import anchor missing')
              text = text.replace(anchor, 'import slimeknights.mantle.recipe.condition.ConditionHelper;\n' + anchor, 1)
          old = 'if (!CraftingHelper.processConditions(json, "conditions", conditionContext)) {'
          new = 'if (!ConditionHelper.processConditions(json, "conditions", conditionContext)) {'
          if text.count(old) != 1:
              raise RuntimeError('FluidEffectManager condition call changed unexpectedly')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify small compatibility cleanup
        shell: bash
        run: |
          grep -Fq '!stack.isDamageableItem()' src/main/java/slimeknights/tconstruct/library/modifiers/hook/display/DurabilityDisplayModifierHook.java
          grep -Fq 'return tool.getDamage() > 0;' src/main/java/slimeknights/tconstruct/library/modifiers/hook/display/DurabilityDisplayModifierHook.java
          ! grep -Fq 'canBeDepleted()' src/main/java/slimeknights/tconstruct/library/modifiers/hook/display/DurabilityDisplayModifierHook.java
          grep -Fq 'stack.canPlaceOnBlockInAdventureMode(new BlockInWorld' src/main/java/slimeknights/tconstruct/library/modifiers/fluid/FluidEffectContext.java
          ! grep -Fq 'hasAdventureModePlaceTagForBlock' src/main/java/slimeknights/tconstruct/library/modifiers/fluid/FluidEffectContext.java
          grep -Fq 'copper.changeOverTime(state, world, context.getBlockPos(), world.getRandom());' src/main/java/slimeknights/tconstruct/library/modifiers/fluid/FluidEffect.java
          grep -Fq 'ConditionHelper.processConditions(json, "conditions", conditionContext)' src/main/java/slimeknights/tconstruct/library/modifiers/fluid/FluidEffectManager.java
          ! grep -Fq 'CraftingHelper.processConditions' src/main/java/slimeknights/tconstruct/library/modifiers/fluid/FluidEffectManager.java
          git diff --check

      - name: Commit small compatibility cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/main/java/slimeknights/tconstruct/library/modifiers/hook/display/DurabilityDisplayModifierHook.java \
            src/main/java/slimeknights/tconstruct/library/modifiers/fluid/FluidEffectContext.java \
            src/main/java/slimeknights/tconstruct/library/modifiers/fluid/FluidEffect.java \
            src/main/java/slimeknights/tconstruct/library/modifiers/fluid/FluidEffectManager.java
          git diff --cached --quiet || {
            git commit -m 'Port remaining small compatibility APIs to 1.21'
            git push origin HEAD:1.21.1-neoforge
          }

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --repo "$GITHUB_REPOSITORY" --ref 1.21.1-neoforge
