name: Tinkers Loot Equipment Compatibility Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout latest Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Port loot context and equipment APIs to 1.21
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # LootContextParamSets exposes its registered-set codec directly in 1.21.
          path = Path('src/main/java/slimeknights/tconstruct/library/json/loot/HasLootContextSetCondition.java')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import com.mojang.serialization.DataResult;\n', '')
          text = text.replace('import net.minecraft.resources.ResourceLocation;\n', '')
          text = text.replace('import java.util.Objects;\n', '')
          old = '''  public static final MapCodec<HasLootContextSetCondition> CODEC = ResourceLocation.CODEC\n    .comapFlatMap(HasLootContextSetCondition::decode, condition ->\n      Objects.requireNonNull(LootContextParamSets.getKey(condition.set), "Unregistered LootContextParamSet"))\n    .fieldOf("set");\n\n  private static DataResult<HasLootContextSetCondition> decode(ResourceLocation key) {\n    LootContextParamSet set = LootContextParamSets.get(key);\n    if (set == null) {\n      return DataResult.error(() -> "Unknown LootContextParamSet " + key);\n    }\n    return DataResult.success(new HasLootContextSetCondition(set));\n  }'''
          new = '''  public static final MapCodec<HasLootContextSetCondition> CODEC = LootContextParamSets.CODEC\n    .xmap(HasLootContextSetCondition::new, HasLootContextSetCondition::set)\n    .fieldOf("set");'''
          if text.count(old) != 1:
              raise RuntimeError('HasLootContextSetCondition registry codec block changed unexpectedly')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Holder#get was removed; Holder#value is the 1.21 accessor.
          path = Path('src/main/java/slimeknights/tconstruct/library/json/loot/equipment/MobEquipment.java')
          text = path.read_text(encoding='utf-8')
          if text.count('.map(Holder::get)') != 1:
              raise RuntimeError('MobEquipment holder accessor changed unexpectedly')
          path.write_text(text.replace('.map(Holder::get)', '.map(Holder::value)', 1), encoding='utf-8')

          path = Path('src/main/java/slimeknights/tconstruct/library/json/loot/equipment/MobEquipmentManager.java')
          text = path.read_text(encoding='utf-8')
          if 'import slimeknights.mantle.recipe.condition.ConditionHelper;\n' not in text:
              anchor = 'import slimeknights.mantle.data.loadable.field.ContextKey;\n'
              if anchor not in text:
                  raise RuntimeError('MobEquipmentManager Mantle import anchor missing')
              text = text.replace(anchor, anchor + 'import slimeknights.mantle.recipe.condition.ConditionHelper;\n', 1)
          text = text.replace('import net.neoforged.neoforge.common.crafting.CraftingHelper;\n', '')
          old = '        if (!CraftingHelper.processConditions(json, "conditions", context)) {'
          new = '        if (!ConditionHelper.processConditions(json, "conditions", context)) {'
          if text.count(old) != 1:
              raise RuntimeError('MobEquipmentManager condition processing changed unexpectedly')
          text = text.replace(old, new, 1)
          if text.count('parsed.computeIfAbsent(holder.get(), ifAbsent).addAll(equipment);') != 1:
              raise RuntimeError('MobEquipmentManager holder accessor changed unexpectedly')
          text = text.replace('parsed.computeIfAbsent(holder.get(), ifAbsent).addAll(equipment);', 'parsed.computeIfAbsent(holder.value(), ifAbsent).addAll(equipment);', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify loot equipment compatibility migration
        shell: bash
        run: |
          grep -Fq 'LootContextParamSets.CODEC' src/main/java/slimeknights/tconstruct/library/json/loot/HasLootContextSetCondition.java
          grep -Fq '.xmap(HasLootContextSetCondition::new, HasLootContextSetCondition::set)' src/main/java/slimeknights/tconstruct/library/json/loot/HasLootContextSetCondition.java
          ! grep -Fq 'LootContextParamSets.getKey' src/main/java/slimeknights/tconstruct/library/json/loot/HasLootContextSetCondition.java
          ! grep -Fq 'LootContextParamSets.get(key)' src/main/java/slimeknights/tconstruct/library/json/loot/HasLootContextSetCondition.java
          grep -Fq '.map(Holder::value)' src/main/java/slimeknights/tconstruct/library/json/loot/equipment/MobEquipment.java
          grep -Fq 'ConditionHelper.processConditions(json, "conditions", context)' src/main/java/slimeknights/tconstruct/library/json/loot/equipment/MobEquipmentManager.java
          grep -Fq 'parsed.computeIfAbsent(holder.value(), ifAbsent).addAll(equipment);' src/main/java/slimeknights/tconstruct/library/json/loot/equipment/MobEquipmentManager.java
          ! grep -R -F 'Holder::get' \
            src/main/java/slimeknights/tconstruct/library/json/loot/equipment/MobEquipment.java \
            src/main/java/slimeknights/tconstruct/library/json/loot/equipment/MobEquipmentManager.java
          git diff --check

      - name: Commit loot equipment compatibility migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/main/java/slimeknights/tconstruct/library/json/loot/HasLootContextSetCondition.java \
            src/main/java/slimeknights/tconstruct/library/json/loot/equipment/MobEquipment.java \
            src/main/java/slimeknights/tconstruct/library/json/loot/equipment/MobEquipmentManager.java
          git diff --cached --quiet || {
            git commit -m 'Port loot equipment APIs to 1.21'
            git push origin HEAD:1.21.1-neoforge
          }

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --repo "$GITHUB_REPOSITORY" --ref 1.21.1-neoforge
