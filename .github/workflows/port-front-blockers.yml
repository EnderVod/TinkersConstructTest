name: Tinkers Item Client API Cleanup

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout latest Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Port item client and fluid copy APIs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Item properties read Tinkers TOOL_DATA rather than removed raw ItemStack NBT.
          path = Path('src/main/java/slimeknights/tconstruct/library/client/model/TinkerItemProperties.java')
          text = path.read_text(encoding='utf-8')
          anchor = 'import slimeknights.tconstruct.library.tools.nbt.ToolStack;\n'
          if 'import slimeknights.tconstruct.library.tools.nbt.ToolDataComponents;' not in text:
              if anchor not in text: raise RuntimeError('TinkerItemProperties ToolData import anchor missing')
              text = text.replace(anchor, 'import slimeknights.tconstruct.library.tools.nbt.ToolDataComponents;\n' + anchor, 1)
          if text.count('CompoundTag nbt = stack.getTag();') != 1:
              raise RuntimeError('TinkerItemProperties legacy stack tag access changed unexpectedly')
          text = text.replace('CompoundTag nbt = stack.getTag();', 'CompoundTag nbt = ToolDataComponents.getTag(stack);', 1)
          if text.count('stack.getUseDuration()') != 1:
              raise RuntimeError('TinkerItemProperties use duration call changed unexpectedly')
          text = text.replace('stack.getUseDuration()', 'stack.getUseDuration(holder)', 1)
          path.write_text(text, encoding='utf-8')

          # Crossbow arm pose uses the same component-backed tool data.
          path = Path('src/main/java/slimeknights/tconstruct/library/client/item/ModifiableCrossbowClientExtension.java')
          text = path.read_text(encoding='utf-8')
          anchor = 'import slimeknights.tconstruct.library.tools.nbt.ToolStack;\n'
          if 'import slimeknights.tconstruct.library.tools.nbt.ToolDataComponents;' not in text:
              if anchor not in text: raise RuntimeError('Crossbow client ToolData import anchor missing')
              text = text.replace(anchor, 'import slimeknights.tconstruct.library.tools.nbt.ToolDataComponents;\n' + anchor, 1)
          if text.count('CompoundTag tag = stack.getTag();') != 1:
              raise RuntimeError('Crossbow client legacy stack tag access changed unexpectedly')
          text = text.replace('CompoundTag tag = stack.getTag();', 'CompoundTag tag = ToolDataComponents.getTag(stack);', 1)
          path.write_text(text, encoding='utf-8')

          # Minecraft 1.21 use duration is entity-aware.
          path = Path('src/main/java/slimeknights/tconstruct/library/client/item/ModifiableItemClientExtension.java')
          text = path.read_text(encoding='utf-8')
          count = text.count('stack.getUseDuration()')
          if count != 3:
              raise RuntimeError(f'ModifiableItemClientExtension expected 3 old duration calls, found {count}')
          text = text.replace('stack.getUseDuration()', 'stack.getUseDuration(player)')
          path.write_text(text, encoding='utf-8')

          # FluidStack copy constructors were replaced by copyWithAmount(), preserving all data components.
          path = Path('src/main/java/slimeknights/tconstruct/library/fluid/SimpleFluidTank.java')
          text = path.read_text(encoding='utf-8')
          if text.count('new FluidStack(resource, amount)') != 1:
              raise RuntimeError('SimpleFluidTank fill copy changed unexpectedly')
          if text.count('new FluidStack(fluid, drained)') != 1:
              raise RuntimeError('SimpleFluidTank drain copy changed unexpectedly')
          text = text.replace('new FluidStack(resource, amount)', 'resource.copyWithAmount(amount)', 1)
          text = text.replace('new FluidStack(fluid, drained)', 'fluid.copyWithAmount(drained)', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify item client cleanup
        shell: bash
        run: |
          grep -Fq 'ToolDataComponents.getTag(stack)' src/main/java/slimeknights/tconstruct/library/client/model/TinkerItemProperties.java
          grep -Fq 'stack.getUseDuration(holder)' src/main/java/slimeknights/tconstruct/library/client/model/TinkerItemProperties.java
          grep -Fq 'ToolDataComponents.getTag(stack)' src/main/java/slimeknights/tconstruct/library/client/item/ModifiableCrossbowClientExtension.java
          test "$(grep -F -c 'stack.getUseDuration(player)' src/main/java/slimeknights/tconstruct/library/client/item/ModifiableItemClientExtension.java)" -eq 3
          grep -Fq 'resource.copyWithAmount(amount)' src/main/java/slimeknights/tconstruct/library/fluid/SimpleFluidTank.java
          grep -Fq 'fluid.copyWithAmount(drained)' src/main/java/slimeknights/tconstruct/library/fluid/SimpleFluidTank.java
          ! grep -R -F 'stack.getUseDuration()' \
            src/main/java/slimeknights/tconstruct/library/client/model/TinkerItemProperties.java \
            src/main/java/slimeknights/tconstruct/library/client/item/ModifiableItemClientExtension.java
          git diff --check

      - name: Commit item client cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/main/java/slimeknights/tconstruct/library/client/model/TinkerItemProperties.java \
            src/main/java/slimeknights/tconstruct/library/client/item/ModifiableCrossbowClientExtension.java \
            src/main/java/slimeknights/tconstruct/library/client/item/ModifiableItemClientExtension.java \
            src/main/java/slimeknights/tconstruct/library/fluid/SimpleFluidTank.java
          git diff --cached --quiet || {
            git commit -m 'Port item client duration and fluid copy APIs to 1.21'
            git push origin HEAD:1.21.1-neoforge
          }

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --repo "$GITHUB_REPOSITORY" --ref 1.21.1-neoforge
