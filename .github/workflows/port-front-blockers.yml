name: Tinkers Front Blocker Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for active port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while gh run list --repo "$GITHUB_REPOSITORY" --workflow port-compile.yml --branch 1.21.1-neoforge --limit 20 --json status --jq '.[] | select(.status == "queued" or .status == "in_progress") | .status' | grep -q .; do
            sleep 15
          done

      - name: Checkout Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge

      - name: Apply targeted front blocker migrations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('src/main/java')
          replacements = {
              'import net.minecraftforge.common.crafting.conditions.ICondition;': 'import net.neoforged.neoforge.common.conditions.ICondition;',
              'import net.minecraftforge.common.crafting.conditions.ICondition.IContext;': 'import net.neoforged.neoforge.common.conditions.ICondition.IContext;',
              'import net.minecraftforge.fml.ModLoader;': 'import net.neoforged.fml.ModLoader;',
              'import net.minecraftforge.fml.event.IModBusEvent;': 'import net.neoforged.fml.event.IModBusEvent;',
              'import net.minecraftforge.fml.javafmlmod.FMLJavaModLoadingContext;': 'import net.neoforged.fml.javafmlmod.FMLJavaModLoadingContext;',
              'import net.neoforged.neoforge.common.util.LazyOptional;': 'import net.minecraftforge.common.util.LazyOptional;',
          }

          if not (root / 'net/minecraftforge/common/util/LazyOptional.java').exists():
              raise SystemExit('Legacy LazyOptional compatibility shim is missing; refusing import migration.')

          changed = []
          for path in root.rglob('*.java'):
              original = path.read_text(encoding='utf-8')
              text = original
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          modifier = root / 'slimeknights/tconstruct/library/modifiers/ModifierManager.java'
          original = modifier.read_text(encoding='utf-8')
          text = original.replace('import net.minecraftforge.common.crafting.CraftingHelper;\n', '')
          if 'import slimeknights.mantle.recipe.condition.ConditionHelper;' not in text:
              text = text.replace('import slimeknights.mantle.data.loadable.field.ContextKey;\n', 'import slimeknights.mantle.data.loadable.field.ContextKey;\nimport slimeknights.mantle.recipe.condition.ConditionHelper;\n')
          text = text.replace('ModLoader.get().runEventGenerator(ModifierRegistrationEvent::new);', 'ModLoader.runEventGenerator(ModifierRegistrationEvent::new);')
          text = text.replace('CraftingHelper.getCondition(GsonHelper.getAsJsonObject(json, "condition"))', 'ConditionHelper.deserialize(GsonHelper.getAsJsonObject(json, "condition"))')
          if text != original:
              modifier.write_text(text, encoding='utf-8')
              if str(modifier) not in changed:
                  changed.append(str(modifier))

          def isolate_datagen(path, imports):
              original = path.read_text(encoding='utf-8')
              text = original
              for imp in imports:
                  text = text.replace(imp, '')
              pattern = re.compile(r'\n  @SubscribeEvent\n  void gatherData\(final GatherDataEvent event\) \{\n.*?\n  \}\n', re.S)
              text, count = pattern.subn('\n', text, count=1)
              if 'void gatherData(final GatherDataEvent event)' in original and count != 1:
                  raise SystemExit(f'Failed to isolate gatherData safely in {path}')
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          isolate_datagen(
              root / 'slimeknights/tconstruct/shared/TinkerCommons.java',
              [
                  'import net.minecraft.data.DataGenerator;\n',
                  'import net.minecraft.data.PackOutput;\n',
                  'import net.neoforged.neoforge.common.data.ExistingFileHelper;\n',
                  'import net.neoforged.neoforge.data.event.GatherDataEvent;\n',
                  'import slimeknights.tconstruct.common.data.model.ModelSpriteProvider;\n',
                  'import slimeknights.tconstruct.common.data.model.TinkerBlockStateProvider;\n',
                  'import slimeknights.tconstruct.common.data.model.TinkerItemModelProvider;\n',
                  'import slimeknights.tconstruct.common.data.model.TinkerSpriteSourceProvider;\n',
                  'import slimeknights.tconstruct.common.data.render.RenderFluidProvider;\n',
                  'import slimeknights.tconstruct.common.data.render.RenderItemProvider;\n',
                  'import slimeknights.tconstruct.shared.data.CommonRecipeProvider;\n',
              ]
          )

          isolate_datagen(
              root / 'slimeknights/tconstruct/fluids/TinkerFluids.java',
              [
                  'import net.minecraft.data.DataGenerator;\n',
                  'import net.minecraft.data.PackOutput;\n',
                  'import net.neoforged.neoforge.data.event.GatherDataEvent;\n',
                  'import slimeknights.mantle.fluid.texture.FluidTextureCameraProvider;\n',
                  'import slimeknights.tconstruct.fluids.data.FluidBlockstateModelProvider;\n',
                  'import slimeknights.tconstruct.fluids.data.FluidBucketModelProvider;\n',
                  'import slimeknights.tconstruct.fluids.data.FluidTextureProvider;\n',
                  'import slimeknights.tconstruct.fluids.data.FluidTooltipProvider;\n',
              ]
          )

          print(f'Updated {len(set(changed))} Java files')
          for path in sorted(set(changed)):
              print(path)
          PY

      - name: Verify isolation targets
        run: |
          if grep -R "net.neoforged.neoforge.common.util.LazyOptional" -n src/main/java; then
            echo 'Found stale NeoForge LazyOptional imports.'
            exit 1
          fi
          if grep -n "void gatherData(final GatherDataEvent" src/main/java/slimeknights/tconstruct/shared/TinkerCommons.java src/main/java/slimeknights/tconstruct/fluids/TinkerFluids.java; then
            echo 'Datagen handler isolation did not complete.'
            exit 1
          fi

      - name: Commit targeted migration
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java
          git commit -m 'Reconnect legacy capability shim and isolate datagen'
          git push origin HEAD:1.21.1-neoforge

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --ref 1.21.1-neoforge
