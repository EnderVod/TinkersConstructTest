name: Tinkers Front Blocker Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Wait for active port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while gh run list --repo "$GITHUB_REPOSITORY" --workflow port-compile.yml --branch 1.21.1-neoforge --limit 30 --json status --jq '.[] | select(.status == "queued" or .status == "in_progress") | .status' | grep -q .; do
            sleep 15
          done

      - name: Checkout latest Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Replace obsolete client equipment capability watcher
        shell: bash
        run: |
          echo '' | base64 -d > src/main/java/slimeknights/tconstruct/tools/logic/EquipmentChangeWatcher.java

      - name: Migrate GUI and item registry APIs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gui = Path('src/main/java/slimeknights/tconstruct/tools/client/ModifierClientEvents.java')
          text = gui.read_text(encoding='utf-8')
          replacements = {
              'import net.neoforged.neoforge.client.event.RenderGuiOverlayEvent;\n': 'import net.neoforged.neoforge.client.event.RenderGuiLayerEvent;\n',
              'import net.minecraftforge.client.gui.overlay.VanillaGuiOverlay;\n': 'import net.neoforged.neoforge.client.gui.VanillaGuiLayers;\n',
              'public static void renderHotbar(RenderGuiOverlayEvent.Post event)': 'public static void renderHotbar(RenderGuiLayerEvent.Post event)',
              'event.getOverlay() != VanillaGuiOverlay.HOTBAR.type()': '!VanillaGuiLayers.HOTBAR.equals(event.getName())',
              'float partialTicks = event.getPartialTick();': 'float partialTicks = event.getPartialTick().getGameTimeDeltaPartialTick(false);',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected GUI token: {old!r}')
              text = text.replace(old, new)
          gui.write_text(text, encoding='utf-8')

          recipe = Path('src/main/java/slimeknights/tconstruct/tools/recipe/EnchantmentConvertingRecipe.java')
          text = recipe.read_text(encoding='utf-8')
          if 'import net.neoforged.neoforge.registries.ForgeRegistries;\n' not in text:
              raise SystemExit('Missing ForgeRegistries import in enchantment conversion recipe')
          text = text.replace('import net.minecraft.network.chat.Component;\n', 'import net.minecraft.core.registries.BuiltInRegistries;\nimport net.minecraft.network.chat.Component;\n')
          text = text.replace('import net.neoforged.neoforge.registries.ForgeRegistries;\n', '')
          text = text.replace('ForgeRegistries.ITEMS.getValues().stream()', 'BuiltInRegistries.ITEM.stream()')
          recipe.write_text(text, encoding='utf-8')
          PY

      - name: Verify targeted migration
        shell: bash
        run: |
          test -z "$(grep -E 'net\.minecraftforge\.common\.capabilities|AttachCapabilitiesEvent|TickEvent\.|net\.minecraftforge\.fml\.LogicalSide|ICapabilityProvider|LazyOptional' src/main/java/slimeknights/tconstruct/tools/logic/EquipmentChangeWatcher.java || true)"
          grep -Fq 'PlayerTickEvent.Post' src/main/java/slimeknights/tconstruct/tools/logic/EquipmentChangeWatcher.java
          grep -Fq 'RenderGuiLayerEvent.Post' src/main/java/slimeknights/tconstruct/tools/client/ModifierClientEvents.java
          grep -Fq 'VanillaGuiLayers.HOTBAR' src/main/java/slimeknights/tconstruct/tools/client/ModifierClientEvents.java
          test -z "$(grep -E 'RenderGuiOverlayEvent|VanillaGuiOverlay' src/main/java/slimeknights/tconstruct/tools/client/ModifierClientEvents.java || true)"
          grep -Fq 'BuiltInRegistries.ITEM.stream()' src/main/java/slimeknights/tconstruct/tools/recipe/EnchantmentConvertingRecipe.java
          test -z "$(grep -F 'ForgeRegistries' src/main/java/slimeknights/tconstruct/tools/recipe/EnchantmentConvertingRecipe.java || true)"

      - name: Commit grouped migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/slimeknights/tconstruct/tools/logic/EquipmentChangeWatcher.java \
                  src/main/java/slimeknights/tconstruct/tools/client/ModifierClientEvents.java \
                  src/main/java/slimeknights/tconstruct/tools/recipe/EnchantmentConvertingRecipe.java
          git commit -m 'Migrate client equipment and GUI APIs to 1.21'
          git push origin HEAD:1.21.1-neoforge

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --ref 1.21.1-neoforge
