name: Tinkers Front Blocker Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Wait for active port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while gh run list --repo "$GITHUB_REPOSITORY" --workflow port-compile.yml --branch 1.21.1-neoforge --limit 30 --json status --jq '.[] | select(.status == "queued" or .status == "in_progress") | .status' | grep -q .; do
            sleep 15
          done

      - name: Checkout latest Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Migrate client watcher and GUI APIs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          watcher = Path('src/main/java/slimeknights/tconstruct/tools/logic/EquipmentChangeWatcher.java')
          watcher.write_text('''package slimeknights.tconstruct.tools.logic;

import net.minecraft.world.entity.EquipmentSlot;
import net.minecraft.world.entity.LivingEntity;
import net.minecraft.world.entity.player.Player;
import net.minecraft.world.item.ItemStack;
import net.neoforged.api.distmarker.Dist;
import net.neoforged.neoforge.common.NeoForge;
import net.neoforged.neoforge.event.entity.living.LivingEquipmentChangeEvent;
import net.neoforged.neoforge.event.tick.PlayerTickEvent;
import net.neoforged.fml.loading.FMLEnvironment;
import slimeknights.tconstruct.library.events.ToolEquipmentChangeEvent;
import slimeknights.tconstruct.library.modifiers.ModifierEntry;
import slimeknights.tconstruct.library.modifiers.ModifierHooks;
import slimeknights.tconstruct.library.tools.context.EquipmentChangeContext;
import slimeknights.tconstruct.library.tools.helper.ModifierUtil;
import slimeknights.tconstruct.library.tools.nbt.IToolStackView;

import java.util.EnumMap;
import java.util.Map;
import java.util.WeakHashMap;

/**
 * Watches equipment changes so modifier hooks receive equivalent notifications on both logical sides.
 */
public class EquipmentChangeWatcher {
  private EquipmentChangeWatcher() {}

  /** Client-side snapshots keyed weakly by player so disconnected players do not remain cached. */
  private static final Map<Player,PlayerLastEquipment> CLIENT_WATCHERS = new WeakHashMap<>();

  /** Registers equipment change listeners. */
  public static void register() {
    // NeoForge's equipment change event is server-side in 1.21.1.
    NeoForge.EVENT_BUS.addListener(EquipmentChangeWatcher::onEquipmentChange);

    // Mirror equipment changes on the physical client using the post player tick event.
    if (FMLEnvironment.dist == Dist.CLIENT) {
      NeoForge.EVENT_BUS.addListener(EquipmentChangeWatcher::onPlayerTick);
    }
  }


  /* Events */

  /** Server-side modifier hooks. */
  private static void onEquipmentChange(LivingEquipmentChangeEvent event) {
    runModifierHooks(event.getEntity(), event.getSlot(), event.getFrom(), event.getTo());
  }

  /** Client-side modifier hooks. */
  private static void onPlayerTick(PlayerTickEvent.Post event) {
    Player player = event.getEntity();
    if (player.level().isClientSide()) {
      CLIENT_WATCHERS.computeIfAbsent(player, key -> new PlayerLastEquipment()).update(player);
    }
  }


  /* Helpers */

  /** Shared modifier hook logic */
  private static void runModifierHooks(LivingEntity entity, EquipmentSlot changedSlot, ItemStack original, ItemStack replacement) {
    EquipmentChangeContext context = new EquipmentChangeContext(entity, changedSlot, original, replacement);

    // first, fire event to notify an item was removed
    IToolStackView tool = context.getOriginalTool();
    if (tool != null && ModifierUtil.validArmorSlot(tool, changedSlot)) {
      for (ModifierEntry entry : tool.getModifierList()) {
        entry.getHook(ModifierHooks.EQUIPMENT_CHANGE).onUnequip(tool, entry, context);
      }
    }

    // next, fire event to notify an item was added
    tool = context.getReplacementTool();
    if (tool != null && ModifierUtil.validArmorSlot(tool, changedSlot)) {
      for (ModifierEntry entry : tool.getModifierList()) {
        entry.getHook(ModifierHooks.EQUIPMENT_CHANGE).onEquip(tool, entry, context);
      }
    }

    // finally, fire events on all other slots to say something changed
    for (EquipmentSlot otherSlot : EquipmentSlot.values()) {
      if (otherSlot != changedSlot) {
        tool = context.getValidTool(otherSlot);
        if (tool != null) {
          for (ModifierEntry entry : tool.getModifierList()) {
            entry.getHook(ModifierHooks.EQUIPMENT_CHANGE).onEquipmentChange(tool, entry, context, otherSlot);
          }
        }
      }
    }
    // fire event for modifiers that want to watch equipment when not equipped
    NeoForge.EVENT_BUS.post(new ToolEquipmentChangeEvent(context));
  }

  /** Client snapshot that runs the actual comparison logic. */
  protected static class PlayerLastEquipment {
    private final Map<EquipmentSlot,ItemStack> lastItems = new EnumMap<>(EquipmentSlot.class);

    private PlayerLastEquipment() {
      for (EquipmentSlot slot : EquipmentSlot.values()) {
        lastItems.put(slot, ItemStack.EMPTY);
      }
    }

    /** Called on player tick to update the stacks and run the event. */
    public void update(Player player) {
      for (EquipmentSlot slot : EquipmentSlot.values()) {
        ItemStack newStack = player.getItemBySlot(slot);
        ItemStack oldStack = lastItems.get(slot);
        if (!ItemStack.matches(oldStack, newStack)) {
          lastItems.put(slot, newStack.copy());
          runModifierHooks(player, slot, oldStack, newStack);
        }
      }
    }
  }
}
''', encoding='utf-8')

          gui = Path('src/main/java/slimeknights/tconstruct/tools/client/ModifierClientEvents.java')
          text = gui.read_text(encoding='utf-8')
          text = text.replace('import net.neoforged.neoforge.client.event.RenderGuiOverlayEvent;\n', 'import net.neoforged.neoforge.client.event.RenderGuiLayerEvent;\n')
          text = text.replace('import net.minecraftforge.client.gui.overlay.VanillaGuiOverlay;\n', 'import net.neoforged.neoforge.client.gui.VanillaGuiLayers;\n')
          text = text.replace('public static void renderHotbar(RenderGuiOverlayEvent.Post event)', 'public static void renderHotbar(RenderGuiLayerEvent.Post event)')
          text = text.replace('event.getOverlay() != VanillaGuiOverlay.HOTBAR.type()', '!VanillaGuiLayers.HOTBAR.equals(event.getName())')
          text = text.replace('float partialTicks = event.getPartialTick();', 'float partialTicks = event.getPartialTick().getGameTimeDeltaPartialTick(false);')
          gui.write_text(text, encoding='utf-8')

          recipe = Path('src/main/java/slimeknights/tconstruct/tools/recipe/EnchantmentConvertingRecipe.java')
          text = recipe.read_text(encoding='utf-8')
          text = text.replace('import net.minecraft.network.chat.Component;\n', 'import net.minecraft.core.registries.BuiltInRegistries;\nimport net.minecraft.network.chat.Component;\n')
          text = text.replace('import net.neoforged.neoforge.registries.ForgeRegistries;\n', '')
          text = text.replace('ForgeRegistries.ITEMS.getValues().stream()', 'BuiltInRegistries.ITEM.stream()')
          recipe.write_text(text, encoding='utf-8')
          PY

      - name: Verify targeted migration
        shell: bash
        run: |
          test -z "$(grep -E 'net\.minecraftforge\.common\.capabilities|AttachCapabilitiesEvent|TickEvent\.|net\.minecraftforge\.fml\.LogicalSide|ICapabilityProvider|LazyOptional' src/main/java/slimeknights/tconstruct/tools/logic/EquipmentChangeWatcher.java || true)"
          grep -Fq 'PlayerTickEvent.Post' src/main/java/slimeknights/tconstruct/tools/logic/EquipmentChangeWatcher.java
          grep -Fq 'RenderGuiLayerEvent.Post' src/main/java/slimeknights/tconstruct/tools/client/ModifierClientEvents.java
          grep -Fq 'VanillaGuiLayers.HOTBAR' src/main/java/slimeknights/tconstruct/tools/client/ModifierClientEvents.java
          test -z "$(grep -E 'RenderGuiOverlayEvent|VanillaGuiOverlay' src/main/java/slimeknights/tconstruct/tools/client/ModifierClientEvents.java || true)"
          grep -Fq 'BuiltInRegistries.ITEM.stream()' src/main/java/slimeknights/tconstruct/tools/recipe/EnchantmentConvertingRecipe.java
          test -z "$(grep -F 'ForgeRegistries' src/main/java/slimeknights/tconstruct/tools/recipe/EnchantmentConvertingRecipe.java || true)"

      - name: Commit grouped migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Client watcher and GUI API migration is already present.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/main/java/slimeknights/tconstruct/tools/logic/EquipmentChangeWatcher.java \
                    src/main/java/slimeknights/tconstruct/tools/client/ModifierClientEvents.java \
                    src/main/java/slimeknights/tconstruct/tools/recipe/EnchantmentConvertingRecipe.java
            git commit -m 'Migrate client equipment and GUI APIs to 1.21'
            git push origin HEAD:1.21.1-neoforge
          fi

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --ref 1.21.1-neoforge
