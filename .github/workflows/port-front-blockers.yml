name: Tinkers Front Blocker Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for active port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while gh run list --repo "$GITHUB_REPOSITORY" --workflow port-compile.yml --branch 1.21.1-neoforge --limit 20 --json status --jq '.[] | select(.status == "queued" or .status == "in_progress") | .status' | grep -q .; do
            sleep 15
          done

      - name: Checkout Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge

      - name: Apply explosion subscriber and spawn migrations
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('src/main/java')
          changed = []
          for path in root.rglob('*.java'):
              original = path.read_text(encoding='utf-8')
              text = original

              # ForgeEventFactory explosion hooks moved to NeoForge EventHooks with the same call shape.
              text = text.replace('import net.neoforged.neoforge.event.ForgeEventFactory;',
                                  'import net.neoforged.neoforge.event.EventHooks;')
              text = text.replace('ForgeEventFactory.onExplosionStart(', 'EventHooks.onExplosionStart(')
              text = text.replace('ForgeEventFactory.onExplosionDetonate(', 'EventHooks.onExplosionDetonate(')

              # NeoForge 1.21 uses a standalone EventBusSubscriber annotation.
              if '@Mod.EventBusSubscriber' in text:
                  text = text.replace('Mod.EventBusSubscriber.Bus.FORGE', 'EventBusSubscriber.Bus.GAME')
                  text = text.replace('Mod.EventBusSubscriber.Bus.MOD', 'EventBusSubscriber.Bus.MOD')
                  text = text.replace('@Mod.EventBusSubscriber', '@EventBusSubscriber')
                  if 'import net.neoforged.fml.common.EventBusSubscriber;' not in text:
                      marker = 'import net.neoforged.fml.common.Mod;\n'
                      if marker in text:
                          text = text.replace(marker, 'import net.neoforged.fml.common.EventBusSubscriber;\n' + marker)
                      else:
                          insert = text.find('\n\n', text.find('package '))
                          text = text[:insert+2] + 'import net.neoforged.fml.common.EventBusSubscriber;\n' + text[insert+2:]

              # 1.21 moved dispenser BlockSource and renamed the spawn placement registration event.
              text = text.replace('import net.minecraft.core.BlockSource;',
                                  'import net.minecraft.core.dispenser.BlockSource;')
              text = text.replace('SpawnPlacementRegisterEvent', 'RegisterSpawnPlacementsEvent')
              if 'SpawnPlacements.Type.ON_GROUND' in text:
                  text = text.replace('SpawnPlacements.Type.ON_GROUND', 'SpawnPlacementTypes.ON_GROUND')
                  if 'import net.minecraft.world.entity.SpawnPlacementTypes;' not in text:
                      marker = 'import net.minecraft.world.entity.SpawnPlacements;\n'
                      text = text.replace(marker, marker + 'import net.minecraft.world.entity.SpawnPlacementTypes;\n')

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print(f'Updated {len(changed)} Java files')
          for path in changed:
              print(path)
          PY

      - name: Verify migration targets
        run: |
          if grep -R "ForgeEventFactory.onExplosion\|@Mod.EventBusSubscriber\|SpawnPlacementRegisterEvent\|SpawnPlacements.Type.ON_GROUND\|import net.minecraft.core.BlockSource;" -n src/main/java; then
            echo 'Found stale explosion/subscriber/spawn references.'
            exit 1
          fi

      - name: Commit targeted migration
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java
          git commit -m 'Migrate explosion events and subscriber spawn APIs'
          git push origin HEAD:1.21.1-neoforge

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --ref 1.21.1-neoforge
