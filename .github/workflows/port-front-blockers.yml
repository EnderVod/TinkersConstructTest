name: Tinkers Front Blocker Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for active port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while gh run list --repo "$GITHUB_REPOSITORY" --workflow port-compile.yml --branch 1.21.1-neoforge --limit 30 --json status --jq '.[] | select(.status == "queued" or .status == "in_progress") | .status' | grep -q .; do
            sleep 15
          done

      - name: Checkout Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge

      - name: Migrate entity capabilities to data attachments
        run: |
          cat > src/main/java/slimeknights/tconstruct/library/tools/capability/PersistentDataCapability.java <<'JAVA'
          package slimeknights.tconstruct.library.tools.capability;

          import net.minecraft.core.HolderLookup;
          import net.minecraft.nbt.CompoundTag;
          import net.minecraft.resources.ResourceLocation;
          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.entity.LivingEntity;
          import net.minecraft.world.entity.player.Player;
          import net.neoforged.neoforge.attachment.AttachmentType;
          import net.neoforged.neoforge.attachment.IAttachmentHolder;
          import net.neoforged.neoforge.attachment.IAttachmentSerializer;
          import net.neoforged.neoforge.common.NeoForge;
          import net.neoforged.neoforge.event.entity.player.PlayerEvent;
          import net.neoforged.neoforge.registries.DeferredRegister;
          import net.neoforged.neoforge.registries.NeoForgeRegistries;
          import slimeknights.tconstruct.TConstruct;
          import slimeknights.tconstruct.common.network.SyncPersistentDataPacket;
          import slimeknights.tconstruct.common.network.TinkerNetwork;
          import slimeknights.tconstruct.library.tools.nbt.ModDataNBT;

          import java.util.function.Consumer;
          import java.util.function.Supplier;

          /** Persistent per-entity Tinkers modifier data, stored through NeoForge 1.21 data attachments. */
          public final class PersistentDataCapability {
            private PersistentDataCapability() {}

            private static final ResourceLocation ID = TConstruct.getResource("persistent_data");
            private static final DeferredRegister<AttachmentType<?>> ATTACHMENT_TYPES =
              DeferredRegister.create(NeoForgeRegistries.ATTACHMENT_TYPES, TConstruct.MOD_ID);

            /** Persistent attachment replacing the old Forge entity capability. */
            public static final Supplier<AttachmentType<ModDataNBT>> ATTACHMENT = ATTACHMENT_TYPES.register(ID.getPath(), () ->
              AttachmentType.builder(ModDataNBT::new)
                .serialize(new IAttachmentSerializer<CompoundTag, ModDataNBT>() {
                  @Override
                  public ModDataNBT read(IAttachmentHolder holder, CompoundTag tag, HolderLookup.Provider provider) {
                    return ModDataNBT.readFromNBT(tag.copy());
                  }

                  @Override
                  public CompoundTag write(ModDataNBT attachment, HolderLookup.Provider provider) {
                    return attachment.getCopy();
                  }
                })
                .copyOnDeath()
                .build());

            /** Gets the data, creating the attachment on first use. */
            public static ModDataNBT getOrWarn(Entity entity) {
              if (!(entity instanceof LivingEntity) && !EntityModifierCapability.supportCapability(entity)) {
                TConstruct.LOG.warn("Creating Tinkers persistent data on unsupported entity {}", entity.getType());
              }
              return entity.getData(ATTACHMENT);
            }

            /** Gets existing data or an empty detached value when none has been created. */
            public static ModDataNBT getOrEmpty(Entity entity) {
              ModDataNBT data = entity.getExistingDataOrNull(ATTACHMENT);
              return data == null ? new ModDataNBT() : data;
            }

            /** Runs the consumer only if data is already present. */
            public static void getIfPresent(Entity entity, Consumer<ModDataNBT> consumer) {
              ModDataNBT data = entity.getExistingDataOrNull(ATTACHMENT);
              if (data != null) {
                consumer.accept(data);
              }
            }

            /** Registers the attachment and player sync listeners during mod construction. */
            public static void register() {
              ATTACHMENT_TYPES.register(TConstruct.getModBus());
              NeoForge.EVENT_BUS.addListener(PersistentDataCapability::playerRespawn);
              NeoForge.EVENT_BUS.addListener(PersistentDataCapability::playerChangeDimension);
              NeoForge.EVENT_BUS.addListener(PersistentDataCapability::playerLoggedIn);
            }

            private static void sync(Player player) {
              ModDataNBT data = player.getData(ATTACHMENT);
              TinkerNetwork.getInstance().sendTo(new SyncPersistentDataPacket(data.getCopy()), player);
            }

            private static void playerRespawn(PlayerEvent.PlayerRespawnEvent event) {
              sync(event.getEntity());
            }

            private static void playerChangeDimension(PlayerEvent.PlayerChangedDimensionEvent event) {
              sync(event.getEntity());
            }

            private static void playerLoggedIn(PlayerEvent.PlayerLoggedInEvent event) {
              sync(event.getEntity());
            }
          }
          JAVA

          cat > src/main/java/slimeknights/tconstruct/library/tools/capability/EntityModifierCapability.java <<'JAVA'
          package slimeknights.tconstruct.library.tools.capability;

          import net.minecraft.core.HolderLookup;
          import net.minecraft.nbt.ListTag;
          import net.minecraft.resources.ResourceLocation;
          import net.minecraft.world.entity.Entity;
          import net.neoforged.neoforge.attachment.AttachmentType;
          import net.neoforged.neoforge.attachment.IAttachmentHolder;
          import net.neoforged.neoforge.attachment.IAttachmentSerializer;
          import net.neoforged.neoforge.registries.DeferredRegister;
          import net.neoforged.neoforge.registries.NeoForgeRegistries;
          import org.jetbrains.annotations.Nullable;
          import slimeknights.tconstruct.TConstruct;
          import slimeknights.tconstruct.library.tools.nbt.ModifierNBT;

          import java.util.ArrayList;
          import java.util.List;
          import java.util.function.Predicate;
          import java.util.function.Supplier;

          /** Data attachment allowing supported entities (notably projectiles) to carry tool modifiers. */
          public final class EntityModifierCapability {
            public static final EntityModifiers EMPTY = new EntityModifiers() {
              @Override
              public ModifierNBT getModifiers() {
                return ModifierNBT.EMPTY;
              }

              @Override
              public void setModifiers(ModifierNBT nbt) {}
            };

            private EntityModifierCapability() {}

            private static final List<Predicate<Entity>> ENTITY_PREDICATES = new ArrayList<>();
            private static final ResourceLocation ID = TConstruct.getResource("modifiers");
            private static final DeferredRegister<AttachmentType<?>> ATTACHMENT_TYPES =
              DeferredRegister.create(NeoForgeRegistries.ATTACHMENT_TYPES, TConstruct.MOD_ID);

            /** Serialized modifier attachment replacing the old Forge entity capability. */
            public static final Supplier<AttachmentType<ModifierNBT>> ATTACHMENT = ATTACHMENT_TYPES.register(ID.getPath(), () ->
              AttachmentType.builder(() -> ModifierNBT.EMPTY)
                .serialize(new IAttachmentSerializer<ListTag, ModifierNBT>() {
                  @Override
                  public ModifierNBT read(IAttachmentHolder holder, ListTag tag, HolderLookup.Provider provider) {
                    return ModifierNBT.readFromNBT(tag);
                  }

                  @Nullable
                  @Override
                  public ListTag write(ModifierNBT attachment, HolderLookup.Provider provider) {
                    return attachment.isEmpty() ? null : attachment.serializeToNBT();
                  }
                })
                .build());

            public static EntityModifiers getCapability(Entity entity) {
              if (!supportCapability(entity)) {
                return EMPTY;
              }
              return new AttachmentEntityModifiers(entity);
            }

            public static ModifierNBT getOrEmpty(Entity entity) {
              if (!supportCapability(entity)) {
                return ModifierNBT.EMPTY;
              }
              ModifierNBT modifiers = entity.getExistingDataOrNull(ATTACHMENT);
              return modifiers == null ? ModifierNBT.EMPTY : modifiers;
            }

            public static boolean supportCapability(Entity entity) {
              for (Predicate<Entity> entityPredicate : ENTITY_PREDICATES) {
                if (entityPredicate.test(entity)) {
                  return true;
                }
              }
              return false;
            }

            public static void registerEntityPredicate(Predicate<Entity> predicate) {
              ENTITY_PREDICATES.add(predicate);
            }

            /** Registers the attachment type during mod construction. */
            public static void register() {
              ATTACHMENT_TYPES.register(TConstruct.getModBus());
            }

            private record AttachmentEntityModifiers(Entity entity) implements EntityModifiers {
              @Override
              public ModifierNBT getModifiers() {
                return entity.getData(ATTACHMENT);
              }

              @Override
              public void setModifiers(ModifierNBT nbt) {
                entity.setData(ATTACHMENT, nbt);
              }
            }

            public interface EntityModifiers {
              ModifierNBT getModifiers();

              void setModifiers(ModifierNBT nbt);

              default void addModifiers(ModifierNBT nbt) {
                ModifierNBT existing = getModifiers();
                if (existing.isEmpty()) {
                  setModifiers(nbt);
                } else {
                  setModifiers(ModifierNBT.builder().add(existing).add(nbt).build());
                }
              }
            }
          }
          JAVA

          python3 - <<'PY'
          from pathlib import Path

          replacements = {
            'src/main/java/slimeknights/tconstruct/tools/modifiers/ModifierLootModifier.java': [
              ('projectile.getCapability(PersistentDataCapability.CAPABILITY).orElseGet(ModDataNBT::new)', 'PersistentDataCapability.getOrEmpty(projectile)')
            ],
            'src/main/java/slimeknights/tconstruct/library/tools/helper/ModifierLootingHandler.java': [
              ('direct.getCapability(PersistentDataCapability.CAPABILITY).orElseGet(ModDataNBT::new)', 'PersistentDataCapability.getOrEmpty(direct)')
            ],
            'src/main/java/slimeknights/tconstruct/common/network/SyncPersistentDataPacket.java': [
              ('player.getCapability(PersistentDataCapability.CAPABILITY).ifPresent(data -> data.copyFrom(packet.data));', 'PersistentDataCapability.getOrWarn(player).copyFrom(packet.data);')
            ],
            'src/main/java/slimeknights/tconstruct/tools/logic/DoubleJumpHandler.java': [
              ('living.getCapability(PersistentDataCapability.CAPABILITY).ifPresent(data -> data.remove(JUMPS));', 'PersistentDataCapability.getIfPresent(living, data -> data.remove(JUMPS));'),
              ('event.getEntity().getCapability(PersistentDataCapability.CAPABILITY).ifPresent(data -> data.remove(JUMPS));', 'PersistentDataCapability.getIfPresent(event.getEntity(), data -> data.remove(JUMPS));')
            ],
          }
          for filename, pairs in replacements.items():
            path = Path(filename)
            text = path.read_text(encoding='utf-8')
            for old, new in pairs:
              if old not in text:
                raise SystemExit(f'Missing persistent-data capability use in {filename}: {old}')
              text = text.replace(old, new, 1)
            path.write_text(text, encoding='utf-8')

          # Registration must be installed from the existing module constructor, before lifecycle events fire.
          path = Path('src/main/java/slimeknights/tconstruct/tools/TinkerModifiers.java')
          text = path.read_text(encoding='utf-8')
          constructor_anchor = '  public TinkerModifiers() {\n'
          if constructor_anchor not in text:
            raise SystemExit('Missing TinkerModifiers constructor')
          registrations = '''    PersistentDataCapability.register();\n    EntityModifierCapability.register();\n    BlockItemProviderCapability.register();\n    EntityModifierCapability.registerEntityPredicate(entity -> entity instanceof Projectile);\n'''
          if '    PersistentDataCapability.register();\n' not in text[:text.find('  void commonSetup(final FMLCommonSetupEvent event)')]:
            text = text.replace(constructor_anchor, constructor_anchor + registrations, 1)

          # Remove the old commonSetup registrations, leaving the constructor copies intact.
          common_idx = text.find('  void commonSetup(final FMLCommonSetupEvent event)')
          if common_idx < 0:
            raise SystemExit('Missing TinkerModifiers commonSetup')
          before, after = text[:common_idx], text[common_idx:]
          for stale in [
            '    PersistentDataCapability.register();\n',
            '    EntityModifierCapability.register();\n',
            '    BlockItemProviderCapability.register();\n',
            '    // by default, we support modifying projectiles (arrows or fireworks mainly, but maybe other stuff). other entities may come in the future\n    EntityModifierCapability.registerEntityPredicate(entity -> entity instanceof Projectile);\n',
          ]:
            after = after.replace(stale, '', 1)
          path.write_text(before + after, encoding='utf-8')
          PY

      - name: Verify entity attachment migration
        run: |
          grep -Fq 'DeferredRegister<AttachmentType' src/main/java/slimeknights/tconstruct/library/tools/capability/PersistentDataCapability.java
          grep -Fq '.copyOnDeath()' src/main/java/slimeknights/tconstruct/library/tools/capability/PersistentDataCapability.java
          grep -Fq 'getExistingDataOrNull(ATTACHMENT)' src/main/java/slimeknights/tconstruct/library/tools/capability/EntityModifierCapability.java
          grep -Fq 'entity.setData(ATTACHMENT, nbt)' src/main/java/slimeknights/tconstruct/library/tools/capability/EntityModifierCapability.java
          grep -Fq 'PersistentDataCapability.register();' src/main/java/slimeknights/tconstruct/tools/TinkerModifiers.java
          grep -Fq 'BlockItemProviderCapability.register();' src/main/java/slimeknights/tconstruct/tools/TinkerModifiers.java
          test -z "$(grep -R 'CapabilityManager\|CapabilityToken\|ICapabilitySerializable\|AttachCapabilitiesEvent\|LazyOptional' \
            src/main/java/slimeknights/tconstruct/library/tools/capability/PersistentDataCapability.java \
            src/main/java/slimeknights/tconstruct/library/tools/capability/EntityModifierCapability.java || true)"
          test -z "$(grep -R 'PersistentDataCapability.CAPABILITY' \
            src/main/java/slimeknights/tconstruct/tools/modifiers/ModifierLootModifier.java \
            src/main/java/slimeknights/tconstruct/library/tools/helper/ModifierLootingHandler.java \
            src/main/java/slimeknights/tconstruct/common/network/SyncPersistentDataPacket.java \
            src/main/java/slimeknights/tconstruct/tools/logic/DoubleJumpHandler.java || true)"

      - name: Commit targeted migration
        run: |
          if git diff --quiet; then
            echo 'Entity attachments are already migrated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/main/java/slimeknights/tconstruct/library/tools/capability/PersistentDataCapability.java \
            src/main/java/slimeknights/tconstruct/library/tools/capability/EntityModifierCapability.java \
            src/main/java/slimeknights/tconstruct/tools/modifiers/ModifierLootModifier.java \
            src/main/java/slimeknights/tconstruct/library/tools/helper/ModifierLootingHandler.java \
            src/main/java/slimeknights/tconstruct/common/network/SyncPersistentDataPacket.java \
            src/main/java/slimeknights/tconstruct/tools/logic/DoubleJumpHandler.java \
            src/main/java/slimeknights/tconstruct/tools/TinkerModifiers.java
          git commit -m 'Migrate entity state to NeoForge data attachments'
          git push origin HEAD:1.21.1-neoforge

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --ref 1.21.1-neoforge
