name: Tinkers Front Blocker Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for active port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while gh run list --repo "$GITHUB_REPOSITORY" --workflow port-compile.yml --branch 1.21.1-neoforge --limit 20 --json status --jq '.[] | select(.status == "queued" or .status == "in_progress") | .status' | grep -q .; do
            sleep 15
          done

      - name: Checkout Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge

      - name: Migrate mechanical NeoForge APIs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('src/main/java/slimeknights/tconstruct')
          changed = []
          for path in root.rglob('*.java'):
              original = path.read_text(encoding='utf-8')
              text = original

              # Forge ToolAction became NeoForge ItemAbility in 1.21.
              if 'import net.minecraftforge.common.ToolAction;' in text:
                  text = text.replace('import net.minecraftforge.common.ToolAction;', 'import net.neoforged.neoforge.common.ItemAbility;')
                  text = re.sub(r'\bToolAction\b', 'ItemAbility', text)
              if 'import net.minecraftforge.common.ToolActions;' in text:
                  text = text.replace('import net.minecraftforge.common.ToolActions;', 'import net.neoforged.neoforge.common.ItemAbilities;')
                  text = re.sub(r'\bToolActions\b', 'ItemAbilities', text)

              # CraftingHelper remains in NeoForge, under the NeoForge namespace.
              text = text.replace(
                  'import net.minecraftforge.common.crafting.CraftingHelper;',
                  'import net.neoforged.neoforge.common.crafting.CraftingHelper;')

              # ForgeHooks was renamed CommonHooks; method-level changes are intentionally left for javac to expose.
              if 'import net.minecraftforge.common.ForgeHooks;' in text:
                  text = text.replace('import net.minecraftforge.common.ForgeHooks;', 'import net.neoforged.neoforge.common.CommonHooks;')
                  text = re.sub(r'\bForgeHooks\b', 'CommonHooks', text)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print(f'Updated {len(changed)} Java files')
          for path in changed:
              print(path)
          PY

      - name: Verify mechanical migration
        run: |
          if grep -R "import net.minecraftforge.common.ToolAction;\|import net.minecraftforge.common.ToolActions;\|import net.minecraftforge.common.crafting.CraftingHelper;\|import net.minecraftforge.common.ForgeHooks;" -n src/main/java/slimeknights/tconstruct; then
            echo 'Found stale mechanical API imports.'
            exit 1
          fi

      - name: Commit targeted migration
        run: |
          if git diff --quiet; then
            echo 'No mechanical API changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java
          git commit -m 'Migrate item abilities and common hooks'
          git push origin HEAD:1.21.1-neoforge

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --ref 1.21.1-neoforge
