name: Tinkers Front Blocker Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Wait for active port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while gh run list --repo "$GITHUB_REPOSITORY" --workflow port-compile.yml --branch 1.21.1-neoforge --limit 30 --json status --jq '.[] | select(.status == "queued" or .status == "in_progress") | .status' | grep -q .; do
            sleep 15
          done

      - name: Checkout latest Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Migrate projectile impact and chest dye components
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Missing expected token in {path}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # ProjectileImpactEvent no longer exposes ImpactResult in NeoForge 21.1.
          modifier_events = 'src/main/java/slimeknights/tconstruct/tools/logic/ModifierEvents.java'
          replace(modifier_events,
                  'import net.neoforged.neoforge.event.entity.ProjectileImpactEvent.ImpactResult;\n',
                  '')
          replace(modifier_events,
                  'event.setImpactResult(ImpactResult.SKIP_ENTITY);',
                  'event.setCanceled(true);')

          # DyeableLeatherItem was replaced by the DYED_COLOR data component in 1.21.
          chest_item = 'src/main/java/slimeknights/tconstruct/tables/item/TinkersChestBlockItem.java'
          replace(chest_item,
                  'import net.minecraft.nbt.CompoundTag;\nimport net.minecraft.nbt.Tag;\n',
                  'import net.minecraft.core.component.DataComponents;\n')
          replace(chest_item,
                  'import net.minecraft.world.item.DyeableLeatherItem;\n',
                  'import net.minecraft.world.item.component.DyedItemColor;\n')
          replace(chest_item,
                  'public class TinkersChestBlockItem extends BlockItem implements DyeableLeatherItem {',
                  'public class TinkersChestBlockItem extends BlockItem {')
          replace(chest_item,
                  '  @Override\n  public int getColor(ItemStack stack) {\n    CompoundTag tag = stack.getTagElement("display");\n    return tag != null && tag.contains("color", Tag.TAG_ANY_NUMERIC) ? tag.getInt("color") : TinkersChestBlockEntity.DEFAULT_COLOR;\n  }',
                  '  public int getColor(ItemStack stack) {\n    DyedItemColor color = stack.get(DataComponents.DYED_COLOR);\n    return color != null ? color.rgb() : TinkersChestBlockEntity.DEFAULT_COLOR;\n  }')
          replace(chest_item,
                  '    if (hasCustomColor(stack) && world.getBlockEntity(pos) instanceof TinkersChestBlockEntity te) {',
                  '    if (stack.get(DataComponents.DYED_COLOR) != null && world.getBlockEntity(pos) instanceof TinkersChestBlockEntity te) {')

          chest_block = 'src/main/java/slimeknights/tconstruct/tables/block/TinkersChestBlock.java'
          replace(chest_block,
                  'import net.minecraft.world.entity.player.Player;\nimport net.minecraft.world.item.DyeableLeatherItem;\n',
                  'import net.minecraft.core.component.DataComponents;\nimport net.minecraft.world.entity.player.Player;\nimport net.minecraft.world.item.component.DyedItemColor;\n')
          replace(chest_block,
                  '      ((DyeableLeatherItem) stack.getItem()).setColor(stack, te.getColor());',
                  '      stack.set(DataComponents.DYED_COLOR, new DyedItemColor(te.getColor(), true));')

          client_events = 'src/main/java/slimeknights/tconstruct/tables/TableClientEvents.java'
          replace(client_events,
                  'import net.minecraft.client.renderer.blockentity.BlockEntityRendererProvider;\nimport net.minecraft.world.item.DyeableLeatherItem;\n',
                  'import net.minecraft.client.renderer.blockentity.BlockEntityRendererProvider;\nimport net.minecraft.core.component.DataComponents;\nimport net.minecraft.world.item.component.DyedItemColor;\n')
          replace(client_events,
                  '    event.register((stack, index) -> ((DyeableLeatherItem)stack.getItem()).getColor(stack), TinkerTables.tinkersChest.asItem());',
                  '    event.register((stack, index) -> {\n      DyedItemColor color = stack.get(DataComponents.DYED_COLOR);\n      return color != null ? color.rgb() : TinkersChestBlockEntity.DEFAULT_COLOR;\n    }, TinkerTables.tinkersChest.asItem());')
          PY

      - name: Verify targeted migration
        shell: bash
        run: |
          test -z "$(grep -F 'ImpactResult' src/main/java/slimeknights/tconstruct/tools/logic/ModifierEvents.java || true)"
          grep -Fq 'event.setCanceled(true);' src/main/java/slimeknights/tconstruct/tools/logic/ModifierEvents.java
          test -z "$(grep -R -F 'DyeableLeatherItem' src/main/java/slimeknights/tconstruct/tables/TableClientEvents.java src/main/java/slimeknights/tconstruct/tables/block/TinkersChestBlock.java src/main/java/slimeknights/tconstruct/tables/item/TinkersChestBlockItem.java || true)"
          grep -Fq 'DataComponents.DYED_COLOR' src/main/java/slimeknights/tconstruct/tables/item/TinkersChestBlockItem.java
          grep -Fq 'new DyedItemColor' src/main/java/slimeknights/tconstruct/tables/block/TinkersChestBlock.java

      - name: Commit grouped migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/slimeknights/tconstruct/tools/logic/ModifierEvents.java \
                  src/main/java/slimeknights/tconstruct/tables/TableClientEvents.java \
                  src/main/java/slimeknights/tconstruct/tables/block/TinkersChestBlock.java \
                  src/main/java/slimeknights/tconstruct/tables/item/TinkersChestBlockItem.java
          git diff --cached --quiet && exit 0
          git commit -m 'Migrate projectile impact and chest dye APIs to 1.21'
          git push origin HEAD:1.21.1-neoforge

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --repo "$GITHUB_REPOSITORY" --ref 1.21.1-neoforge
