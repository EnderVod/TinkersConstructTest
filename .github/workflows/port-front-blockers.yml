name: Tinkers Front Blocker Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout latest Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Apply guarded advancement and interaction batch
        run: python3 .github/scripts/port-smeltery-batch.py

      - name: Verify migration
        shell: bash
        run: |
          grep -Fq 'AdvancementHolder advancement = server.getAdvancements().get' src/main/java/slimeknights/tconstruct/shared/AchievementEvents.java
          grep -Fq 'this.changeOverTime(pState, pLevel, pPos, pRandom);' src/main/java/slimeknights/tconstruct/shared/block/WeatheringPlatformBlock.java
          grep -Fq 'protected ItemInteractionResult useItemOn' src/main/java/slimeknights/tconstruct/shared/block/WeatheringPlatformBlock.java
          grep -Fq 'Item.TooltipContext context' src/main/java/slimeknights/tconstruct/fluids/item/MagmaBottleItem.java
          grep -Fq 'context.tickRate()' src/main/java/slimeknights/tconstruct/fluids/item/MagmaBottleItem.java
          grep -Fq 'player.connection.getConnection().isMemoryConnection()' src/main/java/slimeknights/tconstruct/library/materials/MaterialRegistry.java
          grep -Fq 'new BlockHitResult(context.getClickLocation(), context.getClickedFace(), context.getClickedPos(), context.isInside())' src/main/java/slimeknights/tconstruct/library/tools/definition/module/aoe/BoxAOEIterator.java
          grep -Fq 'menu instanceof InventoryMenu' src/main/java/slimeknights/tconstruct/library/tools/capability/inventory/InventorySlotMenuModule.java
          grep -Fq 'slot.getType() == EquipmentSlot.Type.ARMOR ? ARMOR : RIGHT_CLICK' src/main/java/slimeknights/tconstruct/library/modifiers/hook/interaction/InteractionSource.java
          git diff --check

      - name: Commit compatibility batch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java
          git diff --cached --quiet || {
            git commit -m 'Migrate advancement and interaction APIs to 1.21'
            git push origin HEAD:1.21.1-neoforge
          }

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --repo "$GITHUB_REPOSITORY" --ref 1.21.1-neoforge
