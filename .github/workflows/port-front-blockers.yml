name: Tinkers Client Compatibility Cleanup

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout latest Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Port FML and fluid model cache APIs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # FancyModLoader 1.21 uses static error-state and event dispatch methods.
          for name in (
              'src/main/java/slimeknights/tconstruct/library/client/materials/MaterialRenderInfoLoader.java',
              'src/main/java/slimeknights/tconstruct/library/client/modifiers/ModifierModelMapManager.java',
          ):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if 'ModLoader.isLoadingStateValid()' in text:
                  text = text.replace('ModLoader.isLoadingStateValid()', '!ModLoader.hasErrors()')
              elif '!ModLoader.hasErrors()' not in text:
                  raise RuntimeError(f'Unexpected ModLoader loading-state call in {name}')
              path.write_text(text, encoding='utf-8')

          path = Path('src/main/java/slimeknights/tconstruct/library/client/modifiers/ModifierModelManager.java')
          text = path.read_text(encoding='utf-8')
          if 'ModLoader.get().postEvent(new ModifierModelRegistrationEvent());' in text:
              text = text.replace(
                  'ModLoader.get().postEvent(new ModifierModelRegistrationEvent());',
                  'ModLoader.postEvent(new ModifierModelRegistrationEvent());', 1)
          elif 'ModLoader.postEvent(new ModifierModelRegistrationEvent());' not in text:
              raise RuntimeError('Unexpected ModifierModelManager event dispatch')
          path.write_text(text, encoding='utf-8')

          # There is no registered Potions.EMPTY sentinel in 1.21; a registry lookup that succeeds is renderable.
          path = Path('src/main/java/slimeknights/tconstruct/library/client/modifiers/PotionModifierModel.java')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import net.minecraft.world.item.alchemy.Potions;\n', '')
          old = '''            PotionContents contents = new PotionContents(BuiltInRegistries.POTION.wrapAsHolder(potion));\n            if (!contents.is(Potions.EMPTY)) {\n              quadConsumer.accept(MantleItemLayerModel.getQuadsForSprite(0xFF000000 | contents.getColor(), -1, spriteGetter.apply(texture), transforms, 0, pixels));\n            }'''
          new = '''            PotionContents contents = new PotionContents(BuiltInRegistries.POTION.wrapAsHolder(potion));\n            quadConsumer.accept(MantleItemLayerModel.getQuadsForSprite(0xFF000000 | contents.getColor(), -1, spriteGetter.apply(texture), transforms, 0, pixels));'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'Potions.EMPTY' in text:
              raise RuntimeError('Unexpected PotionModifierModel empty-potion check')
          path.write_text(text, encoding='utf-8')

          # FluidStack custom data is now represented by the component patch; preserve cache identity semantics.
          for name in (
              'src/main/java/slimeknights/tconstruct/library/client/modifiers/model/TankModifierModel.java',
              'src/main/java/slimeknights/tconstruct/library/client/modifiers/model/FluidModifierModel.java',
          ):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = text.replace('import net.minecraft.nbt.CompoundTag;\n', 'import net.minecraft.core.component.DataComponentPatch;\n')
              text = text.replace('@Nullable CompoundTag tag', 'DataComponentPatch components')
              text = text.replace('fluid.getTag()', 'fluid.getComponentsPatch()')
              if 'fluid.getTag()' in text or 'CompoundTag tag' in text:
                  raise RuntimeError(f'Legacy fluid tag cache remains in {name}')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Verify client compatibility cleanup
        shell: bash
        run: |
          grep -Fq '!ModLoader.hasErrors()' src/main/java/slimeknights/tconstruct/library/client/materials/MaterialRenderInfoLoader.java
          grep -Fq '!ModLoader.hasErrors()' src/main/java/slimeknights/tconstruct/library/client/modifiers/ModifierModelMapManager.java
          grep -Fq 'ModLoader.postEvent(new ModifierModelRegistrationEvent());' src/main/java/slimeknights/tconstruct/library/client/modifiers/ModifierModelManager.java
          ! grep -Fq 'Potions.EMPTY' src/main/java/slimeknights/tconstruct/library/client/modifiers/PotionModifierModel.java
          grep -Fq 'DataComponentPatch components' src/main/java/slimeknights/tconstruct/library/client/modifiers/model/TankModifierModel.java
          grep -Fq 'fluid.getComponentsPatch()' src/main/java/slimeknights/tconstruct/library/client/modifiers/model/TankModifierModel.java
          grep -Fq 'DataComponentPatch components' src/main/java/slimeknights/tconstruct/library/client/modifiers/model/FluidModifierModel.java
          grep -Fq 'fluid.getComponentsPatch()' src/main/java/slimeknights/tconstruct/library/client/modifiers/model/FluidModifierModel.java
          git diff --check

      - name: Commit client compatibility cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/main/java/slimeknights/tconstruct/library/client/materials/MaterialRenderInfoLoader.java \
            src/main/java/slimeknights/tconstruct/library/client/modifiers/ModifierModelMapManager.java \
            src/main/java/slimeknights/tconstruct/library/client/modifiers/ModifierModelManager.java \
            src/main/java/slimeknights/tconstruct/library/client/modifiers/PotionModifierModel.java \
            src/main/java/slimeknights/tconstruct/library/client/modifiers/model/TankModifierModel.java \
            src/main/java/slimeknights/tconstruct/library/client/modifiers/model/FluidModifierModel.java
          git diff --cached --quiet || {
            git commit -m 'Port client loading and fluid cache APIs to 1.21'
            git push origin HEAD:1.21.1-neoforge
          }

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --repo "$GITHUB_REPOSITORY" --ref 1.21.1-neoforge
