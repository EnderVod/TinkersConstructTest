name: Tinkers 1.21 Compatibility Cleanup

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout latest Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Apply 1.21 compatibility cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise RuntimeError(f'{label}: expected exactly one match, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('src/main/java/slimeknights/tconstruct/library/modifiers/modules/build/EnchantmentModule.java')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import slimeknights.mantle.util.LogicHelper;\n', '')
          anchor = 'import net.minecraft.resources.ResourceLocation;\n'
          if text.count(anchor) != 1:
              raise RuntimeError('EnchantmentModule ResourceLocation import anchor changed')
          text = text.replace(anchor, anchor + 'import net.minecraft.server.level.ServerLevel;\n', 1)
          anchor = 'import org.jetbrains.annotations.ApiStatus.Internal;\n'
          if text.count(anchor) != 1:
              raise RuntimeError('EnchantmentModule Internal import anchor changed')
          text = text.replace(anchor, 'import org.apache.commons.lang3.mutable.MutableFloat;\n' + anchor, 1)
          old = ('        Enchantment enchantment = enchantment();\n'
                 '        if (subtractLevel > 0 && LogicHelper.isInList(enchantment.slots, slotType) && !source.is(DamageTypeTags.BYPASSES_ENCHANTMENTS)) {\n'
                 '          modifierValue -= enchantment.getDamageProtection(subtractLevel, source);\n'
                 '        }')
          new = ('        Enchantment enchantment = enchantment();\n'
                 '        if (subtractLevel > 0 && enchantment.matchingSlot(slotType) && !source.is(DamageTypeTags.BYPASSES_ENCHANTMENTS)\n'
                 '            && context.getLevel() instanceof ServerLevel serverLevel) {\n'
                 '          MutableFloat protection = new MutableFloat(0f);\n'
                 '          enchantment.modifyDamageProtection(serverLevel, subtractLevel, context.getEntity().getItemBySlot(slotType), context.getEntity(), source, protection);\n'
                 '          modifierValue -= protection.floatValue();\n'
                 '        }')
          if text.count(old) != 1:
              raise RuntimeError('EnchantmentModule legacy protection block changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('src/main/java/slimeknights/tconstruct/library/json/TinkerLoadables.java')
          text = path.read_text(encoding='utf-8')
          for imp in [
              'import net.minecraft.world.level.storage.loot.entries.LootPoolEntryContainer;\n',
              'import net.neoforged.neoforge.common.loot.LootModifierManager;\n',
              'import slimeknights.tconstruct.library.utils.GsonLoadable;\n']:
              if text.count(imp) != 1:
                  raise RuntimeError(f'TinkerLoadables import changed: {imp.strip()}')
              text = text.replace(imp, '', 1)
          old = ('  /* Loot tables */\n'
                 '  /** Loadable for a loot entry instance */\n'
                 '  public static final Loadable<LootPoolEntryContainer> LOOT_ENTRY = new GsonLoadable<>(LootModifierManager.GSON_INSTANCE, LootPoolEntryContainer.class);\n\n')
          if text.count(old) != 1:
              raise RuntimeError('TinkerLoadables legacy LOOT_ENTRY block changed')
          path.write_text(text.replace(old, '', 1), encoding='utf-8')

          replace_once('src/main/java/slimeknights/tconstruct/tools/recipe/BannerModifierRecipe.java', 'return Stream.of(new DisplayRecipe(id, toolInputs, banner));', 'return Stream.of(new DisplayRecipe(id, toolInputs, banner, access));', 'BannerModifierRecipe display call')
          replace_once('src/main/java/slimeknights/tconstruct/tools/recipe/BannerModifierRecipe.java', 'public DisplayRecipe(ResourceLocation recipeId, List<ItemStack> tools, BannerItem banner) {', 'public DisplayRecipe(ResourceLocation recipeId, List<ItemStack> tools, BannerItem banner, RegistryAccess access) {', 'BannerModifierRecipe display constructor')

          path = Path('src/main/java/slimeknights/tconstruct/tools/client/ShieldBannerModifierSpriteSource.java')
          text = path.read_text(encoding='utf-8')
          old = 'public static final Codec<ShieldBannerModifierSpriteSource> CODEC = ExtraCodecs.validate(RecordCodecBuilder.<ShieldBannerModifierSpriteSource>create(inst -> inst.group('
          new = 'public static final Codec<ShieldBannerModifierSpriteSource> CODEC = RecordCodecBuilder.<ShieldBannerModifierSpriteSource>create(inst -> inst.group('
          if text.count(old) != 1:
              raise RuntimeError('ShieldBanner codec opening changed')
          text = text.replace(old, new, 1)
          old = '  ).apply(inst, ShieldBannerModifierSpriteSource::new)), source -> {'
          new = '  ).apply(inst, ShieldBannerModifierSpriteSource::new)).validate(source -> {'
          if text.count(old) != 1:
              raise RuntimeError('ShieldBanner codec validation join changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once('src/main/java/slimeknights/tconstruct/tools/recipe/ArmorTrimRecipe.java', 'TrimMaterial material = holder.get();', 'TrimMaterial material = holder.value();', 'ArmorTrim holder value')
          replace_once('src/main/java/slimeknights/tconstruct/tools/recipe/ArmorTrimRecipe.java', 'this.material = List.of(new ItemStack(material.ingredient().get()));', 'this.material = List.of(new ItemStack(material.ingredient().value()));', 'ArmorTrim ingredient holder value')

          path = Path('src/main/java/slimeknights/tconstruct/tools/TinkerTools.java')
          text = path.read_text(encoding='utf-8')
          anchor = 'import net.minecraft.core.particles.SimpleParticleType;\n'
          if text.count(anchor) != 1:
              raise RuntimeError('TinkerTools particle import anchor changed')
          if 'import net.minecraft.core.component.DataComponents;\n' not in text:
              text = text.replace(anchor, 'import net.minecraft.core.component.DataComponents;\n' + anchor, 1)
          old = 'public static final DeferredHolder<? super LootItemFunctionType, LootItemFunctionType> lootAddToolData = LOOT_FUNCTIONS.register("add_tool_data", () -> new LootItemFunctionType<>(AddToolDataFunction.CODEC));'
          new = 'public static final DeferredHolder<LootItemFunctionType<?>, LootItemFunctionType<AddToolDataFunction>> lootAddToolData = LOOT_FUNCTIONS.register("add_tool_data", () -> new LootItemFunctionType<>(AddToolDataFunction.CODEC));'
          if text.count(old) != 1:
              raise RuntimeError('TinkerTools loot function holder declaration changed')
          text = text.replace(old, new, 1)
          if text.count('player.disableShield(true);') != 1:
              raise RuntimeError('TinkerTools disableShield call changed')
          text = text.replace('player.disableShield(true);', 'player.disableShield();', 1)
          if text.count('stack.setHoverName(TConstruct.makeTranslation("item", "efln_ball"));') != 1:
              raise RuntimeError('TinkerTools EFLN name call changed')
          text = text.replace('stack.setHoverName(TConstruct.makeTranslation("item", "efln_ball"));', 'stack.set(DataComponents.CUSTOM_NAME, TConstruct.makeTranslation("item", "efln_ball"));', 1)
          path.write_text(text, encoding='utf-8')

          path = Path('src/main/resources/META-INF/accesstransformer.cfg')
          text = path.read_text(encoding='utf-8')
          anchor = 'public net.minecraft.world.level.storage.loot.functions.ApplyBonusCount$UniformBonusCount\n'
          if text.count(anchor) != 1:
              raise RuntimeError('ApplyBonus Uniform AT anchor changed')
          additions = ('public net.minecraft.world.level.storage.loot.functions.ApplyBonusCount$BinomialWithBonusCount <init>(IF)V\n'
                       'public net.minecraft.world.level.storage.loot.functions.ApplyBonusCount$UniformBonusCount <init>(I)V\n')
          if '<init>(IF)V' not in text:
              text = text.replace(anchor, anchor + additions, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify compatibility cleanup
        shell: bash
        run: |
          grep -Fq 'enchantment.matchingSlot(slotType)' src/main/java/slimeknights/tconstruct/library/modifiers/modules/build/EnchantmentModule.java
          grep -Fq 'enchantment.modifyDamageProtection(serverLevel' src/main/java/slimeknights/tconstruct/library/modifiers/modules/build/EnchantmentModule.java
          ! grep -Fq 'LOOT_ENTRY' src/main/java/slimeknights/tconstruct/library/json/TinkerLoadables.java
          grep -Fq 'new DisplayRecipe(id, toolInputs, banner, access)' src/main/java/slimeknights/tconstruct/tools/recipe/BannerModifierRecipe.java
          grep -Fq ').validate(source -> {' src/main/java/slimeknights/tconstruct/tools/client/ShieldBannerModifierSpriteSource.java
          grep -Fq 'TrimMaterial material = holder.value();' src/main/java/slimeknights/tconstruct/tools/recipe/ArmorTrimRecipe.java
          grep -Fq 'material.ingredient().value()' src/main/java/slimeknights/tconstruct/tools/recipe/ArmorTrimRecipe.java
          grep -Fq 'player.disableShield();' src/main/java/slimeknights/tconstruct/tools/TinkerTools.java
          grep -Fq 'DataComponents.CUSTOM_NAME' src/main/java/slimeknights/tconstruct/tools/TinkerTools.java
          grep -Fq 'ApplyBonusCount$BinomialWithBonusCount <init>(IF)V' src/main/resources/META-INF/accesstransformer.cfg
          grep -Fq 'ApplyBonusCount$UniformBonusCount <init>(I)V' src/main/resources/META-INF/accesstransformer.cfg
          git diff --check

      - name: Commit compatibility cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/slimeknights/tconstruct/library/modifiers/modules/build/EnchantmentModule.java src/main/java/slimeknights/tconstruct/library/json/TinkerLoadables.java src/main/java/slimeknights/tconstruct/tools/recipe/BannerModifierRecipe.java src/main/java/slimeknights/tconstruct/tools/client/ShieldBannerModifierSpriteSource.java src/main/java/slimeknights/tconstruct/tools/recipe/ArmorTrimRecipe.java src/main/java/slimeknights/tconstruct/tools/TinkerTools.java src/main/resources/META-INF/accesstransformer.cfg
          git commit -m 'Clear 1.21 compatibility frontier'
          git push origin HEAD:1.21.1-neoforge

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --ref 1.21.1-neoforge
