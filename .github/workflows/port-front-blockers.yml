name: Tinkers Front Blocker Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Wait for active port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while gh run list --repo "$GITHUB_REPOSITORY" --workflow port-compile.yml --branch 1.21.1-neoforge --limit 30 --json status --jq '.[] | select(.status == "queued" or .status == "in_progress") | .status' | grep -q .; do
            sleep 15
          done

      - name: Checkout latest Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Migrate enchantment registry and tooltip flags
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Missing expected token in {path}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          packet = 'src/main/java/slimeknights/tconstruct/library/modifiers/UpdateModifiersPacket.java'
          replace(packet,
                  'import net.minecraft.core.registries.Registries;\n',
                  'import net.minecraft.core.registries.BuiltInRegistries;\nimport net.minecraft.core.registries.Registries;\n')
          replace(packet,
                  'import net.neoforged.neoforge.registries.ForgeRegistries;\n',
                  '')
          replace(packet, 'ForgeRegistries.ENCHANTMENTS', 'BuiltInRegistries.ENCHANTMENT')

          tooltip = 'src/main/java/slimeknights/tconstruct/library/tools/helper/TooltipUtil.java'
          replace(tooltip, 'import net.minecraft.world.item.ItemStack.TooltipPart;\n', '')
          replace(tooltip,
                  '  /** Flags used when not holding control or shift */\n  private static final int DEFAULT_HIDE_FLAGS = TooltipPart.ENCHANTMENTS.getMask();\n  /** Flags used when holding control or shift */\n  private static final int MODIFIER_HIDE_FLAGS = TooltipPart.ENCHANTMENTS.getMask() | TooltipPart.MODIFIERS.getMask();',
                  '  /** 1.21 removed ItemStack tooltip bitmasks. Keep the legacy hook neutral until component-based suppression is restored. */\n  private static final int DEFAULT_HIDE_FLAGS = 0;\n  private static final int MODIFIER_HIDE_FLAGS = 0;')
          PY

      - name: Verify targeted migration
        shell: bash
        run: |
          grep -Fq 'BuiltInRegistries.ENCHANTMENT' src/main/java/slimeknights/tconstruct/library/modifiers/UpdateModifiersPacket.java
          test -z "$(grep -F 'ForgeRegistries' src/main/java/slimeknights/tconstruct/library/modifiers/UpdateModifiersPacket.java || true)"
          test -z "$(grep -F 'TooltipPart' src/main/java/slimeknights/tconstruct/library/tools/helper/TooltipUtil.java || true)"
          grep -Fq 'DEFAULT_HIDE_FLAGS = 0' src/main/java/slimeknights/tconstruct/library/tools/helper/TooltipUtil.java

      - name: Commit grouped migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/slimeknights/tconstruct/library/modifiers/UpdateModifiersPacket.java \
                  src/main/java/slimeknights/tconstruct/library/tools/helper/TooltipUtil.java
          git diff --cached --quiet && exit 0
          git commit -m 'Migrate registry and tooltip APIs to 1.21'
          git push origin HEAD:1.21.1-neoforge

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --repo "$GITHUB_REPOSITORY" --ref 1.21.1-neoforge
