name: Tinkers Common API Followup

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - '.github/workflows/port-front-blockers.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout port branch
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge

      - name: Apply guarded API followup
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'Guard failed in {path}: expected exactly one occurrence of {old!r}, found {text.count(old)}')
              path.write_text(text.replace(old, new))

          root = Path('src/main/java/slimeknights/tconstruct')

          # Accept DeferredHolder<R,T> for any R/T subtype chain rooted at MobEffect.
          effects = root / 'shared/TinkerEffects.java'
          replace_once(
              effects,
              'public static Holder<MobEffect> holder(DeferredHolder<MobEffect, ? extends MobEffect> effect) {',
              'public static <R extends MobEffect, T extends R> Holder<MobEffect> holder(DeferredHolder<R, T> effect) {'
          )

          # Item tooltip context replaced the nullable Level parameter in 1.21.
          repair = root / 'tools/item/RepairKitItem.java'
          text = repair.read_text()
          for old, new in [
              ('import net.minecraft.world.item.ItemStack;\n', 'import net.minecraft.world.item.Item;\nimport net.minecraft.world.item.ItemStack;\n'),
              ('import net.minecraft.world.level.Level;\n', ''),
              ('import javax.annotation.Nullable;\n', ''),
              ('public void appendHoverText(ItemStack stack, @Nullable Level world, List<Component> tooltip, TooltipFlag flag) {\n    super.appendHoverText(stack, world, tooltip, flag);',
               'public void appendHoverText(ItemStack stack, Item.TooltipContext context, List<Component> tooltip, TooltipFlag flag) {\n    super.appendHoverText(stack, context, tooltip, flag);'),
          ]:
              if text.count(old) != 1:
                  raise SystemExit(f'RepairKitItem guard failed for {old!r}: {text.count(old)}')
              text = text.replace(old, new)
          repair.write_text(text)

          # Enchantments are data-driven holders in 1.21. Resolve Looting through the level registry.
          shears = root / 'tools/modules/interaction/ShearsModule.java'
          text = shears.read_text()
          for old, new in [
              ('import net.minecraft.world.InteractionHand;\n', 'import net.minecraft.core.registries.Registries;\nimport net.minecraft.world.InteractionHand;\n'),
              ('import net.minecraft.world.item.enchantment.Enchantments;\n', 'import net.minecraft.world.item.enchantment.EnchantmentHelper;\nimport net.minecraft.world.item.enchantment.Enchantments;\n'),
              ('    LootingContext context = new LootingContext(player, target, null, Util.getSlotType(hand));\n    int looting = LootingModifierHook.getLooting(tool, context, player.getItemInHand(hand).getEnchantmentLevel(Enchantments.MOB_LOOTING));\n    looting = ArmorLootingModifierHook.getLooting(tool, context, looting);\n    Level world = player.getCommandSenderWorld();',
               '    LootingContext context = new LootingContext(player, target, null, Util.getSlotType(hand));\n    Level world = player.getCommandSenderWorld();\n    int vanillaLooting = EnchantmentHelper.getItemEnchantmentLevel(\n      world.registryAccess().lookupOrThrow(Registries.ENCHANTMENT).getOrThrow(Enchantments.LOOTING),\n      player.getItemInHand(hand));\n    int looting = LootingModifierHook.getLooting(tool, context, vanillaLooting);\n    looting = ArmorLootingModifierHook.getLooting(tool, context, looting);'),
          ]:
              if text.count(old) != 1:
                  raise SystemExit(f'ShearsModule guard failed for {old!r}: {text.count(old)}')
              text = text.replace(old, new)
          shears.write_text(text)
          PY

          git diff --check
          git diff --stat

      - name: Commit migrated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java
          git diff --cached --quiet && { echo 'No source changes produced'; exit 1; }
          git commit -m 'Fix effect holders repair tooltip and looting lookup'
          git push origin HEAD:1.21.1-neoforge

      - name: Start fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --repo EnderVod/TinkersConstructTest --ref 1.21.1-neoforge
