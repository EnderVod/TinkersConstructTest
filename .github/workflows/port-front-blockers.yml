name: Tinkers Model Data Component Cleanup

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout latest Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Port residual model data APIs to 1.21
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # MaterialBlockModel has two distinct data stores: TOOL_DATA for full tools, CUSTOM_DATA for parts/retextures.
          path = Path('src/main/java/slimeknights/tconstruct/library/client/model/tools/MaterialBlockModel.java')
          text = path.read_text(encoding='utf-8')
          anchor = 'import slimeknights.tconstruct.library.tools.nbt.MaterialIdNBT;\n'
          if 'import slimeknights.tconstruct.library.tools.nbt.ToolDataComponents;' not in text:
              if anchor not in text: raise RuntimeError('MaterialBlockModel ToolData import anchor missing')
              text = text.replace(anchor, anchor + 'import slimeknights.tconstruct.library.tools.nbt.ToolDataComponents;\n', 1)
          anchor = 'import slimeknights.tconstruct.library.tools.part.IMaterialItem;\n'
          if 'import slimeknights.tconstruct.library.utils.TagUtil;' not in text:
              if anchor not in text: raise RuntimeError('MaterialBlockModel TagUtil import anchor missing')
              text = text.replace(anchor, anchor + 'import slimeknights.tconstruct.library.utils.TagUtil;\n', 1)
          old = '      if (stack.isEmpty() || !stack.hasTag()) {'
          if text.count(old) != 3:
              raise RuntimeError(f'MaterialBlockModel expected 3 legacy tag guards, found {text.count(old)}')
          text = text.replace(old, '      if (stack.isEmpty() || ToolDataComponents.getTag(stack) == null) {', 1)
          text = text.replace(old, '        if (stack.isEmpty() || !TagUtil.hasTag(stack)) {', 1)
          text = text.replace(old, '        if (stack.isEmpty() || !TagUtil.hasTag(stack)) {', 1)
          path.write_text(text, encoding='utf-8')

          # Tool model stored ammo is still legacy CompoundTag inside modifier data; parse via the 1.21 registry-aware helper.
          path = Path('src/main/java/slimeknights/tconstruct/library/client/model/tools/ToolModel.java')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import net.minecraft.nbt.CompoundTag;\n', '')
          anchor = 'import slimeknights.tconstruct.library.tools.nbt.ToolStack;\n'
          if 'import slimeknights.tconstruct.library.utils.TagUtil;' not in text:
              if anchor not in text: raise RuntimeError('ToolModel TagUtil import anchor missing')
              text = text.replace(anchor, anchor + 'import slimeknights.tconstruct.library.utils.TagUtil;\n', 1)
          old = '''        ammo = ItemStack.of(persistentData.getCompound(ammoKey));\n        builder.add(ammo.getItem());\n        CompoundTag tag = ammo.getTag();\n        if (tag != null) {\n          builder.add(tag);\n        }'''
          new = '''        ammo = TagUtil.readItem(persistentData.getCompound(ammoKey));\n        builder.add(ammo.getItem());\n        builder.add(ammo.getComponents());'''
          if text.count(old) != 1:
              raise RuntimeError('ToolModel stored-ammo block changed unexpectedly')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Fluid container model: retain legacy JSON NBT compatibility through Mantle NBTLoadable + Tinkers custom-data helper.
          path = Path('src/main/java/slimeknights/tconstruct/library/client/model/FluidContainerModel.java')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import net.neoforged.neoforge.common.crafting.CraftingHelper;\n', '')
          anchor = 'import slimeknights.mantle.data.loadable.Loadables;\n'
          if 'import slimeknights.mantle.data.loadable.common.NBTLoadable;' not in text:
              if anchor not in text: raise RuntimeError('FluidContainerModel NBTLoadable anchor missing')
              text = text.replace(anchor, anchor + 'import slimeknights.mantle.data.loadable.common.NBTLoadable;\n', 1)
          anchor = 'import slimeknights.tconstruct.TConstruct;\n'
          if 'import slimeknights.tconstruct.library.utils.TagUtil;' not in text:
              if anchor not in text: raise RuntimeError('FluidContainerModel TagUtil anchor missing')
              text = text.replace(anchor, anchor + 'import slimeknights.tconstruct.library.utils.TagUtil;\n', 1)
          text = text.replace('tag = CraftingHelper.getNBT(fluidObject.get("nbt"));', 'tag = NBTLoadable.ALLOW_STRING.convert(fluidObject.get("nbt"), "nbt");')
          text = text.replace('fluidStack = new FluidStack(fluid, FluidType.BUCKET_VOLUME, tag);', 'fluidStack = TagUtil.createFluidStack(fluid, FluidType.BUCKET_VOLUME, tag);')
          text = text.replace('UnbakedGeometryHelper.createUnbakedItemElements(0, baseSprite.contents())', 'UnbakedGeometryHelper.createUnbakedItemElements(0, baseSprite)')
          text = text.replace('UnbakedGeometryHelper.createUnbakedItemMaskElements(1, spriteGetter.apply(context.getMaterial("fluid")).contents())', 'UnbakedGeometryHelper.createUnbakedItemMaskElements(1, spriteGetter.apply(context.getMaterial("fluid")))')
          text = text.replace('        $ -> baseSprite, modelState, modelLocation\n', '        $ -> baseSprite, modelState\n')
          text = text.replace('        new SimpleModelState(modelState.getRotation().compose(FLUID_TRANSFORM), modelState.isUvLocked()),\n        modelLocation\n', '        new SimpleModelState(modelState.getRotation().compose(FLUID_TRANSFORM), modelState.isUvLocked())\n')
          if 'CraftingHelper.getNBT' in text or 'new FluidStack(fluid, FluidType.BUCKET_VOLUME, tag)' in text or '.contents()),\n        $ ->' in text:
              raise RuntimeError('FluidContainerModel legacy APIs remain after migration')
          path.write_text(text, encoding='utf-8')

          # Item overrides can query their component-backed helpers directly.
          path = Path('src/main/java/slimeknights/tconstruct/library/client/model/block/TankModel.java')
          text = path.read_text(encoding='utf-8')
          anchor = 'import slimeknights.tconstruct.smeltery.item.TankItem;\n'
          if 'import slimeknights.tconstruct.library.utils.TagUtil;' not in text:
              if anchor not in text: raise RuntimeError('TankModel TagUtil anchor missing')
              text = text.replace(anchor, 'import slimeknights.tconstruct.library.utils.TagUtil;\n' + anchor, 1)
          if text.count('if (stack.isEmpty() || !stack.hasTag()) {') != 1:
              raise RuntimeError('TankModel legacy tag guard changed unexpectedly')
          text = text.replace('if (stack.isEmpty() || !stack.hasTag()) {', 'if (stack.isEmpty() || !TagUtil.hasTag(stack)) {', 1)
          path.write_text(text, encoding='utf-8')

          path = Path('src/main/java/slimeknights/tconstruct/library/client/model/block/FluidTextureModel.java')
          text = path.read_text(encoding='utf-8')
          anchor = 'import slimeknights.tconstruct.library.client.model.ModelProperties;\n'
          if 'import slimeknights.tconstruct.library.utils.TagUtil;' not in text:
              if anchor not in text: raise RuntimeError('FluidTextureModel TagUtil anchor missing')
              text = text.replace(anchor, anchor + 'import slimeknights.tconstruct.library.utils.TagUtil;\n', 1)
          if text.count('if (stack.isEmpty() || !stack.hasTag()) {') != 1:
              raise RuntimeError('FluidTextureModel legacy tag guard changed unexpectedly')
          text = text.replace('if (stack.isEmpty() || !stack.hasTag()) {', 'if (stack.isEmpty() || !TagUtil.hasTag(stack)) {', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify model data cleanup
        shell: bash
        run: |
          grep -Fq 'ToolDataComponents.getTag(stack) == null' src/main/java/slimeknights/tconstruct/library/client/model/tools/MaterialBlockModel.java
          test "$(grep -F -c '!TagUtil.hasTag(stack)' src/main/java/slimeknights/tconstruct/library/client/model/tools/MaterialBlockModel.java)" -eq 2
          grep -Fq 'ammo = TagUtil.readItem' src/main/java/slimeknights/tconstruct/library/client/model/tools/ToolModel.java
          grep -Fq 'builder.add(ammo.getComponents());' src/main/java/slimeknights/tconstruct/library/client/model/tools/ToolModel.java
          grep -Fq 'NBTLoadable.ALLOW_STRING.convert' src/main/java/slimeknights/tconstruct/library/client/model/FluidContainerModel.java
          grep -Fq 'TagUtil.createFluidStack' src/main/java/slimeknights/tconstruct/library/client/model/FluidContainerModel.java
          grep -Fq 'createUnbakedItemElements(0, baseSprite)' src/main/java/slimeknights/tconstruct/library/client/model/FluidContainerModel.java
          grep -Fq 'createUnbakedItemMaskElements(1, spriteGetter.apply(context.getMaterial("fluid")))' src/main/java/slimeknights/tconstruct/library/client/model/FluidContainerModel.java
          grep -Fq '!TagUtil.hasTag(stack)' src/main/java/slimeknights/tconstruct/library/client/model/block/TankModel.java
          grep -Fq '!TagUtil.hasTag(stack)' src/main/java/slimeknights/tconstruct/library/client/model/block/FluidTextureModel.java
          ! grep -R -F 'stack.hasTag()' \
            src/main/java/slimeknights/tconstruct/library/client/model/tools/MaterialBlockModel.java \
            src/main/java/slimeknights/tconstruct/library/client/model/block/TankModel.java \
            src/main/java/slimeknights/tconstruct/library/client/model/block/FluidTextureModel.java
          git diff --check

      - name: Commit model data cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/main/java/slimeknights/tconstruct/library/client/model/tools/MaterialBlockModel.java \
            src/main/java/slimeknights/tconstruct/library/client/model/tools/ToolModel.java \
            src/main/java/slimeknights/tconstruct/library/client/model/FluidContainerModel.java \
            src/main/java/slimeknights/tconstruct/library/client/model/block/TankModel.java \
            src/main/java/slimeknights/tconstruct/library/client/model/block/FluidTextureModel.java
          git diff --cached --quiet || {
            git commit -m 'Port residual model data APIs to 1.21 components'
            git push origin HEAD:1.21.1-neoforge
          }

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --repo "$GITHUB_REPOSITORY" --ref 1.21.1-neoforge
