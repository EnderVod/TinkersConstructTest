name: Tinkers Front Blocker Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for active port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while gh run list --repo "$GITHUB_REPOSITORY" --workflow port-compile.yml --branch 1.21.1-neoforge --limit 20 --json status --jq '.[] | select(.status == "queued" or .status == "in_progress") | .status' | grep -q .; do
            sleep 15
          done

      - name: Checkout Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge

      - name: Migrate RegistryObject declarations to DeferredHolder
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('src/main/java')

          def replace_registry_types(text: str) -> str:
              token = 'RegistryObject<'
              pos = 0
              output = []
              while True:
                  idx = text.find(token, pos)
                  if idx < 0:
                      output.append(text[pos:])
                      break
                  output.append(text[pos:idx])
                  lt = idx + len('RegistryObject')
                  depth = 0
                  end = lt
                  while end < len(text):
                      char = text[end]
                      if char == '<':
                          depth += 1
                      elif char == '>':
                          depth -= 1
                          if depth == 0:
                              break
                      end += 1
                  if end >= len(text):
                      raise SystemExit('Unmatched RegistryObject generic in source')
                  inner = text[lt + 1:end].strip()
                  if inner.startswith('? extends '):
                      base = inner[len('? extends '):].strip()
                      replacement = f'DeferredHolder<{base}, ? extends {base}>'
                  else:
                      replacement = f'DeferredHolder<? super {inner}, {inner}>'
                  output.append(replacement)
                  pos = end + 1
              return ''.join(output)

          changed = []
          for path in root.rglob('*.java'):
              original = path.read_text(encoding='utf-8')
              if 'import net.neoforged.neoforge.registries.RegistryObject;' not in original:
                  continue

              text = replace_registry_types(original)
              text = text.replace(
                  'import net.neoforged.neoforge.registries.RegistryObject;',
                  'import net.neoforged.neoforge.registries.DeferredHolder;')

              # Two old aliases were manually created from existing registry IDs.
              if path.name == 'TinkerTools.java':
                  text = text.replace(
                      'RegistryObject.create(getResource("minotaur_axe"), ForgeRegistries.ITEMS)',
                      'DeferredHolder.create(Registries.ITEM, getResource("minotaur_axe"))')
                  if 'import net.minecraft.core.registries.Registries;' not in text:
                      marker = 'package slimeknights.tconstruct.tools;\n\n'
                      text = text.replace(marker, marker + 'import net.minecraft.core.registries.Registries;\n')

              if path.name == 'TinkerCommons.java':
                  text = text.replace(
                      'RegistryObject.create(glowBlock.getId(), ForgeRegistries.BLOCKS)',
                      'DeferredHolder.create(Registries.BLOCK, glowBlock.getId())')

              # Registry keys that have direct 1.21 equivalents.
              if path.name == 'TinkerStructures.java':
                  text = text.replace('ForgeRegistries.FEATURES', 'Registries.FEATURE')

              if path.name == 'TinkerWorld.java':
                  text = text.replace('ForgeRegistries.Keys.BIOME_MODIFIERS', 'NeoForgeRegistries.Keys.BIOME_MODIFIERS')
                  if 'import net.neoforged.neoforge.registries.NeoForgeRegistries;' not in text:
                      marker = 'import net.neoforged.neoforge.registries.DeferredHolder;\n'
                      text = text.replace(marker, marker + 'import net.neoforged.neoforge.registries.NeoForgeRegistries;\n')

              # Remove ForgeRegistries imports only when no true ForgeRegistries reference remains.
              remaining = text.replace('NeoForgeRegistries.', '')
              if 'ForgeRegistries.' not in remaining:
                  text = text.replace('import net.neoforged.neoforge.registries.ForgeRegistries;\n', '')

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print(f'Updated {len(changed)} Java files')
          for path in changed:
              print(path)
          PY

      - name: Verify registry migration
        run: |
          if grep -R "net.neoforged.neoforge.registries.RegistryObject\|RegistryObject.create" -n src/main/java; then
            echo 'Found stale RegistryObject references.'
            exit 1
          fi
          if grep -n "ForgeRegistries.FEATURES\|ForgeRegistries.Keys.BIOME_MODIFIERS" \
            src/main/java/slimeknights/tconstruct/world/TinkerStructures.java \
            src/main/java/slimeknights/tconstruct/world/TinkerWorld.java; then
            echo 'Found stale world registry keys.'
            exit 1
          fi

      - name: Commit targeted migration
        run: |
          if git diff --quiet; then
            echo 'No registry changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java
          git commit -m 'Migrate RegistryObject declarations to DeferredHolder'
          git push origin HEAD:1.21.1-neoforge

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --ref 1.21.1-neoforge
