name: Tinkers Front Blocker Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for active port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while gh run list --repo "$GITHUB_REPOSITORY" --workflow port-compile.yml --branch 1.21.1-neoforge --limit 20 --json status --jq '.[] | select(.status == "queued" or .status == "in_progress") | .status' | grep -q .; do
            sleep 15
          done

      - name: Checkout Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge

      - name: Migrate legacy network hooks
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('src/main/java/slimeknights/tconstruct')
          changed = []

          def edit(rel, replacements):
              path = root / rel
              original = path.read_text(encoding='utf-8')
              text = original
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'Missing expected source in {rel}: {old!r}')
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          edit('library/materials/MaterialRegistry.java', [
              ('import net.minecraftforge.network.PacketDistributor;\n', ''),
              ('import net.minecraftforge.network.PacketDistributor.PacketTarget;\n', ''),
              ('      PacketTarget target = PacketDistributor.PLAYER.with(() -> player);\n', ''),
              ('        network.send(target, packet);', '        network.sendTo(packet, player);'),
          ])

          edit('library/tools/IndestructibleItemEntity.java', [
              ('import net.minecraft.network.protocol.Packet;\n', ''),
              ('import net.minecraft.network.protocol.game.ClientGamePacketListener;\n', ''),
              ('import net.minecraftforge.network.NetworkHooks;\n', ''),
              ('\n  @Override\n  public Packet<ClientGamePacketListener> getAddEntityPacket() {\n    return NetworkHooks.getEntitySpawningPacket(this);\n  }\n', '\n'),
          ])

          edit('library/tools/capability/inventory/ToolInventoryCapability.java', [
              ('import net.minecraftforge.network.NetworkHooks;\n', ''),
              ('        NetworkHooks.openScreen(serverPlayer, new SimpleMenuProvider(', '        serverPlayer.openMenu(new SimpleMenuProvider('),
          ])

          print(f'Updated {len(changed)} network files')
          for path in changed:
              print(path)
          PY

      - name: Verify network hook migration
        run: |
          if grep -R "net.minecraftforge.network\|PacketDistributor.PLAYER\|NetworkHooks.openScreen\|NetworkHooks.getEntitySpawningPacket" -n \
            src/main/java/slimeknights/tconstruct/library/materials/MaterialRegistry.java \
            src/main/java/slimeknights/tconstruct/library/tools/IndestructibleItemEntity.java \
            src/main/java/slimeknights/tconstruct/library/tools/capability/inventory/ToolInventoryCapability.java; then
            echo 'Found stale legacy network APIs.'
            exit 1
          fi

      - name: Commit targeted migration
        run: |
          if git diff --quiet; then
            echo 'No network migration changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java
          git commit -m 'Migrate legacy network hooks to 1.21'
          git push origin HEAD:1.21.1-neoforge

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --ref 1.21.1-neoforge
