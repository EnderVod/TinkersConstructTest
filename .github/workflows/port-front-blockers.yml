name: Tinkers Front Blocker Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for active port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while gh run list --repo "$GITHUB_REPOSITORY" --workflow port-compile.yml --branch 1.21.1-neoforge --limit 20 --json status --jq '.[] | select(.status == "queued" or .status == "in_progress") | .status' | grep -q .; do
            sleep 15
          done

      - name: Checkout Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge

      - name: Migrate condition and loot codecs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          root = Path('src/main/java/slimeknights/tconstruct')
          replacements = {
              'common/json/ConfigEnabledCondition.java': '...TRUNCATED_BASE64_FOR_REWRITE...',
              'common/json/BlockOrEntityCondition.java': '',
              'library/json/loot/HasLootContextSetCondition.java': '',
              'library/json/condition/TagNotEmptyCondition.java': '...TRUNCATED_BASE64_FOR_REWRITE...',
              'library/json/condition/TagIntersectionPresentCondition.java': '',
              'library/json/condition/TagDifferencePresentCondition.java': '',
              'tools/modifiers/loot/HasModifierLootCondition.java': '...TRUNCATED_BASE64_FOR_REWRITE...',
              'tools/modifiers/loot/ChrysophiliteLootCondition.java': '...TRUNCATED_BASE64_FOR_REWRITE...',
          }

          for rel, encoded in replacements.items():
              path = root / rel
              path.write_text(base64.b64decode(encoded).decode('utf-8'), encoding='utf-8')
              print('Rewrote', path)

          commons = root / 'shared/TinkerCommons.java'
          text = commons.read_text(encoding='utf-8')
          if 'import com.mojang.serialization.MapCodec;' not in text:
              text = text.replace(
                  'package slimeknights.tconstruct.shared;\n\n',
                  'package slimeknights.tconstruct.shared;\n\nimport com.mojang.serialization.MapCodec;\n',
                  1)
          if 'import net.neoforged.neoforge.common.conditions.ICondition;' not in text:
              text = text.replace(
                  'import net.neoforged.neoforge.common.NeoForge;\n',
                  'import net.neoforged.neoforge.common.NeoForge;\nimport net.neoforged.neoforge.common.conditions.ICondition;\n',
                  1)

          if 'CONDITION_CODECS.register' not in text:
              marker = '  /* Loot conditions */\n'
              if marker not in text:
                  raise SystemExit('Missing loot-condition marker in TinkerCommons')
              resource_block = base64.b64decode('').decode('utf-8')
              text = text.replace(marker, resource_block + marker, 1)

          line_replacements = [
              ('  public static final DeferredHolder<? super LootItemConditionType, LootItemConditionType> lootConfig = LOOT_CONDITIONS.register(ConfigEnabledCondition.ID.getPath(), () -> new LootItemConditionType(ConfigEnabledCondition.SERIALIZER));', '  public static final DeferredHolder<? super LootItemConditionType, LootItemConditionType> lootConfig = LOOT_CONDITIONS.register(ConfigEnabledCondition.ID.getPath(), () -> new LootItemConditionType(ConfigEnabledCondition.CODEC));'),
              ('  public static final DeferredHolder<? super LootItemConditionType, LootItemConditionType> lootBlockOrEntity = LOOT_CONDITIONS.register("block_or_entity", () -> new LootItemConditionType(new BlockOrEntityCondition.ConditionSerializer()));', '  public static final DeferredHolder<? super LootItemConditionType, LootItemConditionType> lootBlockOrEntity = LOOT_CONDITIONS.register("block_or_entity", () -> new LootItemConditionType(BlockOrEntityCondition.CODEC));'),
              ('  public static final DeferredHolder<? super LootItemConditionType, LootItemConditionType> hasLootContextSet = LOOT_CONDITIONS.register("has_context_set", () -> new LootItemConditionType(new HasLootContextSetCondition.Serializer()));', '  public static final DeferredHolder<? super LootItemConditionType, LootItemConditionType> hasLootContextSet = LOOT_CONDITIONS.register("has_context_set", () -> new LootItemConditionType(HasLootContextSetCondition.CODEC));'),
              ('  public static final DeferredHolder<? super LootItemConditionType, LootItemConditionType> lootTagNotEmptyCondition = LOOT_CONDITIONS.register("tag_not_empty", () -> new LootItemConditionType(new TagNotEmptyCondition.ConditionSerializer()));', '  public static final DeferredHolder<? super LootItemConditionType, LootItemConditionType> lootTagNotEmptyCondition = LOOT_CONDITIONS.register("tag_not_empty", () -> new LootItemConditionType(TagNotEmptyCondition.CODEC));'),
          ]
          for old, new in line_replacements:
              if old not in text:
                  raise SystemExit('Missing expected TinkerCommons line: ' + old)
              text = text.replace(old, new, 1)

          stale_lines = [
              '      CraftingHelper.register(ConfigEnabledCondition.SERIALIZER);\n',
              '      CraftingHelper.register(TagIntersectionPresentCondition.SERIALIZER);\n',
              '      CraftingHelper.register(TagDifferencePresentCondition.SERIALIZER);\n',
              '      CraftingHelper.register(new TagNotEmptyCondition.ConditionSerializer());\n',
          ]
          for stale in stale_lines:
              if stale not in text:
                  raise SystemExit('Missing expected stale condition registration: ' + stale.strip())
              text = text.replace(stale, '', 1)
          commons.write_text(text, encoding='utf-8')

          modifiers = root / 'tools/TinkerModifiers.java'
          text = modifiers.read_text(encoding='utf-8')
          line_replacements = [
              (
                  '  public static final DeferredHolder<? super LootItemConditionType, LootItemConditionType> hasModifierLootCondition = LOOT_CONDITIONS.register("has_modifier", () -> new LootItemConditionType(new HasModifierLootCondition.ConditionSerializer()));',
                  '  public static final DeferredHolder<? super LootItemConditionType, LootItemConditionType> hasModifierLootCondition = LOOT_CONDITIONS.register("has_modifier", () -> new LootItemConditionType(HasModifierLootCondition.CODEC));'
              ),
              (
                  '  public static final DeferredHolder<? super LootItemConditionType, LootItemConditionType> chrysophiliteLootCondition = LOOT_CONDITIONS.register("has_chrysophilite", () -> new LootItemConditionType(ChrysophiliteLootCondition.SERIALIZER));',
                  '  public static final DeferredHolder<? super LootItemConditionType, LootItemConditionType> chrysophiliteLootCondition = LOOT_CONDITIONS.register("has_chrysophilite", () -> new LootItemConditionType(ChrysophiliteLootCondition.CODEC));'
              ),
          ]
          for old, new in line_replacements:
              if old not in text:
                  raise SystemExit('Missing expected TinkerModifiers line: ' + old)
              text = text.replace(old, new, 1)
          modifiers.write_text(text, encoding='utf-8')
          PY

      - name: Verify condition codec migration
        run: |
          if grep -R "IConditionSerializer\|world.level.storage.loot.Serializer\|ConfigEnabledCondition.SERIALIZER\|TagIntersectionPresentCondition.SERIALIZER\|TagDifferencePresentCondition.SERIALIZER\|ConditionSerializer()\|ChrysophiliteLootCondition.SERIALIZER" -n             src/main/java/slimeknights/tconstruct/common/json             src/main/java/slimeknights/tconstruct/library/json/condition             src/main/java/slimeknights/tconstruct/library/json/loot/HasLootContextSetCondition.java             src/main/java/slimeknights/tconstruct/tools/modifiers/loot             src/main/java/slimeknights/tconstruct/shared/TinkerCommons.java             src/main/java/slimeknights/tconstruct/tools/TinkerModifiers.java; then
            echo 'Found stale condition/loot serializer APIs.'
            exit 1
          fi
          grep -q "CONDITION_CODECS.register" src/main/java/slimeknights/tconstruct/shared/TinkerCommons.java
          grep -q "LootItemConditionType(ConfigEnabledCondition.CODEC)" src/main/java/slimeknights/tconstruct/shared/TinkerCommons.java

      - name: Commit targeted migration
        run: |
          if git diff --quiet; then
            echo 'No condition codec migration changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java
          git commit -m 'Migrate conditions and loot codecs to 1.21'
          git push origin HEAD:1.21.1-neoforge

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --ref 1.21.1-neoforge
