name: Tinkers Combat Fishing Hook Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout latest Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Port combat fishing hook to 1.21
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          hook = Path('src/main/java/slimeknights/tconstruct/tools/entity/CombatFishingHook.java')
          text = hook.read_text(encoding='utf-8')

          anchor = 'import net.minecraft.server.level.ServerPlayer;\n'
          if text.count(anchor) != 1:
              raise RuntimeError('CombatFishingHook ServerPlayer import anchor changed')
          if 'import net.minecraft.server.level.ServerLevel;\n' not in text:
              text = text.replace(anchor, 'import net.minecraft.server.level.ServerLevel;\n' + anchor, 1)
          anchor = 'import net.minecraft.world.entity.ai.attributes.AttributeInstance;\n'
          if text.count(anchor) != 1:
              raise RuntimeError('CombatFishingHook AttributeInstance import anchor changed')
          if 'import net.minecraft.world.entity.ai.attributes.Attributes;\n' not in text:
              text = text.replace(anchor, anchor + 'import net.minecraft.world.entity.ai.attributes.Attributes;\n', 1)

          old = ('  @Override\n'
                 '  protected void defineSynchedData() {\n'
                 '    super.defineSynchedData();\n'
                 '    this.entityData.define(GRAPPLE, (byte) GrappleType.NONE.ordinal());\n'
                 '    this.entityData.define(COLLECTING, false);\n'
                 '    this.entityData.define(MATERIAL, MaterialId.UNKNOWN);\n'
                 '  }')
          new = ('  @Override\n'
                 '  protected void defineSynchedData(SynchedEntityData.Builder builder) {\n'
                 '    super.defineSynchedData(builder);\n'
                 '    builder.define(GRAPPLE, (byte) GrappleType.NONE.ordinal());\n'
                 '    builder.define(COLLECTING, false);\n'
                 '    builder.define(MATERIAL, MaterialId.UNKNOWN);\n'
                 '  }')
          if text.count(old) != 1:
              raise RuntimeError('CombatFishingHook synced-data block changed')
          text = text.replace(old, new, 1)

          old = ('            if (targetLiving != null) {\n'
                 '              EnchantmentHelper.doPostHurtEffects(targetLiving, owner);\n'
                 '            }')
          new = ('            if (targetLiving != null && this.level() instanceof ServerLevel serverLevel) {\n'
                 '              EnchantmentHelper.doPostAttackEffectsWithItemSource(serverLevel, targetLiving, source, null);\n'
                 '            }')
          if text.count(old) != 1:
              raise RuntimeError('CombatFishingHook legacy post-hurt enchantment block changed')
          text = text.replace(old, new, 1)

          if text.count('      player.startAutoSpinAttack(20);') != 1:
              raise RuntimeError('CombatFishingHook old auto-spin call changed')
          text = text.replace(
              '      player.startAutoSpinAttack(20);',
              '      player.startAutoSpinAttack(20, (float) player.getAttributeValue(Attributes.ATTACK_DAMAGE), player.getWeaponItem());',
              1)
          hook.write_text(text, encoding='utf-8')

          at = Path('src/main/resources/META-INF/accesstransformer.cfg')
          text = at.read_text(encoding='utf-8')
          old = 'protected net.minecraft.world.entity.projectile.FishingHook f_37103_ # life'
          new = 'protected net.minecraft.world.entity.projectile.FishingHook life'
          if text.count(old) != 1:
              raise RuntimeError(f'FishingHook life AT changed; expected legacy line once, got {text.count(old)}')
          at.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify combat fishing hook migration
        shell: bash
        run: |
          grep -Fq 'defineSynchedData(SynchedEntityData.Builder builder)' src/main/java/slimeknights/tconstruct/tools/entity/CombatFishingHook.java
          grep -Fq 'super.defineSynchedData(builder);' src/main/java/slimeknights/tconstruct/tools/entity/CombatFishingHook.java
          grep -Fq 'EnchantmentHelper.doPostAttackEffectsWithItemSource(serverLevel, targetLiving, source, null);' src/main/java/slimeknights/tconstruct/tools/entity/CombatFishingHook.java
          grep -Fq 'startAutoSpinAttack(20, (float) player.getAttributeValue(Attributes.ATTACK_DAMAGE), player.getWeaponItem())' src/main/java/slimeknights/tconstruct/tools/entity/CombatFishingHook.java
          grep -Fq 'protected net.minecraft.world.entity.projectile.FishingHook life' src/main/resources/META-INF/accesstransformer.cfg
          ! grep -Fq 'doPostHurtEffects' src/main/java/slimeknights/tconstruct/tools/entity/CombatFishingHook.java
          ! grep -Fq 'FishingHook f_37103_' src/main/resources/META-INF/accesstransformer.cfg
          git diff --check

      - name: Commit combat fishing hook migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/slimeknights/tconstruct/tools/entity/CombatFishingHook.java src/main/resources/META-INF/accesstransformer.cfg
          git commit -m 'Port combat fishing hook to 1.21'
          git push origin HEAD:1.21.1-neoforge

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --ref 1.21.1-neoforge
