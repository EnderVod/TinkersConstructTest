name: Tinkers Front Blocker Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout latest Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Migrate legacy block signatures
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('src/main/java/slimeknights/tconstruct')

          # 1.21 pick-block API no longer receives hit/player and now requires LevelReader.
          clone_files = [
            'smeltery/block/CastingTankBlock.java',
            'smeltery/block/SearedLanternBlock.java',
            'smeltery/block/component/RetexturedOrientableSmelteryBlock.java',
            'smeltery/block/component/SearedDuctBlock.java',
            'smeltery/block/component/SearedTankBlock.java',
            'smeltery/block/controller/HeatingControllerBlock.java',
            'tables/block/RetexturedTableBlock.java',
            'tables/block/TinkersChestBlock.java',
          ]
          old_clone = 'public ItemStack getCloneItemStack(BlockState state, HitResult target, BlockGetter world, BlockPos pos, Player player)'
          new_clone = 'public ItemStack getCloneItemStack(net.minecraft.world.level.LevelReader world, BlockPos pos, BlockState state)'
          for rel in clone_files:
            p = root / rel
            s = p.read_text()
            if s.count(old_clone) != 1:
              raise SystemExit(f'{rel}: expected one legacy clone signature')
            p.write_text(s.replace(old_clone, new_clone))

          # One client call site still invokes the removed five-argument pick-block hook.
          p = root / 'tables/client/inventory/widget/TinkerTabsWidget.java'
          s = p.read_text()
          old = 'state.getBlock().getCloneItemStack(state, null, level, blockPos, minecraft.player)'
          if s.count(old) != 1:
            raise SystemExit('unexpected TinkerTabsWidget clone call')
          p.write_text(s.replace(old, 'state.getBlock().getCloneItemStack(level, blockPos, state)'))

          # Block tooltip context changed from BlockGetter to Item.TooltipContext.
          tooltip_files = [
            'smeltery/block/component/RetexturedOrientableSmelteryBlock.java',
            'smeltery/block/component/SearedDuctBlock.java',
            'smeltery/block/controller/HeatingControllerBlock.java',
            'tables/block/RetexturedTableBlock.java',
          ]
          for rel in tooltip_files:
            p = root / rel
            s = p.read_text()
            s2, n = re.subn(
              r'appendHoverText\(ItemStack stack, @Nullable BlockGetter pLevel, List<Component> tooltip, TooltipFlag (pFlag|flag)\)',
              lambda m: f'appendHoverText(ItemStack stack, net.minecraft.world.item.Item.TooltipContext context, List<Component> tooltip, TooltipFlag {m.group(1)})',
              s)
            if n != 1:
              raise SystemExit(f'{rel}: expected one legacy tooltip signature, got {n}')
            p.write_text(s2)

          # The old four-argument block pathfinding override was removed in vanilla 1.21.
          path_files = [
            'smeltery/block/FaucetBlock.java',
            'smeltery/block/ChannelBlock.java',
            'smeltery/block/component/SearedSoulGlassBlock.java',
            'shared/block/TableBlock.java',
            'shared/block/SoulGlassBlock.java',
            'shared/block/SlimesteelBlock.java',
            'world/block/CongealedSlimeBlock.java',
          ]
          path_pattern = re.compile(r'\n(?:  @SuppressWarnings\("deprecation"\)\n)?(?:  @Deprecated\n)?  @Override\n  public boolean isPathfindable\(BlockState [^\n]+\) \{\n    return false;\n  \}\n')
          for rel in path_files:
            p = root / rel
            s2, n = path_pattern.subn('\n', p.read_text())
            if n != 1:
              raise SystemExit(f'{rel}: expected one legacy pathfinding override, got {n}')
            p.write_text(s2)

          # Tank block item data moved to CUSTOM_DATA components.
          for rel in ['smeltery/block/component/SearedTankBlock.java', 'smeltery/block/CastingTankBlock.java', 'smeltery/block/SearedLanternBlock.java']:
            p = root / rel
            s = p.read_text()
            old = 'CompoundTag nbt = stack.getTag();'
            if s.count(old) != 1:
              raise SystemExit(f'{rel}: expected one legacy stack tag read')
            p.write_text(s.replace(old, 'CompoundTag nbt = slimeknights.tconstruct.library.utils.TagUtil.getTag(stack);'))

          # Same component transition for the heating controller texture marker.
          p = root / 'smeltery/block/controller/HeatingControllerBlock.java'
          s = p.read_text()
          if s.count('if (stack.hasTag()) {') != 1:
            raise SystemExit('unexpected heating controller tag check')
          p.write_text(s.replace('if (stack.hasTag()) {', 'if (slimeknights.tconstruct.library.utils.TagUtil.hasTag(stack)) {'))
          PY

      - name: Verify migration
        shell: bash
        run: |
          ! grep -R -Fq 'getCloneItemStack(BlockState state, HitResult target, BlockGetter world, BlockPos pos, Player player)' src/main/java/slimeknights/tconstruct
          ! grep -R -Fq 'appendHoverText(ItemStack stack, @Nullable BlockGetter' src/main/java/slimeknights/tconstruct
          ! grep -R -Fq 'public boolean isPathfindable(BlockState' src/main/java/slimeknights/tconstruct
          grep -Fq 'getCloneItemStack(level, blockPos, state)' src/main/java/slimeknights/tconstruct/tables/client/inventory/widget/TinkerTabsWidget.java
          grep -Fq 'TagUtil.getTag(stack)' src/main/java/slimeknights/tconstruct/smeltery/block/component/SearedTankBlock.java
          git diff --check

      - name: Commit signature migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java
          git diff --cached --quiet || {
            git commit -m 'Migrate legacy block signatures to 1.21'
            git push origin HEAD:1.21.1-neoforge
          }

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --repo "$GITHUB_REPOSITORY" --ref 1.21.1-neoforge
