          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Missing expected registration in {path}: {old}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace('src/main/java/slimeknights/tconstruct/tools/TinkerTools.java',
                  'new LootItemFunctionType(AddToolDataFunction.SERIALIZER)',
                  'new LootItemFunctionType<>(AddToolDataFunction.CODEC)')
          replace('src/main/java/slimeknights/tconstruct/tools/TinkerToolParts.java',
                  'new LootPoolEntryType(new ToolPartLootEntry.Serializer())',
                  'new LootPoolEntryType(ToolPartLootEntry.CODEC)')
          replace('src/main/java/slimeknights/tconstruct/tools/TinkerModifiers.java',
                  'new LootItemFunctionType(new ModifierBonusLootFunction.Serializer())',
                  'new LootItemFunctionType<>(ModifierBonusLootFunction.CODEC)')
          replace('src/main/java/slimeknights/tconstruct/tools/TinkerModifiers.java',
                  'new LootItemFunctionType(ChrysophiliteBonusFunction.SERIALIZER)',
                  'new LootItemFunctionType<>(ChrysophiliteBonusFunction.CODEC)')
          PY

      - name: Verify final loot migration
        shell: bash
        run: |
          test -z "$(grep -R -E 'LootItemConditionalFunction\.Serializer|LootPoolSingletonContainer\.Serializer|FormulaDeserializer' \
            src/main/java/slimeknights/tconstruct/library/json/loot/AddToolDataFunction.java \
            src/main/java/slimeknights/tconstruct/library/json/loot/ToolPartLootEntry.java \
            src/main/java/slimeknights/tconstruct/tools/modifiers/loot/ModifierBonusLootFunction.java \
            src/main/java/slimeknights/tconstruct/tools/modifiers/loot/ChrysophiliteBonusFunction.java || true)"
          grep -Fq 'MapCodec<AddToolDataFunction>' src/main/java/slimeknights/tconstruct/library/json/loot/AddToolDataFunction.java
          grep -Fq 'MapCodec<ToolPartLootEntry>' src/main/java/slimeknights/tconstruct/library/json/loot/ToolPartLootEntry.java
          grep -Fq 'BonusFormula.CODEC' src/main/java/slimeknights/tconstruct/tools/modifiers/loot/ModifierBonusLootFunction.java
          grep -Fq 'ModifierBonusLootFunction.CODEC' src/main/java/slimeknights/tconstruct/tools/TinkerModifiers.java

      - name: Commit final loot migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/slimeknights/tconstruct/library/json/loot/LootCodecs.java \
                  src/main/java/slimeknights/tconstruct/library/json/loot/AddToolDataFunction.java \
                  src/main/java/slimeknights/tconstruct/library/json/loot/ToolPartLootEntry.java \
                  src/main/java/slimeknights/tconstruct/tools/modifiers/loot/BonusFormula.java \
                  src/main/java/slimeknights/tconstruct/tools/modifiers/loot/ModifierBonusLootFunction.java \
                  src/main/java/slimeknights/tconstruct/tools/modifiers/loot/ChrysophiliteBonusFunction.java \
                  src/main/java/slimeknights/tconstruct/tools/TinkerTools.java \
                  src/main/java/slimeknights/tconstruct/tools/TinkerToolParts.java \
                  src/main/java/slimeknights/tconstruct/tools/TinkerModifiers.java
          git diff --cached --quiet && exit 0
          git commit -m 'Migrate Tinkers loot serializers to 1.21 codecs'
          git push origin HEAD:1.21.1-neoforge

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --repo "$GITHUB_REPOSITORY" --ref 1.21.1-neoforge
