name: Tinkers Front Blocker Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout latest Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Apply guarded mechanical compatibility batch
        run: python3 .github/scripts/port-smeltery-batch.py

      - name: Verify migration
        shell: bash
        run: |
          grep -Fq '.builtInRegistryHolder().is(tag)' src/main/java/slimeknights/tconstruct/library/tools/nbt/IToolContext.java
          grep -Fq 'StreamSupport.stream(BuiltInRegistries.BLOCK.getTagOrEmpty(tag).spliterator(), false)' src/main/java/slimeknights/tconstruct/library/recipe/ingredient/BlockTagIngredient.java
          grep -Fq 'ResourceLocation.withDefaultNamespace("missingno")' src/main/java/slimeknights/tconstruct/library/recipe/material/MaterialRecipe.java
          ! grep -R -Fq 'ItemHandlerHelper.copyStackWithSize' src/main/java/slimeknights/tconstruct/library/tools/capability/inventory src/main/java/slimeknights/tconstruct/library/recipe/material/MaterialRecipe.java
          grep -Fq 'TagUtil.readItem(compound)' src/main/java/slimeknights/tconstruct/library/tools/capability/inventory/InventoryModule.java
          grep -Fq 'ItemStack.OPTIONAL_STREAM_CODEC.encode(buf, stack)' src/main/java/slimeknights/tconstruct/library/tools/capability/inventory/ToolInventoryCapability.java
          ! grep -R -E 'new FluidStack\((resource|drained|current),' src/main/java/slimeknights/tconstruct/library/tools/capability/fluid
          grep -Fq 'FluidStack.STREAM_CODEC' src/main/java/slimeknights/tconstruct/tools/network/FluidDataSerializer.java
          grep -Fq 'TagUtil.hasTag(tool)' src/main/java/slimeknights/tconstruct/library/tools/definition/module/mining/MiningSpeedToolHook.java
          grep -Fq 'InteractionSource.ARMOR' src/main/java/slimeknights/tconstruct/library/modifiers/hook/interaction/InteractionSource.java
          grep -Fq 'Attributes.ATTACK_DAMAGE.value()' src/main/java/slimeknights/tconstruct/library/tools/context/ToolAttackContext.java
          git diff --check

      - name: Commit compatibility batch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java
          git diff --cached --quiet || {
            git commit -m 'Migrate mechanical tool and recipe APIs to 1.21'
            git push origin HEAD:1.21.1-neoforge
          }

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --repo "$GITHUB_REPOSITORY" --ref 1.21.1-neoforge
