name: Tinkers Front Blocker Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout latest Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Port modifiable crossbow to 1.21 APIs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main/java/slimeknights/tconstruct/library/tools/item/ranged/ModifiableCrossbowItem.java')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          safe_import = 'import slimeknights.mantle.client.SafeClientAccess;\n'
          if safe_import not in text:
              replace_once(
                  'import slimeknights.mantle.client.TooltipKey;\n',
                  safe_import + 'import slimeknights.mantle.client.TooltipKey;\n',
                  'SafeClientAccess import')

          replace_once(
              'persistentData.put(KEY_DRAWBACK_AMMO, ammo.save(new CompoundTag()));',
              'persistentData.put(KEY_DRAWBACK_AMMO, ammo.save(level.registryAccess()));',
              'drawback ammo serialization')
          replace_once(
              'ItemStack ammo = ItemStack.of(heldAmmo);',
              'ItemStack ammo = ItemStack.parseOptional(level.registryAccess(), heldAmmo);',
              'loaded ammo parsing')
          replace_once(
              'arrow = arrowItem.createArrow(level, ammo, living);',
              'arrow = arrowItem.createArrow(level, ammo, living, living.getItemInHand(hand));',
              'arrow creation')
          replace_once(
              '          arrow.setShotFromCrossbow(true);\n',
              '',
              'removed crossbow arrow setter')
          replace_once(
              'int duration = getUseDuration(bow);',
              'int duration = getUseDuration(bow, living);',
              'release duration')
          replace_once(
              'getUseDuration(bow) - chargeRemaining',
              'getUseDuration(bow, living) - chargeRemaining',
              'charge duration')
          replace_once(
              'CompoundTag ammoNBT = ammo.save(new CompoundTag());',
              '''Tag encodedAmmo = ammo.save(level.registryAccess());\n        if (!(encodedAmmo instanceof CompoundTag ammoNBT)) {\n          return;\n        }''',
              'charged ammo serialization')
          replace_once(
              'ItemStack heldStack = ItemStack.of(heldAmmo);',
              '''var registryAccess = player == null ? SafeClientAccess.getRegistryAccess() : player.level().registryAccess();\n      ItemStack heldStack = registryAccess == null ? ItemStack.EMPTY : ItemStack.parseOptional(registryAccess, heldAmmo);''',
              'tooltip ammo parsing')
          replace_once(
              'heldStack.getItem().appendHoverText(heldStack, player.level(), nestedTooltip, tooltipFlag);',
              'heldStack.getItem().appendHoverText(heldStack, net.minecraft.world.item.Item.TooltipContext.of(player.level()), nestedTooltip, tooltipFlag);',
              'tooltip context')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify crossbow migration
        shell: bash
        run: |
          FILE=src/main/java/slimeknights/tconstruct/library/tools/item/ranged/ModifiableCrossbowItem.java
          grep -Fq 'ammo.save(level.registryAccess())' "$FILE"
          grep -Fq 'ItemStack.parseOptional(level.registryAccess(), heldAmmo)' "$FILE"
          grep -Fq 'arrowItem.createArrow(level, ammo, living, living.getItemInHand(hand))' "$FILE"
          grep -Fq 'getUseDuration(bow, living)' "$FILE"
          grep -Fq 'SafeClientAccess.getRegistryAccess()' "$FILE"
          grep -Fq 'Item.TooltipContext.of(player.level())' "$FILE"
          ! grep -Fq 'ItemStack.of(heldAmmo)' "$FILE"
          ! grep -Fq 'setShotFromCrossbow' "$FILE"
          ! grep -Fq 'ammo.save(new CompoundTag())' "$FILE"
          ! grep -Fq 'getUseDuration(bow)' "$FILE"
          git diff --check

      - name: Commit crossbow migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/slimeknights/tconstruct/library/tools/item/ranged/ModifiableCrossbowItem.java
          git diff --cached --quiet || {
            git commit -m 'Port modifiable crossbow to 1.21 item stack APIs'
            git push origin HEAD:1.21.1-neoforge
          }

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --repo "$GITHUB_REPOSITORY" --ref 1.21.1-neoforge
