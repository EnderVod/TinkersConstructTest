name: Tinkers Recipe Data Cleanup

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout latest Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Port remaining recipe display data to 1.21 components
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Casting display tools still use Tinkers' TOOL_DATA component; migrate the old mutable NBT idiom.
          path = Path('src/main/java/slimeknights/tconstruct/library/recipe/casting/material/PartSwapCastingRecipe.java')
          text = path.read_text(encoding='utf-8')
          if 'import slimeknights.tconstruct.library.tools.nbt.ToolDataComponents;' not in text:
              anchor = 'import slimeknights.tconstruct.library.tools.nbt.ToolStack;\n'
              if anchor not in text:
                  raise RuntimeError('PartSwapCastingRecipe import anchor missing')
              text = text.replace(anchor, 'import slimeknights.tconstruct.library.tools.nbt.ToolDataComponents;\n' + anchor, 1)
          old = '                  input.getOrCreateTag().putBoolean(TooltipUtil.KEY_DISPLAY, true);'
          new = '                  ToolDataComponents.update(input, tag -> tag.putBoolean(TooltipUtil.KEY_DISPLAY, true));'
          if old in text:
              text = text.replace(old, new, 1)
          elif 'input.getOrCreateTag()' in text:
              raise RuntimeError('Unexpected PartSwapCastingRecipe display tag shape')
          path.write_text(text, encoding='utf-8')

          path = Path('src/main/java/slimeknights/tconstruct/library/recipe/casting/material/ToolCastingRecipe.java')
          text = path.read_text(encoding='utf-8')
          if 'import slimeknights.tconstruct.library.tools.nbt.ToolDataComponents;' not in text:
              anchor = 'import slimeknights.tconstruct.library.tools.nbt.MaterialNBT;\n'
              if anchor not in text:
                  raise RuntimeError('ToolCastingRecipe import anchor missing')
              text = text.replace(anchor, anchor + 'import slimeknights.tconstruct.library.tools.nbt.ToolDataComponents;\n', 1)
          old = '        partSwapDisplay.getOrCreateTag().putBoolean(TooltipUtil.KEY_DISPLAY, true);'
          new = '        ToolDataComponents.update(partSwapDisplay, tag -> tag.putBoolean(TooltipUtil.KEY_DISPLAY, true));'
          if old in text:
              text = text.replace(old, new, 1)
          elif 'partSwapDisplay.getOrCreateTag()' in text:
              raise RuntimeError('Unexpected ToolCastingRecipe display tag shape')
          path.write_text(text, encoding='utf-8')

          path = Path('src/main/java/slimeknights/tconstruct/tables/recipe/PartBuilderToolRecycle.java')
          text = path.read_text(encoding='utf-8')
          if 'import net.minecraft.core.HolderLookup;' not in text:
              anchor = 'import net.minecraft.core.RegistryAccess;\n'
              if anchor not in text:
                  raise RuntimeError('PartBuilderToolRecycle RegistryAccess import missing')
              text = text.replace(anchor, 'import net.minecraft.core.HolderLookup;\n' + anchor, 1)
          if 'import slimeknights.tconstruct.library.tools.nbt.ToolDataComponents;' not in text:
              anchor = 'import slimeknights.tconstruct.library.tools.nbt.ToolStack;\n'
              if anchor not in text:
                  raise RuntimeError('PartBuilderToolRecycle ToolStack import missing')
              text = text.replace(anchor, 'import slimeknights.tconstruct.library.tools.nbt.ToolDataComponents;\n' + anchor, 1)
          replacements = [
              ('public ItemStack getResultItem(RegistryAccess access) {',
               'public ItemStack getResultItem(HolderLookup.Provider access) {',
               'Part Builder result provider'),
              ('      part.getOrCreateTag().putBoolean(TooltipUtil.KEY_DISPLAY, true);',
               '      ToolDataComponents.update(part, tag -> tag.putBoolean(TooltipUtil.KEY_DISPLAY, true));',
               'Part Builder display marker'),
              ('      json.add("pattern", pattern.toJson());',
               '      json.add("pattern", IngredientLoadable.DISALLOW_EMPTY.serialize(pattern));',
               'Part Builder ingredient serialization'),
          ]
          for old, new, label in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise RuntimeError(f'{label}: neither old nor new form found')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify recipe data cleanup
        shell: bash
        run: |
          PART_SWAP=src/main/java/slimeknights/tconstruct/library/recipe/casting/material/PartSwapCastingRecipe.java
          TOOL_CAST=src/main/java/slimeknights/tconstruct/library/recipe/casting/material/ToolCastingRecipe.java
          RECYCLE=src/main/java/slimeknights/tconstruct/tables/recipe/PartBuilderToolRecycle.java
          grep -Fq 'ToolDataComponents.update(input, tag -> tag.putBoolean(TooltipUtil.KEY_DISPLAY, true));' "$PART_SWAP"
          grep -Fq 'ToolDataComponents.update(partSwapDisplay, tag -> tag.putBoolean(TooltipUtil.KEY_DISPLAY, true));' "$TOOL_CAST"
          grep -Fq 'getResultItem(HolderLookup.Provider access)' "$RECYCLE"
          grep -Fq 'ToolDataComponents.update(part, tag -> tag.putBoolean(TooltipUtil.KEY_DISPLAY, true));' "$RECYCLE"
          grep -Fq 'IngredientLoadable.DISALLOW_EMPTY.serialize(pattern)' "$RECYCLE"
          ! grep -Fq 'getOrCreateTag()' "$PART_SWAP"
          ! grep -Fq 'getOrCreateTag()' "$TOOL_CAST"
          ! grep -Fq 'pattern.toJson()' "$RECYCLE"
          git diff --check

      - name: Commit recipe data cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/main/java/slimeknights/tconstruct/library/recipe/casting/material/PartSwapCastingRecipe.java \
            src/main/java/slimeknights/tconstruct/library/recipe/casting/material/ToolCastingRecipe.java \
            src/main/java/slimeknights/tconstruct/tables/recipe/PartBuilderToolRecycle.java
          git diff --cached --quiet || {
            git commit -m 'Port remaining recipe display data to 1.21 components'
            git push origin HEAD:1.21.1-neoforge
          }

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --repo "$GITHUB_REPOSITORY" --ref 1.21.1-neoforge
