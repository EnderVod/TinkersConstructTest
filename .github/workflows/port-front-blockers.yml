name: Tinkers Front Blocker Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout latest Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Apply remaining duct and menu fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/main/java/slimeknights/tconstruct/TConstruct.java')
          s = p.read_text()
          anchor = '    event.registerBlockEntity(Capabilities.FluidHandler.BLOCK, TinkerSmeltery.duct.get(), (io, side) -> io.getHandler(side));\n'
          addition = '    event.registerBlockEntity(Capabilities.ItemHandler.BLOCK, TinkerSmeltery.duct.get(), (duct, side) -> duct.getItemHandler());\n'
          if s.count(anchor) != 1 or addition in s:
            raise SystemExit('unexpected duct registration state')
          p.write_text(s.replace(anchor, anchor + addition))

          p = Path('src/main/java/slimeknights/tconstruct/tools/ToolClientEvents.java')
          s = p.read_text()
          old_import = 'import net.minecraft.client.gui.screens.MenuScreens;\n'
          event_import = 'import net.neoforged.neoforge.client.event.RegisterMenuScreensEvent;\n'
          key_import = 'import net.neoforged.neoforge.client.event.RegisterKeyMappingsEvent;\n'
          if s.count(old_import) != 1 or s.count(key_import) != 1 or event_import in s:
            raise SystemExit('unexpected tool menu import state')
          s = s.replace(old_import, '')
          s = s.replace(key_import, key_import + event_import)
          old_screen = '      // screens\n      MenuScreens.register(TinkerTools.toolContainer.get(), ToolContainerScreen::new);\n\n'
          if s.count(old_screen) != 1:
            raise SystemExit('tool menu registration not found exactly once')
          s = s.replace(old_screen, '')
          method_anchor = '  @SubscribeEvent\n  static void clientSetupEvent(FMLClientSetupEvent event) {\n'
          method = '  @SubscribeEvent\n  static void registerScreens(RegisterMenuScreensEvent event) {\n    event.register(TinkerTools.toolContainer.get(), ToolContainerScreen::new);\n  }\n\n'
          if s.count(method_anchor) != 1:
            raise SystemExit('tool client setup anchor not found exactly once')
          p.write_text(s.replace(method_anchor, method + method_anchor))
          PY

      - name: Verify migration
        shell: bash
        run: |
          grep -Fq 'Capabilities.ItemHandler.BLOCK, TinkerSmeltery.duct.get()' src/main/java/slimeknights/tconstruct/TConstruct.java
          ! grep -Fq 'MenuScreens.register' src/main/java/slimeknights/tconstruct/tools/ToolClientEvents.java
          grep -Fq 'RegisterMenuScreensEvent event' src/main/java/slimeknights/tconstruct/tools/ToolClientEvents.java
          git diff --check

      - name: Commit migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/slimeknights/tconstruct/TConstruct.java src/main/java/slimeknights/tconstruct/tools/ToolClientEvents.java
          git diff --cached --quiet || {
            git commit -m 'Expose duct item handler and migrate tool menu screen'
            git push origin HEAD:1.21.1-neoforge
          }

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --repo "$GITHUB_REPOSITORY" --ref 1.21.1-neoforge
