name: Tinkers Front Blocker Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for active port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while gh run list --repo "$GITHUB_REPOSITORY" --workflow port-compile.yml --branch 1.21.1-neoforge --limit 30 --json status --jq '.[] | select(.status == "queued" or .status == "in_progress") | .status' | grep -q .; do
            sleep 15
          done

      - name: Checkout Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge

      - name: Migrate deprecated tag preference loot entry to codec
        run: |
          cat > src/main/java/slimeknights/tconstruct/library/json/loot/TagPreferenceLootEntry.java <<'JAVA'
          package slimeknights.tconstruct.library.json.loot;

          import com.mojang.serialization.MapCodec;
          import com.mojang.serialization.codecs.RecordCodecBuilder;
          import net.minecraft.core.registries.Registries;
          import net.minecraft.tags.TagKey;
          import net.minecraft.world.item.Item;
          import net.minecraft.world.item.ItemStack;
          import net.minecraft.world.level.storage.loot.LootContext;
          import net.minecraft.world.level.storage.loot.entries.LootPoolEntryType;
          import net.minecraft.world.level.storage.loot.entries.LootPoolSingletonContainer;
          import net.minecraft.world.level.storage.loot.functions.LootItemFunction;
          import net.minecraft.world.level.storage.loot.predicates.LootItemCondition;
          import slimeknights.mantle.recipe.helper.TagPreference;
          import slimeknights.tconstruct.shared.TinkerCommons;

          import java.util.List;
          import java.util.function.Consumer;

          /** @deprecated use {@link slimeknights.mantle.loot.entry.TagPreferenceLootEntry} */
          @Deprecated(forRemoval = true)
          public class TagPreferenceLootEntry extends LootPoolSingletonContainer {
            public static final MapCodec<TagPreferenceLootEntry> CODEC = RecordCodecBuilder.mapCodec(
              instance -> instance.group(TagKey.codec(Registries.ITEM).fieldOf("tag").forGetter(entry -> entry.tag))
                                  .and(singletonFields(instance))
                                  .apply(instance, TagPreferenceLootEntry::new)
            );

            private final TagKey<Item> tag;

            protected TagPreferenceLootEntry(TagKey<Item> tag, int weight, int quality, List<LootItemCondition> conditions, List<LootItemFunction> functions) {
              super(weight, quality, conditions, functions);
              this.tag = tag;
            }

            @SuppressWarnings("removal")
            @Override
            public LootPoolEntryType getType() {
              return TinkerCommons.lootTagPreference.get();
            }

            @Override
            protected void createItemStack(Consumer<ItemStack> consumer, LootContext context) {
              TagPreference.getPreference(tag).ifPresent(item -> consumer.accept(new ItemStack(item)));
            }

            /** @deprecated use {@link slimeknights.mantle.loot.entry.TagPreferenceLootEntry#tagPreference(TagKey)} */
            @Deprecated(forRemoval = true)
            public static LootPoolSingletonContainer.Builder<?> tagPreference(TagKey<Item> tag) {
              return slimeknights.mantle.loot.entry.TagPreferenceLootEntry.tagPreference(tag);
            }
          }
          JAVA

          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/main/java/slimeknights/tconstruct/shared/TinkerCommons.java')
          text = path.read_text(encoding='utf-8')
          old = 'LOOT_ENTRIES.register("tag_preference", () -> new LootPoolEntryType(new TagPreferenceLootEntry.Serializer()))'
          new = 'LOOT_ENTRIES.register("tag_preference", () -> new LootPoolEntryType(TagPreferenceLootEntry.CODEC))'
          if old not in text:
            raise SystemExit('Missing legacy tag preference loot entry registration')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify tag preference loot codec migration
        run: |
          grep -Fq 'MapCodec<TagPreferenceLootEntry> CODEC' src/main/java/slimeknights/tconstruct/library/json/loot/TagPreferenceLootEntry.java
          grep -Fq 'singletonFields(instance)' src/main/java/slimeknights/tconstruct/library/json/loot/TagPreferenceLootEntry.java
          grep -Fq 'new LootPoolEntryType(TagPreferenceLootEntry.CODEC)' src/main/java/slimeknights/tconstruct/shared/TinkerCommons.java
          test -z "$(grep 'LootPoolSingletonContainer.Serializer' src/main/java/slimeknights/tconstruct/library/json/loot/TagPreferenceLootEntry.java || true)"

      - name: Commit targeted migration
        run: |
          if git diff --quiet; then
            echo 'Tag preference loot codec is already migrated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/main/java/slimeknights/tconstruct/library/json/loot/TagPreferenceLootEntry.java \
            src/main/java/slimeknights/tconstruct/shared/TinkerCommons.java
          git commit -m 'Migrate tag preference loot entry to 1.21 codec'
          git push origin HEAD:1.21.1-neoforge

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --ref 1.21.1-neoforge
