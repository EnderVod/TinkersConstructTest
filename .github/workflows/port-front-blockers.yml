name: Tinkers Front Blocker Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout latest Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Apply guarded recipe compatibility batch
        run: python3 .github/scripts/port-smeltery-batch.py

      - name: Verify migration
        shell: bash
        run: |
          ! grep -R -Fq 'new FluidStack(fluid, fluid.getAmount() * itemCost)' src/main/java/slimeknights/tconstruct/library/recipe
          grep -Fq 'RecipeHolder<ICastingRecipe>' src/main/java/slimeknights/tconstruct/smeltery/block/entity/CastingBlockEntity.java
          grep -Fq 'currentRecipeId' src/main/java/slimeknights/tconstruct/smeltery/block/entity/CastingBlockEntity.java
          grep -Fq 'ResourceLocation.parse(tags.getString(TAG_RECIPE))' src/main/java/slimeknights/tconstruct/smeltery/block/entity/CastingBlockEntity.java
          grep -Fq 'HolderLookup.Provider access' src/main/java/slimeknights/tconstruct/library/recipe/casting/ItemCastingRecipe.java
          grep -Fq 'copyWithAmount' src/main/java/slimeknights/tconstruct/library/recipe/melting/MaterialMeltingRecipe.java
          grep -Fq 'new ArrayList<>(getLevel().getRecipeManager().getRecipesFor' src/main/java/slimeknights/tconstruct/smeltery/block/entity/module/alloying/MultiAlloyingModule.java
          git diff --check

      - name: Commit compatibility batch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java
          git diff --cached --quiet || {
            git commit -m 'Migrate recipe holders and fluid copies to 1.21'
            git push origin HEAD:1.21.1-neoforge
          }

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --repo "$GITHUB_REPOSITORY" --ref 1.21.1-neoforge
