name: Tinkers Front Blocker Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout latest Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Apply duct and menu migration
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/ductmenu-batch.tar.gz
          tar -xzf /tmp/ductmenu-batch.tar.gz

      - name: Verify migration
        shell: bash
        run: |
          ! grep -R -Fq 'MenuScreens.register' src/main/java/slimeknights/tconstruct
          ! grep -Fq 'LazyOptional' src/main/java/slimeknights/tconstruct/smeltery/block/entity/component/DuctBlockEntity.java
          ! grep -Fq 'ForgeCapabilities' src/main/java/slimeknights/tconstruct/smeltery/block/entity/component/DuctBlockEntity.java
          grep -Fq 'return handler == null ? null : new DuctTankWrapper(handler, itemHandler);' src/main/java/slimeknights/tconstruct/smeltery/block/entity/component/DuctBlockEntity.java
          grep -Fq 'Capabilities.ItemHandler.BLOCK, TinkerSmeltery.duct.get()' src/main/java/slimeknights/tconstruct/TConstruct.java
          grep -Fq 'RegisterMenuScreensEvent event' src/main/java/slimeknights/tconstruct/smeltery/SmelteryClientEvents.java
          grep -Fq 'RegisterMenuScreensEvent event' src/main/java/slimeknights/tconstruct/tables/TableClientEvents.java
          grep -Fq 'RegisterMenuScreensEvent event' src/main/java/slimeknights/tconstruct/tools/ToolClientEvents.java
          git diff --check

      - name: Commit migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java
          git diff --cached --quiet || {
            git commit -m 'Migrate duct capabilities and menu screens to 1.21'
            git push origin HEAD:1.21.1-neoforge
          }

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --repo "$GITHUB_REPOSITORY" --ref 1.21.1-neoforge
