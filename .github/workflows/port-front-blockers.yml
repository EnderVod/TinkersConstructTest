name: Tinkers Fluid Projectile Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout latest Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Port fluid projectile to 1.21
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main/java/slimeknights/tconstruct/tools/entity/FluidEffectProjectile.java')
          text = path.read_text(encoding='utf-8')

          # Replace old Forge capability imports with NeoForge's block capability system.
          for imp in [
              'import net.minecraft.world.level.block.entity.BlockEntity;\n',
              'import net.minecraftforge.common.capabilities.ForgeCapabilities;\n',
              'import slimeknights.mantle.inventory.EmptyItemHandler;\n']:
              text = text.replace(imp, '')
          anchor = 'import net.neoforged.neoforge.event.EventHooks;\n'
          if text.count(anchor) != 1:
              raise RuntimeError('FluidEffectProjectile EventHooks import anchor changed')
          if 'import net.neoforged.neoforge.capabilities.Capabilities;\n' not in text:
              text = text.replace(anchor, 'import net.neoforged.neoforge.capabilities.Capabilities;\n' + anchor, 1)

          old = ('    if (this.cannon != null && level.isLoaded(this.cannon)) {\n'
                 '      BlockEntity cannonBE = level.getBlockEntity(this.cannon);\n'
                 '      if (cannonBE != null && cannonBE.getCapability(ForgeCapabilities.ITEM_HANDLER).orElse(EmptyItemHandler.INSTANCE) instanceof IItemHandlerModifiable modifiable) {\n'
                 '        return modifiable;\n'
                 '      }\n'
                 '    }')
          new = ('    if (this.cannon != null && level.isLoaded(this.cannon)) {\n'
                 '      IItemHandler handler = level.getCapability(Capabilities.ItemHandler.BLOCK, this.cannon, null);\n'
                 '      if (handler instanceof IItemHandlerModifiable modifiable) {\n'
                 '        return modifiable;\n'
                 '      }\n'
                 '    }')
          if text.count(old) != 1:
              raise RuntimeError('FluidEffectProjectile cannon capability block changed')
          text = text.replace(old, new, 1)

          if text.count('if (hitType != HitResult.Type.MISS && !ForgeEventFactory.onProjectileImpact(this, hitResult)) {') != 1:
              raise RuntimeError('FluidEffectProjectile old projectile impact hook changed')
          text = text.replace('if (hitType != HitResult.Type.MISS && !ForgeEventFactory.onProjectileImpact(this, hitResult)) {', 'if (hitType != HitResult.Type.MISS && !EventHooks.onProjectileImpact(this, hitResult)) {', 1)
          if text.count('      this.onHit(hitResult);') != 1:
              raise RuntimeError('FluidEffectProjectile direct onHit changed')
          text = text.replace('      this.onHit(hitResult);', '      this.hitTargetOrDeflectSelf(hitResult);', 1)

          if text.count('factor += dimensions.height;') != 1 or text.count('factor += dimensions.width / 2;') != 1:
              raise RuntimeError('FluidEffectProjectile EntityDimensions access changed')
          text = text.replace('factor += dimensions.height;', 'factor += dimensions.height();', 1)
          text = text.replace('factor += dimensions.width / 2;', 'factor += dimensions.width() / 2;', 1)

          old = ('  @Override\n'
                 '  protected void defineSynchedData() {\n'
                 '    this.entityData.define(FLUID, FluidStack.EMPTY);\n'
                 '    this.entityData.define(WATER_INERTIA, 0.6f);\n'
                 '  }')
          new = ('  @Override\n'
                 '  protected void defineSynchedData(SynchedEntityData.Builder builder) {\n'
                 '    builder.define(FLUID, FluidStack.EMPTY);\n'
                 '    builder.define(WATER_INERTIA, 0.6f);\n'
                 '  }')
          if text.count(old) != 1:
              raise RuntimeError('FluidEffectProjectile synced-data block changed')
          text = text.replace(old, new, 1)

          if text.count('nbt.put(KEY_FLUID, fluid.writeToNBT(new CompoundTag()));') != 1:
              raise RuntimeError('FluidEffectProjectile legacy fluid save changed')
          text = text.replace('nbt.put(KEY_FLUID, fluid.writeToNBT(new CompoundTag()));', 'nbt.put(KEY_FLUID, fluid.save(this.registryAccess()));', 1)

          old = ('    if (nbt.contains(KEY_CANNON)) {\n'
                 '      this.cannon = NbtUtils.readBlockPos(nbt.getCompound(KEY_CANNON));\n'
                 '    } else {\n'
                 '      this.cannon = null;\n'
                 '    }')
          new = ('    if (nbt.contains(KEY_CANNON)) {\n'
                 '      this.cannon = NbtUtils.readBlockPos(nbt, KEY_CANNON).orElse(null);\n'
                 '    } else {\n'
                 '      this.cannon = null;\n'
                 '    }')
          if text.count(old) != 1:
              raise RuntimeError('FluidEffectProjectile cannon NBT load changed')
          text = text.replace(old, new, 1)

          if text.count('setFluid(FluidStack.loadFluidStackFromNBT(nbt.getCompound(KEY_FLUID)));') != 1:
              raise RuntimeError('FluidEffectProjectile legacy fluid load changed')
          text = text.replace('setFluid(FluidStack.loadFluidStackFromNBT(nbt.getCompound(KEY_FLUID)));', 'setFluid(FluidStack.parseOptional(this.registryAccess(), nbt.getCompound(KEY_FLUID)));', 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify fluid projectile migration
        shell: bash
        run: |
          grep -Fq 'Capabilities.ItemHandler.BLOCK' src/main/java/slimeknights/tconstruct/tools/entity/FluidEffectProjectile.java
          grep -Fq 'EventHooks.onProjectileImpact(this, hitResult)' src/main/java/slimeknights/tconstruct/tools/entity/FluidEffectProjectile.java
          grep -Fq 'this.hitTargetOrDeflectSelf(hitResult);' src/main/java/slimeknights/tconstruct/tools/entity/FluidEffectProjectile.java
          grep -Fq 'dimensions.height()' src/main/java/slimeknights/tconstruct/tools/entity/FluidEffectProjectile.java
          grep -Fq 'dimensions.width()' src/main/java/slimeknights/tconstruct/tools/entity/FluidEffectProjectile.java
          grep -Fq 'defineSynchedData(SynchedEntityData.Builder builder)' src/main/java/slimeknights/tconstruct/tools/entity/FluidEffectProjectile.java
          grep -Fq 'fluid.save(this.registryAccess())' src/main/java/slimeknights/tconstruct/tools/entity/FluidEffectProjectile.java
          grep -Fq 'NbtUtils.readBlockPos(nbt, KEY_CANNON).orElse(null)' src/main/java/slimeknights/tconstruct/tools/entity/FluidEffectProjectile.java
          grep -Fq 'FluidStack.parseOptional(this.registryAccess()' src/main/java/slimeknights/tconstruct/tools/entity/FluidEffectProjectile.java
          ! grep -Fq 'ForgeCapabilities' src/main/java/slimeknights/tconstruct/tools/entity/FluidEffectProjectile.java
          ! grep -Fq 'ForgeEventFactory' src/main/java/slimeknights/tconstruct/tools/entity/FluidEffectProjectile.java
          git diff --check

      - name: Commit fluid projectile migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/slimeknights/tconstruct/tools/entity/FluidEffectProjectile.java
          git commit -m 'Port fluid effect projectile to 1.21'
          git push origin HEAD:1.21.1-neoforge

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --ref 1.21.1-neoforge
