name: Tinkers Front Blocker Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for active port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while gh run list --repo "$GITHUB_REPOSITORY" --workflow port-compile.yml --branch 1.21.1-neoforge --limit 30 --json status --jq '.[] | select(.status == "queued" or .status == "in_progress") | .status' | grep -q .; do
            sleep 15
          done

      - name: Checkout Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge

      - name: Migrate potion modifier color lookup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main/java/slimeknights/tconstruct/library/client/modifiers/PotionModifierModel.java')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import net.minecraft.world.item.alchemy.PotionUtils;\n', 'import net.minecraft.world.item.alchemy.PotionContents;\n', 1)
          old = '''          Potion potion = BuiltInRegistries.POTION.get(id);\n          if (potion != Potions.EMPTY) {\n            quadConsumer.accept(MantleItemLayerModel.getQuadsForSprite(0xFF000000 | PotionUtils.getColor(potion), -1, spriteGetter.apply(texture), transforms, 0, pixels));\n          }'''
          new = '''          Potion potion = BuiltInRegistries.POTION.get(id);\n          if (potion != null) {\n            PotionContents contents = new PotionContents(BuiltInRegistries.POTION.wrapAsHolder(potion));\n            if (!contents.is(Potions.EMPTY)) {\n              quadConsumer.accept(MantleItemLayerModel.getQuadsForSprite(0xFF000000 | contents.getColor(), -1, spriteGetter.apply(texture), transforms, 0, pixels));\n            }\n          }'''
          if old not in text:
              raise SystemExit('Missing legacy PotionUtils color block')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify potion modifier migration
        run: |
          grep -q 'import net.minecraft.world.item.alchemy.PotionContents;' src/main/java/slimeknights/tconstruct/library/client/modifiers/PotionModifierModel.java
          grep -q 'new PotionContents(BuiltInRegistries.POTION.wrapAsHolder(potion))' src/main/java/slimeknights/tconstruct/library/client/modifiers/PotionModifierModel.java
          grep -q 'contents.getColor()' src/main/java/slimeknights/tconstruct/library/client/modifiers/PotionModifierModel.java
          test -z "$(grep 'PotionUtils' src/main/java/slimeknights/tconstruct/library/client/modifiers/PotionModifierModel.java || true)"

      - name: Commit targeted migration
        run: |
          if git diff --quiet; then
            echo 'Potion modifier color lookup is already migrated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/slimeknights/tconstruct/library/client/modifiers/PotionModifierModel.java
          git commit -m 'Migrate potion modifier color to 1.21 contents'
          git push origin HEAD:1.21.1-neoforge

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --ref 1.21.1-neoforge
