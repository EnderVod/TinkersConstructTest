name: Tinkers Front Blocker Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Wait for active port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while gh run list --repo "$GITHUB_REPOSITORY" --workflow port-compile.yml --branch 1.21.1-neoforge --limit 30 --json status --jq '.[] | select(.status == "queued" or .status == "in_progress") | .status' | grep -q .; do
            sleep 15
          done

      - name: Checkout latest Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Wire 1.21 loot codecs into registries
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Missing expected registration in {path}: {old}')
              p.write_text(text.replace(old, new), encoding='utf-8')
          replace('src/main/java/slimeknights/tconstruct/tools/TinkerTools.java', 'new LootItemFunctionType(AddToolDataFunction.SERIALIZER)', 'new LootItemFunctionType<>(AddToolDataFunction.CODEC)')
          replace('src/main/java/slimeknights/tconstruct/tools/TinkerToolParts.java', 'new LootPoolEntryType(new ToolPartLootEntry.Serializer())', 'new LootPoolEntryType(ToolPartLootEntry.CODEC)')
          replace('src/main/java/slimeknights/tconstruct/tools/TinkerModifiers.java', 'new LootItemFunctionType(new ModifierBonusLootFunction.Serializer())', 'new LootItemFunctionType<>(ModifierBonusLootFunction.CODEC)')
          replace('src/main/java/slimeknights/tconstruct/tools/TinkerModifiers.java', 'new LootItemFunctionType(ChrysophiliteBonusFunction.SERIALIZER)', 'new LootItemFunctionType<>(ChrysophiliteBonusFunction.CODEC)')
          PY

      - name: Verify codec registrations
        shell: bash
        run: |
          grep -Fq 'AddToolDataFunction.CODEC' src/main/java/slimeknights/tconstruct/tools/TinkerTools.java
          grep -Fq 'ToolPartLootEntry.CODEC' src/main/java/slimeknights/tconstruct/tools/TinkerToolParts.java
          grep -Fq 'ModifierBonusLootFunction.CODEC' src/main/java/slimeknights/tconstruct/tools/TinkerModifiers.java
          grep -Fq 'ChrysophiliteBonusFunction.CODEC' src/main/java/slimeknights/tconstruct/tools/TinkerModifiers.java
          test -z "$(grep -R -E 'LootItemConditionalFunction\.Serializer|LootPoolSingletonContainer\.Serializer|FormulaDeserializer' src/main/java/slimeknights/tconstruct/library/json/loot src/main/java/slimeknights/tconstruct/tools/modifiers/loot || true)"

      - name: Commit codec registration migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/slimeknights/tconstruct/tools/TinkerTools.java src/main/java/slimeknights/tconstruct/tools/TinkerToolParts.java src/main/java/slimeknights/tconstruct/tools/TinkerModifiers.java
          git diff --cached --quiet && exit 0
          git commit -m 'Wire 1.21 loot codecs into registries'
          git push origin HEAD:1.21.1-neoforge

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --repo "$GITHUB_REPOSITORY" --ref 1.21.1-neoforge
