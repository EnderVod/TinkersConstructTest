name: Tinkers Front Blocker Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for active port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while gh run list --repo "$GITHUB_REPOSITORY" --workflow port-compile.yml --branch 1.21.1-neoforge --limit 20 --json status --jq '.[] | select(.status == "queued" or .status == "in_progress") | .status' | grep -q .; do
            sleep 15
          done

      - name: Checkout Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge

      - name: Migrate shared runtime APIs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('src/main/java/slimeknights/tconstruct')
          changed = []

          def edit(rel, replacements):
              path = root / rel
              original = path.read_text(encoding='utf-8')
              text = original
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'Missing expected source in {rel}: {old!r}')
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          # AbstractGlassBlock/GlassBlock were removed in 1.21; TransparentBlock is the vanilla glass base now.
          edit('shared/TinkerCommons.java', [
              ('import net.minecraft.world.level.block.GlassBlock;', 'import net.minecraft.world.level.block.TransparentBlock;'),
              ('ItemObject<GlassBlock> clearGlass', 'ItemObject<TransparentBlock> clearGlass'),
              ('new GlassBlock(glassBuilder(MapColor.NONE))', 'new TransparentBlock(glassBuilder(MapColor.NONE))'),
              ('ItemObject<GlassBlock> soulGlass', 'ItemObject<TransparentBlock> soulGlass'),
          ])
          edit('shared/block/SoulGlassBlock.java', [
              ('import net.minecraft.world.level.block.GlassBlock;', 'import net.minecraft.world.level.block.TransparentBlock;'),
              ('extends GlassBlock', 'extends TransparentBlock'),
          ])
          edit('shared/block/ClearStainedGlassBlock.java', [
              ('import net.minecraft.world.level.block.AbstractGlassBlock;', 'import net.minecraft.world.level.block.TransparentBlock;'),
              ('extends AbstractGlassBlock', 'extends TransparentBlock'),
              ('public float[] getBeaconColorMultiplier(BlockState state, LevelReader world, BlockPos pos, BlockPos beaconPos) {\n    return this.glassColor.getRgb();\n  }',
               'public Integer getBeaconColorMultiplier(BlockState state, LevelReader world, BlockPos pos, BlockPos beaconPos) {\n    return 0xFF000000 | this.glassColor.getColor();\n  }'),
          ])

          # Forge ToolAction was replaced by NeoForge ItemAbility in 1.21.
          for rel in ['shared/block/WeatheringPlatformBlock.java', 'shared/block/WaxedPlatformBlock.java']:
              edit(rel, [
                  ('import net.minecraftforge.common.ToolAction;', 'import net.neoforged.neoforge.common.ItemAbility;'),
                  ('import net.minecraftforge.common.ToolActions;', 'import net.neoforged.neoforge.common.ItemAbilities;'),
                  ('ToolAction toolAction', 'ItemAbility toolAction'),
                  ('ToolActions.AXE_', 'ItemAbilities.AXE_'),
              ])

          # Block pathfinding types were renamed in vanilla 1.21.
          edit('shared/block/KnightMetalBlock.java', [
              ('import net.minecraft.world.level.pathfinder.BlockPathTypes;', 'import net.minecraft.world.level.pathfinder.PathType;'),
              ('public BlockPathTypes getBlockPathType(', 'public PathType getBlockPathType('),
              ('return BlockPathTypes.DAMAGE_OTHER;', 'return PathType.DAMAGE_OTHER;'),
          ])

          # NeoForge patches ServerPlayer.openMenu directly; NetworkHooks is gone.
          edit('shared/CommonsEvents.java', [
              ('import net.minecraftforge.network.NetworkHooks;\n', ''),
              ('NetworkHooks.openScreen(serverPlayer, provider, pos);', 'serverPlayer.openMenu(provider, pos);'),
          ])

          print(f'Updated {len(changed)} Java files')
          for path in changed:
              print(path)
          PY

      - name: Verify shared runtime migration
        run: |
          if grep -R "AbstractGlassBlock\|world.level.block.GlassBlock\|net.minecraftforge.common.ToolAction\|net.minecraftforge.common.ToolActions\|BlockPathTypes\|net.minecraftforge.network.NetworkHooks" -n \
            src/main/java/slimeknights/tconstruct/shared; then
            echo 'Found stale shared runtime API references.'
            exit 1
          fi

      - name: Commit targeted migration
        run: |
          if git diff --quiet; then
            echo 'No shared runtime changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java
          git commit -m 'Migrate shared runtime APIs to 1.21'
          git push origin HEAD:1.21.1-neoforge

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --ref 1.21.1-neoforge
