name: Tinkers Front Blocker Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout latest Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Apply guarded shared and fluid compatibility batch
        run: python3 .github/scripts/port-smeltery-batch.py

      - name: Verify migration
        shell: bash
        run: |
          ! grep -Fq 'Blocks::never' src/main/java/slimeknights/tconstruct/shared/TinkerCommons.java
          grep -Fq 'Registries.TRIGGER_TYPE, getResource("block_container_opened")' src/main/java/slimeknights/tconstruct/shared/TinkerCommons.java
          grep -Fq 'Integer getBeaconColorMultiplier' src/main/java/slimeknights/tconstruct/shared/block/ClearStainedGlassPaneBlock.java
          grep -Fq 'source.pos().relative(source.state()' src/main/java/slimeknights/tconstruct/shared/block/PlaceBlockDispenserBehavior.java
          grep -Fq 'TConstruct.getResource("fluid_container")' src/main/java/slimeknights/tconstruct/fluids/FluidClientEvents.java
          grep -R -Fq 'public ItemInteractionResult interact(' src/main/java/slimeknights/tconstruct/fluids/util
          grep -Fq 'CauldronInteraction.WATER.map().put' src/main/java/slimeknights/tconstruct/fluids/TinkerFluids.java
          grep -Fq 'TinkerEffects.holder(TinkerEffects.bouncy)' src/main/java/slimeknights/tconstruct/fluids/TinkerFluids.java
          grep -Fq 'effect.getCures().clear()' src/main/java/slimeknights/tconstruct/fluids/block/MobEffectLiquidBlock.java
          grep -Fq 'entity.igniteForSeconds(burnTime)' src/main/java/slimeknights/tconstruct/fluids/block/BurningLiquidBlock.java
          grep -Fq 'EffectCures.MILK' src/main/java/slimeknights/tconstruct/shared/item/CheeseItem.java
          grep -Fq 'FoodProperties.PossibleEffect' src/main/java/slimeknights/tconstruct/fluids/item/ContainerFoodItem.java
          git diff --check

      - name: Commit compatibility batch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java
          git diff --cached --quiet || {
            git commit -m 'Migrate shared and fluid APIs to 1.21'
            git push origin HEAD:1.21.1-neoforge
          }

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --repo "$GITHUB_REPOSITORY" --ref 1.21.1-neoforge
