name: Tinkers Front Blocker Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout latest Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Apply current front blocker fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          inventory_import = 'import slimeknights.tconstruct.library.tools.capability.inventory.ToolInventoryCapability;\n'
          anchor = 'import slimeknights.tconstruct.library.tools.IndestructibleItemEntity;\n'
          for name in (
              'src/main/java/slimeknights/tconstruct/library/tools/item/ModifiableItem.java',
              'src/main/java/slimeknights/tconstruct/library/tools/item/ranged/ModifiableLauncherItem.java',
          ):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if inventory_import not in text:
                  if anchor not in text:
                      raise RuntimeError(f'Missing import anchor in {name}')
                  text = text.replace(anchor, anchor + inventory_import, 1)
                  path.write_text(text, encoding='utf-8')

          harvest = Path('src/main/java/slimeknights/tconstruct/library/tools/helper/ToolHarvestLogic.java')
          text = harvest.read_text(encoding='utf-8')
          stale = '      return tool.getHook(ToolHooks.MINING_CONDITION).canMine(tool, state, isEffective);'
          replacement = '''      ToolHarvestContext context = new ToolHarvestContext((ServerLevel) worldIn, entityLiving, state, pos, Direction.UP, true, isEffective);\n      for (ModifierEntry entry : tool.getModifierList()) {\n        entry.getHook(ModifierHooks.BLOCK_BREAK).afterBlockBreak(tool, entry, context);\n      }\n      ToolDamageUtil.damageAnimated(tool, ToolHarvestLogic.getDamage(tool, worldIn, pos, state), entityLiving, EquipmentSlot.MAINHAND);'''
          if stale in text:
              text = text.replace(stale, replacement, 1)
              harvest.write_text(text, encoding='utf-8')
          elif 'ToolHooks.MINING_CONDITION' in text:
              raise RuntimeError('Unexpected MINING_CONDITION usage remains')
          PY

      - name: Verify migration
        shell: bash
        run: |
          grep -Fq 'import slimeknights.tconstruct.library.tools.capability.inventory.ToolInventoryCapability;' src/main/java/slimeknights/tconstruct/library/tools/item/ModifiableItem.java
          grep -Fq 'import slimeknights.tconstruct.library.tools.capability.inventory.ToolInventoryCapability;' src/main/java/slimeknights/tconstruct/library/tools/item/ranged/ModifiableLauncherItem.java
          ! grep -Fq 'ToolHooks.MINING_CONDITION' src/main/java/slimeknights/tconstruct/library/tools/helper/ToolHarvestLogic.java
          grep -Fq 'entry.getHook(ModifierHooks.BLOCK_BREAK).afterBlockBreak(tool, entry, context);' src/main/java/slimeknights/tconstruct/library/tools/helper/ToolHarvestLogic.java
          git diff --check

      - name: Commit compatibility batch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java
          git diff --cached --quiet || {
            git commit -m 'Restore harvest callbacks and inventory capability imports'
            git push origin HEAD:1.21.1-neoforge
          }

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --repo "$GITHUB_REPOSITORY" --ref 1.21.1-neoforge
