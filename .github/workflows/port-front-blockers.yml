name: Tinkers Front Blocker Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for active port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while gh run list --repo "$GITHUB_REPOSITORY" --workflow port-compile.yml --branch 1.21.1-neoforge --limit 30 --json status --jq '.[] | select(.status == "queued" or .status == "in_progress") | .status' | grep -q .; do
            sleep 15
          done

      - name: Checkout Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge

      - name: Migrate fluid item capabilities to NeoForge 1.21
        run: |
          cat > src/main/java/slimeknights/tconstruct/fluids/util/ConstantFluidContainerWrapper.java <<'JAVA'
          package slimeknights.tconstruct.fluids.util;

          import lombok.Getter;
          import net.minecraft.world.item.ItemStack;
          import net.neoforged.neoforge.fluids.FluidStack;
          import net.neoforged.neoforge.fluids.capability.IFluidHandlerItem;

          import javax.annotation.Nonnull;

          /** Represents a fluid handler for a container with a constant fluid. */
          public class ConstantFluidContainerWrapper implements IFluidHandlerItem {
            /** Contained fluid */
            private final FluidStack fluid;
            /** If true, the container is now empty */
            private boolean empty = false;
            /** Item stack representing the current state */
            @Getter
            @Nonnull
            protected ItemStack container;
            /** Empty version of the container */
            private final ItemStack emptyStack;

            public ConstantFluidContainerWrapper(FluidStack fluid, ItemStack container, ItemStack emptyStack) {
              this.fluid = fluid;
              this.container = container;
              this.emptyStack = emptyStack;
            }

            public ConstantFluidContainerWrapper(FluidStack fluid, ItemStack container) {
              this(fluid, container, container.getCraftingRemainingItem());
            }

            @Override
            public int getTanks() {
              return 1;
            }

            @Override
            public int getTankCapacity(int tank) {
              return fluid.getAmount();
            }

            @Override
            public boolean isFluidValid(int tank, @Nonnull FluidStack stack) {
              return stack.isEmpty() || stack.getFluid() == fluid.getFluid();
            }

            @Nonnull
            @Override
            public FluidStack getFluidInTank(int tank) {
              return empty ? FluidStack.EMPTY : fluid;
            }

            @Override
            public int fill(FluidStack resource, FluidAction action) {
              return 0;
            }

            @Nonnull
            @Override
            public FluidStack drain(FluidStack resource, FluidAction action) {
              if (empty || resource.getFluid() != fluid.getFluid() || resource.getAmount() < fluid.getAmount()) {
                return FluidStack.EMPTY;
              }
              if (action == FluidAction.EXECUTE) {
                container = emptyStack;
                empty = true;
              }
              return fluid.copy();
            }

            @Nonnull
            @Override
            public FluidStack drain(int maxDrain, FluidAction action) {
              if (empty || maxDrain < fluid.getAmount()) {
                return FluidStack.EMPTY;
              }
              if (action == FluidAction.EXECUTE) {
                container = emptyStack;
                empty = true;
              }
              return fluid.copy();
            }
          }
          JAVA

          cat > src/main/java/slimeknights/tconstruct/fluids/FluidEvents.java <<'JAVA'
          package slimeknights.tconstruct.fluids;

          import net.neoforged.neoforge.event.furnace.FurnaceFuelBurnTimeEvent;
          import net.neoforged.bus.api.SubscribeEvent;
          import net.neoforged.fml.common.EventBusSubscriber;
          import net.neoforged.fml.common.EventBusSubscriber.Bus;
          import slimeknights.tconstruct.TConstruct;

          /** Common fluid gameplay events. Item fluid capabilities are registered on the mod bus in TinkerFluids. */
          @SuppressWarnings("unused")
          @EventBusSubscriber(modid = TConstruct.MOD_ID, bus = Bus.FORGE)
          public class FluidEvents {
            @SubscribeEvent
            static void onFurnaceFuel(FurnaceFuelBurnTimeEvent event) {
              if (event.getItemStack().getItem() == TinkerFluids.blazingBlood.asItem()) {
                event.setBurnTime(30000);
              }
            }
          }
          JAVA

          python3 - <<'PY'
          from pathlib import Path

          # Food/slime bottles expose a direct IFluidHandlerItem factory instead of the removed initCapabilities hook.
          path = Path('src/main/java/slimeknights/tconstruct/fluids/item/ContainerFoodItem.java')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import net.minecraft.nbt.CompoundTag;\n', '', 1)
          text = text.replace('import net.minecraftforge.common.capabilities.ICapabilityProvider;\n', '', 1)
          if 'import net.neoforged.neoforge.fluids.capability.IFluidHandlerItem;\n' not in text:
            text = text.replace('import net.neoforged.neoforge.fluids.FluidStack;\n', 'import net.neoforged.neoforge.fluids.FluidStack;\nimport net.neoforged.neoforge.fluids.capability.IFluidHandlerItem;\n', 1)
          old = '''    @Nullable\n    @Override\n    public ICapabilityProvider initCapabilities(ItemStack stack, @Nullable CompoundTag nbt) {\n      return new ConstantFluidContainerWrapper(fluid.get(), stack);\n    }'''
          new = '''    /** Creates the 1.21 item fluid capability for this stack. */\n    public IFluidHandlerItem createFluidHandler(ItemStack stack) {\n      return new ConstantFluidContainerWrapper(fluid.get(), stack);\n    }'''
          if old not in text:
            raise SystemExit('Missing FluidContainerFoodItem initCapabilities block')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Magma bottle no longer provides capabilities from the item instance; TinkerFluids registers its handler.
          path = Path('src/main/java/slimeknights/tconstruct/fluids/item/MagmaBottleItem.java')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import net.minecraft.nbt.CompoundTag;\n', '', 1)
          text = text.replace('import net.minecraftforge.common.capabilities.ICapabilityProvider;\n', '', 1)
          text = text.replace('import net.neoforged.neoforge.fluids.FluidStack;\n', '', 1)
          text = text.replace('import slimeknights.tconstruct.fluids.TinkerFluids;\n', '', 1)
          text = text.replace('import slimeknights.tconstruct.fluids.util.ConstantFluidContainerWrapper;\n', '', 1)
          text = text.replace('import slimeknights.tconstruct.library.recipe.FluidValues;\n', '', 1)
          old = '''\n  @Nullable\n  @Override\n  public ICapabilityProvider initCapabilities(ItemStack stack, @Nullable CompoundTag nbt) {\n    return new ConstantFluidContainerWrapper(new FluidStack(TinkerFluids.magma.get(), FluidValues.BOTTLE), stack);\n  }'''
          if old not in text:
            raise SystemExit('Missing MagmaBottleItem initCapabilities block')
          path.write_text(text.replace(old, '', 1), encoding='utf-8')

          # Potion bucket keeps its handler implementation but registration moves to RegisterCapabilitiesEvent.
          path = Path('src/main/java/slimeknights/tconstruct/fluids/item/PotionBucketItem.java')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import net.minecraftforge.common.capabilities.ICapabilityProvider;\n', '', 1)
          old = '''\n  @Override\n  public ICapabilityProvider initCapabilities(ItemStack stack, @Nullable CompoundTag nbt) {\n    return new PotionBucketWrapper(stack);\n  }\n'''
          if old not in text:
            raise SystemExit('Missing PotionBucketItem initCapabilities block')
          path.write_text(text.replace(old, '\n', 1), encoding='utf-8')

          # Register all fluid item handlers through NeoForge's item capability registry.
          path = Path('src/main/java/slimeknights/tconstruct/fluids/TinkerFluids.java')
          text = path.read_text(encoding='utf-8')
          if 'import net.neoforged.neoforge.capabilities.Capabilities;\n' not in text:
            text = text.replace('import net.neoforged.neoforge.common.NeoForgeMod;\n', 'import net.neoforged.neoforge.capabilities.Capabilities;\nimport net.neoforged.neoforge.capabilities.RegisterCapabilitiesEvent;\nimport net.neoforged.neoforge.common.NeoForgeMod;\n', 1)
          if 'import slimeknights.tconstruct.fluids.util.ConstantFluidContainerWrapper;\n' not in text:
            text = text.replace('import slimeknights.tconstruct.fluids.util.BottleBrewingRecipe;\n', 'import slimeknights.tconstruct.fluids.util.BottleBrewingRecipe;\nimport slimeknights.tconstruct.fluids.util.ConstantFluidContainerWrapper;\n', 1)
          old_ctor = '''  public TinkerFluids() {\n    NeoForgeMod.enableMilkFluid();\n  }'''
          new_ctor = '''  public TinkerFluids() {\n    NeoForgeMod.enableMilkFluid();\n    TConstruct.getModBus().addListener(TinkerFluids::registerCapabilities);\n  }'''
          if old_ctor not in text:
            raise SystemExit('Missing TinkerFluids constructor')
          text = text.replace(old_ctor, new_ctor, 1)
          marker = '''\n  /** Creative tab for general items, or those that lack another tab */'''
          method = '''\n  /** Registers item fluid handlers using the NeoForge 1.21 capability model. */\n  private static void registerCapabilities(RegisterCapabilitiesEvent event) {\n    event.registerItem(Capabilities.FluidHandler.ITEM,\n      (stack, context) -> new ConstantFluidContainerWrapper(new FluidStack(powderedSnow.get(), FluidType.BUCKET_VOLUME), stack, Items.BUCKET.getDefaultInstance()),\n      Items.POWDER_SNOW_BUCKET);\n    event.registerItem(Capabilities.FluidHandler.ITEM,\n      (stack, context) -> new ConstantFluidContainerWrapper(new FluidStack(magma.get(), FluidValues.BOTTLE), stack),\n      magmaBottle.get());\n    event.registerItem(Capabilities.FluidHandler.ITEM,\n      (stack, context) -> ((FluidContainerFoodItem)stack.getItem()).createFluidHandler(stack),\n      venomBottle.get());\n    for (SlimeType type : SlimeType.values()) {\n      event.registerItem(Capabilities.FluidHandler.ITEM,\n        (stack, context) -> ((FluidContainerFoodItem)stack.getItem()).createFluidHandler(stack),\n        slimeBottle.get(type));\n    }\n    event.registerItem(Capabilities.FluidHandler.ITEM,\n      (stack, context) -> new PotionBucketItem.PotionBucketWrapper(stack),\n      potion.asItem());\n  }\n'''
          if marker not in text:
            raise SystemExit('Missing TinkerFluids creative-tab marker')
          if 'private static void registerCapabilities(RegisterCapabilitiesEvent event)' not in text:
            text = text.replace(marker, method + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify fluid capability migration
        run: |
          grep -Fq 'implements IFluidHandlerItem' src/main/java/slimeknights/tconstruct/fluids/util/ConstantFluidContainerWrapper.java
          grep -Fq 'Capabilities.FluidHandler.ITEM' src/main/java/slimeknights/tconstruct/fluids/TinkerFluids.java
          grep -Fq 'Items.POWDER_SNOW_BUCKET' src/main/java/slimeknights/tconstruct/fluids/TinkerFluids.java
          grep -Fq 'PotionBucketItem.PotionBucketWrapper' src/main/java/slimeknights/tconstruct/fluids/TinkerFluids.java
          grep -Fq 'createFluidHandler(ItemStack stack)' src/main/java/slimeknights/tconstruct/fluids/item/ContainerFoodItem.java
          test -z "$(grep -R 'ICapabilityProvider\|AttachCapabilitiesEvent\|initCapabilities' \
            src/main/java/slimeknights/tconstruct/fluids/util/ConstantFluidContainerWrapper.java \
            src/main/java/slimeknights/tconstruct/fluids/FluidEvents.java \
            src/main/java/slimeknights/tconstruct/fluids/item/ContainerFoodItem.java \
            src/main/java/slimeknights/tconstruct/fluids/item/MagmaBottleItem.java \
            src/main/java/slimeknights/tconstruct/fluids/item/PotionBucketItem.java || true)"

      - name: Commit targeted migration
        run: |
          if git diff --quiet; then
            echo 'Fluid item capabilities are already migrated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/main/java/slimeknights/tconstruct/fluids/TinkerFluids.java \
            src/main/java/slimeknights/tconstruct/fluids/FluidEvents.java \
            src/main/java/slimeknights/tconstruct/fluids/util/ConstantFluidContainerWrapper.java \
            src/main/java/slimeknights/tconstruct/fluids/item/ContainerFoodItem.java \
            src/main/java/slimeknights/tconstruct/fluids/item/MagmaBottleItem.java \
            src/main/java/slimeknights/tconstruct/fluids/item/PotionBucketItem.java
          git commit -m 'Migrate fluid item capabilities to NeoForge 1.21'
          git push origin HEAD:1.21.1-neoforge

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --ref 1.21.1-neoforge
