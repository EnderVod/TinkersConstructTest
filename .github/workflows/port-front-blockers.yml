name: Tinkers Front Blocker Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Wait for active port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while gh run list --repo "$GITHUB_REPOSITORY" --workflow port-compile.yml --branch 1.21.1-neoforge --limit 30 --json status --jq '.[] | select(.status == "queued" or .status == "in_progress") | .status' | grep -q .; do
            sleep 15
          done

      - name: Checkout Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Migrate JEI NeoForge API names
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          jei_root = Path('src/main/java/slimeknights/tconstruct/plugin/jei')
          changed = 0
          for path in jei_root.rglob('*.java'):
              text = path.read_text(encoding='utf-8')
              old = text
              text = text.replace('import mezz.jei.api.forge.ForgeTypes;\n', 'import mezz.jei.api.neoforge.NeoForgeTypes;\n')
              text = text.replace('ForgeTypes.', 'NeoForgeTypes.')
              if text != old:
                  changed += 1
                  path.write_text(text, encoding='utf-8')

          path = Path('src/main/java/slimeknights/tconstruct/plugin/jei/transfer/CraftingStationTransferInfo.java')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import net.minecraftforge.common.crafting.IShapedRecipe;\n', 'import net.minecraft.world.item.crafting.ShapedRecipe;\n')
          text = text.replace('recipe instanceof IShapedRecipe<?> shaped', 'recipe instanceof ShapedRecipe shaped')
          text = text.replace('shaped.getRecipeWidth()', 'shaped.getWidth()')
          text = text.replace('shaped.getRecipeHeight()', 'shaped.getHeight()')
          path.write_text(text, encoding='utf-8')

          print(f'Migrated JEI type imports in {changed} files')
          PY

      - name: Verify JEI migration
        run: |
          test -z "$(grep -R 'mezz\.jei\.api\.forge\.ForgeTypes\|ForgeTypes\.' src/main/java/slimeknights/tconstruct/plugin/jei || true)"
          test -z "$(grep -R 'net\.minecraftforge\.common\.crafting\.IShapedRecipe\|IShapedRecipe' src/main/java/slimeknights/tconstruct/plugin/jei/transfer/CraftingStationTransferInfo.java || true)"
          grep -Fq 'mezz.jei.api.neoforge.NeoForgeTypes' src/main/java/slimeknights/tconstruct/plugin/jei/JEIPlugin.java
          grep -Fq 'recipe instanceof ShapedRecipe shaped' src/main/java/slimeknights/tconstruct/plugin/jei/transfer/CraftingStationTransferInfo.java

      - name: Commit targeted migration
        run: |
          if git diff --quiet; then
            echo 'JEI NeoForge API names are already migrated.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/main/java/slimeknights/tconstruct/plugin/jei
            git commit -m 'Migrate JEI integration to NeoForge API names'
            git push origin HEAD:1.21.1-neoforge
          fi

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --ref 1.21.1-neoforge
