name: Tinkers Front Blocker Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for active port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while gh run list --repo "$GITHUB_REPOSITORY" --workflow port-compile.yml --branch 1.21.1-neoforge --limit 20 --json status --jq '.[] | select(.status == "queued" or .status == "in_progress") | .status' | grep -q .; do
            sleep 15
          done

      - name: Checkout Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge

      - name: Migrate world growth and tool events
        run: python3 .github/scripts/port-world-event.py

      - name: Verify world and event migration
        run: |
          if grep -R "AbstractTreeGrower\|net.minecraftforge.common.PlantType\|net.minecraftforge.common.IPlantable\|IForgeShearable\|@HasResult\|bus.api.Event.Result" -n \
            src/main/java/slimeknights/tconstruct/world \
            src/main/java/slimeknights/tconstruct/library/events/TinkerToolEvent.java \
            src/main/java/slimeknights/tconstruct/tools/modules/interaction/HarvestModule.java \
            src/main/java/slimeknights/tconstruct/tools/modules/interaction/ShearsModule.java \
            src/main/java/slimeknights/tconstruct/tools/logic/ToolEvents.java; then
            echo 'Found stale world/event APIs.'
            exit 1
          fi

      - name: Commit targeted migration
        run: |
          if git diff --quiet; then
            echo 'No world/event migration changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java
          git commit -m 'Migrate slime growth and tool event results'
          git push origin HEAD:1.21.1-neoforge

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --ref 1.21.1-neoforge
