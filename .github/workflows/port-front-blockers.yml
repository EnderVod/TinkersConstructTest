name: Tinkers Front Blocker Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Wait for active port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while gh run list --repo "$GITHUB_REPOSITORY" --workflow port-compile.yml --branch 1.21.1-neoforge --limit 30 --json status --jq '.[] | select(.status == "queued" or .status == "in_progress") | .status' | grep -q .; do
            sleep 15
          done

      - name: Checkout latest Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Apply staged 1.21 gadget migration
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, re, subprocess
          from pathlib import Path
          previous = subprocess.check_output(['git', 'show', 'HEAD^:.github/workflows/port-front-blockers.yml'], text=True)
          match = re.search(r"echo '([A-Za-z0-9+/=]+)' \\| base64 -d", previous)
          if not match:
              raise SystemExit('Could not recover staged gadget migration payload')
          Path('/tmp/gadget-batch.tar.gz').write_bytes(base64.b64decode(match.group(1)))
          PY
          tar -xzf /tmp/gadget-batch.tar.gz

      - name: Verify migrated APIs
        shell: bash
        run: |
          grep -Fq 'ItemStack.STREAM_CODEC.encode' src/main/java/slimeknights/tconstruct/gadgets/entity/EFLNEntity.java
          grep -Fq 'ItemStack.STREAM_CODEC.decode' src/main/java/slimeknights/tconstruct/gadgets/entity/GlowballEntity.java
          grep -Fq 'SynchedEntityData.Builder' src/main/java/slimeknights/tconstruct/gadgets/entity/FancyArmorStandEntity.java
          grep -Fq 'source.state()' src/main/java/slimeknights/tconstruct/gadgets/entity/DispenseFancyArmorStand.java
          grep -Fq 'DataComponents.ENTITY_DATA' src/main/java/slimeknights/tconstruct/gadgets/item/FancyItemFrameItem.java
          grep -Fq 'FoodProperties.PossibleEffect' src/main/java/slimeknights/tconstruct/gadgets/block/FoodCakeBlock.java
          grep -Fq 'EntityDataSerializer.forValueType' src/main/java/slimeknights/tconstruct/library/materials/definition/MaterialVariantId.java
          grep -Fq 'new ClientboundExplodePacket(' src/main/java/slimeknights/tconstruct/library/utils/CustomExplosion.java
          ! grep -Eq 'getPosition\(\)|getDamageSource\(\)|ignoreExplosion\(\)' src/main/java/slimeknights/tconstruct/library/utils/CustomExplosion.java

      - name: Commit gadget API migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java
          git diff --cached --quiet && exit 0
          git commit -m 'Migrate gadget and explosion APIs to 1.21'
          git push origin HEAD:1.21.1-neoforge

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --repo "$GITHUB_REPOSITORY" --ref 1.21.1-neoforge
