name: Tinkers Front Blocker Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout latest Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Replace removed stack copy helper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/main/java/slimeknights/tconstruct/smeltery/block/entity/CastingBlockEntity.java")
          source = path.read_text()
          old = "ItemHandlerHelper.copyStackWithSize(held, 1)"
          new = "held.copyWithCount(1)"
          if source.count(old) != 1:
              raise SystemExit(f"expected exactly one removed stack-copy helper, got {source.count(old)}")
          source = source.replace(old, new)
          path.write_text(source)
          PY

      - name: Verify migration
        shell: bash
        run: |
          file=src/main/java/slimeknights/tconstruct/smeltery/block/entity/CastingBlockEntity.java
          ! grep -Fq 'ItemHandlerHelper.copyStackWithSize(held, 1)' "$file"
          grep -Fq 'held.copyWithCount(1)' "$file"
          git diff --check

      - name: Commit migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/slimeknights/tconstruct/smeltery/block/entity/CastingBlockEntity.java
          git diff --cached --quiet || {
            git commit -m 'Replace removed casting stack copy helper'
            git push origin HEAD:1.21.1-neoforge
          }

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --repo "$GITHUB_REPOSITORY" --ref 1.21.1-neoforge
