name: Tinkers Projectile Compatibility Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout latest Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Port fireball and shuriken projectiles to 1.21
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise RuntimeError(f'{label}: expected exactly one match, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # CustomFireball: 1.21 projectile constructors accept a Vec3 acceleration and enchantment post-hit moved to EnchantmentHelper.
          path = Path('src/main/java/slimeknights/tconstruct/tools/entity/CustomFireball.java')
          text = path.read_text(encoding='utf-8')
          anchor = 'import net.minecraft.resources.ResourceLocation;\n'
          if text.count(anchor) != 1:
              raise RuntimeError('CustomFireball ResourceLocation import anchor changed')
          if 'import net.minecraft.server.level.ServerLevel;\n' not in text:
              text = text.replace(anchor, anchor + 'import net.minecraft.server.level.ServerLevel;\n', 1)
          anchor = 'import net.minecraft.world.item.ItemStack;\n'
          if text.count(anchor) != 1:
              raise RuntimeError('CustomFireball ItemStack import anchor changed')
          if 'import net.minecraft.world.item.enchantment.EnchantmentHelper;\n' not in text:
              text = text.replace(anchor, anchor + 'import net.minecraft.world.item.enchantment.EnchantmentHelper;\n', 1)
          anchor = 'import net.minecraft.world.phys.HitResult;\n'
          if text.count(anchor) != 1:
              raise RuntimeError('CustomFireball HitResult import anchor changed')
          if 'import net.minecraft.world.phys.Vec3;\n' not in text:
              text = text.replace(anchor, anchor + 'import net.minecraft.world.phys.Vec3;\n', 1)
          old = '    super(TinkerModifiers.fireball.get(), shooter, xOffset, yOffset, zOffset, level);'
          new = '    super(TinkerModifiers.fireball.get(), shooter, new Vec3(xOffset, yOffset, zOffset), level);'
          if text.count(old) != 1:
              raise RuntimeError('CustomFireball living constructor changed')
          text = text.replace(old, new, 1)
          old = '    super(TinkerModifiers.fireball.get(), x, y, z, xOffset, yOffset, zOffset, pLevel);'
          new = '    super(TinkerModifiers.fireball.get(), x, y, z, new Vec3(xOffset, yOffset, zOffset), pLevel);'
          if text.count(old) != 1:
              raise RuntimeError('CustomFireball positional constructor changed')
          text = text.replace(old, new, 1)
          if text.count('ItemStack stack = getItemRaw();') != 1:
              raise RuntimeError('CustomFireball getItemRaw call changed')
          text = text.replace('ItemStack stack = getItemRaw();', 'ItemStack stack = getItem();', 1)
          old = ('      Entity target = hit.getEntity();\n'
                 '      Entity owner = this.getOwner();\n'
                 '      if (target.hurt(CombatHelper.damageSource(TinkerEffects.needsEnderferenceOverride(target) ? enderferenceType : damageType, this, owner), getDamage()) && owner instanceof LivingEntity livingOwner) {\n'
                 '        this.doEnchantDamageEffects(livingOwner, target);\n'
                 '      }')
          new = ('      Entity target = hit.getEntity();\n'
                 '      Entity owner = this.getOwner();\n'
                 '      DamageSource source = CombatHelper.damageSource(TinkerEffects.needsEnderferenceOverride(target) ? enderferenceType : damageType, this, owner);\n'
                 '      if (target.hurt(source, getDamage()) && owner instanceof LivingEntity && this.level() instanceof ServerLevel serverLevel) {\n'
                 '        EnchantmentHelper.doPostAttackEffects(serverLevel, target, source);\n'
                 '      }')
          if text.count(old) != 1:
              raise RuntimeError('CustomFireball legacy enchant damage block changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # ThrownShuriken: use the 1.21 projectile hit/portal lifecycle while preserving custom water inertia.
          path = Path('src/main/java/slimeknights/tconstruct/tools/entity/ThrownShuriken.java')
          text = path.read_text(encoding='utf-8')
          for imp in [
              'import net.minecraft.core.BlockPos;\n',
              'import net.minecraft.world.level.block.Blocks;\n',
              'import net.minecraft.world.level.block.entity.TheEndGatewayBlockEntity;\n',
              'import net.minecraft.world.level.block.state.BlockState;\n']:
              text = text.replace(imp, '')
          old = ('  @Override\n'
                 '  public boolean isReusable() {\n'
                 '    return reclaim;\n'
                 '  }')
          new = ('  @Override\n'
                 '  public boolean isReusable() {\n'
                 '    return reclaim;\n'
                 '  }\n\n'
                 '  @Override\n'
                 '  public boolean canUsePortal(boolean allowPassengers) {\n'
                 '    return true;\n'
                 '  }')
          if text.count(old) != 1:
              raise RuntimeError('ThrownShuriken reusable method changed')
          text = text.replace(old, new, 1)
          old = ('    boolean teleported = false;\n'
                 '    if (hit.getType() == HitResult.Type.BLOCK) {\n'
                 '      BlockPos pos = ((BlockHitResult)hit).getBlockPos();\n'
                 '      BlockState state = this.level().getBlockState(pos);\n'
                 '      if (state.is(Blocks.NETHER_PORTAL)) {\n'
                 '        this.handleInsidePortal(pos);\n'
                 '        teleported = true;\n'
                 '      } else if (state.is(Blocks.END_GATEWAY)) {\n'
                 '        if (this.level().getBlockEntity(pos) instanceof TheEndGatewayBlockEntity gateway && TheEndGatewayBlockEntity.canEntityTeleport(this)) {\n'
                 '          TheEndGatewayBlockEntity.teleportEntity(this.level(), pos, state, this, gateway);\n'
                 '        }\n'
                 '        teleported = true;\n'
                 '      }\n'
                 '    }\n\n')
          if text.count(old) != 1:
              raise RuntimeError('ThrownShuriken legacy portal block changed')
          text = text.replace(old, '', 1)
          old = '    if (type != HitResult.Type.MISS && !teleported) {'
          new = '    if (type != HitResult.Type.MISS) {'
          if text.count(old) != 1:
              raise RuntimeError('ThrownShuriken impact condition changed')
          text = text.replace(old, new, 1)
          if text.count('if (!ForgeEventFactory.onProjectileImpact(this, hit)) {') != 1:
              raise RuntimeError('ThrownShuriken old projectile hook changed')
          text = text.replace('if (!ForgeEventFactory.onProjectileImpact(this, hit)) {', 'if (!EventHooks.onProjectileImpact(this, hit)) {', 1)
          if text.count('        this.onHit(hit);') != 1:
              raise RuntimeError('ThrownShuriken direct onHit call changed')
          text = text.replace('        this.onHit(hit);', '        this.hitTargetOrDeflectSelf(hit);', 1)
          old = ('  @Override\n'
                 '  protected void defineSynchedData() {\n'
                 '    this.entityData.define(STACK, ItemStack.EMPTY);\n'
                 '    this.entityData.define(WATER_INERTIA, 0.8f);\n'
                 '  }')
          new = ('  @Override\n'
                 '  protected void defineSynchedData(SynchedEntityData.Builder builder) {\n'
                 '    builder.define(STACK, ItemStack.EMPTY);\n'
                 '    builder.define(WATER_INERTIA, 0.8f);\n'
                 '  }')
          if text.count(old) != 1:
              raise RuntimeError('ThrownShuriken synced data block changed')
          text = text.replace(old, new, 1)
          if text.count('tag.put(KEY_STACK, this.stack.save(new CompoundTag()));') != 1:
              raise RuntimeError('ThrownShuriken stack save changed')
          text = text.replace('tag.put(KEY_STACK, this.stack.save(new CompoundTag()));', 'tag.put(KEY_STACK, this.stack.save(this.registryAccess()));', 1)
          if text.count('setStack(ItemStack.of(tag.getCompound(KEY_STACK)));') != 1:
              raise RuntimeError('ThrownShuriken stack load changed')
          text = text.replace('setStack(ItemStack.of(tag.getCompound(KEY_STACK)));', 'setStack(ItemStack.parse(this.registryAccess(), tag.getCompound(KEY_STACK)).orElse(ItemStack.EMPTY));', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify projectile migration
        shell: bash
        run: |
          grep -Fq 'new Vec3(xOffset, yOffset, zOffset)' src/main/java/slimeknights/tconstruct/tools/entity/CustomFireball.java
          grep -Fq 'EnchantmentHelper.doPostAttackEffects(serverLevel, target, source);' src/main/java/slimeknights/tconstruct/tools/entity/CustomFireball.java
          ! grep -Fq 'getItemRaw()' src/main/java/slimeknights/tconstruct/tools/entity/CustomFireball.java
          grep -Fq 'public boolean canUsePortal(boolean allowPassengers)' src/main/java/slimeknights/tconstruct/tools/entity/ThrownShuriken.java
          grep -Fq 'EventHooks.onProjectileImpact(this, hit)' src/main/java/slimeknights/tconstruct/tools/entity/ThrownShuriken.java
          grep -Fq 'this.hitTargetOrDeflectSelf(hit);' src/main/java/slimeknights/tconstruct/tools/entity/ThrownShuriken.java
          grep -Fq 'defineSynchedData(SynchedEntityData.Builder builder)' src/main/java/slimeknights/tconstruct/tools/entity/ThrownShuriken.java
          grep -Fq 'ItemStack.parse(this.registryAccess()' src/main/java/slimeknights/tconstruct/tools/entity/ThrownShuriken.java
          ! grep -Fq 'ForgeEventFactory.onProjectileImpact' src/main/java/slimeknights/tconstruct/tools/entity/ThrownShuriken.java
          ! grep -Fq 'handleInsidePortal' src/main/java/slimeknights/tconstruct/tools/entity/ThrownShuriken.java
          git diff --check

      - name: Commit projectile migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/slimeknights/tconstruct/tools/entity/CustomFireball.java src/main/java/slimeknights/tconstruct/tools/entity/ThrownShuriken.java
          git commit -m 'Port fireball and shuriken projectiles to 1.21'
          git push origin HEAD:1.21.1-neoforge

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --ref 1.21.1-neoforge
