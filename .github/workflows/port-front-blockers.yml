name: Tinkers Front Blocker Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for active port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while gh run list --repo "$GITHUB_REPOSITORY" --workflow port-compile.yml --branch 1.21.1-neoforge --limit 30 --json status --jq '.[] | select(.status == "queued" or .status == "in_progress") | .status' | grep -q .; do
            sleep 15
          done

      - name: Checkout Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge

      - name: Wire condition codec registries
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('src/main/java/slimeknights/tconstruct')
          commons = root / 'shared/TinkerCommons.java'
          text = commons.read_text(encoding='utf-8')

          if 'import com.mojang.serialization.MapCodec;' not in text:
              text = text.replace('package slimeknights.tconstruct.shared;\n\n', 'package slimeknights.tconstruct.shared;\n\nimport com.mojang.serialization.MapCodec;\n', 1)
          if 'import net.neoforged.neoforge.common.conditions.ICondition;' not in text:
              text = text.replace('import net.neoforged.neoforge.common.NeoForge;\n', 'import net.neoforged.neoforge.common.NeoForge;\nimport net.neoforged.neoforge.common.conditions.ICondition;\n', 1)

          marker = '  /* Loot conditions */\n'
          if 'CONDITION_CODECS.register' not in text:
              if marker not in text:
                  raise SystemExit('Missing loot condition marker')
              resource_conditions = '''  /* Resource conditions */
          public static final DeferredHolder<MapCodec<? extends ICondition>, MapCodec<ConfigEnabledCondition>> configCondition = CONDITION_CODECS.register(ConfigEnabledCondition.ID.getPath(), () -> ConfigEnabledCondition.CODEC);
          @SuppressWarnings("removal")
          public static final DeferredHolder<MapCodec<? extends ICondition>, MapCodec<TagIntersectionPresentCondition<?>>> tagIntersectionCondition = CONDITION_CODECS.register(TagIntersectionPresentCondition.ID.getPath(), () -> TagIntersectionPresentCondition.CODEC);
          @SuppressWarnings("removal")
          public static final DeferredHolder<MapCodec<? extends ICondition>, MapCodec<TagDifferencePresentCondition<?>>> tagDifferenceCondition = CONDITION_CODECS.register(TagDifferencePresentCondition.ID.getPath(), () -> TagDifferencePresentCondition.CODEC);
          @SuppressWarnings("removal")
          public static final DeferredHolder<MapCodec<? extends ICondition>, MapCodec<TagNotEmptyCondition<?>>> tagNotEmptyCondition = CONDITION_CODECS.register(TagNotEmptyCondition.ID.getPath(), () -> TagNotEmptyCondition.CODEC);

          '''
              resource_conditions = '\n'.join(line[10:] if line.startswith('          ') else line for line in resource_conditions.splitlines()) + '\n'
              text = text.replace(marker, resource_conditions + marker, 1)

          replacements = [
              ('new LootItemConditionType(ConfigEnabledCondition.SERIALIZER)', 'new LootItemConditionType(ConfigEnabledCondition.CODEC)'),
              ('new LootItemConditionType(new BlockOrEntityCondition.ConditionSerializer())', 'new LootItemConditionType(BlockOrEntityCondition.CODEC)'),
              ('new LootItemConditionType(new HasLootContextSetCondition.Serializer())', 'new LootItemConditionType(HasLootContextSetCondition.CODEC)'),
              ('new LootItemConditionType(new TagNotEmptyCondition.ConditionSerializer())', 'new LootItemConditionType(TagNotEmptyCondition.CODEC)'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit('Missing expected TinkerCommons registration: ' + old)
              text = text.replace(old, new, 1)

          for stale in [
              '      CraftingHelper.register(ConfigEnabledCondition.SERIALIZER);\n',
              '      CraftingHelper.register(TagIntersectionPresentCondition.SERIALIZER);\n',
              '      CraftingHelper.register(TagDifferencePresentCondition.SERIALIZER);\n',
              '      CraftingHelper.register(new TagNotEmptyCondition.ConditionSerializer());\n',
          ]:
              if stale not in text:
                  raise SystemExit('Missing expected stale registration: ' + stale.strip())
              text = text.replace(stale, '', 1)
          commons.write_text(text, encoding='utf-8')

          modifiers = root / 'tools/TinkerModifiers.java'
          text = modifiers.read_text(encoding='utf-8')
          replacements = [
              ('new LootItemConditionType(new HasModifierLootCondition.ConditionSerializer())', 'new LootItemConditionType(HasModifierLootCondition.CODEC)'),
              ('new LootItemConditionType(ChrysophiliteLootCondition.SERIALIZER)', 'new LootItemConditionType(ChrysophiliteLootCondition.CODEC)'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit('Missing expected TinkerModifiers registration: ' + old)
              text = text.replace(old, new, 1)
          modifiers.write_text(text, encoding='utf-8')
          PY

      - name: Verify condition registry wiring
        run: |
          if grep -R "IConditionSerializer\|world.level.storage.loot.Serializer\|ConfigEnabledCondition.SERIALIZER\|TagIntersectionPresentCondition.SERIALIZER\|TagDifferencePresentCondition.SERIALIZER\|ConditionSerializer()\|ChrysophiliteLootCondition.SERIALIZER" -n \
            src/main/java/slimeknights/tconstruct/common/json \
            src/main/java/slimeknights/tconstruct/library/json/condition \
            src/main/java/slimeknights/tconstruct/library/json/loot/HasLootContextSetCondition.java \
            src/main/java/slimeknights/tconstruct/tools/modifiers/loot \
            src/main/java/slimeknights/tconstruct/shared/TinkerCommons.java \
            src/main/java/slimeknights/tconstruct/tools/TinkerModifiers.java; then
            echo 'Found stale condition serializer APIs.'
            exit 1
          fi
          grep -q 'CONDITION_CODECS.register' src/main/java/slimeknights/tconstruct/shared/TinkerCommons.java
          grep -q 'LootItemConditionType(ConfigEnabledCondition.CODEC)' src/main/java/slimeknights/tconstruct/shared/TinkerCommons.java
          grep -q 'LootItemConditionType(HasModifierLootCondition.CODEC)' src/main/java/slimeknights/tconstruct/tools/TinkerModifiers.java

      - name: Commit targeted migration
        run: |
          if git diff --quiet; then
            echo 'No condition registry changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java
          git commit -m 'Wire 1.21 condition and loot codecs'
          git push origin HEAD:1.21.1-neoforge

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --ref 1.21.1-neoforge
