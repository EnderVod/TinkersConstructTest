name: Tinkers Front Blocker Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Wait for active port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while gh run list --repo "$GITHUB_REPOSITORY" --workflow port-compile.yml --branch 1.21.1-neoforge --limit 30 --json status --jq '.[] | select(.status == "queued" or .status == "in_progress") | .status' | grep -q .; do
            sleep 15
          done

      - name: Checkout latest Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Migrate modifiable arrows to ProjectileItem
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          arrow = Path('src/main/java/slimeknights/tconstruct/library/tools/item/ModifiableArrowItem.java')
          text = arrow.read_text(encoding='utf-8')
          replacements = {
              'package slimeknights.tconstruct.library.tools.item;\n\n': 'package slimeknights.tconstruct.library.tools.item;\n\nimport net.minecraft.core.Direction;\nimport net.minecraft.core.Position;\n',
              'import net.minecraft.world.entity.projectile.AbstractArrow;\n': 'import net.minecraft.world.entity.projectile.AbstractArrow;\nimport net.minecraft.world.entity.projectile.Projectile;\n',
              'import java.util.List;\n': 'import javax.annotation.Nullable;\nimport java.util.List;\n',
              '  public AbstractArrow createArrow(Level level, ItemStack stack, LivingEntity shooter) {\n    ModifiableArrow arrow = new ModifiableArrow(level, shooter);\n    arrow.onCreate(stack, shooter);\n    return arrow;\n  }': '  public AbstractArrow createArrow(Level level, ItemStack stack, LivingEntity shooter, @Nullable ItemStack weapon) {\n    ModifiableArrow arrow = new ModifiableArrow(level, shooter);\n    arrow.onCreate(stack, shooter);\n    return arrow;\n  }\n\n  @Override\n  public Projectile asProjectile(Level level, Position position, ItemStack stack, Direction direction) {\n    ModifiableArrow arrow = new ModifiableArrow(level, position.x(), position.y(), position.z());\n    arrow.onCreate(stack, null);\n    arrow.pickup = AbstractArrow.Pickup.ALLOWED;\n    return arrow;\n  }'
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected arrow token: {old!r}')
              text = text.replace(old, new)
          arrow.write_text(text, encoding='utf-8')

          tools = Path('src/main/java/slimeknights/tconstruct/tools/TinkerTools.java')
          text = tools.read_text(encoding='utf-8')
          for old in [
              'import slimeknights.tconstruct.tools.logic.ModifiableArrowDispenserBehavior;\n',
              '      DispenserBlock.registerBehavior(TinkerTools.arrow.get(), ModifiableArrowDispenserBehavior.INSTANCE);\n'
          ]:
              if old not in text:
                  raise SystemExit(f'Missing expected TinkerTools token: {old!r}')
              text = text.replace(old, '')
          tools.write_text(text, encoding='utf-8')
          PY
          rm src/main/java/slimeknights/tconstruct/tools/logic/ModifiableArrowDispenserBehavior.java

      - name: Verify targeted migration
        shell: bash
        run: |
          grep -Fq 'public Projectile asProjectile' src/main/java/slimeknights/tconstruct/library/tools/item/ModifiableArrowItem.java
          grep -Fq '@Nullable ItemStack weapon' src/main/java/slimeknights/tconstruct/library/tools/item/ModifiableArrowItem.java
          test ! -e src/main/java/slimeknights/tconstruct/tools/logic/ModifiableArrowDispenserBehavior.java
          test -z "$(grep -F 'ModifiableArrowDispenserBehavior' src/main/java/slimeknights/tconstruct/tools/TinkerTools.java || true)"

      - name: Commit grouped migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/main/java/slimeknights/tconstruct/library/tools/item/ModifiableArrowItem.java \
                     src/main/java/slimeknights/tconstruct/tools/TinkerTools.java \
                     src/main/java/slimeknights/tconstruct/tools/logic/ModifiableArrowDispenserBehavior.java
          git diff --cached --quiet && exit 0
          git commit -m 'Migrate modifiable arrows to 1.21 ProjectileItem API'
          git push origin HEAD:1.21.1-neoforge

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --repo "$GITHUB_REPOSITORY" --ref 1.21.1-neoforge
