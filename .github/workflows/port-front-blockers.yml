name: Tinkers Front Blocker Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for active port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while gh run list --repo "$GITHUB_REPOSITORY" --workflow port-compile.yml --branch 1.21.1-neoforge --limit 20 --json status --jq '.[] | select(.status == "queued" or .status == "in_progress") | .status' | grep -q .; do
            sleep 15
          done

      - name: Checkout Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge

      - name: Migrate book client APIs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('src/main/java/slimeknights/tconstruct/library/client/book/content')
          changed = []

          def edit(rel, replacements):
              path = root / rel
              original = path.read_text(encoding='utf-8')
              text = original
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'Missing expected source in {rel}: {old!r}')
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          for rel in ['ContentModifier.java', 'AbstractMaterialContent.java', 'FluidEffectContent.java']:
              edit(rel, [
                  ('import net.minecraftforge.common.ForgeI18n;', 'import net.minecraft.client.resources.language.I18n;'),
                  ('ForgeI18n.getPattern(', 'I18n.get('),
              ])

          edit('ContentTool.java', [
              ('import net.minecraftforge.common.ForgeI18n;\n', ''),
              ('import net.minecraftforge.common.crafting.IShapedRecipe;', 'import net.minecraft.world.item.crafting.ShapedRecipe;'),
              ('import net.neoforged.neoforge.registries.ForgeRegistries;', 'import net.minecraft.core.registries.BuiltInRegistries;'),
              ('ForgeI18n.getPattern(', 'I18n.get('),
              ('ForgeRegistries.ITEMS.getValue(new ResourceLocation(this.toolName))', 'BuiltInRegistries.ITEM.get(ResourceLocation.parse(this.toolName))'),
              ('recipe instanceof IShapedRecipe<?> shaped', 'recipe instanceof ShapedRecipe shaped'),
              ('shaped.getRecipeWidth()', 'shaped.getWidth()'),
              ('shaped.getRecipeHeight()', 'shaped.getHeight()'),
          ])

          print(f'Updated {len(changed)} book files')
          for path in changed:
              print(path)
          PY

      - name: Verify book client API migration
        run: |
          if grep -R "ForgeI18n\|IShapedRecipe\|ForgeRegistries\|new ResourceLocation(this.toolName)" -n \
            src/main/java/slimeknights/tconstruct/library/client/book/content; then
            echo 'Found stale book client APIs.'
            exit 1
          fi

      - name: Commit targeted migration
        run: |
          if git diff --quiet; then
            echo 'No book client migration changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java
          git commit -m 'Migrate book client APIs to 1.21'
          git push origin HEAD:1.21.1-neoforge

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --ref 1.21.1-neoforge
