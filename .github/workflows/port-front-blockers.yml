name: Tinkers Port Compile Dispatch

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - '.github/workflows/port-front-blockers.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Start Tinkers compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --ref 1.21.1-neoforge
