name: Tinkers Front Blocker Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for active port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while gh run list --repo "$GITHUB_REPOSITORY" --workflow port-compile.yml --branch 1.21.1-neoforge --limit 30 --json status --jq '.[] | select(.status == "queued" or .status == "in_progress") | .status' | grep -q .; do
            sleep 15
          done

      - name: Checkout Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge

      - name: Migrate item display contexts to NeoForge enum extensions
        run: |
          cat > src/main/java/slimeknights/tconstruct/library/TinkerItemDisplays.java <<'JAVA'
          package slimeknights.tconstruct.library;

          import net.minecraft.world.item.ItemDisplayContext;

          /** Custom transform types used for Tinkers item rendering. */
          public class TinkerItemDisplays {
            private TinkerItemDisplays() {}

            /**
             * Kept as the existing bootstrap hook. NeoForge 1.21 loads the actual enum values from
             * META-INF/enumextensions.json before normal mod construction, so no runtime registry call is needed.
             */
            public static void init() {}

            /** Used by the melter and smeltery for display of items being melted. */
            public static final ItemDisplayContext MELTER = ItemDisplayContext.valueOf("TCONSTRUCT_MELTER");
            /** Used by the part builder, crafting station, tinkers station, and tinker anvil. */
            public static final ItemDisplayContext TABLE = ItemDisplayContext.valueOf("TCONSTRUCT_TABLE");
            /** Used by the casting table for item rendering. */
            public static final ItemDisplayContext CASTING_TABLE = ItemDisplayContext.valueOf("TCONSTRUCT_CASTING_TABLE");
            /** Used by the casting basin for item rendering. */
            public static final ItemDisplayContext CASTING_BASIN = ItemDisplayContext.valueOf("TCONSTRUCT_CASTING_BASIN");
            /** Used by the fluid cannon for display of the item in front. */
            public static final ItemDisplayContext FLUID_CANNON = ItemDisplayContext.valueOf("TCONSTRUCT_FLUID_CANNON");
            /** Used by throwing to allow adjusting the tool position. */
            public static final ItemDisplayContext THROWN = ItemDisplayContext.valueOf("TCONSTRUCT_THROWN");
          }
          JAVA

          cat > src/main/resources/META-INF/enumextensions.json <<'JSON'
          {
            "entries": [
              {
                "enum": "net/minecraft/world/item/ItemDisplayContext",
                "name": "TCONSTRUCT_MELTER",
                "constructor": "(ILjava/lang/String;Ljava/lang/String;)V",
                "parameters": [ -1, "tconstruct:melter", null ]
              },
              {
                "enum": "net/minecraft/world/item/ItemDisplayContext",
                "name": "TCONSTRUCT_TABLE",
                "constructor": "(ILjava/lang/String;Ljava/lang/String;)V",
                "parameters": [ -1, "tconstruct:table", null ]
              },
              {
                "enum": "net/minecraft/world/item/ItemDisplayContext",
                "name": "TCONSTRUCT_CASTING_TABLE",
                "constructor": "(ILjava/lang/String;Ljava/lang/String;)V",
                "parameters": [ -1, "tconstruct:casting_table", "FIXED" ]
              },
              {
                "enum": "net/minecraft/world/item/ItemDisplayContext",
                "name": "TCONSTRUCT_CASTING_BASIN",
                "constructor": "(ILjava/lang/String;Ljava/lang/String;)V",
                "parameters": [ -1, "tconstruct:casting_basin", null ]
              },
              {
                "enum": "net/minecraft/world/item/ItemDisplayContext",
                "name": "TCONSTRUCT_FLUID_CANNON",
                "constructor": "(ILjava/lang/String;Ljava/lang/String;)V",
                "parameters": [ -1, "tconstruct:fluid_cannon", "FIXED" ]
              },
              {
                "enum": "net/minecraft/world/item/ItemDisplayContext",
                "name": "TCONSTRUCT_THROWN",
                "constructor": "(ILjava/lang/String;Ljava/lang/String;)V",
                "parameters": [ -1, "tconstruct:thrown", "FIXED" ]
              }
            ]
          }
          JSON

          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/main/resources/META-INF/neoforge.mods.toml')
          text = path.read_text(encoding='utf-8')
          if 'enumExtensions="META-INF/enumextensions.json"' not in text:
            anchor = '    displayURL="https://www.curseforge.com/minecraft/mc-mods/tinkers-construct"\n'
            if anchor not in text:
              raise SystemExit('Missing Tinkers mod displayURL anchor')
            text = text.replace(anchor, anchor + '    enumExtensions="META-INF/enumextensions.json"\n', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify item display enum extension migration
        run: |
          grep -Fq 'ItemDisplayContext.valueOf("TCONSTRUCT_MELTER")' src/main/java/slimeknights/tconstruct/library/TinkerItemDisplays.java
          grep -Fq 'ItemDisplayContext.valueOf("TCONSTRUCT_THROWN")' src/main/java/slimeknights/tconstruct/library/TinkerItemDisplays.java
          grep -Fq '"name": "TCONSTRUCT_CASTING_TABLE"' src/main/resources/META-INF/enumextensions.json
          grep -Fq '"parameters": [ -1, "tconstruct:casting_table", "FIXED" ]' src/main/resources/META-INF/enumextensions.json
          grep -Fq 'enumExtensions="META-INF/enumextensions.json"' src/main/resources/META-INF/neoforge.mods.toml
          test -z "$(grep -E 'ForgeRegistries|IForgeRegistry|RegisterEvent|ItemDisplayContext.create' src/main/java/slimeknights/tconstruct/library/TinkerItemDisplays.java || true)"

      - name: Commit targeted migration
        run: |
          if git diff --quiet; then
            echo 'Item display enum extensions are already migrated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/main/java/slimeknights/tconstruct/library/TinkerItemDisplays.java \
            src/main/resources/META-INF/enumextensions.json \
            src/main/resources/META-INF/neoforge.mods.toml
          git commit -m 'Migrate item display contexts to NeoForge enum extensions'
          git push origin HEAD:1.21.1-neoforge

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --ref 1.21.1-neoforge
