name: Tinkers Front Blocker Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for active port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while gh run list --repo "$GITHUB_REPOSITORY" --workflow port-compile.yml --branch 1.21.1-neoforge --limit 20 --json status --jq '.[] | select(.status == "queued" or .status == "in_progress") | .status' | grep -q .; do
            sleep 15
          done

      - name: Checkout Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge

      - name: Migrate recipe builder FinishedRecipe imports
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('src/main/java')
          old = 'import net.minecraft.data.recipes.FinishedRecipe;'
          new = 'import slimeknights.mantle.recipe.data.FinishedRecipe;'
          changed = []

          for path in root.rglob('*.java'):
              text = path.read_text(encoding='utf-8')
              if old in text:
                  path.write_text(text.replace(old, new), encoding='utf-8')
                  changed.append(str(path))

          if not changed:
              raise SystemExit('No legacy FinishedRecipe imports found; refusing empty migration')

          print(f'Updated {len(changed)} Java files')
          for path in changed:
              print(path)
          PY

      - name: Verify FinishedRecipe bridge migration
        run: |
          if grep -R "import net.minecraft.data.recipes.FinishedRecipe;" -n src/main/java; then
            echo 'Found stale vanilla FinishedRecipe imports.'
            exit 1
          fi

      - name: Commit targeted migration
        run: |
          if git diff --quiet; then
            echo 'No FinishedRecipe migration changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java
          git commit -m 'Use Mantle FinishedRecipe bridge'
          git push origin HEAD:1.21.1-neoforge

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --ref 1.21.1-neoforge
