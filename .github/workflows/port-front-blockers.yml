name: Tinkers Front Blocker Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for active port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while gh run list --repo "$GITHUB_REPOSITORY" --workflow port-compile.yml --branch 1.21.1-neoforge --limit 20 --json status --jq '.[] | select(.status == "queued" or .status == "in_progress") | .status' | grep -q .; do
            sleep 15
          done

      - name: Checkout Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge

      - name: Apply targeted front blocker migrations
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('src/main/java')
          replacements = {
              'import net.minecraftforge.common.crafting.conditions.ICondition;': 'import net.neoforged.neoforge.common.conditions.ICondition;',
              'import net.minecraftforge.common.crafting.conditions.ICondition.IContext;': 'import net.neoforged.neoforge.common.conditions.ICondition.IContext;',
              'import net.minecraftforge.fml.ModLoader;': 'import net.neoforged.fml.ModLoader;',
              'import net.minecraftforge.fml.event.IModBusEvent;': 'import net.neoforged.fml.event.IModBusEvent;',
              'import net.minecraftforge.fml.javafmlmod.FMLJavaModLoadingContext;': 'import net.neoforged.fml.javafmlmod.FMLJavaModLoadingContext;',
              # The port already contains a local legacy LazyOptional bridge under net.minecraftforge.
              # A previous namespace sweep accidentally pointed these imports at a nonexistent NeoForge class.
              'import net.neoforged.neoforge.common.util.LazyOptional;': 'import net.minecraftforge.common.util.LazyOptional;',
          }

          if not (root / 'net/minecraftforge/common/util/LazyOptional.java').exists():
              raise SystemExit('Legacy LazyOptional compatibility shim is missing; refusing import migration.')

          changed = []
          for path in root.rglob('*.java'):
              original = path.read_text(encoding='utf-8')
              text = original
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          # ModifierManager: NeoForge conditions are codec-based; Mantle already exposes the bridge.
          modifier = root / 'slimeknights/tconstruct/library/modifiers/ModifierManager.java'
          text = modifier.read_text(encoding='utf-8')
          text = text.replace('import net.minecraftforge.common.crafting.CraftingHelper;\n', '')
          if 'import slimeknights.mantle.recipe.condition.ConditionHelper;' not in text:
              text = text.replace('import slimeknights.mantle.data.loadable.field.ContextKey;\n', 'import slimeknights.mantle.data.loadable.field.ContextKey;\nimport slimeknights.mantle.recipe.condition.ConditionHelper;\n')
          text = text.replace('ModLoader.get().runEventGenerator(ModifierRegistrationEvent::new);', 'ModLoader.runEventGenerator(ModifierRegistrationEvent::new);')
          text = text.replace('CraftingHelper.getCondition(GsonHelper.getAsJsonObject(json, "condition"))', 'ConditionHelper.deserialize(GsonHelper.getAsJsonObject(json, "condition"))')
          if text != modifier.read_text(encoding='utf-8'):
              modifier.write_text(text, encoding='utf-8')
              if str(modifier) not in changed:
                  changed.append(str(modifier))

          # Core compile intentionally excludes the unported datagen packages in build.gradle.
          # Keep runtime modules from compile-time linking against those excluded providers until datagen is ported.
          commons = root / 'slimeknights/tconstruct/shared/TinkerCommons.java'
          text = commons.read_text(encoding='utf-8')
          commons_imports = [
              'import net.minecraft.data.DataGenerator;\n',
              'import net.minecraft.data.PackOutput;\n',
              'import net.neoforged.neoforge.common.data.ExistingFileHelper;\n',
              'import net.neoforged.neoforge.data.event.GatherDataEvent;\n',
              'import slimeknights.tconstruct.common.data.model.ModelSpriteProvider;\n',
              'import slimeknights.tconstruct.common.data.model.TinkerBlockStateProvider;\n',
              'import slimeknights.tconstruct.common.data.model.TinkerItemModelProvider;\n',
              'import slimeknights.tconstruct.common.data.model.TinkerSpriteSourceProvider;\n',
              'import slimeknights.tconstruct.common.data.render.RenderFluidProvider;\n',
              'import slimeknights.tconstruct.common.data.render.RenderItemProvider;\n',
              'import slimeknights.tconstruct.shared.data.CommonRecipeProvider;\n',
          ]
          for imp in commons_imports:
              text = text.replace(imp, '')
          commons_datagen = '''  @SubscribeEvent
          void gatherData(final GatherDataEvent event) {
            DataGenerator generator = event.getGenerator();
            PackOutput output = generator.getPackOutput();
            ExistingFileHelper existingFileHelper = event.getExistingFileHelper();
            boolean client = event.includeClient();
            generator.addProvider(client, new ModelSpriteProvider(output, existingFileHelper));
            generator.addProvider(client, new TinkerSpriteSourceProvider(output, existingFileHelper));
            generator.addProvider(client, new TinkerItemModelProvider(output, existingFileHelper));
            generator.addProvider(client, new TinkerBlockStateProvider(output, existingFileHelper));
            generator.addProvider(client, new RenderFluidProvider(output));
            generator.addProvider(client, new RenderItemProvider(output));
            generator.addProvider(event.includeServer(), new CommonRecipeProvider(output));
          }

          '''
          # Dedent the literal exactly to source indentation.
          commons_datagen = '\n'.join(line[10:] if line.startswith('          ') else line for line in commons_datagen.splitlines()) + '\n'
          text = text.replace(commons_datagen, '')
          if text != commons.read_text(encoding='utf-8'):
              commons.write_text(text, encoding='utf-8')
              changed.append(str(commons))

          fluids = root / 'slimeknights/tconstruct/fluids/TinkerFluids.java'
          text = fluids.read_text(encoding='utf-8')
          fluid_imports = [
              'import net.minecraft.data.DataGenerator;\n',
              'import net.minecraft.data.PackOutput;\n',
              'import net.neoforged.neoforge.data.event.GatherDataEvent;\n',
              'import slimeknights.mantle.fluid.texture.FluidTextureCameraProvider;\n',
              'import slimeknights.tconstruct.fluids.data.FluidBlockstateModelProvider;\n',
              'import slimeknights.tconstruct.fluids.data.FluidBucketModelProvider;\n',
              'import slimeknights.tconstruct.fluids.data.FluidTextureProvider;\n',
              'import slimeknights.tconstruct.fluids.data.FluidTooltipProvider;\n',
          ]
          for imp in fluid_imports:
              text = text.replace(imp, '')
          fluids_datagen = '''  @SubscribeEvent
          void gatherData(final GatherDataEvent event) {
            DataGenerator generator = event.getGenerator();
            PackOutput packOutput = generator.getPackOutput();
            boolean client = event.includeClient();
            generator.addProvider(client, new FluidTooltipProvider(packOutput));
            FluidTextureProvider textureProvider = new FluidTextureProvider(packOutput);
            generator.addProvider(client, textureProvider);
            generator.addProvider(client, new FluidTextureCameraProvider(packOutput, event.getExistingFileHelper(), textureProvider));
            generator.addProvider(client, new FluidBucketModelProvider(packOutput, TConstruct.MOD_ID));
            generator.addProvider(client, new FluidBlockstateModelProvider(packOutput, TConstruct.MOD_ID));
          }

          '''
          fluids_datagen = '\n'.join(line[10:] if line.startswith('          ') else line for line in fluids_datagen.splitlines()) + '\n'
          text = text.replace(fluids_datagen, '')
          if text != fluids.read_text(encoding='utf-8'):
              fluids.write_text(text, encoding='utf-8')
              changed.append(str(fluids))

          print(f'Updated {len(changed)} Java files')
          for path in changed:
              print(path)
          PY

      - name: Verify isolation targets
        run: |
          ! grep -R "net.neoforged.neoforge.common.util.LazyOptional" -n src/main/java
          ! grep -n "void gatherData(final GatherDataEvent" src/main/java/slimeknights/tconstruct/shared/TinkerCommons.java
          ! grep -n "void gatherData(final GatherDataEvent" src/main/java/slimeknights/tconstruct/fluids/TinkerFluids.java

      - name: Commit targeted migration
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java
          git commit -m 'Reconnect legacy capability shim and isolate datagen'
          git push origin HEAD:1.21.1-neoforge

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --ref 1.21.1-neoforge
