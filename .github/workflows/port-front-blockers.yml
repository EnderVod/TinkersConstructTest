name: Tinkers Block Interaction API Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout latest Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Port ranged block interaction to 1.21 APIs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/main/java/slimeknights/tconstruct/library/modifiers/fluid/block/BlockInteractFluidEffect.java')
          text = path.read_text(encoding='utf-8')

          def add_import(anchor, imp):
              global text
              if imp not in text:
                  if anchor not in text:
                      raise RuntimeError(f'import anchor missing: {anchor!r}')
                  text = text.replace(anchor, imp + anchor, 1)

          add_import('import net.minecraft.server.level.ServerPlayer;\n', 'import net.minecraft.server.level.ServerLevel;\n')
          add_import('import net.minecraft.world.InteractionResult;\n', 'import net.minecraft.world.ItemInteractionResult;\n')

          old = '''    if (!level.isClientSide && context.getPlayer() == null && stack.isDamageableItem() && !stack.is(TinkerTags.Items.MODIFIABLE)) {
      // unable to call Forge damageItem as that needs entity access, but its just vanilla broken anyways, right?
      stack.hurt(1, level.getRandom(), null);
      // calling methods again instead of using return as return may be incorrect for custom broken stacks
      if (stack.getDamageValue() >= stack.getMaxDamage()) {
        // but that won't happen, right? will need to consider another workaround in that case.
        stack.shrink(1);
        stack.setDamageValue(0);
        level.playSound(null, context.getClickedPos(), SoundEvents.ITEM_BREAK, SoundSource.BLOCKS, 1.0F, 1.0F);
      }
    }'''
          new = '''    if (level instanceof ServerLevel server && context.getPlayer() == null && stack.isDamageableItem() && !stack.is(TinkerTags.Items.MODIFIABLE)) {
      // Player-less item use does not damage vanilla tools itself. Use the 1.21 durability path so enchantments/components are honored.
      stack.hurtAndBreak(1, server, null,
        item -> level.playSound(null, context.getClickedPos(), SoundEvents.ITEM_BREAK, SoundSource.BLOCKS, 1.0F, 1.0F));
    }'''
          if text.count(old) != 1:
              raise RuntimeError('legacy player-less durability block changed unexpectedly')
          text = text.replace(old, new, 1)

          old = '''      // click the block
      ItemStack original = heldItem.copy();
      if (player != null && (useBlock == TriState.TRUE || (useItem == TriState.DEFAULT && !skipBlock))) {
        InteractionResult result = state.use(world, player, hand, hitResult);
        if (result.consumesAction()) {
          if (player instanceof ServerPlayer serverPlayer) {
            CriteriaTriggers.ITEM_USED_ON_BLOCK.trigger(serverPlayer, pos, original);
          }
          player.swing(hand, true);
          return 1;
        }
      }'''
          new = '''      // click the block. In 1.21 vanilla split item-on-block interaction from default empty-hand-style block interaction.
      ItemStack original = heldItem.copy();
      if (player != null && (useBlock == TriState.TRUE || (useItem == TriState.DEFAULT && !skipBlock))) {
        ItemInteractionResult itemResult = state.useItemOn(heldItem, world, player, hand, hitResult);
        if (itemResult.consumesAction()) {
          if (player instanceof ServerPlayer serverPlayer) {
            CriteriaTriggers.ITEM_USED_ON_BLOCK.trigger(serverPlayer, pos, original);
          }
          player.swing(hand, true);
          return 1;
        }
        if (itemResult == ItemInteractionResult.FAIL) {
          return 0;
        }
        if (itemResult == ItemInteractionResult.PASS_TO_DEFAULT_BLOCK_INTERACTION && hand == InteractionHand.MAIN_HAND) {
          InteractionResult result = state.useWithoutItem(world, player, hitResult);
          if (result.consumesAction()) {
            if (player instanceof ServerPlayer serverPlayer) {
              CriteriaTriggers.DEFAULT_BLOCK_USE.trigger(serverPlayer, pos);
            }
            player.swing(hand, true);
            return 1;
          }
          if (result == InteractionResult.FAIL) {
            return 0;
          }
        }
      }'''
          if text.count(old) != 1:
              raise RuntimeError('legacy BlockState.use block changed unexpectedly')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify block interaction migration
        shell: bash
        run: |
          grep -Fq 'stack.hurtAndBreak(1, server, null,' src/main/java/slimeknights/tconstruct/library/modifiers/fluid/block/BlockInteractFluidEffect.java
          grep -Fq 'state.useItemOn(heldItem, world, player, hand, hitResult)' src/main/java/slimeknights/tconstruct/library/modifiers/fluid/block/BlockInteractFluidEffect.java
          grep -Fq 'ItemInteractionResult.PASS_TO_DEFAULT_BLOCK_INTERACTION' src/main/java/slimeknights/tconstruct/library/modifiers/fluid/block/BlockInteractFluidEffect.java
          grep -Fq 'state.useWithoutItem(world, player, hitResult)' src/main/java/slimeknights/tconstruct/library/modifiers/fluid/block/BlockInteractFluidEffect.java
          grep -Fq 'CriteriaTriggers.DEFAULT_BLOCK_USE.trigger(serverPlayer, pos);' src/main/java/slimeknights/tconstruct/library/modifiers/fluid/block/BlockInteractFluidEffect.java
          ! grep -Fq 'stack.hurt(1, level.getRandom(), null)' src/main/java/slimeknights/tconstruct/library/modifiers/fluid/block/BlockInteractFluidEffect.java
          ! grep -Fq 'state.use(world, player, hand, hitResult)' src/main/java/slimeknights/tconstruct/library/modifiers/fluid/block/BlockInteractFluidEffect.java
          git diff --check

      - name: Commit block interaction migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/slimeknights/tconstruct/library/modifiers/fluid/block/BlockInteractFluidEffect.java
          git diff --cached --quiet || {
            git commit -m 'Port ranged block interaction to 1.21 APIs'
            git push origin HEAD:1.21.1-neoforge
          }

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --repo "$GITHUB_REPOSITORY" --ref 1.21.1-neoforge
