name: Tinkers Front Blocker Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for active port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while gh run list --repo "$GITHUB_REPOSITORY" --workflow port-compile.yml --branch 1.21.1-neoforge --limit 30 --json status --jq '.[] | select(.status == "queued" or .status == "in_progress") | .status' | grep -q .; do
            sleep 15
          done

      - name: Checkout Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge

      - name: Finish custom ingredient wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          tools = Path('src/main/java/slimeknights/tconstruct/tools/TinkerTools.java')
          text = tools.read_text(encoding='utf-8')
          old_import = 'import net.neoforged.neoforge.common.crafting.CraftingHelper;\n'
          if old_import not in text:
              raise SystemExit('Missing legacy CraftingHelper import in TinkerTools')
          text = text.replace(old_import, 'import net.neoforged.neoforge.common.crafting.IngredientType;\n', 1)
          loot_line = '  public static final DeferredHolder<? super LootItemFunctionType, LootItemFunctionType> lootAddToolData = LOOT_FUNCTIONS.register("add_tool_data", () -> new LootItemFunctionType(AddToolDataFunction.SERIALIZER));\n'
          if loot_line not in text:
              raise SystemExit('Missing lootAddToolData registration')
          if 'toolHookIngredientType = INGREDIENT_TYPES.register' not in text:
              text = text.replace(loot_line, loot_line + '\n  /** Custom ingredient matching tools that expose a given tool hook. */\n  public static final DeferredHolder<IngredientType<?>, IngredientType<ToolHookIngredient>> toolHookIngredientType =\n    INGREDIENT_TYPES.register(ToolHookIngredient.ID.getPath(), () -> new IngredientType<>(ToolHookIngredient.CODEC));\n', 1)
          stale = '      CraftingHelper.register(ToolHookIngredient.Serializer.ID, ToolHookIngredient.Serializer.INSTANCE);\n'
          if stale not in text:
              raise SystemExit('Missing legacy ToolHookIngredient registration')
          text = text.replace(stale, '', 1)
          tools.write_text(text, encoding='utf-8')

          shaped = Path('src/main/java/slimeknights/tconstruct/library/recipe/material/ShapedMaterialRecipe.java')
          text = shaped.read_text(encoding='utf-8')
          old = '        if (ingredient instanceof MaterialValueIngredient materialValue) {'
          new = '        if (ingredient.getCustomIngredient() instanceof MaterialValueIngredient materialValue) {'
          if old not in text:
              raise SystemExit('Missing MaterialValueIngredient detection in ShapedMaterialRecipe')
          shaped.write_text(text.replace(old, new, 1), encoding='utf-8')

          jei = Path('src/main/java/slimeknights/tconstruct/plugin/jei/ShapedMaterialExtension.java')
          text = jei.read_text(encoding='utf-8')
          old = '    this.materialSlots = IntStream.range(0, inputs.size()).filter(i -> inputs.get(i) instanceof MaterialValueIngredient).toArray();'
          new = '    this.materialSlots = IntStream.range(0, inputs.size()).filter(i -> inputs.get(i).getCustomIngredient() instanceof MaterialValueIngredient).toArray();'
          if old not in text:
              raise SystemExit('Missing MaterialValueIngredient detection in ShapedMaterialExtension')
          jei.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify custom ingredient wiring
        run: |
          grep -q 'toolHookIngredientType = INGREDIENT_TYPES.register' src/main/java/slimeknights/tconstruct/tools/TinkerTools.java
          test -z "$(grep 'CraftingHelper.register(ToolHookIngredient' src/main/java/slimeknights/tconstruct/tools/TinkerTools.java || true)"
          grep -q 'ingredient.getCustomIngredient() instanceof MaterialValueIngredient' src/main/java/slimeknights/tconstruct/library/recipe/material/ShapedMaterialRecipe.java
          grep -q 'getCustomIngredient() instanceof MaterialValueIngredient' src/main/java/slimeknights/tconstruct/plugin/jei/ShapedMaterialExtension.java

      - name: Commit targeted migration
        run: |
          if git diff --quiet; then
            echo 'No remaining custom ingredient wiring changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java
          git commit -m 'Finish 1.21 custom ingredient migration'
          git push origin HEAD:1.21.1-neoforge

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --ref 1.21.1-neoforge
