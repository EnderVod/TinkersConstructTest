name: Tinkers Stack Helper API Cleanup

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout latest Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Port stack copy and NBT buffer helpers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # FluidStack 1.21 exposes component-preserving copies through copyWithAmount().
          path = Path('src/main/java/slimeknights/tconstruct/library/modifiers/modules/capacity/FluidAsCapacityModule.java')
          replace_once(path, 'helper.setFluid(tool, new FluidStack(fluid, amount));',
                       'helper.setFluid(tool, fluid.copyWithAmount(amount));', 'FluidAsCapacityModule copy')

          path = Path('src/main/java/slimeknights/tconstruct/library/modifiers/modules/capacity/FluidPredicateAsCapacityModule.java')
          replace_once(path, 'helper.setFluid(tool, new FluidStack(fluid, amount));',
                       'helper.setFluid(tool, fluid.copyWithAmount(amount));', 'FluidPredicateAsCapacityModule copy')

          # FriendlyByteBuf removed readAnySizeNbt(); ordinary readNbt() is the 1.21 API used by Mantle loadables.
          path = Path('src/main/java/slimeknights/tconstruct/library/utils/GsonLoadable.java')
          replace_once(path, 'CompoundTag tag = buffer.readAnySizeNbt();',
                       'CompoundTag tag = buffer.readNbt();', 'GsonLoadable NBT read')

          # ItemStack now owns count-preserving copies and component-aware identity comparison.
          path = Path('src/main/java/slimeknights/tconstruct/library/modifiers/hook/ranged/BowAmmoModifierHook.java')
          text = path.read_text(encoding='utf-8')
          expected = {
              'ItemHandlerHelper.copyStackWithSize(ammo, projectilesDesired)': 'ammo.copyWithCount(projectilesDesired)',
              'ItemHandlerHelper.copyStackWithSize(ammo, Math.min(projectilesDesired, ammo.getCount()))': 'ammo.copyWithCount(Math.min(projectilesDesired, ammo.getCount()))',
              'ItemHandlerHelper.copyStackWithSize(standardAmmo, projectilesDesired)': 'standardAmmo.copyWithCount(projectilesDesired)',
              'ItemStack.isSameItemSameTags(stack, match)': 'ItemStack.isSameItemSameComponents(stack, match)',
          }
          for old, new in expected.items():
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'BowAmmoModifierHook expected exactly one {old!r}, found {count}')
              text = text.replace(old, new, 1)
          if 'ItemHandlerHelper.' not in text:
              text = text.replace('import net.neoforged.neoforge.items.ItemHandlerHelper;\n', '')
          path.write_text(text, encoding='utf-8')

          path = Path('src/main/java/slimeknights/tconstruct/library/modifiers/fluid/general/DropItemFluidEffect.java')
          text = path.read_text(encoding='utf-8')
          old = 'ItemHandlerHelper.copyStackWithSize(item.get(), count * item.getCount())'
          new = 'item.get().copyWithCount(count * item.getCount())'
          if text.count(old) != 1:
              raise RuntimeError('DropItemFluidEffect stack copy changed unexpectedly')
          text = text.replace(old, new, 1)
          if 'ItemHandlerHelper.' not in text:
              text = text.replace('import net.neoforged.neoforge.items.ItemHandlerHelper;\n', '')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify stack helper cleanup
        shell: bash
        run: |
          grep -Fq 'fluid.copyWithAmount(amount)' src/main/java/slimeknights/tconstruct/library/modifiers/modules/capacity/FluidAsCapacityModule.java
          grep -Fq 'fluid.copyWithAmount(amount)' src/main/java/slimeknights/tconstruct/library/modifiers/modules/capacity/FluidPredicateAsCapacityModule.java
          grep -Fq 'CompoundTag tag = buffer.readNbt();' src/main/java/slimeknights/tconstruct/library/utils/GsonLoadable.java
          test "$(grep -F -c '.copyWithCount(' src/main/java/slimeknights/tconstruct/library/modifiers/hook/ranged/BowAmmoModifierHook.java)" -ge 3
          grep -Fq 'ItemStack.isSameItemSameComponents(stack, match)' src/main/java/slimeknights/tconstruct/library/modifiers/hook/ranged/BowAmmoModifierHook.java
          grep -Fq 'item.get().copyWithCount(count * item.getCount())' src/main/java/slimeknights/tconstruct/library/modifiers/fluid/general/DropItemFluidEffect.java
          ! grep -R -F 'ItemHandlerHelper.copyStackWithSize' \
            src/main/java/slimeknights/tconstruct/library/modifiers/hook/ranged/BowAmmoModifierHook.java \
            src/main/java/slimeknights/tconstruct/library/modifiers/fluid/general/DropItemFluidEffect.java
          ! grep -Fq 'readAnySizeNbt' src/main/java/slimeknights/tconstruct/library/utils/GsonLoadable.java
          git diff --check

      - name: Commit stack helper cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/main/java/slimeknights/tconstruct/library/modifiers/modules/capacity/FluidAsCapacityModule.java \
            src/main/java/slimeknights/tconstruct/library/modifiers/modules/capacity/FluidPredicateAsCapacityModule.java \
            src/main/java/slimeknights/tconstruct/library/utils/GsonLoadable.java \
            src/main/java/slimeknights/tconstruct/library/modifiers/hook/ranged/BowAmmoModifierHook.java \
            src/main/java/slimeknights/tconstruct/library/modifiers/fluid/general/DropItemFluidEffect.java
          git diff --cached --quiet || {
            git commit -m 'Port stack copy and buffer helpers to 1.21'
            git push origin HEAD:1.21.1-neoforge
          }

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --repo "$GITHUB_REPOSITORY" --ref 1.21.1-neoforge
