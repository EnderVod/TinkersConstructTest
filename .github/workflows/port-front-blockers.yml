name: Tinkers Front Blocker Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for active port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while gh run list --repo "$GITHUB_REPOSITORY" --workflow port-compile.yml --branch 1.21.1-neoforge --limit 20 --json status --jq '.[] | select(.status == "queued" or .status == "in_progress") | .status' | grep -q .; do
            sleep 15
          done

      - name: Checkout Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge

      - name: Migrate flowing fluid base APIs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('src/main/java/slimeknights/tconstruct')
          changed = []

          def edit(rel, replacements):
              path = root / rel
              original = path.read_text(encoding='utf-8')
              text = original
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'Missing expected source in {rel}: {old!r}')
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          # Mantle 1.21 builds all standard flowing fluids on NeoForge BaseFlowingFluid.
          edit('fluids/TinkerFluids.java', [
              ('import net.minecraft.world.level.pathfinder.BlockPathTypes;', 'import net.minecraft.world.level.pathfinder.PathType;'),
              ('import net.minecraftforge.common.ForgeMod;', 'import net.neoforged.neoforge.common.NeoForgeMod;'),
              ('import net.minecraftforge.common.SoundActions;', 'import net.neoforged.neoforge.common.SoundActions;'),
              ('import net.neoforged.neoforge.fluids.ForgeFlowingFluid;', 'import net.neoforged.neoforge.fluids.BaseFlowingFluid;'),
              ('ForgeMod.enableMilkFluid();', 'NeoForgeMod.enableMilkFluid();'),
              ('FlowingFluidObject<ForgeFlowingFluid>', 'FlowingFluidObject<BaseFlowingFluid>'),
              ('BlockPathTypes.LAVA', 'PathType.LAVA'),
          ])
          edit('fluids/fluids/SlimeFluid.java', [
              ('import net.neoforged.neoforge.fluids.ForgeFlowingFluid;', 'import net.neoforged.neoforge.fluids.BaseFlowingFluid;'),
              ('extends ForgeFlowingFluid', 'extends BaseFlowingFluid'),
          ])

          print(f'Updated {len(changed)} Java files')
          for path in changed:
              print(path)
          PY

      - name: Verify flowing fluid migration
        run: |
          if grep -R "ForgeFlowingFluid\|net.minecraftforge.common.ForgeMod\|net.minecraftforge.common.SoundActions\|BlockPathTypes" -n \
            src/main/java/slimeknights/tconstruct/fluids; then
            echo 'Found stale flowing-fluid API references.'
            exit 1
          fi

      - name: Commit targeted migration
        run: |
          if git diff --quiet; then
            echo 'No flowing-fluid changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java
          git commit -m 'Migrate fluids to BaseFlowingFluid'
          git push origin HEAD:1.21.1-neoforge

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --ref 1.21.1-neoforge
