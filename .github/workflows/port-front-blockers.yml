name: Tinkers Small API Cleanup Batch

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout latest Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Port small 1.21 API removals
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise RuntimeError(f'{path}: expected {count} occurrences of {old!r}, found {actual}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          replace(
              'src/main/java/slimeknights/tconstruct/library/modifiers/modules/armor/ReplaceBlockWalkerModule.java',
              'ForgeEventFactory.onBlockPlace',
              'EventHooks.onBlockPlace')

          path = Path('src/main/java/slimeknights/tconstruct/library/modifiers/modules/technical/ArmorStatModule.java')
          text = path.read_text(encoding='utf-8')
          if 'import net.minecraft.world.entity.LivingEntity;\n' not in text:
              anchor = 'import net.minecraft.world.entity.Entity;\n'
              if anchor not in text:
                  raise RuntimeError('ArmorStatModule entity import anchor missing')
              text = text.replace(anchor, anchor + 'import net.minecraft.world.entity.LivingEntity;\n', 1)
          old = 'return living.getCapability(TinkerDataCapability.CAPABILITY).resolve().map(data -> data.get(key)).orElse(0f);'
          new = 'return living instanceof LivingEntity entity ? TinkerDataCapability.getData(entity).get(key, 0f) : 0f;'
          if text.count(old) != 1:
              raise RuntimeError('ArmorStatModule legacy capability access changed unexpectedly')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace(
              'src/main/java/slimeknights/tconstruct/library/modifiers/modules/interaction/edible/EdibleConsumeDurabilityModule.java',
              'player.broadcastBreakEvent(player.getUsedItemHand());',
              'player.onEquippedItemBroken(tool.getItem(), eatenSlot);')

          path = Path('src/main/java/slimeknights/tconstruct/library/modifiers/modules/behavior/BlockTransformModule.java')
          text = path.read_text(encoding='utf-8')
          if text.count('player.broadcastBreakEvent(slotType);') != 1:
              raise RuntimeError('BlockTransformModule slot break callback changed unexpectedly')
          if text.count('player.broadcastBreakEvent(context.getHand());') != 1:
              raise RuntimeError('BlockTransformModule hand break callback changed unexpectedly')
          text = text.replace('player.broadcastBreakEvent(slotType);', 'player.onEquippedItemBroken(stack.getItem(), slotType);', 1)
          text = text.replace('player.broadcastBreakEvent(context.getHand());', 'player.onEquippedItemBroken(stack.getItem(), slotType);', 1)
          path.write_text(text, encoding='utf-8')

          path = Path('src/main/java/slimeknights/tconstruct/library/modifiers/modules/behavior/InfinityModule.java')
          text = path.read_text(encoding='utf-8')
          if 'import slimeknights.tconstruct.library.utils.TagUtil;\n' not in text:
              anchor = 'import slimeknights.tconstruct.library.tools.nbt.ModDataNBT;\n'
              if anchor not in text:
                  raise RuntimeError('InfinityModule import anchor missing')
              text = text.replace(anchor, anchor + 'import slimeknights.tconstruct.library.utils.TagUtil;\n', 1)
          if text.count('CompoundTag tag = ammo.getOrCreateTag();') != 1:
              raise RuntimeError('InfinityModule getOrCreateTag call changed unexpectedly')
          text = text.replace('CompoundTag tag = ammo.getOrCreateTag();', 'CompoundTag tag = TagUtil.getOrCreateTag(ammo);', 1)
          if text.count('    return ammo;\n') != 1:
              raise RuntimeError('InfinityModule ammo return shape changed unexpectedly')
          text = text.replace('    return ammo;\n', '    TagUtil.setTag(ammo, tag);\n    return ammo;\n', 1)
          if text.count('CompoundTag tag = ammo.getTag();') != 1:
              raise RuntimeError('InfinityModule getTag call changed unexpectedly')
          text = text.replace('CompoundTag tag = ammo.getTag();', 'CompoundTag tag = TagUtil.getTag(ammo);', 1)
          path.write_text(text, encoding='utf-8')

          path = Path('src/main/java/slimeknights/tconstruct/library/json/variable/StatLoadable.java')
          text = path.read_text(encoding='utf-8')
          if 'import io.netty.handler.codec.EncoderException;\n' not in text:
              anchor = 'import io.netty.handler.codec.DecoderException;\n'
              if anchor not in text:
                  raise RuntimeError('StatLoadable decoder import anchor missing')
              text = text.replace(anchor, anchor + 'import io.netty.handler.codec.EncoderException;\n', 1)
          text = text.replace('import net.minecraft.world.item.enchantment.Enchantment;\n', '')
          old = '  /** Encodes the value to the registry using the type generics */\n  @SuppressWarnings("deprecation")\n  private <T> void encodeGeneric(FriendlyByteBuf buffer, Stat<T> value) {\n    StatType<T> type = value.getType();\n    buffer.writeId(BuiltInRegistries.STAT_TYPE, type);\n    buffer.writeId(type.getRegistry(), value.getValue());\n  }'
          new = '  /** Writes a registry value by numeric ID, throwing for unregistered values. */\n  private static <T> void encodeRegistry(FriendlyByteBuf buffer, Registry<T> registry, T value) {\n    int id = registry.getId(value);\n    if (id < 0) {\n      throw new EncoderException("Unknown " + registry.key().location() + " value " + value);\n    }\n    buffer.writeVarInt(id);\n  }\n\n  /** Encodes the value to the registry using the type generics */\n  @SuppressWarnings("deprecation")\n  private <T> void encodeGeneric(FriendlyByteBuf buffer, Stat<T> value) {\n    StatType<T> type = value.getType();\n    encodeRegistry(buffer, BuiltInRegistries.STAT_TYPE, type);\n    encodeRegistry(buffer, type.getRegistry(), value.getValue());\n  }'
          if text.count(old) != 1:
              raise RuntimeError('StatLoadable legacy registry encoder changed unexpectedly')
          text = text.replace(old, new, 1)
          old = '    } else if (registry == BuiltInRegistries.MOB_EFFECT) {\n      name = ((MobEffect) value).getDisplayName();\n    } else if (registry == BuiltInRegistries.ENCHANTMENT) {\n      name = Component.translatable(((Enchantment) value).getDescriptionId());\n    } else {'
          new = '    } else if (registry == BuiltInRegistries.MOB_EFFECT) {\n      name = ((MobEffect) value).getDisplayName();\n    } else {'
          if text.count(old) != 1:
              raise RuntimeError('StatLoadable invalid enchantment registry branch changed unexpectedly')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify small API cleanup
        shell: bash
        run: |
          grep -Fq 'EventHooks.onBlockPlace' src/main/java/slimeknights/tconstruct/library/modifiers/modules/armor/ReplaceBlockWalkerModule.java
          grep -Fq 'TinkerDataCapability.getData(entity).get(key, 0f)' src/main/java/slimeknights/tconstruct/library/modifiers/modules/technical/ArmorStatModule.java
          grep -Fq 'player.onEquippedItemBroken(tool.getItem(), eatenSlot);' src/main/java/slimeknights/tconstruct/library/modifiers/modules/interaction/edible/EdibleConsumeDurabilityModule.java
          test "$(grep -Fc 'player.onEquippedItemBroken(stack.getItem(), slotType);' src/main/java/slimeknights/tconstruct/library/modifiers/modules/behavior/BlockTransformModule.java)" -eq 2
          grep -Fq 'CompoundTag tag = TagUtil.getOrCreateTag(ammo);' src/main/java/slimeknights/tconstruct/library/modifiers/modules/behavior/InfinityModule.java
          grep -Fq 'TagUtil.setTag(ammo, tag);' src/main/java/slimeknights/tconstruct/library/modifiers/modules/behavior/InfinityModule.java
          grep -Fq 'encodeRegistry(buffer, BuiltInRegistries.STAT_TYPE, type);' src/main/java/slimeknights/tconstruct/library/json/variable/StatLoadable.java
          ! grep -R -F 'broadcastBreakEvent' \
            src/main/java/slimeknights/tconstruct/library/modifiers/modules/interaction/edible/EdibleConsumeDurabilityModule.java \
            src/main/java/slimeknights/tconstruct/library/modifiers/modules/behavior/BlockTransformModule.java
          ! grep -Fq 'BuiltInRegistries.ENCHANTMENT' src/main/java/slimeknights/tconstruct/library/json/variable/StatLoadable.java
          git diff --check

      - name: Commit small API cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/main/java/slimeknights/tconstruct/library/modifiers/modules/armor/ReplaceBlockWalkerModule.java \
            src/main/java/slimeknights/tconstruct/library/modifiers/modules/technical/ArmorStatModule.java \
            src/main/java/slimeknights/tconstruct/library/modifiers/modules/interaction/edible/EdibleConsumeDurabilityModule.java \
            src/main/java/slimeknights/tconstruct/library/modifiers/modules/behavior/BlockTransformModule.java \
            src/main/java/slimeknights/tconstruct/library/modifiers/modules/behavior/InfinityModule.java \
            src/main/java/slimeknights/tconstruct/library/json/variable/StatLoadable.java
          git diff --cached --quiet || {
            git commit -m 'Port small modifier APIs to 1.21'
            git push origin HEAD:1.21.1-neoforge
          }

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --repo "$GITHUB_REPOSITORY" --ref 1.21.1-neoforge
