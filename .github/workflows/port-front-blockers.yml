name: Tinkers Enchantment Component Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout latest Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Port enchantment components and mining context
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('src/main/java')

          def p(rel):
              return root / rel

          def replace(path, old, new, expected=1):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise RuntimeError(f'{path}: expected {expected} x {old!r}, found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          def add_import(path, anchor, imp):
              text = path.read_text(encoding='utf-8')
              if imp not in text:
                  if anchor not in text:
                      raise RuntimeError(f'Import anchor missing in {path}: {anchor!r}')
                  path.write_text(text.replace(anchor, imp + anchor, 1), encoding='utf-8')

          # Fix the one missing import exposed by the attribute batch.
          path = p('slimeknights/tconstruct/library/modifiers/modules/combat/MeleeAttributeModule.java')
          add_import(path, 'import slimeknights.tconstruct.library.modifiers.modules.behavior.AttributeUniqueField;\n',
                     'import slimeknights.tconstruct.library.modifiers.modules.behavior.AttributeModule;\n')

          # Keep the public modifier hook API on raw Enchantment values, but bridge stack data through 1.21 components.
          path = p('slimeknights/tconstruct/library/modifiers/hook/behavior/EnchantmentModifierHook.java')
          add_import(path, 'import net.minecraft.world.item.ItemStack;\n',
                     'import net.minecraft.core.RegistryAccess;\nimport net.minecraft.core.registries.Registries;\n')
          add_import(path, 'import net.minecraft.world.item.enchantment.EnchantmentHelper;\n',
                     'import net.minecraft.world.item.enchantment.ItemEnchantments;\n')
          add_import(path, 'import java.util.Collection;\n', 'import java.util.HashMap;\n')
          replace(path,
                  '''  static int getEnchantmentLevel(ItemStack stack, Enchantment enchantment) {\n    int level = EnchantmentHelper.getTagEnchantmentLevel(enchantment, stack);''',
                  '''  static int getEnchantmentLevel(ItemStack stack, Enchantment enchantment) {\n    int level = 0;\n    for (var entry : stack.getEnchantments().entrySet()) {\n      if (entry.getKey().value() == enchantment) {\n        level = entry.getIntValue();\n        break;\n      }\n    }''')
          replace(path,
                  'Map<Enchantment,Integer> enchantments = EnchantmentHelper.getEnchantments(stack);',
                  'Map<Enchantment,Integer> enchantments = getStoredEnchantments(stack);')
          text = path.read_text(encoding='utf-8')
          anchor = '''  /**\n   * Gets all enchantments on the given stack\n'''
          helper = '''  /** Gets the stack enchantment component as the legacy raw-enchantment map used by modifier hooks. */\n  static Map<Enchantment,Integer> getStoredEnchantments(ItemStack stack) {\n    Map<Enchantment,Integer> enchantments = new HashMap<>();\n    for (var entry : stack.getEnchantments().entrySet()) {\n      enchantments.put(entry.getKey().value(), entry.getIntValue());\n    }\n    return enchantments;\n  }\n\n  /** Applies a legacy raw-enchantment map through the active dynamic enchantment registry. */\n  static void setEnchantments(ItemStack stack, RegistryAccess registryAccess, Map<Enchantment,Integer> enchantments) {\n    ItemEnchantments.Mutable mutable = new ItemEnchantments.Mutable(stack.getEnchantments());\n    mutable.removeIf(holder -> true);\n    var registry = registryAccess.registryOrThrow(Registries.ENCHANTMENT);\n    enchantments.forEach((enchantment, level) -> {\n      if (level > 0) {\n        mutable.set(registry.wrapAsHolder(enchantment), level);\n      }\n    });\n    EnchantmentHelper.setEnchantments(stack, mutable.toImmutable());\n  }\n\n'''
          if helper not in text:
              if anchor not in text:
                  raise RuntimeError('EnchantmentModifierHook helper anchor missing')
              path.write_text(text.replace(anchor, helper + anchor, 1), encoding='utf-8')

          # Harvest enchantment overrides now snapshot and restore ItemEnchantments instead of legacy NBT lists.
          path = p('slimeknights/tconstruct/library/modifiers/hook/mining/HarvestEnchantmentsModifierHook.java')
          replace(path, 'import net.minecraft.nbt.CompoundTag;\n', '')
          replace(path, 'import net.minecraft.nbt.ListTag;\n', '')
          add_import(path, 'import net.minecraft.world.item.enchantment.EnchantmentHelper;\n',
                     'import net.minecraft.world.item.enchantment.ItemEnchantments;\n')
          replace(path,
                  'static ListTag updateHarvestEnchantments(IToolStackView tool, ItemStack stack, ToolHarvestContext context)',
                  'static ItemEnchantments updateHarvestEnchantments(IToolStackView tool, ItemStack stack, ToolHarvestContext context)')
          replace(path, 'ListTag originalEnchants = null;', 'ItemEnchantments originalEnchants = null;')
          replace(path,
                  '''                originalEnchants = stack.getEnchantmentTags();\n                enchantments = EnchantmentHelper.deserializeEnchantments(originalEnchants);''',
                  '''                originalEnchants = stack.getEnchantments();\n                enchantments = EnchantmentModifierHook.getStoredEnchantments(stack);''')
          replace(path,
                  'EnchantmentHelper.setEnchantments(enchantments, stack);',
                  'EnchantmentModifierHook.setEnchantments(stack, context.getWorld().registryAccess(), enchantments);')
          replace(path,
                  '''  static void restoreEnchantments(ItemStack stack, ListTag originalTag) {\n    CompoundTag nbt = stack.getTag();\n    if (nbt != null) {\n      if (originalTag.isEmpty()) {\n        nbt.remove(TAG_ENCHANTMENTS);\n      } else {\n        nbt.put(TAG_ENCHANTMENTS, originalTag);\n      }\n    }\n  }''',
                  '''  static void restoreEnchantments(ItemStack stack, ItemEnchantments originalEnchantments) {\n    EnchantmentHelper.setEnchantments(stack, originalEnchantments);\n  }''')

          # Caller local type follows the component snapshot.
          path = p('slimeknights/tconstruct/library/tools/helper/ToolHarvestLogic.java')
          replace(path, 'import net.minecraft.nbt.ListTag;\n', 'import net.minecraft.world.item.enchantment.ItemEnchantments;\n')
          replace(path,
                  'ListTag originalEnchantments = HarvestEnchantmentsModifierHook.updateHarvestEnchantments(tool, stack, context);',
                  'ItemEnchantments originalEnchantments = HarvestEnchantmentsModifierHook.updateHarvestEnchantments(tool, stack, context);')

          # Fluid block breaker resolves configured raw enchantments through the active server registry.
          path = p('slimeknights/tconstruct/library/modifiers/fluid/block/BreakBlockFluidEffect.java')
          replace(path, 'import net.minecraft.world.item.enchantment.EnchantmentHelper;\n',
                  'import slimeknights.tconstruct.library.modifiers.hook.behavior.EnchantmentModifierHook;\n')
          replace(path,
                  'EnchantmentHelper.setEnchantments(enchantments, fakeTool);',
                  'EnchantmentModifierHook.setEnchantments(fakeTool, server.registryAccess(), enchantments);')
          replace(path,
                  'MutableComponent component = Component.translatable(enchantment.getDescriptionId());',
                  'MutableComponent component = enchantment.description().copy();')

          # Vanilla 1.21 represents underwater mining slowdown through an attribute, including Aqua Affinity changes.
          path = p('slimeknights/tconstruct/library/modifiers/hook/mining/BreakSpeedContext.java')
          replace(path, 'import net.minecraft.world.item.enchantment.EnchantmentHelper;\n',
                  'import net.minecraft.world.entity.ai.attributes.Attributes;\n')
          replace(path,
                  '''    if (entity.isEyeInFluid(FluidTags.WATER) && !EnchantmentHelper.hasAquaAffinity(entity)) {\n      modifier /= 5.0F;\n    }''',
                  '''    if (entity.isEyeInFluid(FluidTags.WATER)) {\n      modifier *= (float)entity.getAttributeValue(Attributes.SUBMERGED_MINING_SPEED);\n    }''')
          PY

      - name: Verify enchantment component migration
        shell: bash
        run: |
          grep -Fq 'import slimeknights.tconstruct.library.modifiers.modules.behavior.AttributeModule;' src/main/java/slimeknights/tconstruct/library/modifiers/modules/combat/MeleeAttributeModule.java
          grep -Fq 'static Map<Enchantment,Integer> getStoredEnchantments(ItemStack stack)' src/main/java/slimeknights/tconstruct/library/modifiers/hook/behavior/EnchantmentModifierHook.java
          grep -Fq 'registryAccess.registryOrThrow(Registries.ENCHANTMENT)' src/main/java/slimeknights/tconstruct/library/modifiers/hook/behavior/EnchantmentModifierHook.java
          grep -Fq 'static ItemEnchantments updateHarvestEnchantments' src/main/java/slimeknights/tconstruct/library/modifiers/hook/mining/HarvestEnchantmentsModifierHook.java
          grep -Fq 'ItemEnchantments originalEnchantments' src/main/java/slimeknights/tconstruct/library/tools/helper/ToolHarvestLogic.java
          grep -Fq 'EnchantmentModifierHook.setEnchantments(fakeTool, server.registryAccess(), enchantments);' src/main/java/slimeknights/tconstruct/library/modifiers/fluid/block/BreakBlockFluidEffect.java
          grep -Fq 'Attributes.SUBMERGED_MINING_SPEED' src/main/java/slimeknights/tconstruct/library/modifiers/hook/mining/BreakSpeedContext.java
          ! grep -R -F 'getTagEnchantmentLevel' src/main/java/slimeknights/tconstruct/library/modifiers/hook/behavior/EnchantmentModifierHook.java
          ! grep -R -F 'getEnchantmentTags()' src/main/java/slimeknights/tconstruct/library/modifiers/hook/mining/HarvestEnchantmentsModifierHook.java
          ! grep -R -F 'deserializeEnchantments' src/main/java/slimeknights/tconstruct/library/modifiers/hook/mining/HarvestEnchantmentsModifierHook.java
          git diff --check

      - name: Commit enchantment component migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/main/java/slimeknights/tconstruct/library/modifiers/modules/combat/MeleeAttributeModule.java \
            src/main/java/slimeknights/tconstruct/library/modifiers/hook/behavior/EnchantmentModifierHook.java \
            src/main/java/slimeknights/tconstruct/library/modifiers/hook/mining/HarvestEnchantmentsModifierHook.java \
            src/main/java/slimeknights/tconstruct/library/tools/helper/ToolHarvestLogic.java \
            src/main/java/slimeknights/tconstruct/library/modifiers/fluid/block/BreakBlockFluidEffect.java \
            src/main/java/slimeknights/tconstruct/library/modifiers/hook/mining/BreakSpeedContext.java
          git diff --cached --quiet || {
            git commit -m 'Port enchantment storage and mining context to 1.21 components'
            git push origin HEAD:1.21.1-neoforge
          }

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --repo "$GITHUB_REPOSITORY" --ref 1.21.1-neoforge
