name: Tinkers Slime Lifecycle Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout latest Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Port slime lifecycle and combat to 1.21
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def add_import(text, anchor, imp, label):
              if imp in text:
                  return text
              if anchor not in text:
                  raise RuntimeError(f'{label}: import anchor missing')
              return text.replace(anchor, anchor + imp, 1)

          # Armored slime: synced data builder, spawn signatures, equipment drops, and removed capability invalidation.
          path = Path('src/main/java/slimeknights/tconstruct/world/entity/ArmoredSlimeEntity.java')
          text = path.read_text(encoding='utf-8')
          text = add_import(text, 'import net.minecraft.network.syncher.SynchedEntityData;\n', 'import net.minecraft.server.level.ServerLevel;\n', 'ArmoredSlimeEntity ServerLevel')
          text = add_import(text, 'import net.minecraft.world.entity.EquipmentSlot;\n', 'import net.minecraft.world.entity.LivingEntity;\n', 'ArmoredSlimeEntity LivingEntity')
          text = add_import(text, 'import net.minecraft.world.item.enchantment.EnchantmentHelper;\n', 'import net.minecraft.world.item.enchantment.EnchantmentEffectComponents;\n', 'ArmoredSlimeEntity EnchantmentEffectComponents')

          old = '''  @Override\n  protected void defineSynchedData() {\n    super.defineSynchedData();\n    this.entityData.define(METAL, false);\n  }'''
          new = '''  @Override\n  protected void defineSynchedData(SynchedEntityData.Builder builder) {\n    super.defineSynchedData(builder);\n    builder.define(METAL, false);\n  }'''
          if text.count(old) != 1:
              raise RuntimeError('ArmoredSlimeEntity legacy defineSynchedData changed unexpectedly')
          text = text.replace(old, new, 1)

          old = '  public SpawnGroupData finalizeSpawn(ServerLevelAccessor pLevel, DifficultyInstance difficulty, MobSpawnType pReason, @Nullable SpawnGroupData pSpawnData, @Nullable CompoundTag pDataTag) {\n    SpawnGroupData spawnData = super.finalizeSpawn(pLevel, difficulty, pReason, pSpawnData, pDataTag);'
          new = '  public SpawnGroupData finalizeSpawn(ServerLevelAccessor pLevel, DifficultyInstance difficulty, MobSpawnType pReason, @Nullable SpawnGroupData pSpawnData) {\n    SpawnGroupData spawnData = super.finalizeSpawn(pLevel, difficulty, pReason, pSpawnData);'
          if text.count(old) != 1:
              raise RuntimeError('ArmoredSlimeEntity finalizeSpawn signature changed unexpectedly')
          text = text.replace(old, new, 1)

          old = '  protected void populateDefaultEquipmentEnchantments(RandomSource random, DifficultyInstance difficulty) {'
          new = '  protected void populateDefaultEquipmentEnchantments(ServerLevelAccessor level, RandomSource random, DifficultyInstance difficulty) {'
          if text.count(old) != 1:
              raise RuntimeError('ArmoredSlimeEntity equipment enchantment signature changed unexpectedly')
          text = text.replace(old, new, 1)

          old = '''  @Override\n  protected void dropCustomDeathLoot(DamageSource source, int looting, boolean recentlyHit) {\n    ItemStack stack = this.getItemBySlot(EquipmentSlot.HEAD);\n    float slotChance = this.getEquipmentDropChance(EquipmentSlot.HEAD);\n    // items do not always drop if a large slime, increases chance of inheritance\n    // small slimes always drop, no losing gear\n    if (slotChance > 0.25f && getSize() > 1) {\n      slotChance = 0.25f;\n    }\n    boolean alwaysDrop = slotChance > 1.0F;\n    if (!stack.isEmpty() && !EnchantmentHelper.hasVanishingCurse(stack) && (recentlyHit || alwaysDrop)) {\n      if ((this.random.nextFloat() - (looting * 0.01f)) < slotChance) {\n        if (!alwaysDrop && stack.isDamageableItem()) {\n          int max = stack.getMaxDamage();\n          stack.setDamageValue(max - this.random.nextInt(1 + this.random.nextInt(Math.max(max - 3, 1))));\n        }\n        this.spawnAtLocation(stack);\n        this.setItemSlot(EquipmentSlot.HEAD, ItemStack.EMPTY);\n      }\n    }\n  }'''
          new = '''  @Override\n  protected void dropCustomDeathLoot(ServerLevel level, DamageSource source, boolean recentlyHit) {\n    ItemStack stack = this.getItemBySlot(EquipmentSlot.HEAD);\n    float slotChance = this.getEquipmentDropChance(EquipmentSlot.HEAD);\n    // items do not always drop if a large slime, increases chance of inheritance\n    // small slimes always drop, no losing gear\n    if (slotChance > 0.25f && getSize() > 1) {\n      slotChance = 0.25f;\n    }\n    boolean alwaysDrop = slotChance > 1.0F;\n    Entity attacker = source.getEntity();\n    if (attacker instanceof LivingEntity living) {\n      slotChance = EnchantmentHelper.processEquipmentDropChance(level, living, source, slotChance);\n    }\n    if (!stack.isEmpty() && !EnchantmentHelper.has(stack, EnchantmentEffectComponents.PREVENT_EQUIPMENT_DROP) && (recentlyHit || alwaysDrop)) {\n      if (this.random.nextFloat() < slotChance) {\n        if (!alwaysDrop && stack.isDamageableItem()) {\n          int max = stack.getMaxDamage();\n          stack.setDamageValue(max - this.random.nextInt(1 + this.random.nextInt(Math.max(max - 3, 1))));\n        }\n        this.spawnAtLocation(stack);\n        this.setItemSlot(EquipmentSlot.HEAD, ItemStack.EMPTY);\n      }\n    }\n  }'''
          if text.count(old) != 1:
              raise RuntimeError('ArmoredSlimeEntity legacy death loot block changed unexpectedly')
          text = text.replace(old, new, 1)

          if text.count('    this.invalidateCaps();\n') != 1:
              raise RuntimeError('ArmoredSlimeEntity invalidateCaps call changed unexpectedly')
          text = text.replace('    this.invalidateCaps();\n', '', 1)
          path.write_text(text, encoding='utf-8')

          # Ender slime: 1.21 removed doEnchantDamageEffects; mirror current Slime#dealDamage and append teleport on a successful hit.
          path = Path('src/main/java/slimeknights/tconstruct/world/entity/EnderSlimeEntity.java')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import net.minecraft.world.entity.Entity;\n', '')
          if 'import net.minecraft.server.level.ServerLevel;\n' not in text:
              anchor = 'import net.minecraft.core.particles.ParticleOptions;\n'
              if anchor not in text:
                  raise RuntimeError('EnderSlimeEntity particle import anchor missing')
              text = text.replace(anchor, anchor + 'import net.minecraft.server.level.ServerLevel;\nimport net.minecraft.sounds.SoundEvents;\n', 1)
          if 'import net.minecraft.world.item.enchantment.EnchantmentHelper;\n' not in text:
              anchor = 'import net.minecraft.world.entity.LivingEntity;\n'
              if anchor not in text:
                  raise RuntimeError('EnderSlimeEntity LivingEntity import anchor missing')
              text = text.replace(anchor, anchor + 'import net.minecraft.world.item.enchantment.EnchantmentHelper;\n', 1)

          old = '''  @Override\n  public void doEnchantDamageEffects(LivingEntity slime, Entity target) {\n    super.doEnchantDamageEffects(slime, target);\n    if (target instanceof LivingEntity) {\n      TeleportHelper.randomNearbyTeleport((LivingEntity) target, teleportPredicate);\n    }\n  }'''
          new = '''  @Override\n  protected void dealDamage(LivingEntity target) {\n    if (this.isAlive() && this.isWithinMeleeAttackRange(target) && this.hasLineOfSight(target)) {\n      DamageSource source = this.damageSources().mobAttack(this);\n      if (target.hurt(source, this.getAttackDamage())) {\n        this.playSound(SoundEvents.SLIME_ATTACK, 1.0F, (this.random.nextFloat() - this.random.nextFloat()) * 0.2F + 1.0F);\n        if (this.level() instanceof ServerLevel server) {\n          EnchantmentHelper.doPostAttackEffects(server, target, source);\n        }\n        TeleportHelper.randomNearbyTeleport(target, teleportPredicate);\n      }\n    }\n  }'''
          if text.count(old) != 1:
              raise RuntimeError('EnderSlimeEntity legacy enchant-damage hook changed unexpectedly')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify slime lifecycle migration
        shell: bash
        run: |
          grep -Fq 'protected void defineSynchedData(SynchedEntityData.Builder builder)' src/main/java/slimeknights/tconstruct/world/entity/ArmoredSlimeEntity.java
          grep -Fq 'builder.define(METAL, false);' src/main/java/slimeknights/tconstruct/world/entity/ArmoredSlimeEntity.java
          grep -Fq 'super.finalizeSpawn(pLevel, difficulty, pReason, pSpawnData);' src/main/java/slimeknights/tconstruct/world/entity/ArmoredSlimeEntity.java
          grep -Fq 'populateDefaultEquipmentEnchantments(ServerLevelAccessor level, RandomSource random, DifficultyInstance difficulty)' src/main/java/slimeknights/tconstruct/world/entity/ArmoredSlimeEntity.java
          grep -Fq 'dropCustomDeathLoot(ServerLevel level, DamageSource source, boolean recentlyHit)' src/main/java/slimeknights/tconstruct/world/entity/ArmoredSlimeEntity.java
          grep -Fq 'EnchantmentHelper.processEquipmentDropChance(level, living, source, slotChance)' src/main/java/slimeknights/tconstruct/world/entity/ArmoredSlimeEntity.java
          grep -Fq 'EnchantmentEffectComponents.PREVENT_EQUIPMENT_DROP' src/main/java/slimeknights/tconstruct/world/entity/ArmoredSlimeEntity.java
          ! grep -Fq 'invalidateCaps' src/main/java/slimeknights/tconstruct/world/entity/ArmoredSlimeEntity.java
          grep -Fq 'protected void dealDamage(LivingEntity target)' src/main/java/slimeknights/tconstruct/world/entity/EnderSlimeEntity.java
          grep -Fq 'EnchantmentHelper.doPostAttackEffects(server, target, source);' src/main/java/slimeknights/tconstruct/world/entity/EnderSlimeEntity.java
          grep -Fq 'TeleportHelper.randomNearbyTeleport(target, teleportPredicate);' src/main/java/slimeknights/tconstruct/world/entity/EnderSlimeEntity.java
          ! grep -Fq 'doEnchantDamageEffects' src/main/java/slimeknights/tconstruct/world/entity/EnderSlimeEntity.java
          git diff --check

      - name: Commit slime lifecycle migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/main/java/slimeknights/tconstruct/world/entity/ArmoredSlimeEntity.java \
            src/main/java/slimeknights/tconstruct/world/entity/EnderSlimeEntity.java
          git diff --cached --quiet || {
            git commit -m 'Port armored slime lifecycle to 1.21'
            git push origin HEAD:1.21.1-neoforge
          }

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --repo "$GITHUB_REPOSITORY" --ref 1.21.1-neoforge
