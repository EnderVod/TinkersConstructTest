name: Tinkers Front Blocker Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for active port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while gh run list --repo "$GITHUB_REPOSITORY" --workflow port-compile.yml --branch 1.21.1-neoforge --limit 30 --json status --jq '.[] | select(.status == "queued" or .status == "in_progress") | .status' | grep -q .; do
            sleep 15
          done

      - name: Checkout Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge

      - name: Migrate dummy armor material to holder model
        run: |
          cat > src/main/java/slimeknights/tconstruct/library/tools/item/armor/DummyArmorMaterial.java <<'JAVA'
          package slimeknights.tconstruct.library.tools.item.armor;

          import lombok.Getter;
          import net.minecraft.core.Holder;
          import net.minecraft.core.registries.BuiltInRegistries;
          import net.minecraft.resources.ResourceLocation;
          import net.minecraft.sounds.SoundEvent;
          import net.minecraft.world.item.ArmorItem.Type;
          import net.minecraft.world.item.ArmorMaterial;
          import net.minecraft.world.item.crafting.Ingredient;
          import slimeknights.mantle.registration.object.IdAwareObject;

          import java.util.EnumMap;
          import java.util.List;
          import java.util.Map;

          /**
           * Lightweight armor material wrapper used by modifiable armor.
           * Tinkers supplies its real protection and durability through tool stats, while vanilla 1.21 requires
           * armor items to receive a {@link Holder} containing an {@link ArmorMaterial} record.
           */
          @Getter
          public class DummyArmorMaterial implements IdAwareObject {
            private final ResourceLocation id;
            private final SoundEvent equipSound;
            private final Holder<ArmorMaterial> material;

            public DummyArmorMaterial(ResourceLocation id, SoundEvent equipSound) {
              this.id = id;
              this.equipSound = equipSound;

              Map<Type,Integer> defense = new EnumMap<>(Type.class);
              for (Type type : Type.values()) {
                defense.put(type, 0);
              }
              this.material = Holder.direct(new ArmorMaterial(
                defense,
                0,
                BuiltInRegistries.SOUND_EVENT.wrapAsHolder(equipSound),
                () -> Ingredient.EMPTY,
                List.of(new ArmorMaterial.Layer(id)),
                0.0F,
                0.0F));
            }
          }
          JAVA

          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main/java/slimeknights/tconstruct/library/tools/item/armor/ModifiableArmorItem.java')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import net.minecraft.world.item.ArmorMaterial;\n', '', 1)
          old = '''  public ModifiableArmorItem(ArmorMaterial materialIn, ArmorItem.Type type, Properties builderIn, ToolDefinition toolDefinition) {\n    super(materialIn, type, builderIn);\n    this.toolDefinition = toolDefinition;\n  }'''
          new = '''  public ModifiableArmorItem(DummyArmorMaterial materialIn, ArmorItem.Type type, Properties builderIn, ToolDefinition toolDefinition) {\n    super(materialIn.getMaterial(), type, builderIn);\n    this.toolDefinition = toolDefinition;\n  }'''
          if old not in text:
              raise SystemExit('Missing ModifiableArmorItem armor material constructor')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('src/main/java/slimeknights/tconstruct/library/tools/item/armor/MultilayerArmorItem.java')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import net.minecraft.world.item.ArmorMaterial;\n', '', 1)
          old = '''  @SuppressWarnings("removal")\n  public MultilayerArmorItem(ArmorMaterial material, ArmorItem.Type slot, Properties properties, ToolDefinition toolDefinition) {\n    this(material, slot, properties, toolDefinition, new ResourceLocation(material.getName()));\n  }\n\n  public MultilayerArmorItem(ArmorMaterial material, ArmorItem.Type slot, Properties properties, ToolDefinition toolDefinition, ResourceLocation name) {'''
          new = '''  public MultilayerArmorItem(DummyArmorMaterial material, ArmorItem.Type slot, Properties properties, ToolDefinition toolDefinition) {\n    this(material, slot, properties, toolDefinition, material.getId());\n  }\n\n  public MultilayerArmorItem(DummyArmorMaterial material, ArmorItem.Type slot, Properties properties, ToolDefinition toolDefinition, ResourceLocation name) {'''
          if old not in text:
              raise SystemExit('Missing MultilayerArmorItem legacy armor material constructors')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify armor material migration
        run: |
          grep -q 'Holder<ArmorMaterial> material' src/main/java/slimeknights/tconstruct/library/tools/item/armor/DummyArmorMaterial.java
          grep -q 'Holder.direct(new ArmorMaterial' src/main/java/slimeknights/tconstruct/library/tools/item/armor/DummyArmorMaterial.java
          grep -q 'super(materialIn.getMaterial(), type, builderIn);' src/main/java/slimeknights/tconstruct/library/tools/item/armor/ModifiableArmorItem.java
          grep -q 'MultilayerArmorItem(DummyArmorMaterial material' src/main/java/slimeknights/tconstruct/library/tools/item/armor/MultilayerArmorItem.java
          test -z "$(grep 'implements ArmorMaterial' src/main/java/slimeknights/tconstruct/library/tools/item/armor/DummyArmorMaterial.java || true)"

      - name: Commit targeted migration
        run: |
          if git diff --quiet; then
            echo 'Armor material holder migration is already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/main/java/slimeknights/tconstruct/library/tools/item/armor/DummyArmorMaterial.java \
            src/main/java/slimeknights/tconstruct/library/tools/item/armor/ModifiableArmorItem.java \
            src/main/java/slimeknights/tconstruct/library/tools/item/armor/MultilayerArmorItem.java
          git commit -m 'Migrate armor material wrapper to 1.21 holder model'
          git push origin HEAD:1.21.1-neoforge

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --ref 1.21.1-neoforge
