name: Tinkers Front Blocker Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for active port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while gh run list --repo "$GITHUB_REPOSITORY" --workflow port-compile.yml --branch 1.21.1-neoforge --limit 30 --json status --jq '.[] | select(.status == "queued" or .status == "in_progress") | .status' | grep -q .; do
            sleep 15
          done

      - name: Checkout Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge

      - name: Register tool stack item sub-predicate
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main/java/slimeknights/tconstruct/tools/TinkerTools.java')
          text = path.read_text(encoding='utf-8')

          old_import = 'import net.minecraft.advancements.critereon.ItemPredicate;\n'
          new_import = 'import net.minecraft.advancements.critereon.ItemSubPredicate;\n'
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          elif new_import not in text:
              raise SystemExit('Could not locate ItemPredicate import')

          anchor = '  public static final DeferredHolder<IngredientType<?>, IngredientType<ToolHookIngredient>> toolHookIngredientType =\n    INGREDIENT_TYPES.register(ToolHookIngredient.ID.getPath(), () -> new IngredientType<>(ToolHookIngredient.CODEC));\n'
          registration = '\n  /** Item sub-predicate matching Tinkers tool data in advancements and commands. */\n  public static final DeferredHolder<ItemSubPredicate.Type<?>, ItemSubPredicate.Type<ToolStackItemPredicate>> toolStackItemPredicateType =\n    ITEM_SUB_PREDICATES.register(ToolStackItemPredicate.ID.getPath(), () -> new ItemSubPredicate.Type<>(ToolStackItemPredicate.CODEC));\n'
          if 'toolStackItemPredicateType = ITEM_SUB_PREDICATES.register' not in text:
              if anchor not in text:
                  raise SystemExit('Could not locate ingredient registration anchor')
              text = text.replace(anchor, anchor + registration, 1)

          stale = '      ItemPredicate.register(ToolStackItemPredicate.ID, ToolStackItemPredicate::deserialize);\n'
          text = text.replace(stale, '', 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify item sub-predicate migration
        run: |
          grep -q 'import net.minecraft.advancements.critereon.ItemSubPredicate;' src/main/java/slimeknights/tconstruct/tools/TinkerTools.java
          grep -q 'toolStackItemPredicateType = ITEM_SUB_PREDICATES.register' src/main/java/slimeknights/tconstruct/tools/TinkerTools.java
          grep -q 'new ItemSubPredicate.Type<>(ToolStackItemPredicate.CODEC)' src/main/java/slimeknights/tconstruct/tools/TinkerTools.java
          test -z "$(grep 'ItemPredicate.register(ToolStackItemPredicate' src/main/java/slimeknights/tconstruct/tools/TinkerTools.java || true)"

      - name: Commit targeted migration
        run: |
          if git diff --quiet; then
            echo 'Item sub-predicate registration is already migrated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/slimeknights/tconstruct/tools/TinkerTools.java
          git commit -m 'Register 1.21 tool item sub-predicate'
          git push origin HEAD:1.21.1-neoforge

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --ref 1.21.1-neoforge
