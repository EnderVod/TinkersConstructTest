name: Tinkers GuiUtil Render API Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout latest Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Port GuiUtil buffer builder calls to 1.21
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main/java/slimeknights/tconstruct/library/client/GuiUtil.java')
          text = path.read_text(encoding='utf-8')

          old = '''    BufferBuilder builder = Tesselator.getInstance().getBuilder();\n    builder.begin(Mode.QUADS, DefaultVertexFormat.POSITION_TEX);'''
          new = '''    BufferBuilder builder = Tesselator.getInstance().begin(Mode.QUADS, DefaultVertexFormat.POSITION_TEX);'''
          if text.count(old) != 1:
              raise RuntimeError('GuiUtil Tesselator begin sequence changed unexpectedly')
          text = text.replace(old, new, 1)

          old = 'BufferUploader.drawWithShader(builder.end());'
          new = 'BufferUploader.drawWithShader(builder.buildOrThrow());'
          if text.count(old) != 1:
              raise RuntimeError('GuiUtil buffer finish call changed unexpectedly')
          text = text.replace(old, new, 1)

          replacements = {
              'builder.vertex(matrix, x1, y2, z).uv(u1, v2).endVertex();': 'builder.addVertex(matrix, x1, y2, z).setUv(u1, v2);',
              'builder.vertex(matrix, x2, y2, z).uv(u2, v2).endVertex();': 'builder.addVertex(matrix, x2, y2, z).setUv(u2, v2);',
              'builder.vertex(matrix, x2, y1, z).uv(u2, v1).endVertex();': 'builder.addVertex(matrix, x2, y1, z).setUv(u2, v1);',
              'builder.vertex(matrix, x1, y1, z).uv(u1, v1).endVertex();': 'builder.addVertex(matrix, x1, y1, z).setUv(u1, v1);',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise RuntimeError(f'GuiUtil vertex call changed unexpectedly: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify GuiUtil render migration
        shell: bash
        run: |
          grep -Fq 'Tesselator.getInstance().begin(Mode.QUADS, DefaultVertexFormat.POSITION_TEX)' src/main/java/slimeknights/tconstruct/library/client/GuiUtil.java
          grep -Fq 'BufferUploader.drawWithShader(builder.buildOrThrow());' src/main/java/slimeknights/tconstruct/library/client/GuiUtil.java
          test "$(grep -F -c 'builder.addVertex(matrix' src/main/java/slimeknights/tconstruct/library/client/GuiUtil.java)" -eq 4
          ! grep -Fq 'getBuilder()' src/main/java/slimeknights/tconstruct/library/client/GuiUtil.java
          ! grep -Fq 'builder.begin(' src/main/java/slimeknights/tconstruct/library/client/GuiUtil.java
          ! grep -Fq 'builder.end()' src/main/java/slimeknights/tconstruct/library/client/GuiUtil.java
          ! grep -Fq '.endVertex()' src/main/java/slimeknights/tconstruct/library/client/GuiUtil.java
          git diff --check

      - name: Commit GuiUtil render migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/slimeknights/tconstruct/library/client/GuiUtil.java
          git diff --cached --quiet || {
            git commit -m 'Port GuiUtil buffer rendering to 1.21'
            git push origin HEAD:1.21.1-neoforge
          }

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --repo "$GITHUB_REPOSITORY" --ref 1.21.1-neoforge
