name: Tinkers Front Blocker Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout latest Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Apply guarded 1.21 compatibility batch
        run: python3 .github/scripts/port-smeltery-batch.py

      - name: Verify migration
        shell: bash
        run: |
          ! grep -Fq 'Blocks::never' src/main/java/slimeknights/tconstruct/world/TinkerWorld.java
          ! grep -Fq '.setCustomClientFactory' src/main/java/slimeknights/tconstruct/world/TinkerWorld.java
          ! grep -Fq 'ComposterBlock.add' src/main/java/slimeknights/tconstruct/world/TinkerWorld.java
          grep -Fq 'MapCodec<LeaveVineDecorator>' src/main/java/slimeknights/tconstruct/world/worldgen/trees/LeaveVineDecorator.java
          grep -Fq 'MapCodec<ExtraRootVariantPlacer>' src/main/java/slimeknights/tconstruct/world/worldgen/trees/ExtraRootVariantPlacer.java
          grep -Fq 'MapCodec<IslandStructure>' src/main/java/slimeknights/tconstruct/world/worldgen/islands/IslandStructure.java
          ! grep -Fq 'ModelLayers.ALL_MODELS' src/main/java/slimeknights/tconstruct/world/WorldClientEvents.java
          grep -Fq 'new ItemCost(Items.EMERALD, cost)' src/main/java/slimeknights/tconstruct/world/logic/AncientToolItemListing.java
          git diff --check

      - name: Commit compatibility batch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java
          git diff --cached --quiet || {
            git commit -m 'Migrate world and client APIs to 1.21'
            git push origin HEAD:1.21.1-neoforge
          }

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --repo "$GITHUB_REPOSITORY" --ref 1.21.1-neoforge
