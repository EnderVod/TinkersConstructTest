name: Tinkers Book Recipe API Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout latest Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Port book recipe and component APIs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ContentTool: RecipeManager 1.21 exposes RecipeHolder lists through getAllRecipesFor().
          path = Path('src/main/java/slimeknights/tconstruct/library/client/book/content/ContentTool.java')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import net.minecraft.world.inventory.CraftingContainer;\n', '')
          text = text.replace('import net.minecraft.world.item.crafting.Recipe;\n', '')
          if 'import net.minecraft.world.item.crafting.CraftingRecipe;\n' not in text:
              anchor = 'import net.minecraft.world.item.crafting.Ingredient;\n'
              if anchor not in text:
                  raise RuntimeError('ContentTool Ingredient import anchor missing')
              text = text.replace(anchor, 'import net.minecraft.world.item.crafting.CraftingRecipe;\n' + anchor, 1)

          old = '''      Recipe<CraftingContainer> recipe = Optional.ofNullable(Minecraft.getInstance().level)\n                                                 .flatMap(world -> {\n                                                   RegistryAccess access = world.registryAccess();\n                                                   return world.getRecipeManager().byType(RecipeType.CRAFTING).values().stream()\n                                                        .filter(r -> r.getResultItem(access).getItem() == tool.asItem())\n                                                        .findFirst();\n                                                 })\n                                                 .orElse(null);'''
          new = '''      CraftingRecipe recipe = Optional.ofNullable(Minecraft.getInstance().level)\n                                                 .flatMap(world -> {\n                                                   RegistryAccess access = world.registryAccess();\n                                                   return world.getRecipeManager().getAllRecipesFor(RecipeType.CRAFTING).stream()\n                                                        .map(holder -> holder.value())\n                                                        .filter(r -> r.getResultItem(access).getItem() == tool.asItem())\n                                                        .findFirst();\n                                                 })\n                                                 .orElse(null);'''
          if text.count(old) != 1:
              raise RuntimeError('ContentTool crafting recipe lookup changed unexpectedly')
          text = text.replace(old, new, 1)

          old = '''        List<Ingredient> extraRequirements = Optional.ofNullable(Minecraft.getInstance().level)\n                                                     .flatMap(world -> world.getRecipeManager().byType(TinkerRecipeTypes.TINKER_STATION.get()).values().stream()\n                                                                            .filter(r -> r instanceof ToolBuildingRecipe toolRecipe && toolRecipe.getOutput() == tool)\n                                                                            .map(r -> ((ToolBuildingRecipe)r).getExtraRequirements())\n                                                                            .findFirst()).orElse(List.of());'''
          new = '''        List<Ingredient> extraRequirements = Optional.ofNullable(Minecraft.getInstance().level)\n                                                     .flatMap(world -> world.getRecipeManager().getAllRecipesFor(TinkerRecipeTypes.TINKER_STATION.get()).stream()\n                                                                            .map(holder -> holder.value())\n                                                                            .filter(r -> r instanceof ToolBuildingRecipe toolRecipe && toolRecipe.getOutput() == tool)\n                                                                            .map(r -> ((ToolBuildingRecipe)r).getExtraRequirements())\n                                                                            .findFirst()).orElse(List.of());'''
          if text.count(old) != 1:
              raise RuntimeError('ContentTool tinker station recipe lookup changed unexpectedly')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          # Component.Serializer is static-only in 1.21; SerializerAdapter is the Gson adapter.
          path = Path('src/main/java/slimeknights/tconstruct/library/client/book/TinkerBook.java')
          text = path.read_text(encoding='utf-8')
          if 'import net.minecraft.core.RegistryAccess;\n' not in text:
              anchor = 'import net.minecraft.network.chat.Component;\n'
              if anchor not in text:
                  raise RuntimeError('TinkerBook Component import anchor missing')
              text = text.replace(anchor, 'import net.minecraft.core.RegistryAccess;\n' + anchor, 1)
          old = 'BookLoader.registerGsonTypeAdapter(Component.class, new Component.Serializer());'
          new = 'BookLoader.registerGsonTypeAdapter(Component.class, new Component.SerializerAdapter(RegistryAccess.EMPTY));'
          if text.count(old) != 1:
              raise RuntimeError('TinkerBook component adapter call changed unexpectedly')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify book API migration
        shell: bash
        run: |
          grep -Fq 'CraftingRecipe recipe = Optional.ofNullable' src/main/java/slimeknights/tconstruct/library/client/book/content/ContentTool.java
          test "$(grep -F -c 'getAllRecipesFor(' src/main/java/slimeknights/tconstruct/library/client/book/content/ContentTool.java)" -eq 2
          test "$(grep -F -c '.map(holder -> holder.value())' src/main/java/slimeknights/tconstruct/library/client/book/content/ContentTool.java)" -eq 2
          ! grep -Fq '.byType(' src/main/java/slimeknights/tconstruct/library/client/book/content/ContentTool.java
          ! grep -Fq 'CraftingContainer' src/main/java/slimeknights/tconstruct/library/client/book/content/ContentTool.java
          grep -Fq 'new Component.SerializerAdapter(RegistryAccess.EMPTY)' src/main/java/slimeknights/tconstruct/library/client/book/TinkerBook.java
          ! grep -Fq 'new Component.Serializer()' src/main/java/slimeknights/tconstruct/library/client/book/TinkerBook.java
          git diff --check

      - name: Commit book API migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/main/java/slimeknights/tconstruct/library/client/book/content/ContentTool.java \
            src/main/java/slimeknights/tconstruct/library/client/book/TinkerBook.java
          git diff --cached --quiet || {
            git commit -m 'Port book recipe lookups to 1.21 holders'
            git push origin HEAD:1.21.1-neoforge
          }

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --repo "$GITHUB_REPOSITORY" --ref 1.21.1-neoforge
