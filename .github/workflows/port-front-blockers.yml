name: Tinkers Front Blocker Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Wait for active port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while gh run list --repo "$GITHUB_REPOSITORY" --workflow port-compile.yml --branch 1.21.1-neoforge --limit 30 --json status --jq '.[] | select(.status == "queued" or .status == "in_progress") | .status' | grep -q .; do
            sleep 15
          done

      - name: Checkout latest Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Apply 1.21 gadget and explosion API migration
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/gadget-batch.tar.gz
          tar -xzf /tmp/gadget-batch.tar.gz

      - name: Verify migrated APIs
        shell: bash
        run: |
          test -z "$(grep -R -E 'getItemRaw\(|readItem\(|getBlockState\(\)|getPos\(\)|getLevel\(\)|stack\.getTag\(\)|defineSynchedData\(\)|EntityDataSerializer\.simple|getPosition\(\)|getDamageSource\(\)|ignoreExplosion\(\)' src/main/java/slimeknights/tconstruct/gadgets src/main/java/slimeknights/tconstruct/library/utils/CustomExplosion.java src/main/java/slimeknights/tconstruct/library/materials/definition/MaterialVariantId.java || true)"
          grep -Fq 'ItemStack.STREAM_CODEC.encode' src/main/java/slimeknights/tconstruct/gadgets/entity/EFLNEntity.java
          grep -Fq 'SynchedEntityData.Builder' src/main/java/slimeknights/tconstruct/gadgets/entity/FancyArmorStandEntity.java
          grep -Fq 'new ClientboundExplodePacket(' src/main/java/slimeknights/tconstruct/library/utils/CustomExplosion.java
          grep -Fq 'FoodProperties.PossibleEffect' src/main/java/slimeknights/tconstruct/gadgets/block/FoodCakeBlock.java

      - name: Commit gadget API migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java
          git diff --cached --quiet && exit 0
          git commit -m 'Migrate gadget and explosion APIs to 1.21'
          git push origin HEAD:1.21.1-neoforge

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --repo "$GITHUB_REPOSITORY" --ref 1.21.1-neoforge
