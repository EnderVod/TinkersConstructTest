name: Tinkers Front Blocker Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Wait for active port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while gh run list --repo "$GITHUB_REPOSITORY" --workflow port-compile.yml --branch 1.21.1-neoforge --limit 30 --json status --jq '.[] | select(.status == "queued" or .status == "in_progress") | .status' | grep -q .; do
            sleep 15
          done

      - name: Checkout latest Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Migrate final loot serializers to MapCodec
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          Path('src/main/java/slimeknights/tconstruct/library/json/loot/LootCodecs.java').write_text(r'''package slimeknights.tconstruct.library.json.loot;

import com.mojang.serialization.Codec;
import com.mojang.serialization.Dynamic;
import com.mojang.serialization.JsonOps;
import slimeknights.mantle.util.typed.TypedMap;
import slimeknights.tconstruct.library.materials.RandomMaterial;

/** Bridges Tinkers legacy Mantle JSON loaders into Minecraft 1.21 codecs. */
public final class LootCodecs {
  private LootCodecs() {}

  public static final Codec<RandomMaterial> RANDOM_MATERIAL = Codec.PASSTHROUGH.xmap(
    dynamic -> RandomMaterial.LOADER.convert(dynamic.convert(JsonOps.INSTANCE).getValue(), "material", TypedMap.empty()),
    material -> new Dynamic<>(JsonOps.INSTANCE, RandomMaterial.LOADER.serialize(material))
  );
}
''', encoding='utf-8')

          Path('src/main/java/slimeknights/tconstruct/tools/modifiers/loot/BonusFormula.java').write_text(r'''package slimeknights.tconstruct.tools.modifiers.loot;

import com.mojang.serialization.Codec;
import com.mojang.serialization.MapCodec;
import com.mojang.serialization.codecs.RecordCodecBuilder;
import net.minecraft.resources.ResourceLocation;
import net.minecraft.util.RandomSource;

/** 1.21-compatible copy of the vanilla bonus-count formula data used by Tinkers loot functions. */
public record BonusFormula(ResourceLocation id, Parameters parameters) {
  private static final ResourceLocation ORE_DROPS = ResourceLocation.withDefaultNamespace("ore_drops");
  private static final ResourceLocation UNIFORM_BONUS = ResourceLocation.withDefaultNamespace("uniform_bonus_count");
  private static final ResourceLocation BINOMIAL_BONUS = ResourceLocation.withDefaultNamespace("binomial_with_bonus_count");

  public static final MapCodec<BonusFormula> CODEC = RecordCodecBuilder.mapCodec(instance -> instance.group(
    ResourceLocation.CODEC.fieldOf("formula").forGetter(BonusFormula::id),
    Parameters.CODEC.optionalFieldOf("parameters", Parameters.DEFAULT).forGetter(BonusFormula::parameters)
  ).apply(instance, BonusFormula::new));

  public static BonusFormula oreDrops() {
    return new BonusFormula(ORE_DROPS, Parameters.DEFAULT);
  }

  public static BonusFormula uniformBonus(int multiplier) {
    return new BonusFormula(UNIFORM_BONUS, new Parameters(multiplier, 0, 0));
  }

  public static BonusFormula binomialBonus(int extra, float probability) {
    return new BonusFormula(BINOMIAL_BONUS, new Parameters(1, extra, probability));
  }

  public int calculateNewCount(RandomSource random, int count, int level) {
    if (id.equals(ORE_DROPS)) {
      if (level > 0) {
        int bonus = random.nextInt(level + 2) - 1;
        if (bonus < 0) {
          bonus = 0;
        }
        return count * (bonus + 1);
      }
      return count;
    }
    if (id.equals(UNIFORM_BONUS)) {
      return count + random.nextInt(parameters.bonusMultiplier() * level + 1);
    }
    if (id.equals(BINOMIAL_BONUS)) {
      int result = count;
      for (int i = 0; i < level + parameters.extra(); i++) {
        if (random.nextFloat() < parameters.probability()) {
          result++;
        }
      }
      return result;
    }
    return count;
  }

  public record Parameters(int bonusMultiplier, int extra, float probability) {
    private static final Parameters DEFAULT = new Parameters(1, 0, 0);
    private static final Codec<Parameters> CODEC = RecordCodecBuilder.create(instance -> instance.group(
      Codec.INT.optionalFieldOf("bonusMultiplier", 1).forGetter(Parameters::bonusMultiplier),
      Codec.INT.optionalFieldOf("extra", 0).forGetter(Parameters::extra),
      Codec.FLOAT.optionalFieldOf("probability", 0f).forGetter(Parameters::probability)
    ).apply(instance, Parameters::new));
  }
}
''', encoding='utf-8')

          Path('src/main/java/slimeknights/tconstruct/library/json/loot/AddToolDataFunction.java').write_text(r'''package slimeknights.tconstruct.library.json.loot;

import com.google.common.collect.ImmutableList;
import com.mojang.serialization.Codec;
import com.mojang.serialization.MapCodec;
import com.mojang.serialization.codecs.RecordCodecBuilder;
import lombok.experimental.Accessors;
import net.minecraft.resources.ResourceLocation;
import net.minecraft.world.item.ItemStack;
import net.minecraft.world.level.storage.loot.LootContext;
import net.minecraft.world.level.storage.loot.functions.LootItemConditionalFunction;
import net.minecraft.world.level.storage.loot.functions.LootItemFunction;
import net.minecraft.world.level.storage.loot.functions.LootItemFunctionType;
import net.minecraft.world.level.storage.loot.predicates.LootItemCondition;
import slimeknights.tconstruct.TConstruct;
import slimeknights.tconstruct.common.TinkerTags;
import slimeknights.tconstruct.library.materials.RandomMaterial;
import slimeknights.tconstruct.library.materials.definition.MaterialId;
import slimeknights.tconstruct.library.tools.definition.ToolDefinition;
import slimeknights.tconstruct.library.tools.definition.module.material.ToolMaterialHook;
import slimeknights.tconstruct.library.tools.nbt.ToolStack;
import slimeknights.tconstruct.library.tools.stat.ToolStats;
import slimeknights.tconstruct.tools.TinkerTools;

import java.util.List;

/** Loot function to add data to a tool. */
public class AddToolDataFunction extends LootItemConditionalFunction {
  public static final ResourceLocation ID = TConstruct.getResource("add_tool_data");
  public static final MapCodec<AddToolDataFunction> CODEC = RecordCodecBuilder.mapCodec(instance ->
    commonFields(instance).and(instance.group(
      Codec.floatRange(0f, 1f).optionalFieldOf("damage_percent", 0f).forGetter(function -> function.damage),
      LootCodecs.RANDOM_MATERIAL.listOf().optionalFieldOf("materials", List.of()).forGetter(function -> function.materials)
    )).apply(instance, AddToolDataFunction::new));

  private final float damage;
  private final List<RandomMaterial> materials;

  protected AddToolDataFunction(List<LootItemCondition> conditions, float damage, List<RandomMaterial> materials) {
    super(conditions);
    this.damage = damage;
    this.materials = materials;
  }

  public static AddToolDataFunction.Builder builder() {
    return new AddToolDataFunction.Builder();
  }

  @Override
  public LootItemFunctionType getType() {
    return TinkerTools.lootAddToolData.get();
  }

  @Override
  protected ItemStack run(ItemStack stack, LootContext context) {
    if (stack.is(TinkerTags.Items.MODIFIABLE)) {
      ToolStack tool = ToolStack.from(stack);
      ToolDefinition definition = tool.getDefinition();
      if (definition.hasMaterials() && !materials.isEmpty()) {
        tool.setMaterials(RandomMaterial.build(ToolMaterialHook.stats(definition), materials, context.getRandom()));
      } else {
        tool.rebuildStats();
      }
      if (damage > 0) {
        tool.setDamage((int)(tool.getStats().get(ToolStats.DURABILITY) * damage));
      }
    }
    return stack;
  }

  @Accessors(chain = true)
  public static class Builder extends LootItemConditionalFunction.Builder<AddToolDataFunction.Builder> {
    private final ImmutableList.Builder<RandomMaterial> materials = ImmutableList.builder();
    private float damage = 0;

    protected Builder() {}

    @Override
    protected Builder getThis() {
      return this;
    }

    public void setDamage(float damage) {
      if (damage < 0 || damage > 1) {
        throw new IllegalArgumentException("Damage must be between 0 and 1, given " + damage);
      }
      this.damage = damage;
    }

    public Builder addMaterial(RandomMaterial mat) {
      materials.add(mat);
      return this;
    }

    public Builder addMaterial(MaterialId mat) {
      return addMaterial(RandomMaterial.fixed(mat));
    }

    @Override
    public LootItemFunction build() {
      return new AddToolDataFunction(getConditions(), damage, materials.build());
    }
  }
}
''', encoding='utf-8')

          Path('src/main/java/slimeknights/tconstruct/library/json/loot/ToolPartLootEntry.java').write_text(r'''package slimeknights.tconstruct.library.json.loot;

import com.mojang.serialization.MapCodec;
import com.mojang.serialization.codecs.RecordCodecBuilder;
import net.minecraft.core.registries.BuiltInRegistries;
import net.minecraft.core.registries.Registries;
import net.minecraft.tags.TagKey;
import net.minecraft.util.RandomSource;
import net.minecraft.world.item.Item;
import net.minecraft.world.item.ItemStack;
import net.minecraft.world.level.storage.loot.LootContext;
import net.minecraft.world.level.storage.loot.entries.LootPoolEntryType;
import net.minecraft.world.level.storage.loot.entries.LootPoolSingletonContainer;
import net.minecraft.world.level.storage.loot.functions.LootItemFunction;
import net.minecraft.world.level.storage.loot.predicates.LootItemCondition;
import slimeknights.mantle.util.RegistryHelper;
import slimeknights.tconstruct.library.materials.RandomMaterial;
import slimeknights.tconstruct.library.materials.definition.MaterialVariantId;
import slimeknights.tconstruct.library.tools.part.IToolPart;
import slimeknights.tconstruct.tools.TinkerToolParts;

import java.util.List;
import java.util.function.Consumer;
import java.util.stream.Stream;

/** Entry for a random tool part from a list with a random material. */
public class ToolPartLootEntry extends LootPoolSingletonContainer {
  public static final MapCodec<ToolPartLootEntry> CODEC = RecordCodecBuilder.mapCodec(instance ->
    singletonFields(instance).and(instance.group(
      TagKey.codec(Registries.ITEM).fieldOf("tag").forGetter(entry -> entry.tag),
      LootCodecs.RANDOM_MATERIAL.fieldOf("material").forGetter(entry -> entry.material)
    )).apply(instance, ToolPartLootEntry::new));

  private final TagKey<Item> tag;
  private final RandomMaterial material;

  protected ToolPartLootEntry(int weight, int quality, List<LootItemCondition> conditions, List<LootItemFunction> functions, TagKey<Item> tag, RandomMaterial material) {
    super(weight, quality, conditions, functions);
    this.tag = tag;
    this.material = material;
  }

  @Override
  public LootPoolEntryType getType() {
    return TinkerToolParts.toolPartLootEntry.get();
  }

  @SuppressWarnings("deprecation")
  @Override
  protected void createItemStack(Consumer<ItemStack> consumer, LootContext context) {
    List<IToolPart> options = RegistryHelper.getTagValueStream(BuiltInRegistries.ITEM, tag)
      .flatMap(item -> item instanceof IToolPart mat ? Stream.of(mat) : Stream.empty()).toList();
    if (!options.isEmpty()) {
      RandomSource random = context.getRandom();
      IToolPart choice = options.get(random.nextInt(options.size()));
      MaterialVariantId material = this.material.getMaterial(choice.getStatType(), random);
      if (choice.canUseMaterial(material.getId())) {
        consumer.accept(choice.withMaterial(material));
      }
    }
  }

  public static LootPoolSingletonContainer.Builder<?> entry(TagKey<Item> tag, RandomMaterial material) {
    return simpleBuilder((weight, quality, conditions, functions) -> new ToolPartLootEntry(weight, quality, conditions, functions, tag, material));
  }

  public static LootPoolSingletonContainer.Builder<?> fixed(TagKey<Item> tag, MaterialVariantId material) {
    return entry(tag, RandomMaterial.fixed(material));
  }
}
''', encoding='utf-8')

          Path('src/main/java/slimeknights/tconstruct/tools/modifiers/loot/ModifierBonusLootFunction.java').write_text(r'''package slimeknights.tconstruct.tools.modifiers.loot;

import com.google.common.collect.ImmutableSet;
import com.mojang.serialization.Codec;
import com.mojang.serialization.MapCodec;
import com.mojang.serialization.codecs.RecordCodecBuilder;
import net.minecraft.resources.ResourceLocation;
import net.minecraft.world.item.ItemStack;
import net.minecraft.world.level.storage.loot.LootContext;
import net.minecraft.world.level.storage.loot.functions.LootItemConditionalFunction;
import net.minecraft.world.level.storage.loot.functions.LootItemFunctionType;
import net.minecraft.world.level.storage.loot.parameters.LootContextParam;
import net.minecraft.world.level.storage.loot.parameters.LootContextParams;
import net.minecraft.world.level.storage.loot.predicates.LootItemCondition;
import slimeknights.tconstruct.library.modifiers.ModifierId;
import slimeknights.tconstruct.library.tools.helper.ModifierUtil;
import slimeknights.tconstruct.tools.TinkerModifiers;

import java.util.List;
import java.util.Set;

/** Boosts drop rates based on modifier level. */
public class ModifierBonusLootFunction extends LootItemConditionalFunction {
  private static final Codec<ModifierId> MODIFIER_CODEC = ResourceLocation.CODEC.xmap(ModifierId::new, id -> id);
  public static final MapCodec<ModifierBonusLootFunction> CODEC = RecordCodecBuilder.mapCodec(instance ->
    commonFields(instance).and(instance.group(
      MODIFIER_CODEC.fieldOf("modifier").forGetter(function -> function.modifier),
      BonusFormula.CODEC.forGetter(function -> function.formula),
      Codec.BOOL.optionalFieldOf("include_base", true).forGetter(function -> function.includeBase)
    )).apply(instance, ModifierBonusLootFunction::new));

  private final ModifierId modifier;
  private final BonusFormula formula;
  private final boolean includeBase;

  protected ModifierBonusLootFunction(List<LootItemCondition> conditions, ModifierId modifier, BonusFormula formula, boolean includeBase) {
    super(conditions);
    this.modifier = modifier;
    this.formula = formula;
    this.includeBase = includeBase;
  }

  public static Builder<?> builder(ModifierId modifier, BonusFormula formula, boolean includeBase) {
    return simpleBuilder(conditions -> new ModifierBonusLootFunction(conditions, modifier, formula, includeBase));
  }

  public static Builder<?> binomialWithBonusCount(ModifierId modifier, float probability, int extra, boolean includeBase) {
    return builder(modifier, BonusFormula.binomialBonus(extra, probability), includeBase);
  }

  public static Builder<?> oreDrops(ModifierId modifier, boolean includeBase) {
    return builder(modifier, BonusFormula.oreDrops(), includeBase);
  }

  public static Builder<?> uniformBonusCount(ModifierId modifier, int bonusMultiplier, boolean includeBase) {
    return builder(modifier, BonusFormula.uniformBonus(bonusMultiplier), includeBase);
  }

  @Override
  public LootItemFunctionType getType() {
    return TinkerModifiers.modifierBonusFunction.get();
  }

  @Override
  public Set<LootContextParam<?>> getReferencedContextParams() {
    return ImmutableSet.of(LootContextParams.TOOL);
  }

  @Override
  protected ItemStack run(ItemStack stack, LootContext context) {
    int level = ModifierUtil.getModifierLevel(context.getParam(LootContextParams.TOOL), modifier);
    if (!includeBase) {
      level--;
    }
    if (level > 0) {
      stack.setCount(formula.calculateNewCount(context.getRandom(), stack.getCount(), level));
    }
    return stack;
  }
}
''', encoding='utf-8')

          Path('src/main/java/slimeknights/tconstruct/tools/modifiers/loot/ChrysophiliteBonusFunction.java').write_text(r'''package slimeknights.tconstruct.tools.modifiers.loot;

import com.google.common.collect.ImmutableSet;
import com.mojang.serialization.Codec;
import com.mojang.serialization.MapCodec;
import com.mojang.serialization.codecs.RecordCodecBuilder;
import net.minecraft.world.entity.LivingEntity;
import net.minecraft.world.item.ItemStack;
import net.minecraft.world.level.storage.loot.LootContext;
import net.minecraft.world.level.storage.loot.functions.LootItemConditionalFunction;
import net.minecraft.world.level.storage.loot.functions.LootItemFunctionType;
import net.minecraft.world.level.storage.loot.parameters.LootContextParam;
import net.minecraft.world.level.storage.loot.parameters.LootContextParams;
import net.minecraft.world.level.storage.loot.predicates.LootItemCondition;
import slimeknights.tconstruct.shared.TinkerAttributes;
import slimeknights.tconstruct.tools.TinkerModifiers;

import java.util.List;
import java.util.Set;

/** Loot modifier to boost drops based on chrysophilite amount. */
public class ChrysophiliteBonusFunction extends LootItemConditionalFunction {
  public static final MapCodec<ChrysophiliteBonusFunction> CODEC = RecordCodecBuilder.mapCodec(instance ->
    commonFields(instance).and(instance.group(
      BonusFormula.CODEC.forGetter(function -> function.formula),
      Codec.BOOL.optionalFieldOf("include_base", true).forGetter(function -> function.includeBase)
    )).apply(instance, ChrysophiliteBonusFunction::new));

  private final BonusFormula formula;
  private final boolean includeBase;

  protected ChrysophiliteBonusFunction(List<LootItemCondition> conditions, BonusFormula formula, boolean includeBase) {
    super(conditions);
    this.formula = formula;
    this.includeBase = includeBase;
  }

  public static Builder<?> builder(BonusFormula formula, boolean includeBase) {
    return simpleBuilder(conditions -> new ChrysophiliteBonusFunction(conditions, formula, includeBase));
  }

  public static Builder<?> binomialWithBonusCount(float probability, int extra, boolean includeBase) {
    return builder(BonusFormula.binomialBonus(extra, probability), includeBase);
  }

  public static Builder<?> oreDrops(boolean includeBase) {
    return builder(BonusFormula.oreDrops(), includeBase);
  }

  public static Builder<?> uniformBonusCount(int bonusMultiplier, boolean includeBase) {
    return builder(BonusFormula.uniformBonus(bonusMultiplier), includeBase);
  }

  @Override
  protected ItemStack run(ItemStack stack, LootContext context) {
    if (context.getParamOrNull(LootContextParams.THIS_ENTITY) instanceof LivingEntity entity) {
      int level = (int) entity.getAttributeValue(TinkerAttributes.CHRYSOPHILITE.get());
      if (!includeBase) {
        level--;
      }
      if (level > 0) {
        stack.setCount(formula.calculateNewCount(context.getRandom(), stack.getCount(), level));
      }
    }
    return stack;
  }

  @Override
  public Set<LootContextParam<?>> getReferencedContextParams() {
    return ImmutableSet.of(LootContextParams.THIS_ENTITY);
  }

  @Override
  public LootItemFunctionType getType() {
    return TinkerModifiers.chrysophiliteBonusFunction.get();
  }
}
