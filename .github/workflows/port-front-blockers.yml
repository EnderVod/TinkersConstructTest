name: Tinkers Front Blocker Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout latest Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Apply interaction and mechanical compatibility fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('src/main/java/slimeknights/tconstruct')

          def replace_once(path, old, new, label):
            p = root / path
            s = p.read_text()
            count = s.count(old)
            if count != 1:
              raise SystemExit(f'{label}: expected one match, got {count}')
            p.write_text(s.replace(old, new))

          # Channel interaction split: item-on-block and empty-hand now use separate hooks.
          p = root / 'smeltery/block/ChannelBlock.java'
          s = p.read_text()
          import_anchor = 'import net.minecraft.world.InteractionResult;\n'
          if s.count(import_anchor) != 1 or 'import net.minecraft.world.ItemInteractionResult;\n' in s:
            raise SystemExit('ChannelBlock: unexpected interaction imports')
          s = s.replace(import_anchor, import_anchor + 'import net.minecraft.world.ItemInteractionResult;\n')
          start = s.find('  @SuppressWarnings("deprecation")\n  @Override\n  public InteractionResult use(BlockState state, Level world, BlockPos pos, Player player, InteractionHand hand, BlockHitResult hit) {')
          marker = '\n  @SuppressWarnings("deprecation")\n  @Override\n  @Deprecated\n  public void neighborChanged'
          end = s.find(marker, start)
          if start < 0 or end < 0:
            raise SystemExit('ChannelBlock: legacy use method boundaries not found')
          old = s[start:end]
          new = '''  @SuppressWarnings("deprecation")
  @Override
  protected ItemInteractionResult useItemOn(ItemStack stack, BlockState state, Level world, BlockPos pos, Player player, InteractionHand hand, BlockHitResult hit) {
    Direction hitFace = hit.getDirection();
    if (world.getBlockState(pos.relative(hitFace)).canBeReplaced()) {
      // if the player is holding a channel, skip default block handling so the held block can place
      if (stack.getItem() == this.asItem()) {
        return ItemInteractionResult.SKIP_DEFAULT_BLOCK_INTERACTION;
      }
      // if they are holding a gauge, set the side to in to make it easier to place a gauge on it
      if (hitFace != Direction.DOWN && stack.getItem() instanceof BlockItem blockItem && RegistryHelper.contains(MantleTags.Blocks.ATTACHED_GAUGES, blockItem.getBlock())) {
        if (hitFace != Direction.UP) {
          EnumProperty<ChannelConnection> prop = DIRECTION_MAP.get(hitFace);
          ChannelConnection connection = state.getValue(prop);
          if (connection == ChannelConnection.NONE) {
            BlockState newState = state.setValue(prop, ChannelConnection.IN);
            world.setBlockAndUpdate(pos, newState);
            world.invalidateCapabilities(pos);
          }
        }
        return ItemInteractionResult.SKIP_DEFAULT_BLOCK_INTERACTION;
      }
    }

    return interactWithChannel(state, world, pos, player, hit) == InteractionResult.SUCCESS
      ? ItemInteractionResult.SUCCESS
      : ItemInteractionResult.SKIP_DEFAULT_BLOCK_INTERACTION;
  }

  @SuppressWarnings("deprecation")
  @Override
  protected InteractionResult useWithoutItem(BlockState state, Level world, BlockPos pos, Player player, BlockHitResult hit) {
    return interactWithChannel(state, world, pos, player, hit);
  }

  private InteractionResult interactWithChannel(BlockState state, Level world, BlockPos pos, Player player, BlockHitResult hit) {
    Direction hitFace = hit.getDirection();

    Direction side = hitFace == Direction.UP ? Direction.DOWN : hitFace;
    if (player.isShiftKeyDown() && side != Direction.DOWN) {
      side = side.getOpposite();
    }

    Vec3 hitVec = hit.getLocation().subtract(pos.getX(), pos.getY(), pos.getZ());
    if (hitVec.z() < 0.25f) {
      side = Direction.NORTH;
    } else if (hitVec.z() > 0.75f) {
      side = Direction.SOUTH;
    } else if (hitVec.x() < 0.25f) {
      side = Direction.WEST;
    } else if (hitVec.x() > 0.75f) {
      side = Direction.EAST;
    }

    BlockState newState = interactWithSide(state, world, pos, player, side);
    if (newState != null) {
      world.setBlockAndUpdate(pos, newState);
      if (!world.isClientSide && world.getBlockEntity(pos) instanceof ChannelBlockEntity te) {
        te.refreshNeighbor(newState, side);
      }
      return InteractionResult.SUCCESS;
    }
    return InteractionResult.PASS;
  }
'''
          p.write_text(s[:start] + new + s[end:])

          # Proxy tank: preserve clicked-region routing for both held-item and empty-hand interactions.
          p = root / 'smeltery/block/ProxyTankBlock.java'
          s = p.read_text()
          if s.count('import net.minecraft.world.InteractionResult;\n') != 1 or 'ItemInteractionResult' in s:
            raise SystemExit('ProxyTankBlock: unexpected interaction imports')
          s = s.replace('import net.minecraft.world.InteractionResult;\n', 'import net.minecraft.world.InteractionResult;\nimport net.minecraft.world.ItemInteractionResult;\n')
          anchor = 'import net.minecraft.world.entity.player.Player;\n'
          if s.count(anchor) != 1:
            raise SystemExit('ProxyTankBlock: player import anchor mismatch')
          s = s.replace(anchor, anchor + 'import net.minecraft.world.item.ItemStack;\n')
          old = '''  @Deprecated
  @Override
  public InteractionResult use(BlockState state, Level world, BlockPos pos, Player player, InteractionHand hand, BlockHitResult hit) {
    if (world.getBlockEntity(pos) instanceof ProxyTankBlockEntity tank) {
      boolean clickedTank;
      Direction direction = hit.getDirection();
      if (direction == Direction.DOWN) {
        // down is a solid flat spot, treat it all as items
        clickedTank = false;
      } else {
        Vec3 location = hit.getLocation();
        double x = location.x - pos.getX();
        double z = location.z - pos.getZ();
        // up is a window, corners are tanks and center item
        clickedTank = (x < LOWER || x > UPPER) && (z < LOWER || z > UPPER);
        // if you clicked a side tank, cancel that if we clicked too low
        if (clickedTank && direction != Direction.UP) {
          double y = location.y - pos.getY();
          clickedTank = y > 0.25f;
        }
      }
      tank.interact(player, hand, clickedTank);
    }
    return InteractionResult.SUCCESS;
  }
'''
          new = '''  @Deprecated
  @Override
  protected ItemInteractionResult useItemOn(ItemStack stack, BlockState state, Level world, BlockPos pos, Player player, InteractionHand hand, BlockHitResult hit) {
    interact(world, pos, player, hand, hit);
    return ItemInteractionResult.SUCCESS;
  }

  @Deprecated
  @Override
  protected InteractionResult useWithoutItem(BlockState state, Level world, BlockPos pos, Player player, BlockHitResult hit) {
    interact(world, pos, player, InteractionHand.MAIN_HAND, hit);
    return InteractionResult.SUCCESS;
  }

  private void interact(Level world, BlockPos pos, Player player, InteractionHand hand, BlockHitResult hit) {
    if (world.getBlockEntity(pos) instanceof ProxyTankBlockEntity tank) {
      boolean clickedTank;
      Direction direction = hit.getDirection();
      if (direction == Direction.DOWN) {
        clickedTank = false;
      } else {
        Vec3 location = hit.getLocation();
        double x = location.x - pos.getX();
        double z = location.z - pos.getZ();
        clickedTank = (x < LOWER || x > UPPER) && (z < LOWER || z > UPPER);
        if (clickedTank && direction != Direction.UP) {
          double y = location.y - pos.getY();
          clickedTank = y > 0.25f;
        }
      }
      tank.interact(player, hand, clickedTank);
    }
  }
'''
          if s.count(old) != 1:
            raise SystemExit('ProxyTankBlock: legacy use block mismatch')
          p.write_text(s.replace(old, new))

          # Casting tank: preserve lower-tank/item-region interaction for held and empty hands.
          p = root / 'smeltery/block/CastingTankBlock.java'
          s = p.read_text()
          anchor = 'import net.minecraft.world.InteractionResult;\n'
          if s.count(anchor) != 1 or 'ItemInteractionResult' in s:
            raise SystemExit('CastingTankBlock: unexpected interaction imports')
          s = s.replace(anchor, anchor + 'import net.minecraft.world.ItemInteractionResult;\n')
          old = '''  @Deprecated
  @Override
  public InteractionResult use(BlockState state, Level world, BlockPos pos, Player player, InteractionHand hand, BlockHitResult hit) {
    if (world.getBlockEntity(pos) instanceof CastingTankBlockEntity tank) {
      tank.interact(player, hand, hit.getLocation().y - pos.getY() < 0.6875);
      return InteractionResult.SUCCESS;
    }
    return InteractionResult.FAIL;
  }
'''
          new = '''  @Deprecated
  @Override
  protected ItemInteractionResult useItemOn(ItemStack stack, BlockState state, Level world, BlockPos pos, Player player, InteractionHand hand, BlockHitResult hit) {
    if (world.getBlockEntity(pos) instanceof CastingTankBlockEntity tank) {
      tank.interact(player, hand, hit.getLocation().y - pos.getY() < 0.6875);
      return ItemInteractionResult.SUCCESS;
    }
    return ItemInteractionResult.FAIL;
  }

  @Deprecated
  @Override
  protected InteractionResult useWithoutItem(BlockState state, Level world, BlockPos pos, Player player, BlockHitResult hit) {
    if (world.getBlockEntity(pos) instanceof CastingTankBlockEntity tank) {
      tank.interact(player, InteractionHand.MAIN_HAND, hit.getLocation().y - pos.getY() < 0.6875);
      return InteractionResult.SUCCESS;
    }
    return InteractionResult.FAIL;
  }
'''
          if s.count(old) != 1:
            raise SystemExit('CastingTankBlock: legacy use block mismatch')
          p.write_text(s.replace(old, new))

          # Drain fluid-container interaction.
          p = root / 'smeltery/block/component/SearedDrainBlock.java'
          s = p.read_text()
          if s.count('import net.minecraft.world.InteractionResult;\n') != 1:
            raise SystemExit('SearedDrainBlock: interaction import mismatch')
          s = s.replace('import net.minecraft.world.InteractionResult;\n', 'import net.minecraft.world.ItemInteractionResult;\n')
          anchor = 'import net.minecraft.world.entity.player.Player;\n'
          if s.count(anchor) != 1:
            raise SystemExit('SearedDrainBlock: player import mismatch')
          s = s.replace(anchor, anchor + 'import net.minecraft.world.item.ItemStack;\n')
          old = '''  public InteractionResult use(BlockState state, Level world, BlockPos pos, Player player, InteractionHand hand, BlockHitResult hit) {
    if (FluidTransferHelper.interactWithTank(world, pos, player, hand, hit.getDirection(), state.getValue(FACING).getOpposite())) {
      return InteractionResult.SUCCESS;
    }
    return InteractionResult.PASS;
  }
'''
          new = '''  protected ItemInteractionResult useItemOn(ItemStack stack, BlockState state, Level world, BlockPos pos, Player player, InteractionHand hand, BlockHitResult hit) {
    if (FluidTransferHelper.interactWithTank(world, pos, player, hand, hit.getDirection(), state.getValue(FACING).getOpposite())) {
      return ItemInteractionResult.SUCCESS;
    }
    return ItemInteractionResult.PASS_TO_DEFAULT_BLOCK_INTERACTION;
  }
'''
          if s.count(old) != 1:
            raise SystemExit('SearedDrainBlock: legacy use method mismatch')
          p.write_text(s.replace(old, new))

          # 1.21 moved custom render bounds from BlockEntity to the renderer extension.
          p = root / 'smeltery/block/entity/ChannelBlockEntity.java'
          s = p.read_text()
          if s.count('import net.minecraft.world.phys.AABB;\n') != 1:
            raise SystemExit('ChannelBlockEntity: AABB import mismatch')
          s = s.replace('import net.minecraft.world.phys.AABB;\n', '')
          old = '''  @Override
  public AABB getRenderBoundingBox() {
    return new AABB(worldPosition.getX(), worldPosition.getY() - 1, worldPosition.getZ(), worldPosition.getX() + 1, worldPosition.getY() + 1, worldPosition.getZ() + 1);
  }

'''
          if s.count(old) != 1:
            raise SystemExit('ChannelBlockEntity: legacy render bounds mismatch')
          p.write_text(s.replace(old, ''))

          p = root / 'smeltery/client/render/ChannelBlockEntityRenderer.java'
          s = p.read_text()
          anchor = 'import net.minecraft.world.level.block.state.BlockState;\n'
          if s.count(anchor) != 1 or 'import net.minecraft.world.phys.AABB;\n' in s:
            raise SystemExit('Channel renderer: import state mismatch')
          s = s.replace(anchor, anchor + 'import net.minecraft.world.phys.AABB;\n')
          constructor = '  public ChannelBlockEntityRenderer(Context context) {}\n\n'
          method = '''  @Override
  public AABB getRenderBoundingBox(ChannelBlockEntity te) {
    BlockPos pos = te.getBlockPos();
    return new AABB(pos.getX(), pos.getY() - 1, pos.getZ(), pos.getX() + 1, pos.getY() + 1, pos.getZ() + 1);
  }

'''
          if s.count(constructor) != 1:
            raise SystemExit('Channel renderer: constructor anchor mismatch')
          p.write_text(s.replace(constructor, constructor + method))

          # Geometry loader registration now takes namespaced resource IDs.
          p = root / 'smeltery/SmelteryClientEvents.java'
          s = p.read_text()
          if s.count('event.register("tank", TankModel.LOADER);') != 1 or s.count('event.register("fluid_texture", FluidTextureModel.LOADER);') != 1:
            raise SystemExit('SmelteryClientEvents: geometry loader registrations mismatch')
          s = s.replace('event.register("tank", TankModel.LOADER);', 'event.register(TConstruct.getResource("tank"), TankModel.LOADER);')
          s = s.replace('event.register("fluid_texture", FluidTextureModel.LOADER);', 'event.register(TConstruct.getResource("fluid_texture"), FluidTextureModel.LOADER);')
          p.write_text(s)

          # StairBlock constructor now receives a concrete base state.
          replace_once('smeltery/block/component/SearedStairsBlock.java', '    super(state, properties);', '    super(state.get(), properties);', 'SearedStairsBlock')

          # Item tooltip API uses Item.TooltipContext in 1.21.
          p = root / 'smeltery/item/DummyMaterialItem.java'
          s = p.read_text()
          if s.count('import net.minecraft.world.level.Level;\n') != 1 or s.count('import javax.annotation.Nullable;\n') != 1:
            raise SystemExit('DummyMaterialItem: legacy imports mismatch')
          s = s.replace('import net.minecraft.world.level.Level;\n', '').replace('import javax.annotation.Nullable;\n', '')
          old = '  public void appendHoverText(ItemStack pStack, @Nullable Level pLevel, List<Component> tooltip, TooltipFlag pIsAdvanced) {'
          new = '  public void appendHoverText(ItemStack pStack, Item.TooltipContext context, List<Component> tooltip, TooltipFlag pIsAdvanced) {'
          if s.count(old) != 1:
            raise SystemExit('DummyMaterialItem: legacy tooltip signature mismatch')
          p.write_text(s.replace(old, new))

          # FluidStack serialization moved to the registry-aware stream codec.
          p = root / 'smeltery/network/FaucetActivationPacket.java'
          s = p.read_text()
          anchor = 'import net.minecraft.network.FriendlyByteBuf;\n'
          if s.count(anchor) != 1 or 'RegistryFriendlyByteBuf' in s:
            raise SystemExit('FaucetActivationPacket: buffer import mismatch')
          s = s.replace(anchor, anchor + 'import net.minecraft.network.RegistryFriendlyByteBuf;\n')
          if s.count('this.fluid = buffer.readFluidStack();') != 1 or s.count('buffer.writeFluidStack(fluid);') != 1:
            raise SystemExit('FaucetActivationPacket: legacy fluid codec calls mismatch')
          s = s.replace('this.fluid = buffer.readFluidStack();', 'this.fluid = FluidStack.OPTIONAL_STREAM_CODEC.decode((RegistryFriendlyByteBuf)buffer);')
          s = s.replace('buffer.writeFluidStack(fluid);', 'FluidStack.OPTIONAL_STREAM_CODEC.encode((RegistryFriendlyByteBuf)buffer, fluid);')
          p.write_text(s)

          # Vanilla entity textures used the old one-argument ResourceLocation constructor.
          p = root / 'world/WorldClientEvents.java'
          s = p.read_text()
          old = 'new ResourceLocation("textures/'
          count = s.count(old)
          if count != 12:
            raise SystemExit(f'WorldClientEvents: expected 12 vanilla texture IDs, got {count}')
          p.write_text(s.replace(old, 'ResourceLocation.withDefaultNamespace("textures/'))
          PY

      - name: Verify migration
        shell: bash
        run: |
          ! grep -R -Fq 'public InteractionResult use(BlockState state, Level world, BlockPos pos, Player player, InteractionHand' src/main/java/slimeknights/tconstruct/smeltery/block
          ! grep -Fq 'getRenderBoundingBox()' src/main/java/slimeknights/tconstruct/smeltery/block/entity/ChannelBlockEntity.java
          grep -Fq 'getRenderBoundingBox(ChannelBlockEntity te)' src/main/java/slimeknights/tconstruct/smeltery/client/render/ChannelBlockEntityRenderer.java
          grep -Fq 'TConstruct.getResource("tank")' src/main/java/slimeknights/tconstruct/smeltery/SmelteryClientEvents.java
          grep -Fq 'super(state.get(), properties);' src/main/java/slimeknights/tconstruct/smeltery/block/component/SearedStairsBlock.java
          grep -Fq 'Item.TooltipContext context' src/main/java/slimeknights/tconstruct/smeltery/item/DummyMaterialItem.java
          grep -Fq 'FluidStack.OPTIONAL_STREAM_CODEC.decode' src/main/java/slimeknights/tconstruct/smeltery/network/FaucetActivationPacket.java
          test "$(grep -o 'ResourceLocation.withDefaultNamespace("textures/' src/main/java/slimeknights/tconstruct/world/WorldClientEvents.java | wc -l)" -eq 12
          git diff --check

      - name: Commit migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java
          git diff --cached --quiet || {
            git commit -m 'Migrate remaining smeltery interaction APIs to 1.21'
            git push origin HEAD:1.21.1-neoforge
          }

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --repo "$GITHUB_REPOSITORY" --ref 1.21.1-neoforge
