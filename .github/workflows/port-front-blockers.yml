name: Tinkers Front Blocker Migration

on:
  push:
    branches:
      - 1.21.1-neoforge
    paths:
      - .github/workflows/port-front-blockers.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Wait for active port compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while gh run list --repo "$GITHUB_REPOSITORY" --workflow port-compile.yml --branch 1.21.1-neoforge --limit 30 --json status --jq '.[] | select(.status == "queued" or .status == "in_progress") | .status' | grep -q .; do
            sleep 15
          done

      - name: Checkout latest Tinkers port
        uses: actions/checkout@v4
        with:
          ref: 1.21.1-neoforge
          fetch-depth: 0

      - name: Migrate combat and tick events
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Missing expected token in {path}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          tool_events = 'src/main/java/slimeknights/tconstruct/tools/logic/ToolEvents.java'
          replace(tool_events,
                  'import net.neoforged.neoforge.event.entity.living.LivingAttackEvent;\n',
                  'import net.neoforged.neoforge.event.entity.living.LivingIncomingDamageEvent;\n')
          replace(tool_events,
                  'import net.neoforged.neoforge.event.entity.living.LivingDamageEvent;\n',
                  'import net.neoforged.neoforge.event.entity.living.LivingDamageEvent;\nimport net.neoforged.neoforge.event.tick.EntityTickEvent;\n')
          replace(tool_events,
                  'import net.neoforged.neoforge.event.entity.living.LivingEvent.LivingTickEvent;\n',
                  '')
          replace(tool_events,
                  '  static void livingAttack(LivingAttackEvent event) {',
                  '  static void livingAttack(LivingIncomingDamageEvent event) {')
          replace(tool_events,
                  '  static void livingDamage(LivingDamageEvent event) {',
                  '  static void livingDamage(LivingDamageEvent.Pre event) {')
          replace(tool_events,
                  '    float amount = event.getAmount();',
                  '    float amount = event.getNewDamage();')
          replace(tool_events,
                  '      event.setAmount(amount);',
                  '      event.setNewDamage(amount);')
          replace(tool_events,
                  '        event.setCanceled(true);',
                  '        event.setNewDamage(0);')
          replace(tool_events,
                  '&& entity.getType() == EntityType.ENDER_DRAGON && event.getAmount() > 0',
                  '&& entity.getType() == EntityType.ENDER_DRAGON && event.getNewDamage() > 0')
          replace(tool_events,
                  '  static void livingWalk(LivingTickEvent event) {\n    LivingEntity living = event.getEntity();',
                  '  static void livingWalk(EntityTickEvent.Pre event) {\n    if (!(event.getEntity() instanceof LivingEntity living)) {\n      return;\n    }')

          interaction = 'src/main/java/slimeknights/tconstruct/tools/logic/InteractionHandler.java'
          replace(interaction,
                  'import net.neoforged.neoforge.event.entity.living.ShieldBlockEvent;\n',
                  'import net.neoforged.neoforge.event.entity.living.LivingShieldBlockEvent;\n')
          replace(interaction,
                  '  static void onBlock(ShieldBlockEvent event) {',
                  '  static void onBlock(LivingShieldBlockEvent event) {')
          replace(interaction,
                  '          event.setShieldTakesDamage(false);',
                  '          event.setShieldDamage(0);')
          PY

      - name: Verify targeted migration
        shell: bash
        run: |
          grep -Fq 'LivingIncomingDamageEvent event' src/main/java/slimeknights/tconstruct/tools/logic/ToolEvents.java
          grep -Fq 'LivingDamageEvent.Pre event' src/main/java/slimeknights/tconstruct/tools/logic/ToolEvents.java
          grep -Fq 'EntityTickEvent.Pre event' src/main/java/slimeknights/tconstruct/tools/logic/ToolEvents.java
          test -z "$(grep -E 'LivingAttackEvent|LivingTickEvent' src/main/java/slimeknights/tconstruct/tools/logic/ToolEvents.java || true)"
          grep -Fq 'LivingShieldBlockEvent event' src/main/java/slimeknights/tconstruct/tools/logic/InteractionHandler.java
          grep -Fq 'setShieldDamage(0)' src/main/java/slimeknights/tconstruct/tools/logic/InteractionHandler.java
          test -z "$(grep -F 'ShieldBlockEvent' src/main/java/slimeknights/tconstruct/tools/logic/InteractionHandler.java | grep -v LivingShieldBlockEvent || true)"

      - name: Commit grouped migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/slimeknights/tconstruct/tools/logic/ToolEvents.java \
                  src/main/java/slimeknights/tconstruct/tools/logic/InteractionHandler.java
          git diff --cached --quiet && exit 0
          git commit -m 'Migrate combat events to NeoForge 21.1'
          git push origin HEAD:1.21.1-neoforge

      - name: Trigger fresh compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-compile.yml --repo "$GITHUB_REPOSITORY" --ref 1.21.1-neoforge
